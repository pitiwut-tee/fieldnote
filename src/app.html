<script>
const ERR = {concept:"ยังไม่เข้าใจหลัก", forgot:"เข้าใจ แต่จำสูตรหรือวิธีคิดไม่ได้", read:"อ่านโจทย์พลาด", misopt:"อ่านตัวเลือกผิด", unclear:"โจทย์กำกวม อ่านแล้วไม่เข้าใจ", calc:"คิดเลขผิด", slip:"คิดถูกแล้ว แต่กดหรือพิมพ์ผิด", guess:"เดา", other:"อื่นๆ (พิมพ์บอกเอง)", dontknow:"คิดไม่ออก (กดดูเฉลย)", notTaught:"ยังไม่ได้เรียนเรื่องนี้"};
const LV = {1:"ระดับ 1 · พื้นฐาน",2:"ระดับ 2 · ประยุกต์",3:"ระดับ 3 · แนวคิดวิเคราะห์"};

/* ---------- content comes from content/*.json, injected at build time (tools/build.py) ---------- */
const CONTENT=/*@@CONTENT@@*/null;
const CAL=CONTENT.calendar;
const SETS=CONTENT.sets.map(s=>{ const o=JSON.parse(JSON.stringify(s)); o.warm=o.warm||[];
  [...o.warm,...o.practice,...(o.challenge?[o.challenge]:[])].forEach(q=>q.hints=(s.hints||{})[q.id]||[]);
  o.concept=o.concept||{title:"",points:[],formulas:[],vocab:[],alts:[]}; o.concept.alts=o.concept.alts||[];
  o.current=CAL.currentSpells.includes(o.spell); return o });
const SKIP_REASONS=["การบ้านเยอะ","มีสอบ/ต้องอ่านวิชาอื่น","ไม่สบาย","เหนื่อยมาก","มีธุระ/ไปข้างนอก","อื่นๆ"];
/* ---------- spell map (from the curriculum map doc): id, realm, magic name, topic, grade, exam stars, school status ---------- */
const REALMS=CONTENT.spells.realms, SCHOOL=CONTENT.spells.school, SPELLS=CONTENT.spells.spells;

/* ---------- daily vocabulary: general academic words + science/math words + story/art words ---------- */
const VOCAB=CONTENT.vocab.map(x=>({...x}));
const MISSIONS=(CONTENT.missions&&CONTENT.missions.missions)||[];
const GUESTS=(CONTENT.guests&&CONTENT.guests.guests)||[];
const READINGS=CONTENT.readings.map((r,i)=>({text:r.text,qs:r.qs.map(q=>({q:q.q,opts:q.opts,a:q.a})),th:{text:r.th,qs:r.qs.map(q=>({q:q.qth,opts:q.optsTh}))},idx:i}));

/* ---------- test mode: open the page with #test once; results get a "test" tag ---------- */
let TEST=false;
try{ if(location.hash==="#test") localStorage.setItem("fieldnote.test","1"); TEST=localStorage.getItem("fieldnote.test")==="1" }catch(e){ TEST=location.hash==="#test" }
function leaveTest(){
  try{
    localStorage.removeItem("fieldnote.test");
    localStorage.setItem("fieldnote.attempts",JSON.stringify(JSON.parse(localStorage.getItem("fieldnote.attempts")||"[]").filter(x=>!x.test)));
    localStorage.setItem("fieldnote.fb",JSON.stringify(JSON.parse(localStorage.getItem("fieldnote.fb")||"[]").filter(x=>!x.test)));
  }catch(e){}
  TEST=false; attempts=lsRead(); if(location.hash==="#test") location.hash="#home"; view="home"; render();
}

/* ---------- fresh start on 5 Nov 2026: the trial day (4 Nov) is cleared from this browser, once ---------- */
const START_DAY=new Date(CAL.startDay+"T00:00:00").getTime();
try{
  if(Date.now()>=START_DAY&&localStorage.getItem("fieldnote.epoch")!=="2"){
    ["fieldnote.attempts","fieldnote.fb","fieldnote.vocab","fieldnote.inprogress","fieldnote.test"].forEach(k=>localStorage.removeItem(k));
    localStorage.setItem("fieldnote.epoch","2");
  }
  const keep=JSON.parse(localStorage.getItem("fieldnote.attempts")||"[]").filter(a=>new Date(a.endedAt).getTime()>=START_DAY);
  localStorage.setItem("fieldnote.attempts",JSON.stringify(keep));
}catch(e){}

/* ---------- storage: shared db when available, otherwise this browser only ---------- */
let db = null, store = "local", attempts = [], unsub = null;
const LS = "fieldnote.attempts";
function lsRead(){ try{ return JSON.parse(localStorage.getItem(LS)||"[]") }catch(e){ return [] } }
function lsWrite(a){ try{ localStorage.setItem(LS, JSON.stringify(a)) }catch(e){} }
attempts = lsRead();
setTimeout(()=>{ try{ migrateBuddy() }catch(e){} },0);
(async()=>{
  try{
    db = await window.claude?.use?.("db");
  }catch(e){ db = null }
  if(!db) return;
  const t = setTimeout(()=>{}, 10000);
  try{
    unsub = db.collection("attempts").orderBy("endedAt","desc").limit(200).onSnapshot(s=>{
      clearTimeout(t); store="db";
      attempts = s.docs.map(d=>({id:d.id,...d.data()}));
      if(view==="parent"||view==="home") render();
    }, ()=>{ clearTimeout(t) });
  }catch(e){ clearTimeout(t) }
})();
async function saveAttempt(rec){
  if(TEST) rec.test=true;
  if(db){
    try{ await db.collection("attempts").add(rec); return "db" }catch(e){}
  }
  attempts = [rec, ...attempts]; lsWrite(attempts.filter(a=>!a.example)); return "local";
}

function b64e(str){const b=new TextEncoder().encode(str);let o="";for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(o)}
function b64d(x){return new TextDecoder().decode(Uint8Array.from(atob(x),c=>c.charCodeAt(0)))}
function lsFb(){ try{ return JSON.parse(localStorage.getItem("fieldnote.fb")||"[]") }catch(e){ return [] } }
function unsent(){ return {a:lsRead().filter(x=>!x.sent), f:lsFb().filter(x=>!x.sent)} }
function markSent(){ lsWrite(lsRead().map(x=>({...x,sent:true}))); try{localStorage.setItem("fieldnote.fb",JSON.stringify(lsFb().map(x=>({...x,sent:true}))))}catch(e){} attempts=lsRead() }
/* short code: drop text the parent page can look up again by question id, then deflate */
function slim(a){ const {sent,...x}=a; return {...x, items:(x.items||[]).map(({prompt,phase,topic,spell,...i})=>i), confused:(x.confused||[]).map(({prompt,...c})=>c)} }
function fatten(a){ return {...a, items:(a.items||[]).map(i=>{const q=QBANK[i.qid]?.q; return q?{topic:q.topic,spell:q.spell,prompt:q.q,...i}:i}),
  confused:(a.confused||[]).map(c=>{const q=QBANK[c.qid]?.q; return q&&!c.prompt?{...c,prompt:q.q}:c})} }
async function packCode(obj){
  const json=JSON.stringify(obj);
  if(typeof CompressionStream==="function"){ try{
    const buf=new Uint8Array(await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer());
    let t=""; for(let i=0;i<buf.length;i+=0x8000) t+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
    return "SK2:"+btoa(t).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }catch(e){} }
  return "FIELDNOTE1:"+b64e(json);
}
async function exportCode(all){ const a=all?lsRead():unsent().a, f=all?lsFb():unsent().f; const b=getBuddy(); return (a.length||f.length)?await packCode({a:a.map(slim),f:f.map(({sent,...x})=>x),...(b?{b:{name:b.name,kind:b.kind}}:{})}):"" }

/* LINE cuts long messages (about 1,000 characters got through), so a long code is sent as numbered parts */
const PART_LEN=800;
function splitCode(code){ if(code.length<=PART_LEN) return [code];
  const id=(Date.now()%46656).toString(36).padStart(3,"0"), n=Math.ceil(code.length/PART_LEN), out=[];
  for(let i=0;i<n;i++) out.push(`SKP:${id}:${i+1}/${n}:`+code.slice(i*PART_LEN,(i+1)*PART_LEN));
  return out }
async function copyText(t,box,m,okMsg){ try{await navigator.clipboard.writeText(t);m.textContent=okMsg}catch(e){box.focus();box.select();m.textContent="กดค้างที่กล่อง แล้วเลือก \"เลือกทั้งหมด\" ก่อนคัดลอก"} }
async function renderSend(all){
  const u=unsent(); const code=await exportCode(all); const parts=code?splitCode(code):[];
  const ta=(id,v)=>`<textarea id="${id}" readonly rows="3" style="font-family:var(--mono);font-size:.75rem;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)">${v}</textarea>`;
  $v.innerHTML=`<section class="card"><h2>ส่งผลให้พ่อ</h2>
    ${code?`<p>มีผลฝึก <b>${all?lsRead().length:u.a.length}</b> ครั้ง และข้อความถึง Claude <b>${all?lsFb().length:u.f.length}</b> ข้อความ ที่ยังไม่ได้ส่ง</p>
    <ol style="margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px">
      <li>กด <b>ส่งเป็นไฟล์</b> แล้วเลือก <b>LINE</b> → เลือกพ่อ</li><li>กลับมากด <b>ส่งเรียบร้อยแล้ว</b></li></ol>
    <div class="row"><button class="btn" id="sendfile">ส่งเป็นไฟล์</button><span class="small" id="fmsg" aria-live="polite"></span></div>
    <div class="row"><button class="btn ghost" id="sent">ส่งเรียบร้อยแล้ว</button></div>
    <details><summary class="small muted" style="cursor:pointer">ส่งไฟล์ไม่ได้? ใช้วิธีคัดลอกรหัสแทน</summary><div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
    ${parts.length>1?`<p>รหัสยาว LINE ส่งทีเดียวไม่หมด เลยแบ่งเป็น <b>${parts.length} ส่วน</b> คัดลอกแล้ววางส่งใน LINE <b>ทีละส่วน ส่วนละ 1 ข้อความ</b> จนครบ แล้วกลับมากด <b>ส่งเรียบร้อยแล้ว</b></p>`
      :`<ol style="margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px">
      <li>กด <b>คัดลอกรหัส</b></li><li>เปิด LINE แล้ววางส่งให้พ่อ</li></ol>`}
    ${parts.map((p,i)=>`<div style="display:flex;flex-direction:column;gap:6px">${parts.length>1?`<b class="small">ส่วนที่ ${i+1} จาก ${parts.length}</b>`:`<p class="small muted">รหัสยาว ${code.length.toLocaleString()} ตัวอักษร</p>`}
      ${ta("code"+i,p)}<div class="row"><button class="btn ghost" data-copy="${i}">คัดลอก${parts.length>1?`ส่วนที่ ${i+1}`:"รหัส"}</button><span class="small" id="cmsg${i}" aria-live="polite"></span></div></div>`).join("")}
    </div></details>`:`<p class="muted">ส่งครบทุกครั้งแล้ว ไม่มีผลค้างส่ง</p>
    <button class="btn ghost" id="resend">ต้องการส่งทั้งหมดอีกครั้ง</button>`}
    <button class="btn ghost" id="sback" style="border:0;padding-left:0">← กลับหน้าแรก</button></section>`;
  document.getElementById("sback").onclick=()=>{view="home";render()};
  const rs=document.getElementById("resend"); if(rs) rs.onclick=()=>renderSend(true);
  if(!code) return;
  document.getElementById("sendfile").onclick=async()=>{const m=document.getElementById("fmsg"); const d=new Date(), pad=x=>String(x).padStart(2,"0");
    const name=`สมุดคาถา-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.txt`;
    const file=new File([code],name,{type:"text/plain"});
    try{ if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"ผลฝึกสมุดคาถา"}); m.textContent="ส่งแล้ว กด \"ส่งเรียบร้อยแล้ว\" ได้เลย"; return } }
    catch(e){ if(e&&e.name==="AbortError"){ m.textContent="ยกเลิกแล้ว กดส่งใหม่ได้"; return } }
    const url=URL.createObjectURL(file), a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
    m.textContent="บันทึกไฟล์ลงเครื่องแล้ว เปิด LINE กด + แล้วแนบไฟล์นี้ส่งให้พ่อ"; };
  $v.querySelectorAll("[data-copy]").forEach(btn=>btn.onclick=()=>{const i=+btn.dataset.copy;
    copyText(parts[i],document.getElementById("code"+i),document.getElementById("cmsg"+i),parts.length>1?`คัดลอกส่วนที่ ${i+1} แล้ว ไปวางใน LINE ได้เลย`:"คัดลอกแล้ว ไปวางใน LINE ได้เลย")});
  document.getElementById("sent").onclick=()=>{markSent();view="home";render()};
}
async function importCode(raw, asTest){
  /* LINE may wrap a long code, split it into several bubbles, or add invisible characters: join everything first */
  raw=String(raw||"").replace(/[\s\u200B-\u200D\u2060\uFEFF]/g,"");
  if(raw.includes("SKP:")){ const got={}; let n=0, id=null;
    raw.split("SKP:").slice(1).forEach(seg=>{const m=seg.match(/^([a-z0-9]+):(\d+)\/(\d+):(.*)$/); if(!m) return;
      if(id&&m[1]!==id) return; id=m[1]; n=+m[3]; got[+m[2]]=m[4]});
    const miss=[]; for(let i=1;i<=n;i++) if(!(i in got)) miss.push(i);
    if(!n) throw new Error("bad");
    if(miss.length){ const er=new Error("parts"); er.miss=miss; er.n=n; throw er }
    raw=Array.from({length:n},(_,i)=>got[i+1]).join(""); }
  let data; const m2=raw.match(/SK2:([A-Za-z0-9_-]+)/), m1=raw.match(/FIELDNOTE1:([A-Za-z0-9+/=]+)/);
  if(!m2&&!m1) throw new Error("bad");
  try{
    if(m2){ const c=m2[1].replace(/-/g,"+").replace(/_/g,"/"); const bin=atob(c+"=".repeat((4-c.length%4)%4));
      const bytes=Uint8Array.from(bin,ch=>ch.charCodeAt(0));
      data=JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text()); }
    else data=JSON.parse(b64d(m1[1]));
  }catch(e){ const er=new Error("cut"); er.len=(m2||m1)[1].length; throw er }
  let n=0,k=0; const what=[];
  for(const a of (data.a||[])){ what.push(`${a.topic||a.type||"ผลฝึก"} (${new Date(a.endedAt).toLocaleString("th-TH",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})})`); const id=("s-"+(a.setId||a.type)+"-"+a.endedAt).replace(/[^A-Za-z0-9_-]/g,""); const {example,...rest}=fatten(a); await db.collection("attempts").doc(id).set({...rest,via:"code",test:!!(a.test||asTest)}); n++ }
  if(data.b&&!asTest){ try{ await db.collection("feedback").doc("buddy").set({kind:"buddy",name:data.b.name,buddy:data.b.kind,at:new Date().toISOString()}) }catch(e){} }
  for(const f of (data.f||[])){ const id=("f-"+f.at).replace(/[^A-Za-z0-9_-]/g,""); await db.collection("feedback").doc(id).set({...f,test:!!(f.test||asTest)}); k++ }
  return {n,k,what};
}

/* ---------- updates: GitHub Pages lets the browser keep an old copy for a while, so check for a newer build ---------- */
const BUILD="/*@@BUILD@@*/";

/* warm-up questions review older topics, so they count toward those spells */

const QBANK={};
SETS.forEach(s=>[...s.warm,...s.practice,...(s.challenge?[s.challenge]:[])].forEach(q=>{q.spell=q.spell||s.spell;QBANK[q.id]={q,set:s}}));
/* twin questions (content/variants.json): same idea, new numbers and story, used when a question comes back for review */
const VARIANTS=(CONTENT.variants&&CONTENT.variants.variants)||{};
Object.entries(VARIANTS).forEach(([orig,vs])=>{ const o=QBANK[orig]; if(!o) return;
  vs.forEach(v=>{ QBANK[v.id]={q:{topic:o.q.topic,level:o.q.level,spell:o.q.spell,ctx:o.q.ctx,...v,of:orig},set:o.set} }) });
/* a question coming back (review, retry, spaced): use an unseen twin if there is one; otherwise make her produce the
   answer: type it when every option is a number, or think first with the options hidden */
const NUMOPT=/^\s*([−-]?[\d,]*\.?\d+(?:\s*\/\s*\d+)?)\s*(.*)$/;
/* a typed answer: "12", "-3.5", "1,200", "2/3", "-7/4" */
function parseAns(raw){ const t=String(raw).replace(/,/g,"").replace(/−/g,"-").replace(/\s+/g,"");
  const f=t.match(/^(-?\d*\.?\d+)\/(\d*\.?\d+)$/); if(f){ const d=parseFloat(f[2]); return d?parseFloat(f[1])/d:NaN }
  return /^-?\d*\.?\d+$/.test(t)?parseFloat(t):NaN }
/* turn a question whose options are all numbers with the same unit into a typed answer (null if it can't) */
function numify(q){
  if(q.num||!q.opts) return null;
  const m=q.opts.map(o=>String(o).match(NUMOPT)); if(m.some(x=>!x)) return null;
  const unit=m[0][2].trim(); if(m.some(x=>x[2].trim()!==unit)) return null;
  const ans=parseAns(m[q.a][1]); if(!isFinite(ans)) return null;
  return {...q,num:true,answer:ans,answerText:m[q.a][1].trim(),tol:Math.max(0.01,Math.abs(ans)*0.005),unit};
}
function recallize(q){
  if(q.num||!q.opts) return q;
  const n=numify(q); return n?{...n,recall:true}:{...q,cover:true};
}
/* exam style (first round has a written/fill-in part): level-3 questions, and level 2 in exam-style mixed sets, are answered
   by typing the number instead of choosing, whenever the options allow it. A question can opt out with "fill": false. */
/* mixed sets alternate math and science (they were written subject by subject, so science sat at the end) */
function mixOrder(qs){ const m=qs.filter(q=>!/^s/.test(q.spell||"")), sc=qs.filter(q=>/^s/.test(q.spell||"")), out=[]; const r=m.length/Math.max(1,sc.length);
  let i=0,j=0; while(i<m.length||j<sc.length){ if(j>=sc.length||(i<m.length&&i<(j+1)*r)) out.push(m[i++]); else out.push(sc[j++]) } return out }
function fillize(q,mixed){
  if(CAL.fillIn===false||q.fill===false||q.num) return q;
  if(!(q.fill===true||q.level>=3||mixed&&q.level>=2)) return q;
  const n=numify(q); return n?{...n,fill:true}:q;
}
function comeback(q,list){
  const seen=new Set(list.filter(isLesson).flatMap(a=>(a.items||[]).map(x=>x.qid)));
  const root=q.of||q.id, twins=(VARIANTS[root]||[]).map(v=>QBANK[v.id]?.q).filter(Boolean);
  const fresh=twins.find(t=>!seen.has(t.id)); return fresh?{...fresh}:recallize(q);
}

/* ---------- XP, streak and ice ---------- */
const GOAL=60, FREEZE_MAX=2, DAY=86400000;
const VOID=new Set(CAL.voidRecords||[]);   /* records the father said were only button tests */
/* voidRules: whole kinds of records the father asked to reset, e.g. {type:"labverdict", before:"…"} (10 Nov: verdicts made by
   blind clicking before the detective game was explained). Ignored everywhere, including XP. */
const VOID_RULES=CAL.voidRules||[];
function voided(a){ return VOID.has(a.endedAt)||VOID_RULES.some(r=>a.type===r.type&&(!r.setId||a.setId===r.setId)&&(!r.before||new Date(a.endedAt)<new Date(r.before))&&(!r.missing||a[r.missing]==null)) }
function realAttempts(){ return attempts.filter(a=>!a.example&&!a.test&&!voided(a)) }
function mine(){ return TEST ? attempts.filter(a=>!a.example) : realAttempts() }
function isSkip(a){ return a.type==="skip" }
const LESSON_TYPES=["set","probe","mixed","passage","review","sweep"];
function isLesson(a){ return LESSON_TYPES.includes(a.type||"set") }
function dayKey(iso){ const d=new Date(iso); d.setHours(0,0,0,0); return d.getTime() }
function todayKey(){ return dayKey(new Date().toISOString()) }
function nextDay(d){ const t=new Date(d); t.setDate(t.getDate()+1); t.setHours(0,0,0,0); return t.getTime() }
function weekStart(d){ const t=new Date(d); t.setHours(0,0,0,0); t.setDate(t.getDate()-((t.getDay()+6)%7)); return t.getTime() }
function xpOf(a){ if(isSkip(a)||a.type==="daymode") return 0; if(typeof a.xp==="number") return a.xp; return (a.correct||0)*10+((a.total||0)-(a.correct||0))*5+20 }
/* a wrong answer given in under 4 seconds looks like a tap, not a try: 0 XP instead of 5 */
/* explanations are split into short steps (father, 9 Nov): she reads one step at a time instead of facing a wall of text.
   Thai separates clauses with spaces, so a step ends at a space before a Thai word once it is long enough, or before a linking word. */
function exSteps(t){ const w=String(t||"").split(/\s+/).filter(Boolean), out=[]; let cur="";
  for(const x of w){ const thai=/^[\u0E00-\u0E7F]/.test(x), kw=/^(ดังนั้น|จากนั้น|ต่อมา|ระวัง|จำไว้|สรุป|ถ้า|เพราะ|ขั้นที่|ส่วน|แต่|อีกวิธี|ตรวจ|ลอง)/.test(x);
    if(cur&&thai&&(cur.length>=90||(kw&&cur.length>=30))){ out.push(cur); cur=x } else cur=cur?cur+" "+x:x }
  if(cur){ if(out.length&&cur.length<25) out[out.length-1]+=" "+cur; else out.push(cur) } return out }
/* a third hint: the first step of the worked solution. Authored as q.step1; for typed-number questions it can come from the
   explanation's first step when that step does not contain the answer. Choice questions without step1 get no third hint,
   because the first explanation step usually names the right option. */
/* wrong, don't-know or guessed → the explanation opens one step at a time; a confident right answer sees it all at once */
function exStepped(q,ans){ return ans&&(!ans.correct||S.guessed||S.checkPick===-1)&&exSteps(q.ex).length>=2 }
function exLeft(q,ans){ return exStepped(q,ans)&&(S.exStep||1)<exSteps(q.ex).length }
function exHtml(q,ans){ if(!exStepped(q,ans)) return `<p>${gloss(q.ex)}</p>`; const st=exSteps(q.ex), n=Math.min(st.length,S.exStep||1);
  return `<ol class="exsteps">${st.slice(0,n).map((x,i)=>`<li class="${i===n-1?"now":""}">${gloss(x)}</li>`).join("")}</ol>
    ${n<st.length?`<button class="btn small" id="exnext" type="button">ขั้นต่อไป ▸ (${n}/${st.length})</button>`:`<span class="small muted">ครบ ${st.length} ขั้นแล้ว</span>`}` }
function hintList(q){ const h=[...(q.hints||[])], st=exSteps(q.ex), a=String(q.num?(q.answerText||q.answer):q.opts?q.opts[q.a]:"").trim();
  const leaks=a&&new RegExp("(^|[^0-9.])"+a.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"([^0-9.]|$)").test(st[0]||"");
  if(q.step1) h.push("ขั้นแรกของวิธีทำ: "+q.step1); else if(q.num&&st.length>=2&&!leaks&&(q.hints||[]).length<3) h.push("ขั้นแรกของวิธีทำ: "+st[0]); return h }
function itemXp(items){ return items.reduce((s,x)=>s+(x.skipped||x.dontknow?0:x.correct?10:(x.timeSec!=null&&x.timeSec<4?0:5))+(x.checkOk?5:0),0) }
/* anti-grinding (father, 8 Nov 2026), applied when a lesson-type record is saved:
   - replaying a set she already finished pays only for questions she had missed before and now gets right, no finish bonus
   - lesson XP above DAY_XP_SOFT in one day counts half ("พักบ้างนะ") */
const DAY_XP_SOFT=450;
function xpRules(rec,prev){
  if(!["set","probe","mixed","passage"].includes(rec.type)||typeof rec.xp!=="number") return rec;
  const before=prev.filter(a=>a.setId===rec.setId&&a.type===rec.type);
  let xp=rec.xp, note=[];
  if(before.length){
    const everRight=new Set(before.flatMap(a=>(a.items||[]).filter(x=>x.correct).map(x=>x.qid)));
    const missed=new Set(before.flatMap(a=>(a.items||[]).filter(x=>!x.correct&&!x.skipped).map(x=>x.qid)));
    const fixed=(rec.items||[]).filter(x=>x.correct&&missed.has(x.qid)&&!everRight.has(x.qid));
    xp=fixed.length*10; note.push(`ชุดนี้เคยทำแล้ว รอบนี้ได้ XP เฉพาะข้อที่เคยพลาดแล้วแก้ได้ (${fixed.length} ข้อ)`);
  }
  const t=todayKey(), today=prev.filter(a=>isLesson(a)&&dayKey(a.endedAt)===t).reduce((s,a)=>s+Math.max(0,xpOf(a)),0);
  if(today+xp>DAY_XP_SOFT){ const over=today+xp-Math.max(DAY_XP_SOFT,today), keep=xp-over+Math.round(over/2); if(keep<xp){ note.push("วันนี้เก็บ XP เยอะมากแล้ว ส่วนที่เกินนับครึ่งเดียว พักบ้างนะ"); xp=keep } }
  return xp===rec.xp&&!before.length?rec:{...rec,xp,xpBase:rec.xp,...(before.length?{replay:true}:{}),xpNote:note.join(" · ")};
}

/* ---------- day types: school day or holiday (Thai public holidays, school days off, weekends), plus a manual switch ---------- */
const LEVELS={full:{label:"เต็ม",mins:"ราว 75–90 นาที แบ่งทำเป็นช่วงๆ",units:2,probe:true,sweep:10},mid:{label:"กลาง",mins:"ราว 60 นาที",units:2,probe:true,sweep:5},light:{label:"เบา",mins:"ราว 40 นาที",units:1,probe:false,sweep:5}};

const LOWER_REASONS=["มีธุระครอบครัว","ไปเที่ยว/ออกนอกบ้าน","การบ้านหรืองานเยอะ","เรียนพิเศษ/กิจกรรม","ไม่สบาย","อื่นๆ"];
const MILESTONES=[3,7,14,30,50,100,200,365];
function isoDay(dk){ const d=new Date(dk); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0") }
function baseDay(dk){
  const ds=isoDay(dk), wd=new Date(dk).getDay();
  if(CAL.holidays&&CAL.holidays[ds]) return {kind:"holiday",name:CAL.holidays[ds]};
  if(CAL.schoolOff&&CAL.schoolOff[ds]) return {kind:"holiday",name:CAL.schoolOff[ds]};
  for(const b of CAL.schoolBreaks||[]) if(ds>=b.from&&ds<=b.to) return {kind:"holiday",name:b.name};
  if(wd===0||wd===6) return {kind:"holiday",name:wd===6?"วันเสาร์":"วันอาทิตย์"};
  return {kind:"school",name:"วันไปโรงเรียน"};
}
function dayModes(list){ const m={}; list.filter(a=>a.type==="daymode").sort((a,b)=>new Date(a.endedAt)-new Date(b.endedAt)).forEach(a=>{m[a.day]={...(m[a.day]||{}),...a}}); return m }
function dayInfo(dk, modes){
  const b=baseDay(dk), o=modes[isoDay(dk)]||{};
  const kind=o.kind||b.kind, level=kind==="school"?"school":(o.level||"full");
  const name=o.kind&&o.kind!==b.kind?(o.kind==="holiday"?"หยุดเรียน (แจ้งเอง)":"ไปโรงเรียน (แจ้งเอง)"):b.name;
  return {kind,level,name,override:!!o.kind&&o.kind!==b.kind,lowered:kind==="holiday"&&level!=="full",reason:o.reason||""};
}

/* ---------- weekly quests ---------- */
function questStatus(list, wk, upto, met){
  const inWeek=a=>{const k=dayKey(a.endedAt); return k>=wk&&k<=upto};
  let metDays=0; for(let d=wk; d<=upto; d=nextDay(d)) if(met.has(d)) metDays++;
  const spelled=list.filter(a=>a.type==="vocab"&&inWeek(a)).reduce((s,a)=>s+(a.items||[]).filter(i=>i.kind==="spell"&&i.correct).length,0);
  let tierUp=0;
  if(metDays>=0){ const before=spellStats(list.filter(a=>dayKey(a.endedAt)<wk)), after=spellStats(list.filter(a=>dayKey(a.endedAt)<=upto));
    for(const [k,v] of Object.entries(after)) if(v.tier>(before[k]?.tier||0)) tierUp++; }
  const q=[{key:"days",label:"จุดไฟให้ครบ 5 วัน",have:metDays,need:5},{key:"tier",label:"ทำให้คาถาขึ้นขั้น 1 ครั้ง",have:tierUp,need:1},{key:"spell",label:"สะกดคำศัพท์ถูก 20 คำ",have:spelled,need:20}];
  return {q,all:q.every(x=>x.have>=x.need)};
}

function progressOf(list){
  const modes=dayModes(list);
  const byDay=new Map(), sweepDays=new Set(), skipDays=new Set(), leaveDays=new Set(), vocabDays=new Set(), units=new Map(), probes=new Map(), met=new Set();
  list.forEach(a=>{ const k=dayKey(a.endedAt);
    if(a.type==="daymode") return;
    if(a.type==="mission"||a.type==="teach"){ byDay.set(k,(byDay.get(k)||0)+xpOf(a)); return }   /* mission / teaching dad: XP only, not a daily unit */
    if(a.type==="goal"||a.type==="goaldone"||a.type==="shop"||a.type==="mood"||a.type==="adv"||a.type==="studio"||a.type==="elem"||a.type==="save"||a.type==="card"||a.type==="wish"||a.type==="chem") return;
    if(a.type==="lab"||a.type==="labverdict"||a.type==="labquest"){ byDay.set(k,(byDay.get(k)||0)+xpOf(a)); return }
    if(a.type==="sweep"){ sweepDays.add(k); byDay.set(k,(byDay.get(k)||0)+xpOf(a)); return }
    if(a.type==="recall"||a.type==="comp"){ byDay.set(k,(byDay.get(k)||0)+xpOf(a)); return }   /* 🧠 3-question recall tile: XP, not a lesson unit */   /* old-topic sweep: its own daily step, not a lesson unit */
    if(isSkip(a)){ if(a.leave&&a.from&&a.to){ for(let d=a.from; d<=a.to; d=nextDay(d)) leaveDays.add(d) } else skipDays.add(k); return }
    byDay.set(k,(byDay.get(k)||0)+xpOf(a));
    if(a.type==="vocab") vocabDays.add(k); else { units.set(k,(units.get(k)||0)+1); if(a.type==="probe"||a.type==="mixed"||a.type==="passage") probes.set(k,(probes.get(k)||0)+1) } });
  const probeCount=SETS.filter(s=>s.kind==="probe").length, firstProbe={};
  list.filter(a=>a.type==="probe").forEach(a=>{const k=dayKey(a.endedAt); firstProbe[a.setId]=Math.min(firstProbe[a.setId]??Infinity,k)});
  const probesLeft=d=>probeCount-Object.values(firstProbe).filter(x=>x<d).length>0;
  const today=todayKey();
  const noVocabToday=(()=>{try{const v=vocabToday();return !v.due.length&&!v.fresh.length}catch(e){return false}})();
  const need=d=>{ const info=dayInfo(d,modes); const ex=examAt(d); if(ex&&ex.phase==="during") return {units:0,probe:false,info,exam:true};
    if(ex&&ex.phase==="prep") return {units:1,probe:false,info};
    if(info.level==="school") return {units:1,probe:false,info}; const L=LEVELS[info.level]; return {units:L.units,probe:L.probe&&probesLeft(d),info} };
  const sweepFrom=CAL.sweepFrom?new Date(CAL.sweepFrom+"T00:00:00").getTime():Infinity, noSweepToday=(()=>{try{return !sweepQuestions(list,1).length}catch(e){return true}})();
  const sweepOk=d=>d<sweepFrom||examAt(d)||sweepDays.has(d)||(d===today&&noSweepToday);
  const isMet=d=>{ const n=need(d); return (vocabDays.has(d)||(d===today&&noVocabToday))&&(units.get(d)||0)>=n.units&&(!n.probe||(probes.get(d)||0)>=1)&&sweepOk(d) };
  const keys=[...byDay.keys(),...skipDays,...[...leaveDays].filter(d=>d<=today)];
  let streak=0, best=0, freeze=0, goalDays=0; const frozen=new Set(), earned=[], questDone=new Set();
  if(keys.length){
    for(let d=Math.min(...keys); d<=today; d=nextDay(d)){
      const xp=byDay.get(d)||0;
      if(isMet(d)){ met.add(d); goalDays++; streak++; best=Math.max(best,streak);
        if(goalDays%5===0&&freeze<FREEZE_MAX){freeze++;earned.push({d,why:"ทำภารกิจครบ 5 วัน"})}
        if((units.get(d)||0)>need(d).units&&freeze<FREEZE_MAX){freeze++;earned.push({d,why:"ทำชุดฝึกเกินภารกิจของวันนั้น"})}
      } else if(leaveDays.has(d)){
        /* planned leave (camp, trip): the flame waits, no ice used */
      } else if(d<today){
        if(freeze>0&&streak>0){freeze--;frozen.add(d)} else streak=0;
      }
      const wk=weekStart(d);
      if(!questDone.has(wk)&&met.has(d)&&questStatus(list,wk,d,met).all){ questDone.add(wk); if(freeze<FREEZE_MAX){freeze++;earned.push({d,why:"ภารกิจประจำสัปดาห์ครบ"})} }
    }
  }
  const n=need(today), u=units.get(today)||0, pr=probes.get(today)||0;
  return {streak,best,freeze,goalDays,frozen,skipDays,byDay,met,todayXp:byDay.get(today)||0,leaveDays,onLeave:leaveDays.has(today),
    unitsToday:u,probesToday:pr,sweepToday:sweepDays.has(today),sweepNeeded:today>=sweepFrom&&!noSweepToday,lessonToday:u-pr>=1||(u>=1&&!n.probe),vocabToday:vocabDays.has(today),noVocabToday,need:n,info:n.info,modes,
    goalToday:met.has(today),earnedToday:earned.filter(e=>e.d===today),quests:questStatus(list,weekStart(today),today,met),questDoneThisWeek:questDone.has(weekStart(today)),questWeeks:[...questDone].sort()};
}

/* ---------- what to do today ---------- */
function lastDone(list){ const last={}; list.filter(isLesson).forEach(a=>{if(a.setId) last[a.setId]=Math.max(last[a.setId]||0,dayKey(a.endedAt))}); return last }
function pickLesson(list, preferCurrent, exclude){
  const last=lastDone(list), t=todayKey(), ex=exclude||[];
  /* calendar.lessonQueue: the school's order for the next lessons; the first one not done yet comes first */
  if(preferCurrent&&Array.isArray(CAL.lessonQueue)){ const q=CAL.lessonQueue.map(id=>SETS.find(s=>s.id===id)).find(s=>s&&s.kind==="lesson"&&!last[s.id]&&!ex.includes(s.id)); if(q) return q }
  const lessons=SETS.filter(s=>s.kind==="lesson"&&!ex.includes(s.id)); if(!lessons.length) return null;
  const pool=lessons.filter(s=>last[s.id]!==t), use=pool.length?pool:lessons;
  return use.slice().sort((a,b)=>(preferCurrent?(b.current?1:0)-(a.current?1:0):0)||(last[a.id]||0)-(last[b.id]||0))[0];
}
function pickProbe(list){ const done=new Set(list.filter(a=>a.type==="probe").map(a=>a.setId)); return SETS.find(s=>s.kind==="probe"&&!done.has(s.id))||null }
/* mixed exam-style sets (interleaving): one per week on a holiday, in the probe slot */
function pickMixed(list){
  const done=new Set(list.filter(a=>a.type==="mixed").map(a=>a.setId));
  const wk=weekStart(todayKey()), thisWeek=list.filter(a=>a.type==="mixed"&&dayKey(a.endedAt)>=wk&&dayKey(a.endedAt)<todayKey()).length;
  const doneToday=list.some(a=>a.type==="mixed"&&dayKey(a.endedAt)===todayKey());
  if(thisWeek>=(CAL.mixedPerWeek||1)&&!doneToday) return null;
  return SETS.find(s=>s.kind==="mixed"&&!done.has(s.id))||(doneToday?SETS.find(s=>s.kind==="mixed"&&list.some(a=>a.setId===s.id&&dayKey(a.endedAt)===todayKey())):null)||null;
}
/* weekly Thai science reading passage: in the probe slot on a holiday that has no mixed set */
function pickPassage(list){
  const done=new Set(list.filter(a=>a.type==="passage").map(a=>a.setId)), wk=weekStart(todayKey()), t=todayKey();
  const doneToday=list.find(a=>a.type==="passage"&&dayKey(a.endedAt)===t);
  if(doneToday) return SETS.find(s=>s.id===doneToday.setId)||null;
  if(list.filter(a=>a.type==="passage"&&dayKey(a.endedAt)>=wk).length>=(CAL.passagePerWeek||1)) return null;
  return SETS.find(s=>s.kind==="passage"&&!done.has(s.id))||null;
}
/* ---------- school exams (calendar.schoolExams): a week of review before, a light load during ---------- */
function examAt(dk){ const ds=isoDay(dk); for(const x of CAL.schoolExams||[]){ const pre=isoDay(new Date(x.from+"T12:00:00").getTime()-(CAL.examPrepDays||7)*DAY);

/* ---------- read aloud in Thai: phrase by phrase, the phrase being read is highlighted so her eyes follow the text
   (reading-while-listening trains reading; listening instead of reading does not). Questions: only after she has
   tried reading for a while, and never in mixed exam-style sets. ---------- */
const RD={where:null,chunks:[],k:0,rate:1,timer:null};
const RD_RATES=[["ช้ามาก",0.6],["ช้า",0.8],["ปกติ",1],["เร็ว",1.2]];
try{ const x=parseFloat(localStorage.getItem("fieldnote.thrate")); if(x) RD.rate=x }catch(e){}
function thVoices(){ try{ return speechSynthesis.getVoices().filter(v=>/^th/i.test(v.lang)) }catch(e){ return [] } }
function thVoice(){ const vs=thVoices(); let want=null; try{ want=localStorage.getItem("fieldnote.thvoice") }catch(e){} return vs.find(v=>v.name===want)||vs[0]||null }
try{ speechSynthesis.addEventListener&&speechSynthesis.addEventListener("voiceschanged",()=>{ const sel=document.getElementById("rdvoice"); if(sel&&RD.box) sel.outerHTML=thVoiceSelect() }) }catch(e){}
function thVoiceSelect(){ const vs=thVoices(), cur=thVoice();
  if(vs.length<=1) return `<span class="small muted" id="rdvoice">${vs.length?`เสียง: ${esc(vs[0].name)}`:""} · อยากได้เสียงอื่น ดาวน์โหลดเพิ่มที่ การตั้งค่า › การช่วยการเข้าถึง › เนื้อหาที่ถูกพูด › เสียง › ไทย</span>`;
  return `<label class="small row" style="gap:6px" id="rdvoice">เสียง <select id="rdvsel" style="font:inherit;padding:4px 6px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)">${vs.map(v=>`<option value="${esc(v.name)}" ${cur&&cur.name===v.name?"selected":""}>${esc(v.name)}</option>`).join("")}</select></label>` }
const SUP={"⁰":"0","¹":"1","²":"2","³":"3","⁴":"4","⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9","⁻":"ลบ "};
const UNIT_SAY={km:"กิโลเมตร",cm:"เซนติเมตร",mm:"มิลลิเมตร",m:"เมตร",kg:"กิโลกรัม",mg:"มิลลิกรัม",g:"กรัม",mL:"มิลลิลิตร",ml:"มิลลิลิตร",L:"ลิตร",N:"นิวตัน",Pa:"ปาสคาล",kPa:"กิโลปาสคาล",W:"วัตต์",kW:"กิโลวัตต์",kWh:"กิโลวัตต์ชั่วโมง",J:"จูล",s:"วินาที",h:"ชั่วโมง",V:"โวลต์",A:"แอมแปร์","µm":"ไมโครเมตร"};
function sayable(t){
  return String(t).replace(/PM ?2\.5/g,"พีเอ็มสองจุดห้า").replace(/ม\.(\d)/g,"มอ $1").replace(/ป\.(\d)/g,"ปอ $1")
    .replace(/([\d⁰¹²³⁴⁵⁶⁷⁸⁹]) ?(kWh|kPa|km|cm|mm|kg|mg|mL|ml|kW|µm|Pa|m|g|L|N|W|J|V|A|s|h)(?![A-Za-z²³\/])/g,(m,d,u)=>d+" "+UNIT_SAY[u]+" ")
    .replace(/(\d+)\/(\d+)/g,"$1 ส่วน $2")
    .replace(/µg\/m³/g," ไมโครกรัมต่อลูกบาศก์เมตร ").replace(/g\/cm³/g," กรัมต่อลูกบาศก์เซนติเมตร ").replace(/cm³/g," ลูกบาศก์เซนติเมตร ").replace(/m³/g," ลูกบาศก์เมตร ")
    .replace(/m²/g," ตารางเมตร ").replace(/cm²/g," ตารางเซนติเมตร ").replace(/°C/g," องศาเซลเซียส ").replace(/% ?w\/v/g," เปอร์เซ็นต์โดยมวลต่อปริมาตร ")
    .replace(/(\d)²/g,"$1 กำลังสอง ").replace(/(\d)³/g,"$1 กำลังสาม ").replace(/([⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g,m=>" ยกกำลัง "+[...m].map(c=>SUP[c]).join("")+" ")
    .replace(/√/g," รากที่สองของ ").replace(/×/g," คูณ ").replace(/÷/g," หาร ").replace(/=/g," เท่ากับ ").replace(/[−–](?=\s*\d)/g," ลบ ")
    .replace(/%/g," เปอร์เซ็นต์ ").replace(/(\d) : (\d)/g,"$1 ต่อ $2").replace(/[→]/g," ได้ ").replace(/·/g,", ").replace(/\s+/g," ").trim();
}
function chunkText(t){
  const parts=String(t).replace(/\s+/g," ").trim().split(/(?<=[ .?!;])(?=\S)/), out=[];
  for(const p of parts){ if(out.length&&(out[out.length-1].length<22||p.trim().length<6)) out[out.length-1]+=p; else out.push(p) }
  return out.filter(x=>x.trim());
}
function readStop(){ try{ speechSynthesis.cancel() }catch(e){} RD.where=null; document.querySelectorAll(".rdbox").forEach(b=>b.remove()); document.querySelectorAll("[data-read]").forEach(b=>b.textContent=b.dataset.label) }
function readAloud(where, texts, after){
  if(RD.where===where){ readStop(); return }
  readStop();
  if(!CAN_SPEAK){ alertRead(where,"เครื่องนี้ใช้เสียงอ่านไม่ได้ ลองเปิดใน Safari หรือ Chrome"); return }
  const btn=document.querySelector(`[data-read="${where}"]`); if(!btn) return;
  RD.where=where; const groups=texts.map(t=>chunkText(t)); RD.chunks=groups.flat(); RD.k=0;
  const box=document.createElement("div"); box.className="rdbox"; box.setAttribute("aria-live","off");
  let n=0; box.innerHTML=`${groups.map(g=>`<div>${g.map(c=>`<span data-ck="${n++}">${esc(c)}</span>`).join("")}</div>`).join("")}
    <div class="row" style="margin-top:8px;gap:8px"><span class="small">ความเร็ว</span><span class="why">${RD_RATES.map(([l,v])=>`<button type="button" data-rate="${v}" aria-pressed="${RD.rate===v}">${l}</button>`).join("")}</span></div>
    <div class="row" style="gap:8px">${thVoiceSelect()}</div><span class="small muted">ให้ตาวิ่งตามตัวที่ไฮไลต์ไปด้วยนะ</span>`;
  (btn.closest(".row")||btn).insertAdjacentElement("afterend",box); btn.textContent="⏹ หยุดอ่าน"; RD.box=box;
  /* changing speed or voice restarts the current phrase right away, so she hears the difference */
  const restart=()=>{ RD.gen=(RD.gen||0)+1; try{ speechSynthesis.cancel() }catch(err){} setTimeout(()=>{ if(RD.where===where) next() },60) };
  box.addEventListener("click",e=>{ const b=e.target.closest("[data-rate]"); if(!b) return; RD.rate=parseFloat(b.dataset.rate);
    try{localStorage.setItem("fieldnote.thrate",String(RD.rate))}catch(err){} box.querySelectorAll("[data-rate]").forEach(x=>x.setAttribute("aria-pressed",x===b)); restart() });
  box.addEventListener("change",e=>{ if(e.target.id!=="rdvsel") return; try{localStorage.setItem("fieldnote.thvoice",e.target.value)}catch(err){} restart() });
  if(after) after();
  let started=false;
  const next=()=>{ if(RD.where!==where) return;
    box.querySelectorAll("[data-ck]").forEach(x=>x.classList.toggle("now",+x.dataset.ck===RD.k));
    const btn=document.querySelector(`[data-read="${where}"]`)||{dataset:{}};
    if(RD.k>=RD.chunks.length){ RD.where=null; btn.textContent=btn.dataset.label; box.querySelectorAll(".now").forEach(x=>x.classList.remove("now")); return }
    const v=thVoice(), k=RD.k, gen=RD.gen||0, u=new SpeechSynthesisUtterance(sayable(RD.chunks[k])); u.lang="th-TH"; if(v){ u.voice=v; u.lang=v.lang } u.rate=RD.rate;
    u.onstart=()=>{started=true}; u.onend=()=>{ if(RD.k===k&&RD.where===where&&(RD.gen||0)===gen){ RD.k++; next() } }; u.onerror=e=>{ if(e.error!=="interrupted"&&e.error!=="canceled"){ RD.where=null; btn.textContent=btn.dataset.label; alertRead(where,"เสียงภาษาไทยยังไม่พร้อม บน iPad ไปที่ การตั้งค่า › การช่วยการเข้าถึง › เนื้อหาที่ถูกพูด › เสียง › ไทย แล้วดาวน์โหลดเสียง") } };
    try{ speechSynthesis.speak(u) }catch(e){} };
  next();

}

/* ---------- figures inside questions (q.fig): dot plot, stem-and-leaf (one or two sided), histogram/bar chart, table ---------- */
function figHtml(f){
  if(!f) return "";
  try{
  if(f.kind==="dot"){ const step=f.step||1, n=Math.round((f.max-f.min)/step), W=Math.max(260,n*26+40), maxc=Math.max(1,...Object.values(f.counts||{})), H=maxc*13+46, x=v=>20+(v-f.min)/step*((W-40)/n);
    const tick=f.tick||(n>14?2:1); let g="";
    for(let i=0;i<=n;i++){ const v=+(f.min+i*step).toFixed(4); g+=`<line x1="${x(v)}" y1="${H-26}" x2="${x(v)}" y2="${H-20}" stroke="currentColor"/>`+(i%tick===0?`<text x="${x(v)}" y="${H-6}" font-size="11" text-anchor="middle" fill="currentColor">${v}</text>`:"") }
    Object.entries(f.counts||{}).forEach(([v,c])=>{ for(let k=0;k<c;k++) g+=`<circle cx="${x(+v)}" cy="${H-33-k*13}" r="4.6" fill="var(--accent)"/>` });
    return `<figure class="qfig"><svg viewBox="0 0 ${W} ${H}" style="max-width:${W}px" role="img" aria-label="แผนภาพจุด"><line x1="10" y1="${H-23}" x2="${W-10}" y2="${H-23}" stroke="currentColor" stroke-width="1.5"/>${g}</svg>${f.label?`<figcaption class="small muted">${esc(f.label)}</figcaption>`:""}</figure>` }
  if(f.kind==="stem"){ const two=f.rows.some(r=>r.length===3);
    return `<figure class="qfig"><table class="stemtab">${f.head?`<tr>${f.head.map((h,i)=>`<th class="${two&&i===0?"l":""}">${esc(h)}</th>`).join("")}</tr>`:""}${f.rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${two?(i===0?"l":i===1?"st":""):(i===0?"st":"")}">${esc(c)}</td>`).join("")}</tr>`).join("")}</table>${f.key?`<figcaption class="small muted">${esc(f.key)}</figcaption>`:""}</figure>` }
  if(f.kind==="hist"||f.kind==="bar"){ const v=f.values, mx=Math.max(...v), W=Math.max(260,v.length*48+50), H=190, bw=(W-50)/v.length, gap=f.kind==="hist"?0:10, y=t=>H-30-(t/mx)*(H-55);
    let g=""; v.forEach((t,i)=>{ g+=`<rect x="${40+i*bw+gap/2}" y="${y(t)}" width="${bw-gap}" height="${H-30-y(t)}" fill="color-mix(in srgb,var(--accent) 55%,transparent)" stroke="currentColor" stroke-width="1"/><text x="${40+i*bw+bw/2}" y="${y(t)-4}" font-size="11" text-anchor="middle" fill="currentColor">${t}</text>` });
    (f.labels||[]).forEach((l,i)=>{ g+=`<text x="${f.kind==="hist"&&f.edges?40+i*bw:40+i*bw+bw/2}" y="${H-14}" font-size="10.5" text-anchor="middle" fill="currentColor">${esc(l)}</text>` });
    return `<figure class="qfig"><svg viewBox="0 0 ${W} ${H}" style="max-width:${W}px" role="img" aria-label="${f.kind==="hist"?"ฮิสโทแกรม":"แผนภูมิแท่ง"}"><line x1="38" y1="${H-30}" x2="${W-6}" y2="${H-30}" stroke="currentColor"/><line x1="38" y1="12" x2="38" y2="${H-30}" stroke="currentColor"/>${g}</svg>${f.xLabel||f.yLabel?`<figcaption class="small muted">${esc([f.yLabel&&("แกนตั้ง: "+f.yLabel),f.xLabel&&("แกนนอน: "+f.xLabel)].filter(Boolean).join(" · "))}</figcaption>`:""}</figure>` }
  if(f.kind==="table") return `<figure class="qfig"><div style="overflow-x:auto"><table class="mt">${f.head?`<thead><tr>${f.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>`:""}<tbody>${f.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${f.caption?`<figcaption class="small muted">${esc(f.caption)}</figcaption>`:""}</figure>`;
  }catch(e){}
  return "";
}

const GLOSS_KEYS=Object.keys(GLOSS).sort((a,b)=>b.length-a.length);
/* question data written as "a → b · c → d · ..." is shown one item per line (father, 10 Nov: the dots were hard to read) */
function qLines(h){ if(!h||h.indexOf(" · ")<0||/English corner/.test(h)) return h; const parts=h.split(" · ");
  let head=parts[0], first="", after=""; const c=head.lastIndexOf(": "); if(c>0&&c>head.length-40){ first=head.slice(c+2); head=head.slice(0,c+1) } else { const o=head.lastIndexOf("("); if(o>=0&&o>head.length-40){ first=head.slice(o+1); head=head.slice(0,o+1) } else { first=head; head="" } }
  const items=[first,...parts.slice(1)]; let last=items[items.length-1];
  const startsData=x=>/^\s*[\d(]/.test(x);
  if(items.length>2&&startsData(items[0])&&!startsData(last)&&!/→/.test(last)){ items.pop(); after=last }
  else { const r=/\s{2}(?=\()|\)\s+(?=[ก-๙])|\s(?=(?:ข้อใด|ข้อสรุป|ถ้า|จง|ฐานนิยม|มัธยฐาน|ค่าเฉลี่ย|พิสัย|ชมรม|ส่วนกลุ่ม|มีนักเรียน|ทำไม|ช่วงคะแนนใด|ช่วงใด))/g; let mm, cut=-1;
    while((mm=r.exec(last))){ if(mm.index>0){ cut=mm.index+(mm[0].startsWith(")")?1:0); break } }
    if(cut>0){ items[items.length-1]=last.slice(0,cut); after=last.slice(cut).trim() } }
  return head+items.map(x=>`<span class="qline">${x}</span>`).join("")+(after?`<span class="qafter">${after}</span>`:"") }
function gloss(raw){
  let t=esc(raw); const marks=[];
  GLOSS_KEYS.forEach(k=>{ const ek=esc(k), i=t.indexOf(ek); if(i<0) return;
    marks.push(k); t=t.slice(0,i)+"\u0001"+(marks.length-1)+"\u0002"+t.slice(i+ek.length) });
  return t.replace(/\u0001(\d+)\u0002/g,(_,n)=>`<button class="term" type="button" data-t="${esc(marks[+n])}">${esc(marks[+n])}</button>`);
}
function bindGloss(){
  $v.querySelectorAll(".term").forEach(b=>b.onclick=()=>{
    const box=document.getElementById("gloss-box"); if(!box) return;
    const k=b.dataset.t; box.hidden=false; box.innerHTML=`<b>${esc(k)}</b> <span class="small">${esc(GLOSS[k]||"")}</span> <button class="btn ghost" id="gloss-x" style="border:0;padding:0 4px">ปิด</button>`;
    document.getElementById("gloss-x").onclick=()=>{box.hidden=true};
    if(S&&!S.glossed.includes(k)) S.glossed.push(k);
  });
}

/* ---------- scratch paper for the pencil ---------- */
const PAD={open:false,strokes:[],hist:[],tool:"pen",penSeen:false,view:{z:1,x:0,y:0},big:false};
try{ PAD.penSeen=localStorage.getItem("fieldnote.pen")==="1" }catch(e){}
function padHtml(){
  return `<button class="padfab" id="pad-toggle" type="button">${PAD.open?"✕ ปิดกระดาษทด":"✏️ กระดาษทด"}</button>
  <div class="pad ${PAD.big?"big":""}" id="pad" ${PAD.open?"":"hidden"}>
    <div class="padbar"><button type="button" data-tool="pen" aria-pressed="${PAD.tool==="pen"}">✏️ ปากกา</button><button type="button" data-tool="eraser" aria-pressed="${PAD.tool==="eraser"}">🧽 ยางลบ (ลบทีละเส้น)</button>
      <button type="button" data-tool="pan" aria-pressed="${PAD.tool==="pan"}">✋ เลื่อน</button>
      <button type="button" id="pad-zo" aria-label="ซูมออก">🔍−</button><button type="button" id="pad-zi" aria-label="ซูมเข้า">🔍+</button><button type="button" id="pad-fit">⤢ ${Math.round(PAD.view.z*100)}%</button>
      <button type="button" id="pad-big" aria-pressed="${PAD.big}">${PAD.big?"⬇ ย่อกระดาษ":"⬆ ขยายกระดาษ"}</button>
      <button type="button" id="pad-undo">↶ ย้อน</button><button type="button" id="pad-clear">🗑 ล้าง</button></div>
    <canvas id="pad-canvas"></canvas></div>`;
}
function padSetup(){
  const tg=document.getElementById("pad-toggle"); if(!tg) return;
  tg.onclick=()=>{PAD.open=!PAD.open; document.body.classList.toggle("padopen",PAD.open); const p=document.getElementById("pad"); p.hidden=!PAD.open; tg.textContent=PAD.open?"✕ ปิดกระดาษทด":"✏️ กระดาษทด"; if(PAD.open) padDraw(true)};
  document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{PAD.tool=b.dataset.tool;document.querySelectorAll("[data-tool]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.tool===PAD.tool))});
  /* undo history: "add" a stroke, or "erase" whole strokes (so undo brings erased lines back) */
  document.getElementById("pad-undo").onclick=()=>{ const h=PAD.hist.pop(); if(!h) return;
    if(h.type==="add") PAD.strokes=PAD.strokes.filter(x=>x!==h.stroke); else if(h.type==="erase") PAD.strokes.push(...h.strokes); else if(h.type==="clear") PAD.strokes=h.strokes; padDraw() };
  document.getElementById("pad-clear").onclick=()=>{ if(PAD.strokes.length) PAD.hist.push({type:"clear",strokes:PAD.strokes}); PAD.strokes=[]; padDraw() };
  const cv=document.getElementById("pad-canvas"); let cur=null, activeId=null, erased=null;
  /* zoom and pan: strokes are kept in paper coordinates; the view (z, x, y) maps paper to screen.
     Zoom out = more paper. Move with the ✋ tool, or with two fingers (pinch to zoom). */
  const V=PAD.view, fitLbl=()=>{ const f=document.getElementById("pad-fit"); if(f) f.textContent="⤢ "+Math.round(V.z*100)+"%" };
  const zoomAt=(nz,cx,cy)=>{ nz=Math.max(0.35,Math.min(3,nz)); V.x=cx-(cx-V.x)*nz/V.z; V.y=cy-(cy-V.y)*nz/V.z; V.z=nz; fitLbl(); padDraw() };
  document.getElementById("pad-zi").onclick=()=>zoomAt(V.z*1.25,cv.clientWidth/2,cv.clientHeight/2);
  document.getElementById("pad-zo").onclick=()=>zoomAt(V.z/1.25,cv.clientWidth/2,cv.clientHeight/2);
  document.getElementById("pad-fit").onclick=()=>{ V.z=1; V.x=0; V.y=0; fitLbl(); padDraw() };
  document.getElementById("pad-big").onclick=()=>{ PAD.big=!PAD.big; document.body.classList.toggle("padbig",PAD.big); const pd=document.getElementById("pad"); pd.classList.toggle("big",PAD.big);
    const b=document.getElementById("pad-big"); b.textContent=PAD.big?"⬇ ย่อกระดาษ":"⬆ ขยายกระดาษ"; b.setAttribute("aria-pressed",PAD.big); padDraw(true) };
  const touches=new Map(); let pinch=null, panning=null;
  const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left-V.x)/V.z,(e.clientY-r.top-V.y)/V.z,e.pressure||0.5]};
  const scr=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  cv.addEventListener("pointerdown",e=>{ if(e.pointerType!=="touch") return; touches.set(e.pointerId,scr(e));
    if(touches.size===2){ const [a,b]=[...touches.values()]; pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),m:[(a[0]+b[0])/2,(a[1]+b[1])/2],z:V.z,x:V.x,y:V.y};
      if(cur&&cur.touch){ PAD.strokes=PAD.strokes.filter(x=>x!==cur); PAD.hist=PAD.hist.filter(h=>h.stroke!==cur); cur=null; activeId=null; padDraw() } } },true);
  cv.addEventListener("pointermove",e=>{ if(!touches.has(e.pointerId)) return; touches.set(e.pointerId,scr(e));
    if(pinch&&touches.size>=2){ const [a,b]=[...touches.values()], d=Math.hypot(a[0]-b[0],a[1]-b[1]), m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
      const nz=Math.max(0.35,Math.min(3,pinch.z*d/pinch.d)); V.z=nz; V.x=m[0]-(pinch.m[0]-pinch.x)*nz/pinch.z; V.y=m[1]-(pinch.m[1]-pinch.y)*nz/pinch.z; fitLbl(); padDraw() } },true);
  const tEnd=e=>{ touches.delete(e.pointerId); if(touches.size<2) pinch=null };
  cv.addEventListener("pointerup",tEnd,true); cv.addEventListener("pointercancel",tEnd,true);
  /* stroke eraser: any stroke passing within 14 px of the eraser is removed whole */
  const near=(s,x,y)=>s.pts.some((p,i)=>{ const q=s.pts[i-1]||p, dx=p[0]-q[0], dy=p[1]-q[1], L=dx*dx+dy*dy, t=L?Math.max(0,Math.min(1,((x-q[0])*dx+(y-q[1])*dy)/L)):0;
    const cx=q[0]+t*dx-x, cy=q[1]+t*dy-y, R=14/PAD.view.z; return cx*cx+cy*cy<R*R });
  const eraseAt=([x,y])=>{ const hit=PAD.strokes.filter(s=>near(s,x,y)); if(hit.length){ PAD.strokes=PAD.strokes.filter(s=>!hit.includes(s)); erased.push(...hit); padDraw() } };
  /* palm rejection: once a pencil has been used on this device, finger/palm touches never draw; a pencil always wins */
  cv.onpointerdown=e=>{
    if(e.pointerType==="pen"){ if(!PAD.penSeen){ PAD.penSeen=true; try{localStorage.setItem("fieldnote.pen","1")}catch(err){} }
      if(cur&&cur.touch){ PAD.strokes=PAD.strokes.filter(x=>x!==cur); PAD.hist=PAD.hist.filter(h=>h.stroke!==cur); cur=null } }
    else if(PAD.penSeen&&e.pointerType==="touch") return;

    if(PAD.tool==="pan"){ panning={s:scr(e),x:V.x,y:V.y}; return }

  cv.onpointermove=e=>{ if(e.pointerId!==activeId||pinch) return;
    if(panning){ const c=scr(e); V.x=panning.x+c[0]-panning.s[0]; V.y=panning.y+c[1]-panning.s[1]; padDraw(); return }
    let evs=e.getCoalescedEvents?e.getCoalescedEvents():[]; if(!evs.length) evs=[e];
    if(erased){ evs.forEach(ev=>eraseAt(pt(ev))); return }
    if(cur){ evs.forEach(ev=>cur.pts.push(pt(ev))); padDraw() } };
  cv.onpointerup=cv.onpointercancel=e=>{ if(e.pointerId!==activeId) return; if(erased&&erased.length) PAD.hist.push({type:"erase",strokes:erased}); erased=null; cur=null; activeId=null; panning=null };
  /* stop iPad's long-press magnifier / selection and page gestures on the pad */
  ["touchstart","touchmove"].forEach(t=>cv.addEventListener(t,ev=>ev.preventDefault(),{passive:false}));
  if(PAD.open){ document.body.classList.add("padopen"); document.body.classList.toggle("padbig",PAD.big); padDraw(true) }
}
function padDraw(resize){
  const cv=document.getElementById("pad-canvas"); if(!cv||cv.offsetParent===null) return;
  const dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight;
  if(resize||cv.width!==Math.round(w*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr) }
  const g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  const ink=getComputedStyle(document.documentElement).getPropertyValue("--ink").trim()||"#16302B", V=PAD.view;
  /* faint dot grid in paper coordinates, so moving and zooming feels like moving real paper */
  { const step=32*V.z; if(step>=6){ g.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--line").trim()||"#ddd"; g.lineWidth=1; const oy=((V.y%step)+step)%step;
      g.beginPath(); for(let y=oy;y<h;y+=step){ g.moveTo(0,Math.round(y)+0.5); g.lineTo(w,Math.round(y)+0.5) } g.stroke() } }
  g.setTransform(dpr*V.z,0,0,dpr*V.z,dpr*V.x,dpr*V.y);
  PAD.strokes.forEach(s=>{ g.globalCompositeOperation=s.tool==="eraser"?"destination-out":"source-over"; g.strokeStyle=ink; g.lineCap="round"; g.lineJoin="round";
    if(s.pts.length===1){ const [x,y,p]=s.pts[0]; g.fillStyle=ink; g.beginPath(); g.arc(x,y,0.8+p*1.3,0,7); g.fill() }
    for(let i=1;i<s.pts.length;i++){ const [x0,y0]=s.pts[i-1],[x1,y1,p]=s.pts[i]; g.lineWidth=s.tool==="eraser"?22:1.2+p*2.6; g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke() } });
  g.globalCompositeOperation="source-over";
}
window.addEventListener("resize",()=>padDraw(true));

async function finishWith(rec){
  if(S&&rec.type!=="vocab"){ S.active=false; if(S.mode==="set") clearProgress() }
  PAD.open=false; document.body.classList.remove("padopen");
  const prevList=mine(), before=progressOf(prevList), ssB=spellStats(prevList);
  { const adj=xpRules(rec,prevList); if(adj!==rec) Object.assign(rec,adj); }
  const where=await saveAttempt(rec);
  const list=attempts.includes(rec)?mine():[rec,...mine()];
  const after=progressOf(list), ssA=spellStats(list);
  /* celebrations: only for things that matter, so they stay special */
  const cele=[];
  SPELLS.forEach(sp=>{ const tA=ssA[sp.id]?.tier||0, tB=ssB[sp.id]?.tier||0; if(tA>tB) cele.push({kind:"tier",sp,tier:tA}) });
  Object.keys(REALMS).forEach(rk=>{ const sps=SPELLS.filter(s=>s.realm===rk);
    if(sps.every(s=>(ssA[s.id]?.tier||0)>=1)&&!sps.every(s=>(ssB[s.id]?.tier||0)>=1)) cele.push({kind:"realm",rk}) });
  MILESTONES.filter(m=>after.best>=m&&before.best<m).forEach(m=>cele.push({kind:"milestone",m}));
  if(after.questDoneThisWeek&&!before.questDoneThisWeek) cele.push({kind:"quest"});
  if(after.freeze>before.freeze) cele.push({kind:"ice",why:after.earnedToday.map(e=>e.why).join(", ")});
  S={...S,where,rec,before,after,list,cele,ci:0}; view="done"; render(); window.scrollTo({top:0});
}

    return `<section class="card"><span class="eyebrow">🎯 เป้าหมายเดือนนี้ที่เธอตั้งเอง</span><h3>${esc(g.goal)}</h3>
      <div class="progress"><i style="width:${g.target?have/g.target*100:0}%"></i></div><span class="small muted">${have}/${g.target}${g.metric==="custom"?"":" · นับอัตโนมัติ"}</span>
      ${g.reward?`<p class="small">รางวัลที่ขอ: ${esc(g.reward)} · ${dec?.status==="ok"?"✅ พ่อตกลงแล้ว":dec?.status==="talk"?`💬 พ่ออยากคุยกันก่อน${dec.note?`: “${esc(dec.note)}”`:""}`:`⏳ ${esc(b.name)} กำลังคุยกับพ่อให้`}</p>`:""}
      ${done?`<p><b>สำเร็จแล้ว! 🎉 ไปบอกพ่อได้เลย</b></p>`:g.metric==="custom"?`<button class="btn ghost small" id="gdone">ทำสำเร็จแล้ว</button>`:""}</section>` }
  const opts=goalOptions(list);
  return `<section class="card"><span class="eyebrow">🎯 ตั้งเป้าหมายเดือนนี้ (เลือกเอง)</span>
    <p class="small">${esc(b.name)}: เดือนนี้อยากพิชิตอะไร เลือกเองเลย หรือเขียนเป้าของเธอเองก็ได้</p>
    <div class="why">${opts.map(o=>`<button data-gk="${o.key}" aria-pressed="${gDraft.key===o.key}">${esc(o.label)}</button>`).join("")}<button data-gk="custom" aria-pressed="${gDraft.key==="custom"}">เขียนเป้าเอง</button></div>
    ${gDraft.key==="custom"?`<input id="gcustom" maxlength="80" value="${esc(gDraft.custom)}" placeholder="เช่น อธิบายพีทาโกรัสให้พ่อฟังได้โดยไม่ดูโน้ต" style="font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)">`:""}
    <label class="small" for="greward">ถ้าทำได้ อยากขอรางวัลอะไรจากพ่อ (ไม่บังคับ) ${esc(b.name)} จะลองคุยกับพ่อให้</label>
    <div class="why">${REWARD_IDEAS.map(r=>`<button data-gr="${esc(r)}" aria-pressed="${gDraft.reward===r}">${esc(r)}</button>`).join("")}</div>
    <input id="greward" maxlength="80" value="${esc(gDraft.reward)}" placeholder="หรือพิมพ์เอง" style="font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)">
    <button class="btn" id="gsave" ${gDraft.key&&(gDraft.key!=="custom"||gDraft.custom.trim())?"":"disabled"}>ตั้งเป้านี้</button></section>` }
function bindGoal(list){
  const keep=()=>{ const c=document.getElementById("gcustom"), r=document.getElementById("greward"); if(c) gDraft.custom=c.value; if(r) gDraft.reward=r.value };
  $v.querySelectorAll("[data-gk]").forEach(b=>b.onclick=()=>{keep();gDraft.key=b.dataset.gk;renderHome()});
  $v.querySelectorAll("[data-gr]").forEach(b=>b.onclick=()=>{keep();gDraft.reward=b.dataset.gr;renderHome()});
  const c=document.getElementById("gcustom"); if(c) c.oninput=()=>{gDraft.custom=c.value; document.getElementById("gsave").disabled=!c.value.trim()};
  const r=document.getElementById("greward"); if(r) r.oninput=()=>{gDraft.reward=r.value};
  const s=document.getElementById("gsave"); if(s) s.onclick=async()=>{ keep(); s.disabled=true; const o=goalOptions(list).find(x=>x.key===gDraft.key), now=new Date().toISOString(), id="goal-"+monthKey(todayKey())+"-"+Date.now().toString(36);
    await saveAttempt({type:"goal",setId:id,topic:"เป้าหมายเดือนนี้",month:monthKey(todayKey()),metric:gDraft.key,goal:o?o.label:gDraft.custom.trim(),target:o?o.target:1,
      base:Object.values(spellStats(list)).filter(v=>v.tier>=1).length,reward:gDraft.reward.trim(),startedAt:now,endedAt:now,durationSec:0,correct:0,total:0,xp:0,items:[]});
    buddyNote=`รับทราบ! เป้าหมายนี้เท่มาก${gDraft.reward.trim()?` เรื่องรางวัล เดี๋ยวเราลองคุยกับพ่อให้นะ`:""}`; gDraft={key:null,custom:"",reward:""}; renderHome(); window.scrollTo({top:0}) };
  const d=document.getElementById("gdone"); if(d) d.onclick=async()=>{ const g=goalOf(list), now=new Date().toISOString(); await saveAttempt({type:"goaldone",setId:g.setId,topic:"เป้าหมายสำเร็จ",startedAt:now,endedAt:now,durationSec:0,correct:0,total:0,xp:0,items:[]}); buddyNote="สุดยอด! ไปบอกพ่อได้เลย"; renderHome() };
}

ion": ["Magic Potion เป็นมอร์ฟของตัวกะปิ Armadillidium vulgare ที่มีแต้มหลายสี", "เปลือกไอโซพอดมีแคลเซียมคาร์บอเนต สารเดียวกับเปลือกไข่และหินปูน", "คนเลี้ยงไอโซพอดจะทำมุมชื้นและมุมแห้งไว้ในตู้ ให้มันเลือกเองว่าจะอยู่ตรงไหน"], "kilen": ["กิเลนเป็นสัตว์หิมพานต์ หัวคล้ายมังกร ตัวมีเกล็ด และมีกีบเหมือนกวางหรือม้า", "ในความเชื่อจีน กิเลนเป็นสัตว์มงคลที่เดินเบามากจนไม่เหยียบหญ้าให้ช้ำ", "ตัวนิ่มหรือตัวลิ่นมีเกล็ดจริงๆ ทำจากเคราติน และถูกล่าจนใกล้สูญพันธุ์"], "lion": ["ราชสีห์เป็นสัตว์หิมพานต์ ที่ได้แรงบันดาลใจมาจากสิงโต", "สิงโตเป็นแมวป่าชนิดเดียวที่อยู่กันเป็นฝูง", "แผงคอของสิงโตตัวผู้ช่วยป้องกันคอเวลาต่อสู้ และบอกว่าตัวนั้นแข็งแรงแค่ไหน"], "naga": ["พญานาคเป็นสัตว์ในตำนานที่ผูกพันกับน้ำและฝน ในความเชื่อของไทยและลาว", "งูจงอางแผ่แม่เบี้ยได้ และเป็นงูพิษที่ยาวที่สุดในโลก ยาวได้ราว 5 เมตร", "งูจงอางกินงูชนิดอื่นเป็นอาหารหลัก และตัวเมียทำรังจากใบไม้เพื่อวางไข่"]};

function placeItem(r,s,kind){
  if(s.slot==="bg") r.bg=s.id;

/* drag worn things around the companion, and room things around the scene; positions are % of the box they sit in */
function bindArrange(kind, reRender){
  const grab=(el,t,i,box)=>{ el.onpointerdown=e=>{ e.preventDefault(); e.stopPropagation(); denSel={t,i}; $v.querySelectorAll(".sel").forEach(z=>z.classList.remove("sel")); el.classList.add("sel");
      el.setPointerCapture(e.pointerId); let moved=false;
      el.onpointermove=ev=>{ const rc=box().getBoundingClientRect(); const x=Math.max(-10,Math.min(110,(ev.clientX-rc.left)/rc.width*100)), y=Math.max(-10,Math.min(110,(ev.clientY-rc.top)/rc.height*100));
        el.style.left=x+"%"; el.style.top=y+"%"; el.dataset.nx=x.toFixed(1); el.dataset.ny=y.toFixed(1); moved=true };
      el.onpointerup=()=>{ el.onpointermove=null; el.onpointerup=null; const r=room(), o=t==="p"?r.props[i]:(r.wear[kind]||[])[i];
        if(o&&moved){ o.x=+el.dataset.nx; o.y=+el.dataset.ny; if(t==="p"&&!el.dataset.shelf) snapShelf(o,el,box()); lsSet("fieldnote.room",r) } reRender() } } };
  /* drop a small thing onto a shelf: it lands on the nearest board, in the nearest free-looking slot */
  const snapShelf=(o,el,bx)=>{ const rc=bx.getBoundingClientRect(), it=el.getBoundingClientRect(), px=rc.left+o.x/100*rc.width, py=rc.top+o.y/100*rc.height;
    for(const sh of $v.querySelectorAll("#props [data-shelf]")){ const b=sh.getBoundingClientRect(), cfg=SHELVES[sh.dataset.shelf]; if(!cfg) continue;
      if(px<b.left||px>b.right||py<b.top-20||py>b.bottom) continue;
      const by=cfg.boards.map(f=>b.top+f*b.height).reduce((best,y)=>Math.abs(y-py)<Math.abs(best-py)?y:best);
      const sx=cfg.slots.map(f=>b.left+f*b.width).reduce((best,x)=>Math.abs(x-px)<Math.abs(best-px)?x:best);
      const h=Math.min(it.height,b.height*0.3); if((o.s||1)>0.8) o.s=0.8;
      o.x=+((sx-rc.left)/rc.width*100).toFixed(1); o.y=+((by-h*0.8/2-rc.top)/rc.height*100).toFixed(1); return } };
  $v.querySelectorAll("#props .prop-it").forEach(el=>grab(el,"p",+el.dataset.pi,()=>document.getElementById("props")));

  const hero=document.querySelector("#petpat .petwrap");
  $v.querySelectorAll("#petpat .w-it").forEach(el=>{ if(denSel&&denSel.t==="w"&&denSel.i===+el.dataset.wi) el.classList.add("sel"); grab(el,"w",+el.dataset.wi,()=>hero) });
}

  return {n,mean:v.reduce((s,x)=>s+x,0)/n,med:n%2?v[(n-1)/2]:(v[n/2-1]+v[n/2])/2,min:v[0],max:v[n-1]} }

    img.onload=()=>{ const max=360, k=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement("canvas");

function speak(text, slow){

  try{
    if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=slow?0.42:0.9;
    const v=pickVoice(); if(v){ u.voice=v; u.lang=v.lang }

}

/* replay the vocabulary sessions that are kept, so removed tries do not leave words half-learned */
function rebuildVocabState(list){
  const st={};
  list.filter(a=>a.type==="vocab").sort((a,b)=>new Date(a.endedAt)-new Date(b.endedAt)).forEach(a=>{
    const t=dayKey(a.endedAt), byWord={};
    (a.items||[]).forEach(i=>{ if(i.word) byWord[i.word]=(byWord[i.word]??true)&&i.correct });
    Object.entries(byWord).forEach(([w,ok])=>{ const cur=st[w]?.box||0, box=ok?Math.min(BOX_DAYS.length,cur+1):1; let due=t; for(let k=0;k<BOX_DAYS[box-1];k++) due=nextDay(due); st[w]={box,due} });
  });
  saveVocabState(st);
}
async function finishVocab(){
  V.active=false;
  try{ if(CAN_SPEAK) speechSynthesis.cancel() }catch(e){}
  $v.innerHTML=`<section class="card"><p class="muted">กำลังบันทึก…</p></section>`;
  const st=vocabState(), t=todayKey(), byWord={};
  V.results.forEach(r=>{ byWord[r.w]=(byWord[r.w]??true)&&r.correct });   // a word moves up only if every item on it was right
  Object.entries(byWord).forEach(([w,ok])=>{ const cur=st[w]?.box||0; const box=ok?Math.min(BOX_DAYS.length,cur+1):1;
    let due=t; for(let i=0;i<BOX_DAYS[box-1];i++) due=nextDay(due); st[w]={box,due} });
  saveVocabState(st);
  const c=V.results.filter(r=>r.correct).length, rc=V.rres.filter(Boolean).length;
  const sp=V.results.filter(r=>r.kind==="spell");
  await finishWith({type:"vocab",setId:"vocab",subject:"อังกฤษ",topic:"คำศัพท์วันนี้",startedAt:new Date(V.start).toISOString(),endedAt:new Date().toISOString(),
    durationSec:Math.round((Date.now()-V.start)/1000),correct:c,total:V.results.length,newWords:V.fresh.length,
    spelling:{correct:sp.filter(r=>r.correct).length,total:sp.length},
    reading:V.read?{correct:rc,total:V.rres.length}:null,xp:c*5+(V.results.length-c)*2+rc*5+(V.rres.length-rc)*2,
    items:V.results.map(r=>({qid:"v:"+r.w,word:r.w,kind:r.kind,fresh:r.fresh,correct:r.correct}))});
}

function groupParent(){

    d.innerHTML=`<summary><span class="pgt">${title}${extra}</span><span class="small muted">${hint} · ${list.length} หัวข้อ</span></summary>`;
    d.ontoggle=()=>{ d.open?pgOpen.add(id):pgOpen.delete(id) };
    list.forEach(sec=>d.appendChild(sec)); if(anchor) anchor.after(d); else $v.appendChild(d); anchor=d });
  /* order: dashboard, import, then the folders in PGROUPS order */
  const first=$v.querySelector("section"), imp=[...$v.children].find(e=>e.tagName==="SECTION"&&/นำเข้าผล/.test((e.querySelector("h3")||{}).textContent||""));

/* ---------- readiness vs the real exam, by district (rough estimate, recomputed for each month-end) ----------
   coverage  = share of the district's spells practised (tier ≥ 1), weighted by exam importance (stars)
   level 3   = accuracy on level-3 (exam-style) questions in the district, last 30 days
   retention = accuracy in the old-topic sweep for the district (falls back to level 3 when no data)
   readiness = 40% coverage + 40% level 3 + 20% retention;  80+ ≈ ready for first-round level */
const READY_TARGET=80;
function readiness(list,upto){ const L=list.filter(a=>new Date(a.endedAt).getTime()<=upto), ss=spellStats(L), out={};
  const its=L.filter(a=>isLesson(a)&&upto-new Date(a.endedAt).getTime()<30*DAY).flatMap(a=>a.items||[]).filter(x=>!x.skipped);
  const sw=L.filter(a=>a.type==="sweep").flatMap(a=>a.items||[]);
  Object.keys(DISTRICTS).filter(k=>k!=="tech").forEach(rk=>{ const sps=SPELLS.filter(s=>s.realm===rk); if(!sps.length) return;
    const w=sp=>sp.stars||1, tot=sps.reduce((a,sp)=>a+w(sp),0), cov=sps.filter(sp=>(ss[sp.id]?.tier||0)>=1).reduce((a,sp)=>a+w(sp),0)/tot;
    const ids=new Set(sps.map(s=>s.id)), l3=its.filter(x=>x.level===3&&ids.has(QBANK[x.qid]?.q.spell)), sv=sw.filter(x=>ids.has(QBANK[x.qid]?.q.spell));
    const p3=l3.length>=3?l3.filter(x=>x.correct&&!x.guessed).length/l3.length:null, pr=sv.length>=3?sv.filter(x=>x.correct).length/sv.length:null;
    const val=Math.round(100*(0.4*cov+0.4*(p3??0)+0.2*(pr??p3??0)));
    out[rk]={val,cov:Math.round(cov*100),p3:p3==null?null:Math.round(p3*100),pr:pr==null?null:Math.round(pr*100),w:tot,n3:l3.length} });
  const ks=Object.keys(out), W=ks.reduce((a,k)=>a+out[k].w,0); out._all=Math.round(ks.reduce((a,k)=>a+out[k].val*out[k].w,0)/W); return out }
function readinessCard(list){ if(!list.length) return "";
  const now=Date.now(), r=readiness(list,now), first=Math.min(...list.map(a=>new Date(a.endedAt).getTime()));
  const months=[]; { const d=new Date(first); d.setDate(1); d.setMonth(d.getMonth()+1); d.setHours(0,0,0,0); while(d.getTime()<now){ months.push(d.getTime()-1); d.setMonth(d.getMonth()+1) } } months.push(now);
  const trend=months.map(t=>({t,v:readiness(list,t)._all}));
  const notYet=Object.entries(r).filter(([k,v])=>k!=="_all"&&v.val===0).map(([k])=>DISTRICTS[k].e+" "+DISTRICTS[k].n);
  const rows=Object.entries(r).filter(([k,v])=>k!=="_all"&&v.val>0).sort((a,b)=>a[1].val-b[1].val).map(([k,v])=>{ const d=DISTRICTS[k], col=v.val>=READY_TARGET?"var(--good)":v.val>=50?"var(--beak)":"var(--warn)";
    return `<div class="rrow"><span class="small" style="min-width:8.5em">${d.e} ${d.n}</span><div class="rbar"><i style="width:${v.val}%;background:${col}"></i><b style="left:${READY_TARGET}%"></b></div><span class="small" style="min-width:2.4em;text-align:right">${v.val}</span></div>
      <p class="small muted" style="margin:-4px 0 4px 0">ฝึกแล้ว ${v.cov}% ของเรื่อง · ข้อระดับ 3 ${v.p3==null?"ยังน้อยไป":v.p3+"%"} · ความจำเรื่องเก่า ${v.pr==null?"ยังไม่มีข้อมูล":v.pr+"%"}</p>` }).join("");
  const W=300,H=60, xs=i=>trend.length<2?W/2:i*(W/(trend.length-1)), ys=v=>H-v/100*H;
  const spark=`<svg viewBox="0 0 ${W} ${H+16}" style="width:100%;max-width:360px;height:auto;color:var(--ink)"><line x1="0" x2="${W}" y1="${ys(READY_TARGET)}" y2="${ys(READY_TARGET)}" stroke="var(--good)" stroke-dasharray="4 4"/>
    ${trend.length>1?`<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${trend.map((p,i)=>`${xs(i)},${ys(p.v)}`).join(" ")}"/>`:""}
    ${trend.map((p,i)=>`<circle cx="${xs(i)}" cy="${ys(p.v)}" r="3.5" fill="var(--accent)"/><text x="${xs(i)}" y="${H+13}" font-size="9" text-anchor="middle" fill="currentColor" opacity=".7">${new Date(p.t).toLocaleDateString("th-TH",{month:"short"})} ${p.v}</text>`).join("")}</svg>`;
  return `<div><span class="eyebrow">ความพร้อมเทียบระดับข้อสอบจริง · ตอนนี้ ${r._all}/100 (เส้นเป้า ${READY_TARGET})</span>
    ${spark}<div class="rrows">${rows}</div>${notYet.length?`<p class="small muted">ยังไม่เริ่ม (${notYet.length} ย่าน): ${notYet.join(" · ")}</p>`:""}
    <details class="small"><summary>คิดคะแนนนี้อย่างไร</summary><p class="small">แต่ละย่านคิดจาก 3 ส่วน: ฝึกครบกี่เรื่อง (40% ถ่วงตามความสำคัญในข้อสอบ) ความแม่นข้อระดับ 3 ที่เป็นแนวข้อสอบใน 30 วันล่าสุด (40%) และความจำเรื่องเก่าจากย้อนคาถาเก่า (20%) 80 ขึ้นไปถือว่าใกล้ระดับข้อสอบรอบแรก ตัวเลขนี้เป็นค่าประมาณจากการฝึกในแอป ไม่ใช่คะแนนสอบ ผลสอบจำลองจากภายนอกจะช่วยยืนยันว่าตรงแค่ไหน ช่วงแรกตัวเลขจะต่ำเพราะยังฝึกไม่ครบทุกเรื่อง จุดสำคัญคือแนวโน้มรายเดือนที่ควรค่อยๆ ขึ้น</p></details></div>` }

  const lab=[]; LAB_ORDER.forEach(sp=>{ const L=LAB_LINES[sp]; labAnimals(list,sp).filter(x=>!x.stock&&x.g&&!/\?/.test(x.g)).forEach(x=>{ const ph=L.ph(x.g);
    lab.push({uid:"lab:"+x.id,name:L.n.replace("ปริศนา","").split(" ")[0]+" "+(L.names[ph]||""),el:LAB_ELEM[ph]||"plant",el2:LAB_SECOND[ph]||"water",base:sp==="dragon"?12:10,svg:L.art[ph](),sp}) }) });
  const seen={}; lab.forEach(u=>{ seen[u.name]=(seen[u.name]||0)+1; if(seen[u.name]>1) u.name+=" #"+seen[u.name] });
  return [...pets,...lab].map(u=>{ const tl=advTrainLv(list,u.uid), exp=advExp(list,u.uid), el=Math.floor(exp/6), lv=Math.min(20,tl+el);
    return {...u,el2:u.el2||ADV_SECOND[u.uid.slice(4)]||"water",lv,tl,exp,expIn:exp%6,power:u.base+3*lv+advGearP(list),skill:lv>=3} }) }

function advFreed(){ return ls("fieldnote.advfreed",[]) }
function advValley(list){ const r=new Set(advRecruits()), fr=new Set(advFreed()); return advUnits(list).filter(u=>!fr.has(u.uid)).filter(u=>u.uid.startsWith("lab:")&&!r.has(u.uid)) }
function advTeam(list){ const us=advRoster(list); let t=ls("fieldnote.advteam",null);
  t=(Array.isArray(t)?t:[]).filter(id=>us.some(u=>u.uid===id)).slice(0,3);
  if(!t.length){ const b=getBuddy(); if(b&&us.some(u=>u.uid==="pet:"+b.kind)) t.push("pet:"+b.kind);
    us.slice().sort((a,b)=>b.power-a.power).forEach(u=>{ if(t.length<3&&!t.includes(u.uid)) t.push(u.uid) }) }
  return t.map(id=>us.find(u=>u.uid===id)) }

function advEnergy(list){ const t=todayKey(), used=advRecs(list).filter(a=>a.act==="battle"&&dayKey(a.endedAt)===t).length; let stops=0, all=false;
  try{ const p=progressOf(list), m=missionList(p); stops=m.filter(x=>x.done).length; all=!!p.goalToday }catch(e){} const max=2+stops+(all?1:0);
  return {used,max,left:Math.max(0,max-used)} }

function labSim(v){ const R=[], sw=x=>x*(1+v.luck/100*(2*Math.random()-1));
  for(let n=0;n<100;n++){ let th=v.th, mh=v.mh, t=0, win=false; while(t<40){ t++; mh-=sw(v.ta); if(mh<=0){ win=true; break } th-=sw(v.ma); if(th<=0) break } R.push({t,win}) }
  const ts=R.map(r=>r.t).sort((a,b)=>a-b), mean=ts.reduce((a,b)=>a+b,0)/ts.length, med=(ts[49]+ts[50])/2;
  return {R,win:R.filter(r=>r.win).length,mean,med,min:ts[0],max:ts[ts.length-1]} }
function labOk(L,v,r){ const c=L.check||{}; return (c.winMin==null||r.win>=c.winMin)&&(c.winMax==null||r.win<=c.winMax)&&(c.meanMin==null||r.mean>=c.meanMin)&&(c.meanMax==null||r.mean<=c.meanMax)&&(c.luckMin==null||v.luck>=c.luckMin)&&(c.skewMin==null||r.mean-r.med>=c.skewMin) }
function labHist(r){ const top=Math.min(20,Math.max(...r.R.map(x=>x.t))), b=Array.from({length:top},()=>[0,0]); r.R.forEach(x=>{ const i=Math.min(top,x.t)-1; b[i][x.win?0:1]++ });
  const mx=Math.max(...b.map(x=>x[0]+x[1]),1), W=300, H=120, bw=W/top;
  return `<svg viewBox="0 0 ${W} ${H+28}" class="labhist" role="img" aria-label="กราฟจำนวนตาที่ใช้">${b.map((x,i)=>{ const hw=x[0]/mx*H, hl=x[1]/mx*H;
    return `<rect x="${i*bw+1}" y="${H-hw}" width="${bw-2}" height="${hw}" fill="#3f9b5a"/><rect x="${i*bw+1}" y="${H-hw-hl}" width="${bw-2}" height="${hl}" fill="#e08a2c"/>${top<=12||i%2===0?`<text x="${i*bw+bw/2}" y="${H+12}" font-size="9" text-anchor="middle" fill="currentColor">${i+1}${i===top-1&&top===20?"+":""}</text>`:""}` }).join("")}
    <line x1="${(r.mean-0.5)*bw}" x2="${(r.mean-0.5)*bw}" y1="0" y2="${H}" stroke="#2f6f8f" stroke-width="2" stroke-dasharray="4 3"/><line x1="${(r.med-0.5)*bw}" x2="${(r.med-0.5)*bw}" y1="0" y2="${H}" stroke="#b04a8c" stroke-width="2"/>
    <text x="${W/2}" y="${H+26}" font-size="9" text-anchor="middle" fill="currentColor">จำนวนตาที่ใช้ (เขียว = ชนะ, ส้ม = แพ้)</text></svg>` }
