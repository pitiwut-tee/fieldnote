<script>
const ERR = {concept:"ยังไม่เข้าใจหลัก", forgot:"เข้าใจ แต่จำสูตรหรือวิธีคิดไม่ได้", read:"อ่านโจทย์พลาด", misopt:"อ่านตัวเลือกผิด", unclear:"โจทย์กำกวม อ่านแล้วไม่เข้าใจ", calc:"คิดเลขผิด", guess:"เดา", dontknow:"คิดไม่ออก (กดดูเฉลย)"};
const LV = {1:"ระดับ 1 · พื้นฐาน",2:"ระดับ 2 · ประยุกต์",3:"ระดับ 3 · แนวคิดวิเคราะห์"};

/* ---------- content comes from content/*.json, injected at build time (tools/build.py) ---------- */
const CONTENT=/*@@CONTENT@@*/null;
const CAL=CONTENT.calendar;
const SETS=CONTENT.sets.map(s=>{ const o=JSON.parse(JSON.stringify(s)); o.warm=o.warm||[];
  [...o.warm,...o.practice,...(o.challenge?[o.challenge]:[])].forEach(q=>q.hints=(s.hints||{})[q.id]||[]);
  o.concept=o.concept||{title:"",points:[],formulas:[],vocab:[],alts:[]}; o.concept.alts=o.concept.alts||[];
  o.current=CAL.currentSpells.includes(o.spell); return o });
const SKIP_REASONS=["การบ้านเยอะ","มีสอบ/ต้องอ่านวิชาอื่น","ไม่สบาย","เหนื่อยมาก","มีธุระ/ไปข้างนอก","อื่นๆ"];
/* ---------- spell map (from the curriculum map doc): id, realm, magic name, topic, grade, exam stars, school status ---------- */
const REALMS=CONTENT.spells.realms, SCHOOL=CONTENT.spells.school, SPELLS=CONTENT.spells.spells;

/* ---------- daily vocabulary: general academic words + science/math words + story/art words ---------- */
const VOCAB=CONTENT.vocab.map(x=>({...x}));
const MISSIONS=(CONTENT.missions&&CONTENT.missions.missions)||[];
const READINGS=CONTENT.readings.map((r,i)=>({text:r.text,qs:r.qs.map(q=>({q:q.q,opts:q.opts,a:q.a})),th:{text:r.th,qs:r.qs.map(q=>({q:q.qth,opts:q.optsTh}))},idx:i}));

/* ---------- test mode: open the page with #test once; results get a "test" tag ---------- */
let TEST=false;
try{ if(location.hash==="#test") localStorage.setItem("fieldnote.test","1"); TEST=localStorage.getItem("fieldnote.test")==="1" }catch(e){ TEST=location.hash==="#test" }
function leaveTest(){
  try{
    localStorage.removeItem("fieldnote.test");
    localStorage.setItem("fieldnote.attempts",JSON.stringify(JSON.parse(localStorage.getItem("fieldnote.attempts")||"[]").filter(x=>!x.test)));
    localStorage.setItem("fieldnote.fb",JSON.stringify(JSON.parse(localStorage.getItem("fieldnote.fb")||"[]").filter(x=>!x.test)));
  }catch(e){}
  TEST=false; attempts=lsRead(); if(location.hash==="#test") location.hash="#home"; view="home"; render();
}

/* ---------- fresh start on 5 Nov 2026: the trial day (4 Nov) is cleared from this browser, once ---------- */
const START_DAY=new Date(CAL.startDay+"T00:00:00").getTime();
try{
  if(Date.now()>=START_DAY&&localStorage.getItem("fieldnote.epoch")!=="2"){
    ["fieldnote.attempts","fieldnote.fb","fieldnote.vocab","fieldnote.inprogress","fieldnote.test"].forEach(k=>localStorage.removeItem(k));

const NUMOPT=/^\s*([−-]?[\d,]*\.?\d+)\s*(.*)$/;
function recallize(q){
  if(q.num||!q.opts) return q;
  const m=q.opts.map(o=>String(o).match(NUMOPT)); if(m.some(x=>!x)) return {...q,cover:true};
  const unit=m[0][2].trim(); if(m.some(x=>x[2].trim()!==unit)) return {...q,cover:true};
  const ans=parseFloat(m[q.a][1].replace(/,/g,"").replace("−","-")); if(!isFinite(ans)) return {...q,cover:true};
  return {...q,num:true,answer:ans,tol:Math.max(0.01,Math.abs(ans)*0.005),unit,recall:true};
}

  const root=q.of||q.id, twins=(VARIANTS[root]||[]).map(v=>QBANK[v.id]?.q).filter(Boolean);

/* ---------- weekly quests ---------- */
function questStatus(list, wk, upto, met){
  const inWeek=a=>{const k=dayKey(a.endedAt); return k>=wk&&k<=upto};
  let metDays=0; for(let d=wk; d<=upto; d=nextDay(d)) if(met.has(d)) metDays++;
  const spelled=list.filter(a=>a.type==="vocab"&&inWeek(a)).reduce((s,a)=>s+(a.items||[]).filter(i=>i.kind==="spell"&&i.correct).length,0);
  let tierUp=0;
  if(metDays>=0){ const before=spellStats(list.filter(a=>dayKey(a.endedAt)<wk)), after=spellStats(list.filter(a=>dayKey(a.endedAt)<=upto));
    for(const [k,v] of Object.entries(after)) if(v.tier>(before[k]?.tier||0)) tierUp++; }
  const q=[{key:"days",label:"จุดไฟให้ครบ 5 วัน",have:metDays,need:5},{key:"tier",label:"ทำให้คาถาขึ้นขั้น 1 ครั้ง",have:tierUp,need:1},{key:"spell",label:"สะกดคำศัพท์ถูก 20 คำ",have:spelled,need:20}];
  return {q,all:q.every(x=>x.have>=x.need)};
}

function progressOf(list){
  const modes=dayModes(list);
  const byDay=new Map(), skipDays=new Set(), leaveDays=new Set(), vocabDays=new Set(), units=new Map(), probes=new Map(), met=new Set();
  list.forEach(a=>{ const k=dayKey(a.endedAt);
    if(a.type==="daymode") return;
    if(a.type==="mission"||a.type==="teach"){ byDay.set(k,(byDay.get(k)||0)+xpOf(a)); return }   /* mission / teaching dad: XP only, not a daily unit */
    if(a.type==="goal"||a.type==="goaldone") return;
    if(isSkip(a)){ if(a.leave&&a.from&&a.to){ for(let d=a.from; d<=a.to; d=nextDay(d)) leaveDays.add(d) } else skipDays.add(k); return }
    byDay.set(k,(byDay.get(k)||0)+xpOf(a));
    if(a.type==="vocab") vocabDays.add(k); else { units.set(k,(units.get(k)||0)+1); if(a.type==="probe"||a.type==="mixed"||a.type==="passage") probes.set(k,(probes.get(k)||0)+1) } });
  const probeCount=SETS.filter(s=>s.kind==="probe").length, firstProbe={};
  list.filter(a=>a.type==="probe").forEach(a=>{const k=dayKey(a.endedAt); firstProbe[a.setId]=Math.min(firstProbe[a.setId]??Infinity,k)});
  const probesLeft=d=>probeCount-Object.values(firstProbe).filter(x=>x<d).length>0;
  const today=todayKey();
  const noVocabToday=(()=>{try{const v=vocabToday();return !v.due.length&&!v.fresh.length}catch(e){return false}})();
  const need=d=>{ const info=dayInfo(d,modes); if(info.level==="school") return {units:1,probe:false,info}; const L=LEVELS[info.level]; return {units:L.units,probe:L.probe&&probesLeft(d),info} };
  const isMet=d=>{ const n=need(d); return (vocabDays.has(d)||(d===today&&noVocabToday))&&(units.get(d)||0)>=n.units&&(!n.probe||(probes.get(d)||0)>=1) };
  const keys=[...byDay.keys(),...skipDays,...[...leaveDays].filter(d=>d<=today)];
  let streak=0, best=0, freeze=0, goalDays=0; const frozen=new Set(), earned=[], questDone=new Set();
  if(keys.length){
    for(let d=Math.min(...keys); d<=today; d=nextDay(d)){
      const xp=byDay.get(d)||0;
      if(isMet(d)){ met.add(d); goalDays++; streak++; best=Math.max(best,streak);
        if(goalDays%5===0&&freeze<FREEZE_MAX){freeze++;earned.push({d,why:"ทำภารกิจครบ 5 วัน"})}

/* ---------- what to do today ---------- */
function lastDone(list){ const last={}; list.filter(isLesson).forEach(a=>{if(a.setId) last[a.setId]=Math.max(last[a.setId]||0,dayKey(a.endedAt))}); return last }
function pickLesson(list, preferCurrent, exclude){
  const last=lastDone(list), t=todayKey(), ex=exclude||[];
  const lessons=SETS.filter(s=>s.kind==="lesson"&&!ex.includes(s.id)); if(!lessons.length) return null;
  const pool=lessons.filter(s=>last[s.id]!==t), use=pool.length?pool:lessons;
  return use.slice().sort((a,b)=>(preferCurrent?(b.current?1:0)-(a.current?1:0):0)||(last[a.id]||0)-(last[b.id]||0))[0];
}
function pickProbe(list){ const done=new Set(list.filter(a=>a.type==="probe").map(a=>a.setId)); return SETS.find(s=>s.kind==="probe"&&!done.has(s.id))||null }
/* mixed exam-style sets (interleaving): one per week on a holiday, in the probe slot */
function pickMixed(list){
  const done=new Set(list.filter(a=>a.type==="mixed").map(a=>a.setId));
  const wk=weekStart(todayKey()), thisWeek=list.filter(a=>a.type==="mixed"&&dayKey(a.endedAt)>=wk&&dayKey(a.endedAt)<todayKey()).length;
  const doneToday=list.some(a=>a.type==="mixed"&&dayKey(a.endedAt)===todayKey());
  if(thisWeek>=(CAL.mixedPerWeek||1)&&!doneToday) return null;
  return SETS.find(s=>s.kind==="mixed"&&!done.has(s.id))||(doneToday?SETS.find(s=>s.kind==="mixed"&&list.some(a=>a.setId===s.id&&dayKey(a.endedAt)===todayKey())):null)||null;
}
/* weekly Thai science reading passage: in the probe slot on a holiday that has no mixed set */
function pickPassage(list){
  const done=new Set(list.filter(a=>a.type==="passage").map(a=>a.setId)), wk=weekStart(todayKey()), t=todayKey();
  const doneToday=list.find(a=>a.type==="passage"&&dayKey(a.endedAt)===t);
  if(doneToday) return SETS.find(s=>s.id===doneToday.setId)||null;
  if(list.filter(a=>a.type==="passage"&&dayKey(a.endedAt)>=wk).length>=(CAL.passagePerWeek||1)) return null;
  return SETS.find(s=>s.kind==="passage"&&!done.has(s.id))||null;
}
function planToday(list, p){
  const wd=new Date().getDay(), school=p.info.kind==="school";
  const repair=school&&wd===5&&reviewPool(list).length+dueQuestions(list,3).length>=4;
  const doneToday=list.filter(a=>isLesson(a)&&dayKey(a.endedAt)===todayKey()).map(a=>a.setId);
  const lesson=repair?null:pickLesson(list, school);
  const mixed=school?null:pickMixed(list);
  const passage=school||mixed?null:pickPassage(list);
  const special=mixed||passage;
  const probe=school||special?null:pickProbe(list);
  /* when a weekly special (mixed set or passage) takes slot 3, the probe moves to slot 4 so older topics still get checked */
  const lessonX=()=>pickLesson(list,false,[...(lesson?[lesson.id]:[]),...doneToday]);
  const extra=p.info.level==="full"?(special?(pickProbe(list)||lessonX()):lessonX()):null;
  return {repair,lesson,probe,mixed,passage,extra};
}
function recommend(list){ return pickLesson(list,true) }
/* questions to look at again: wrong answers, and (trial) right answers she was not sure about */
function reviewPool(list){
  const wrong=new Map();
  list.filter(isLesson).slice().sort((a,b)=>new Date(a.endedAt)-new Date(b.endedAt)).forEach(a=>(a.items||[]).forEach(x=>{
    if(x.skipped||!QBANK[x.qid]) return; const id=QBANK[x.qid].q.of||x.qid;
    /* a right answer only clears a mistake if she had to think: a twin, a typed answer, hidden options, or a fresh set.
       Re-tapping the same remembered option in a review does not count. */
    const thought=a.type!=="review"&&!x.retry||x.of||x.recall||x.cover;
    if(x.correct===false||(x.correct&&x.conf==="unsure")) wrong.set(id,+new Date(a.endedAt)); else if(x.correct&&thought) wrong.delete(id);
  }));
  return [...wrong.entries()].sort((a,b)=>a[1]-b[1]).map(([qid])=>QBANK[qid].q);
}
/* spaced review: spells not practised for a while come back, one question each (questions she has seen before) */
const SPACING=[3,4,7,14];   // days before a spell is due again, by tier 0..3
function dueQuestions(list, n, avoidSpells){
  const ss=spellStats(list), t=todayKey(), avoid=new Set(avoidSpells||[]);
  const seen=new Map();   // qid -> last day seen
  list.filter(isLesson).forEach(a=>(a.items||[]).forEach(x=>{ if(!x.skipped&&QBANK[x.qid]) seen.set(x.qid,Math.max(seen.get(x.qid)||0,dayKey(a.endedAt))) }));
  const due=Object.entries(ss).filter(([sp,v])=>!avoid.has(sp)&&v.idle>=SPACING[v.tier]).sort((a,b)=>b[1].idle/SPACING[b[1].tier]-a[1].idle/SPACING[a[1].tier]);
  const out=[];
  for(const [sp] of due){

const TRIAL_NAMES={confidence:"ปุ่ม มั่นใจ / ไม่ชัวร์ ก่อนส่งคำตอบ",explain:"เขียนเหตุผลก่อนดูเฉลย (ชุดละ 1 ข้อ)"};

function spellStats(list){
  const st={};
  list.filter(isLesson).forEach(a=>{
    const d=dayKey(a.endedAt);
    (a.items||[]).forEach(x=>{
      if(x.skipped) return; const sp=x.spell||QBANK[x.qid]?.q.spell; if(!sp||!x.level) return;
      const o=st[sp]??={days:{},last:0}; const dd=o.days[d]??={1:[0,0],2:[0,0],3:[0,0]};
      dd[x.level][0]++; if(x.correct) dd[x.level][1]++; o.last=Math.max(o.last,d);
    });
  });
  const out={}, t=todayKey();
  for(const [sp,o] of Object.entries(st)){
    const days=Object.entries(o.days).map(([d,v])=>({d:+d,v}));
    const n1=days.reduce((s,x)=>s+x.v[1][0],0), c1=days.reduce((s,x)=>s+x.v[1][1],0);
    const t1=n1>=3&&c1/n1>=0.8;
    const d2=days.filter(x=>x.v[2][0]>=2&&x.v[2][1]/x.v[2][0]>=0.7).length;
    const t2=t1&&d2>=2;
    const d3=days.filter(x=>x.v[3][0]>=1&&x.v[3][1]/x.v[3][0]>=0.6).map(x=>x.d).sort((a,b)=>a-b);
    const t3=t2&&d3.length>=2&&d3[d3.length-1]-d3[0]>=7*DAY;
    const tier=t3?3:t2?2:t1?1:0, idle=Math.round((t-o.last)/DAY);
    out[sp]={tier,idle,faded:(tier===2&&idle>14)||(tier===3&&idle>21),n1,c1,d2,d3:d3.length};
  }

}

function startSet(set, conceptFirst, perms, dueIds){
  const probe=set.kind==="probe", mixed=set.kind==="mixed";
  /* spaced review: a lesson's warm-up gets 1 question from a spell that is due again */
  /* plus 1 earlier mistake (at least 2 days old) so the mistake pile doesn't only wait for Friday */
  const due = set.kind==="lesson" ? (dueIds ? dueIds.map(id=>{const q=QBANK[id.replace(/^r:/,"")]?.q; return q&&{...recallize(q),...(id.startsWith("r:")?{_retry:true}:{})}}).filter(Boolean)
    : (()=>{ const l=mine(), d=dueQuestions(l,1,[set.spell,...set.warm.map(q=>q.spell)]), t=todayKey();
        const last={}; l.filter(isLesson).forEach(a=>(a.items||[]).forEach(x=>{last[x.qid]=Math.max(last[x.qid]||0,dayKey(a.endedAt))}));
        const m=reviewPool(l).find(q=>!d.some(x=>x.id===q.id)&&q.spell!==set.spell&&t-(last[q.id]||0)>=2*DAY);
        return [...d.map(q=>comeback(q,l)),...(m?[{...comeback(m,l),_retry:true}]:[])] })()) : [];
  const warm = [...set.warm.map(q=>({kind:"q",phase:"อุ่นเครื่อง (ทบทวนของเก่า)",q})),...due.map(q=>q._retry?{kind:"q",phase:"ลองใหม่ ข้อที่เคยพลาด",q,retry:true}:{kind:"q",phase:"ทบทวนตามรอบ (คาถาที่ไม่ได้ใช้มาหลายวัน)",q,due:true})];
  const card = {kind:"concept",phase:"การ์ดสรุปเนื้อหา"};
  const passage=set.kind==="passage";
  const steps = (passage?[
    {kind:"passage",phase:"อ่านบทความ (อ่านเองเงียบๆ)"},
    ...set.practice.map(q=>({kind:"q",phase:"ตอบจากบทความ",q,passage:true})),
    {kind:"rate",phase:"ปิดท้าย"}
  ]:mixed?[
    ...set.practice.map(q=>({kind:"q",phase:"ชุดผสมแบบข้อสอบ",q})),
    {kind:"rate",phase:"ปิดท้าย"}
  ]:probe?[
    ...set.practice.map(q=>({kind:"q",phase:"ด่านสำรวจ",q})),
    ...(set.concept&&set.concept.points&&set.concept.points.length?[{kind:"concept",phase:"สรุปหลังผ่านด่าน"}]:[]),
    {kind:"rate",phase:"ปิดท้าย"}
  ]:[
    ...(conceptFirst?[card,...warm]:[...warm,card]),
    ...set.practice.map(q=>({kind:"q",phase:"ฝึกทำ",q})),
    ...(set.challenge?[{kind:"q",phase:"ข้อท้าทาย (ไม่บังคับ)",q:set.challenge,optional:true}]:[]),
    {kind:"rate",phase:"ปิดท้าย"}
  ]).map((st,k)=>st.q?{...st,q:shuffleQ(st.q,perms&&perms[k])}:st);   // the right answer is not always the first choice
  const trial=trialsToday(); markExplain(steps, trial);
  S = {mode:"set", active:true, set, conceptFirst, steps, dueIds:due.map(q=>(q._retry?"r:":"")+q.id), trial, trialVote:{}, i:0, start:Date.now(), qStart:Date.now(), items:[], answered:null, why:null, rating:null, hints:0, struck:[], glossed:[], askOpen:null, confused:[], altShown:0, pick:null, whyText:""};
  PAD.strokes=[]; PAD.hist=[]; saveProgress();
  view="session"; render(); window.scrollTo({top:0});
}
/* trial "explain": one question per set (the first level-3 one, else the hardest) asks for a reason before the answer shows */
function markExplain(steps, trial){
  if(!trial.includes("explain")) return;
  const all=steps.filter(st=>st.kind==="q"&&!st.optional), main=all.filter(st=>!st.due&&!st.retry&&!/^อุ่นเครื่อง/.test(st.phase)), qs=main.length?main:all; if(!qs.length) return;
  const top=qs.find(st=>st.q.level===3)||qs.slice().sort((a,b)=>b.q.level-a.q.level)[0]; top.explain=true;
}
function startReview(n, title){
  const list=mine(), repair=n>5;
  /* the Friday repair set also brings back up to 3 spells that are due (spaced review), not only mistakes */
  const due=repair?dueQuestions(list,3):[], dueIds=new Set(due.map(q=>q.id));
  const qs=[...due,...reviewPool(list).filter(q=>!dueIds.has(q.id))].slice(0,n||5); if(!qs.length) return;
  for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]]}
  const t=title||"ทบทวนข้อที่เคยพลาด";
  const steps=[...qs.map(q=>({kind:"q",phase:dueIds.has(q.id)?t+" · ทบทวนตามรอบ":t,q:shuffleQ(comeback(q,list)),due:dueIds.has(q.id)})),{kind:"finish",phase:"เสร็จ"}];
  const trial=trialsToday(); markExplain(steps, trial);
  S = {mode:"review", set:{id:repair?"repair":"review",subject:"ทบทวน",topic:t}, steps, trial, trialVote:{},
       active:true, i:0, start:Date.now(), qStart:Date.now(), items:[], answered:null, why:null, hints:0, struck:[], glossed:[], askOpen:null, confused:[], altShown:0, pick:null, whyText:""};
  view="session"; render(); window.scrollTo({top:0});
}

let skipPick=null, skipMode="one", leaveDaysN=3;
const LEAVE_REASONS=["ไปค่าย","ทัศนศึกษา","ไปต่างจังหวัด/ต่างประเทศ","สอบ/งานโรงเรียนช่วงยาว","ไม่สบายหลายวัน","อื่นๆ"];
function renderSkip(){
  const p=progressOf(mine());
  const reasons=skipMode==="one"?SKIP_REASONS:LEAVE_REASONS;
  const until=new Date(); until.setDate(until.getDate()+leaveDaysN-1);
  $v.innerHTML=`<section class="card"><h2>ขอพัก</h2>
    <div class="why" role="tablist"><button data-mode="one" aria-pressed="${skipMode==="one"}">วันนี้วันเดียว</button><button data-mode="leave" aria-pressed="${skipMode==="leave"}">ไม่อยู่หลายวัน (ค่าย ทัศนศึกษา)</button></div>
    ${skipMode==="one"?`<p class="small">${p.streak?(p.freeze?`มีน้ำแข็ง 🧊 ${p.freeze} ก้อน พรุ่งนี้จะใช้ 1 ก้อนกันไฟ ${p.streak} วันไม่ให้ดับ`:`ตอนนี้ไม่มีน้ำแข็ง ไฟ ${p.streak} วันจะดับ แต่ไม่เป็นไร เริ่มใหม่ได้เสมอ`):"ไม่เป็นไร พรุ่งนี้เริ่มจุดไฟใหม่กัน"}</p>`
    :`<p class="small">ช่วงที่ลาไว้ ไฟ ${p.streak} วันจะ<b>หยุดรอ</b> ไม่ดับและไม่ใช้น้ำแข็ง กลับมาแล้วทำต่อได้เลย ลาได้ครั้งละไม่เกิน 14 วัน พ่อจะเห็นในหน้าผู้ปกครอง</p>
      <label class="small" for="ldays">กี่วัน (นับวันนี้ด้วย)</label>
      <div class="row"><button class="btn ghost" id="lminus" ${leaveDaysN<=2?"disabled":""}>−</button><b id="ldays" style="font-family:var(--mono);font-size:1.3rem">${leaveDaysN}</b><button class="btn ghost" id="lplus" ${leaveDaysN>=14?"disabled":""}>+</button>
      <span class="small muted">ถึง ${until.toLocaleDateString("th-TH",{weekday:"short",day:"numeric",month:"short"})}</span></div>`}
    <p class="small muted">เพราะอะไร</p>
    <div class="why">${reasons.map(x=>`<button data-sr="${x}" aria-pressed="${skipPick===x}">${x}</button>`).join("")}</div>
    <label class="small muted" for="skipnote">อยากเล่าเพิ่มไหม (ไม่บังคับ)</label>
    <input id="skipnote" style="font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)" placeholder="${skipMode==="one"?"เช่น มีงานกลุ่มส่งพรุ่งนี้":"เช่น ค่ายลูกเสือที่กาญจนบุรี ห้ามใช้มือถือ"}">
    <div class="row"><button class="btn" id="skipsave" ${skipPick?"":"disabled"}>บันทึก</button><button class="btn ghost" id="skipback">กลับ</button></div></section>`;
  const keep=f=>()=>{const n=document.getElementById("skipnote").value; f(); renderSkip(); document.getElementById("skipnote").value=n};
  $v.querySelectorAll("[data-mode]").forEach(b=>b.onclick=keep(()=>{skipMode=b.dataset.mode;skipPick=null}));
  $v.querySelectorAll("[data-sr]").forEach(b=>b.onclick=keep(()=>{skipPick=b.dataset.sr}));
  const lm=document.getElementById("lminus"); if(lm) lm.onclick=keep(()=>{leaveDaysN=Math.max(2,leaveDaysN-1)});
  const lp=document.getElementById("lplus"); if(lp) lp.onclick=keep(()=>{leaveDaysN=Math.min(14,leaveDaysN+1)});
  document.getElementById("skipback").onclick=()=>{view="home";render()};
  document.getElementById("skipsave").onclick=async e=>{e.target.disabled=true;
    const now=new Date().toISOString(), from=todayKey(); let to=from; for(let i=1;i<leaveDaysN;i++) to=nextDay(to);
    const base={type:"skip",reason:skipPick,memo:document.getElementById("skipnote").value.trim(),startedAt:now,endedAt:now,durationSec:0,correct:0,total:0,xp:0,items:[]};
    await saveAttempt(skipMode==="one"?{...base,setId:"skip",topic:"ขอพัก"}:{...base,setId:"leave",topic:"ลาหลายวัน",leave:true,days:leaveDaysN,from,to});
    skipPick=null; skipMode="one"; view="home"; render();};
}

const SUP={"⁰":"0","¹":"1","²":"2","³":"3","⁴":"4","⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9","⁻":"ลบ "};
const UNIT_SAY={km:"กิโลเมตร",cm:"เซนติเมตร",mm:"มิลลิเมตร",m:"เมตร",kg:"กิโลกรัม",mg:"มิลลิกรัม",g:"กรัม",mL:"มิลลิลิตร",ml:"มิลลิลิตร",L:"ลิตร",N:"นิวตัน",Pa:"ปาสคาล",kPa:"กิโลปาสคาล",W:"วัตต์",kW:"กิโลวัตต์",kWh:"กิโลวัตต์ชั่วโมง",J:"จูล",s:"วินาที",h:"ชั่วโมง",V:"โวลต์",A:"แอมแปร์","µm":"ไมโครเมตร"};
function sayable(t){
  return String(t).replace(/PM ?2\.5/g,"พีเอ็มสองจุดห้า").replace(/ม\.(\d)/g,"มอ $1").replace(/ป\.(\d)/g,"ปอ $1")
    .replace(/([\d⁰¹²³⁴⁵⁶⁷⁸⁹]) ?(kWh|kPa|km|cm|mm|kg|mg|mL|ml|kW|µm|Pa|m|g|L|N|W|J|V|A|s|h)(?![A-Za-z²³\/])/g,(m,d,u)=>d+" "+UNIT_SAY[u]+" ")
    .replace(/(\d+)\/(\d+)/g,"$1 ส่วน $2")
    .replace(/µg\/m³/g," ไมโครกรัมต่อลูกบาศก์เมตร ").replace(/g\/cm³/g," กรัมต่อลูกบาศก์เซนติเมตร ").replace(/cm³/g," ลูกบาศก์เซนติเมตร ").replace(/m³/g," ลูกบาศก์เมตร ")
    .replace(/m²/g," ตารางเมตร ").replace(/cm²/g," ตารางเซนติเมตร ").replace(/°C/g," องศาเซลเซียส ").replace(/% ?w\/v/g," เปอร์เซ็นต์โดยมวลต่อปริมาตร ")
    .replace(/(\d)²/g,"$1 กำลังสอง ").replace(/(\d)³/g,"$1 กำลังสาม ").replace(/([⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g,m=>" ยกกำลัง "+[...m].map(c=>SUP[c]).join("")+" ")
    .replace(/√/g," รากที่สองของ ").replace(/×/g," คูณ ").replace(/÷/g," หาร ").replace(/=/g," เท่ากับ ").replace(/[−–](?=\s*\d)/g," ลบ ")
    .replace(/%/g," เปอร์เซ็นต์ ").replace(/(\d) : (\d)/g,"$1 ต่อ $2").replace(/[→]/g," ได้ ").replace(/·/g,", ").replace(/\s+/g," ").trim();

function chunkText(t){
  const parts=String(t).replace(/\s+/g," ").trim().split(/(?<=[ .?!;])(?=\S)/), out=[];
  for(const p of parts){ if(out.length&&(out[out.length-1].length<22||p.trim().length<6)) out[out.length-1]+=p; else out.push(p) }
  return out.filter(x=>x.trim());
}

  const restart=()=>{ RD.gen=(RD.gen||0)+1; try{ speechSynthesis.cancel() }catch(err){} setTimeout(()=>{ if(RD.where===where) next() },60) };
  box.addEventListener("click",e=>{ const b=e.target.closest("[data-rate]"); if(!b) return; RD.rate=parseFloat(b.dataset.rate);
    try{localStorage.setItem("fieldnote.thrate",String(RD.rate))}catch(err){} box.querySelectorAll("[data-rate]").forEach(x=>x.setAttribute("aria-pressed",x===b)); restart() });

  next();

    ${done?`<p class="small">ส่งคำถามแล้ว: “${esc(done.ask)}” พ่อกับ Claude จะช่วยตอบ</p>`:""}
    <textarea id="ask-text" rows="2" placeholder="เช่น จำนวนคู่ คืออะไร / ทำไมต้องหาร 5" style="font:inherit;padding:8px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);width:100%;box-sizing:border-box"></textarea>
    <button class="btn ghost" id="ask-send">ส่งคำถาม</button>
    <p class="small muted">คำว่าที่มีเส้นประใต้ กดดูความหมายได้ทันทีนะ</p></details>`;
}
function askKey(where){ const st=S.steps[S.i]; return where==="concept"?"concept":(st.q?.id||"q") }
function bindAsk(where, extra){
  const d=$v.querySelector("details.ask"); if(d) d.ontoggle=()=>{S.askOpen=d.open?askKey(where):null};
  const b=document.getElementById("ask-send"); if(!b) return;
  b.onclick=()=>{ const t=document.getElementById("ask-text").value.trim(); if(!t) return;
    S.confused.push({where,key:askKey(where),topic:extra.topic,qid:extra.qid,prompt:extra.prompt,ask:t}); saveProgress(); S.askOpen=askKey(where); renderStep() };

/* ---------- scratch paper for the pencil ---------- */
const PAD={open:false,strokes:[],hist:[],tool:"pen",penSeen:false};
try{ PAD.penSeen=localStorage.getItem("fieldnote.pen")==="1" }catch(e){}
function padHtml(){
  return `<button class="padfab" id="pad-toggle" type="button">${PAD.open?"✕ ปิดกระดาษทด":"✏️ กระดาษทด"}</button>
  <div class="pad" id="pad" ${PAD.open?"":"hidden"}>
    <div class="padbar"><button type="button" data-tool="pen" aria-pressed="${PAD.tool==="pen"}">✏️ ปากกา</button><button type="button" data-tool="eraser" aria-pressed="${PAD.tool==="eraser"}">🧽 ยางลบ (ลบทีละเส้น)</button>
      <button type="button" id="pad-undo">↶ ย้อน</button><button type="button" id="pad-clear">🗑 ล้าง</button></div>
    <canvas id="pad-canvas"></canvas></div>`;
}
function padSetup(){
  const tg=document.getElementById("pad-toggle"); if(!tg) return;
  tg.onclick=()=>{PAD.open=!PAD.open; document.body.classList.toggle("padopen",PAD.open); const p=document.getElementById("pad"); p.hidden=!PAD.open; tg.textContent=PAD.open?"✕ ปิดกระดาษทด":"✏️ กระดาษทด"; if(PAD.open) padDraw(true)};
  document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{PAD.tool=b.dataset.tool;document.querySelectorAll("[data-tool]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.tool===PAD.tool))});
  /* undo history: "add" a stroke, or "erase" whole strokes (so undo brings erased lines back) */
  document.getElementById("pad-undo").onclick=()=>{ const h=PAD.hist.pop(); if(!h) return;
    if(h.type==="add") PAD.strokes=PAD.strokes.filter(x=>x!==h.stroke); else if(h.type==="erase") PAD.strokes.push(...h.strokes); else if(h.type==="clear") PAD.strokes=h.strokes; padDraw() };
  document.getElementById("pad-clear").onclick=()=>{ if(PAD.strokes.length) PAD.hist.push({type:"clear",strokes:PAD.strokes}); PAD.strokes=[]; padDraw() };
  const cv=document.getElementById("pad-canvas"); let cur=null, activeId=null, erased=null;
  const pt=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top,e.pressure||0.5]};
  /* stroke eraser: any stroke passing within 14 px of the eraser is removed whole */
  const near=(s,x,y)=>s.pts.some((p,i)=>{ const q=s.pts[i-1]||p, dx=p[0]-q[0], dy=p[1]-q[1], L=dx*dx+dy*dy, t=L?Math.max(0,Math.min(1,((x-q[0])*dx+(y-q[1])*dy)/L)):0;
    const cx=q[0]+t*dx-x, cy=q[1]+t*dy-y; return cx*cx+cy*cy<196 });
  const eraseAt=([x,y])=>{ const hit=PAD.strokes.filter(s=>near(s,x,y)); if(hit.length){ PAD.strokes=PAD.strokes.filter(s=>!hit.includes(s)); erased.push(...hit); padDraw() } };
  /* palm rejection: once a pencil has been used on this device, finger/palm touches never draw; a pencil always wins */
  cv.onpointerdown=e=>{
    if(e.pointerType==="pen"){ if(!PAD.penSeen){ PAD.penSeen=true; try{localStorage.setItem("fieldnote.pen","1")}catch(err){} }
      if(cur&&cur.touch){ PAD.strokes=PAD.strokes.filter(x=>x!==cur); PAD.hist=PAD.hist.filter(h=>h.stroke!==cur); cur=null } }
    else if(PAD.penSeen&&e.pointerType==="touch") return;
    if(activeId!==null&&e.pointerType!=="pen") return;
    activeId=e.pointerId; try{cv.setPointerCapture(e.pointerId)}catch(err){} e.preventDefault();
    if(PAD.tool==="eraser"){ erased=[]; eraseAt(pt(e)); return }
    cur={tool:"pen",pts:[pt(e)],touch:e.pointerType==="touch"}; PAD.strokes.push(cur); PAD.hist.push({type:"add",stroke:cur}) };
  cv.onpointermove=e=>{ if(e.pointerId!==activeId) return; let evs=e.getCoalescedEvents?e.getCoalescedEvents():[]; if(!evs.length) evs=[e];
    if(erased){ evs.forEach(ev=>eraseAt(pt(ev))); return }
    if(cur){ evs.forEach(ev=>cur.pts.push(pt(ev))); padDraw() } };
  cv.onpointerup=cv.onpointercancel=e=>{ if(e.pointerId!==activeId) return; if(erased&&erased.length) PAD.hist.push({type:"erase",strokes:erased}); erased=null; cur=null; activeId=null };
  /* stop iPad's long-press magnifier / selection and page gestures on the pad */
  ["touchstart","touchmove"].forEach(t=>cv.addEventListener(t,ev=>ev.preventDefault(),{passive:false}));
  if(PAD.open){ document.body.classList.add("padopen"); padDraw(true) }
}
function padDraw(resize){
  const cv=document.getElementById("pad-canvas"); if(!cv||cv.offsetParent===null) return;
  const dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight;
  if(resize||cv.width!==Math.round(w*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr) }
  const g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  const ink=getComputedStyle(document.documentElement).getPropertyValue("--ink").trim()||"#16302B";
  PAD.strokes.forEach(s=>{ g.globalCompositeOperation=s.tool==="eraser"?"destination-out":"source-over"; g.strokeStyle=ink; g.lineCap="round"; g.lineJoin="round";
    if(s.pts.length===1){ const [x,y,p]=s.pts[0]; g.fillStyle=ink; g.beginPath(); g.arc(x,y,0.8+p*1.3,0,7); g.fill() }
    for(let i=1;i<s.pts.length;i++){ const [x0,y0]=s.pts[i-1],[x1,y1,p]=s.pts[i]; g.lineWidth=s.tool==="eraser"?22:1.2+p*2.6; g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke() } });
  g.globalCompositeOperation="source-over";
}
window.addEventListener("resize",()=>padDraw(true));

/* ---------- one question ---------- */
function renderStep(){
  const st = S.steps[S.i];
  if(st.kind==="concept") return renderConcept();
  if(st.kind==="passage") return renderPassage();
  if(st.kind==="rate") return renderRate();
  if(st.kind==="finish") return finishReview();
  const q = st.q, ans = S.answered;
  const canQ=!q.en&&S.set.kind!=="mixed"&&CAL.listenQuestions!==false, waitMs=Math.max(0,(CAL.listenDelaySec??20)*1000-(Date.now()-S.qStart));
  /* trials: confidence buttons and/or a reason before the answer is shown, so choosing and sending are two taps */
  const tConf=(S.trial||[]).includes("confidence"), tWhy=!!st.explain, staged=tConf||tWhy;
  const sendBtns=tConf?`<button class="btn" id="send-sure">✓ มั่นใจ ส่งคำตอบ</button><button class="btn ghost" id="send-unsure">🤔 ไม่ชัวร์ ส่งคำตอบ</button>`:`<button class="btn" id="send-plain">ส่งคำตอบ</button>`;
  const panel = !ans&&staged&&(q.num||S.pick!=null)?`<div class="feedback trialbox">
      ${tWhy?`<label class="small" for="whytext"><b>ก่อนดูเฉลย:</b> ทำไมถึงตอบแบบนี้ เขียนสั้นๆ 1–2 บรรทัด (หรือเขียนในกระดาษทดก็ได้)</label>

      ${tConf?`<span class="small muted">ตอบแล้วมั่นใจแค่ไหน ข้อที่ถูกแต่ไม่ชัวร์ ระบบจะเอามาให้ทวนอีกรอบ</span>`:""}
      <div class="row">${sendBtns}</div></div>`:"";
  let body;

    body=`<div class="feedback trialbox"><b>🧠 ข้อนี้เคยเจอแล้ว</b><span class="small">ลองคิดคำตอบในใจหรือในกระดาษทดก่อน ว่าต้องใช้วิธีไหน ได้คำตอบอะไร แล้วค่อยกดดูตัวเลือก</span>

  } else if(q.num){

    body = `<div class="num"><input id="numin" inputmode="${coarse?"none":"decimal"}" aria-label="คำตอบ" ${ans?"disabled":""} value="${ans&&!ans.dontknow?esc(ans.raw):esc(S.numDraft||"")}"><span class="muted" style="align-self:center">${q.unit}</span>
      ${ans||staged?"":`<button class="btn" id="check">ตรวจคำตอบ</button>`}</div>
      ${ans?"":`<div class="numpad" role="group" aria-label="แป้นตัวเลข">${["7","8","9","4","5","6","1","2","3","−","0",".","⌫"].map(k=>`<button type="button" data-np="${k}" ${k==="⌫"?'aria-label="ลบ"':""}>${k}</button>`).join("")}</div>`}${panel}`;
  } else {
    body = `<div class="opts">${q.opts.map((o,k)=>{
      let c=""; if(ans){ if(k===q.a) c="right"; else if(k===ans.choice) c="wrong"; } else if(staged&&S.pick===k) c="picked";
      const struck=!ans&&S.struck.includes(k);
      return `<div class="optrow"><button class="opt ${c} ${struck?"struck":""}" data-k="${k}" ${ans?"disabled":""}>${esc(o)}</button>
        ${ans?"":`<button class="xopt" type="button" data-x="${k}" aria-pressed="${struck}" aria-label="${struck?"เอาคืน":"ตัดตัวเลือกนี้"}" title="${struck?"เอาคืน":"ตัดตัวเลือกนี้"}">${struck?"↺":"✕"}</button>`}</div>`}).join("")}</div>
      ${ans?"":`<p class="small muted">${staged?"แตะตัวเลือกเพื่อเลือก แล้วกดส่งคำตอบ · ":""}กด ✕ ท้ายข้อเพื่อตัดตัวเลือกที่ไม่ใช่แน่ๆ</p>`}${panel}`;

    const confNote = ans.dontknow||!ans.conf?"":ans.correct&&ans.conf==="unsure"?`<p class="small">ถูกแล้ว แต่ยังไม่ชัวร์ ระบบจะเอาข้อนี้มาให้ทวนอีกรอบ จะได้มั่นใจขึ้น</p>`

      ${askHtml("question")}

  $v.innerHTML = `<section class="card">${header()}

    ${q.parts&&!ans&&S.set.kind!=="mixed"?(S.partsShown?`<div class="feedback usebox"><b>🧩 แบ่งโจทย์ให้ดูทีละส่วน</b>
      <span class="small"><b>โจทย์ให้อะไรมา</b></span><ul style="margin:0;padding-left:1.2em">${(q.parts.given||[]).map(g=>`<li class="small">${esc(g)}</li>`).join("")}</ul>
      <span class="small"><b>โจทย์ถามอะไร</b> ${esc(q.parts.ask||"")}</span>${q.parts.watch?`<span class="small"><b>ระวัง</b> ${esc(q.parts.watch)}</span>`:""}</div>`
:""):""}
    ${S.hints?`<div class="feedback">${q.hints.slice(0,S.hints).map((h,k)=>`<span class="small"><b>คำใบ้ ${k+1}</b> ${esc(h)}</span>`).join("")}</div>`:""}
    ${body}${fb}
    <div class="row">${!ans&&S.hints<q.hints.length?`<button class="btn ghost" id="hint">ขอคำใบ้ (${S.hints}/${q.hints.length})</button>`:""}
    ${!ans?`<button class="btn ghost" id="dontknow">🤔 ยังคิดไม่ออก ดูเฉลย</button>`:""}
    ${st.optional&&!ans?`<button class="btn ghost" id="skip">ข้ามข้อนี้</button>`:""}</div>
    ${!ans&&q.recall?`<p class="small muted">🧠 ข้อนี้เคยเจอแล้ว รอบนี้ไม่มีตัวเลือก พิมพ์คำตอบเองเลย</p>`:""}

  bindGloss(); padSetup();
  clearTimeout(RD.timer);
  const qb=$v.querySelector('[data-read="q"]');
  if(qb){ if(qb.disabled) RD.timer=setTimeout(()=>{ qb.disabled=false; qb.dataset.label="🔊 ฟังโจทย์"; if(RD.where!=="q") qb.textContent="🔊 ฟังโจทย์" },waitMs);
    qb.onclick=()=>readAloud("q",[q.q,...(q.num||(q.cover&&!S.uncovered)?[]:q.opts.map((o,k)=>`ตัวเลือกที่ ${k+1}. ${o}`))],()=>{S.listenQ=(S.listenQ||0)+1}) }
  const eb=$v.querySelector('[data-read="ex"]'); if(eb) eb.onclick=()=>readAloud("ex",[q.ex],()=>{S.listenEx=(S.listenEx||0)+1});

async function finishWith(rec){
  if(S&&rec.type!=="vocab"){ S.active=false; if(S.mode==="set") clearProgress() }
  PAD.open=false; document.body.classList.remove("padopen");
  const prevList=mine(), before=progressOf(prevList), ssB=spellStats(prevList);
  const where=await saveAttempt(rec);
  const list=attempts.includes(rec)?mine():[rec,...mine()];
  const after=progressOf(list), ssA=spellStats(list);
  /* celebrations: only for things that matter, so they stay special */
  const cele=[];
  SPELLS.forEach(sp=>{ const tA=ssA[sp.id]?.tier||0, tB=ssB[sp.id]?.tier||0; if(tA>tB) cele.push({kind:"tier",sp,tier:tA}) });
  Object.keys(REALMS).forEach(rk=>{ const sps=SPELLS.filter(s=>s.realm===rk);
    if(sps.every(s=>(ssA[s.id]?.tier||0)>=1)&&!sps.every(s=>(ssB[s.id]?.tier||0)>=1)) cele.push({kind:"realm",rk}) });
  MILESTONES.filter(m=>after.best>=m&&before.best<m).forEach(m=>cele.push({kind:"milestone",m}));
  if(after.questDoneThisWeek&&!before.questDoneThisWeek) cele.push({kind:"quest"});
  if(after.freeze>before.freeze) cele.push({kind:"ice",why:after.earnedToday.map(e=>e.why).join(", ")});
  if(getBuddy()){ const b1=buddyStage(prevList), b2=buddyStage(list); if(b2.i>b1.i) cele.push({kind:"buddy",name:b2.name}) }
  S={...S,where,rec,before,after,list,cele,ci:0}; view="done"; render(); window.scrollTo({top:0});
}

const BUDDY_KINDS=[{k:"fox",e:"🦊",n:"จิ้งจอกเวท"},{k:"dragon",e:"🐉",n:"มังกรน้อย"},{k:"owl",e:"🦉",n:"นกฮูกนักปราชญ์"},{k:"cat",e:"🐈‍⬛",n:"แมวดำจอมเวท"},{k:"bunny",e:"🐇",n:"กระต่ายจันทรา"},{k:"bubble",e:"🫧",n:"ภูตฟองสบู่"},{k:"robot",e:"🤖",n:"หุ่นกลไกจิ๋ว"},{k:"turtle",e:"🐢",n:"เต่าเก็บความรู้"}];
const BUDDY_STAGES=[[0,"ภูตแรกเกิด"],[3,"ภูตฝึกหัด"],[10,"ภูตชำนาญ"],[20,"ภูตผู้พิทักษ์"],[35,"ภูตตำนาน"]];
function getBuddy(){ try{ return JSON.parse(localStorage.getItem("fieldnote.buddy")||"null") }catch(e){ return null } }
function setBuddy(b){ try{ localStorage.setItem("fieldnote.buddy",JSON.stringify(b)) }catch(e){} }
function buddyArt(){ try{ return localStorage.getItem("fieldnote.buddyart") }catch(e){ return null } }
function buddyStage(list){ const n=Object.values(spellStats(list)).filter(v=>v.tier>=1).length; let i=0; BUDDY_STAGES.forEach(([m],k)=>{ if(n>=m) i=k });

/* pronunciation: the browser's own English voice (works on iPad and Android Chrome) */
/* Some in-app browsers (LINE, Facebook, the Claude app) hide the voice engine, so detect it and offer a way out */
const CAN_SPEAK = typeof speechSynthesis!=="undefined" && typeof SpeechSynthesisUtterance!=="undefined";
const UA = navigator.userAgent||"";
const IN_APP = /Line\/|FBAN|FBAV|Instagram|; wv\)|Claude/i.test(UA);
const IS_ANDROID = /Android/i.test(UA);
let speechBroken = !CAN_SPEAK;
try{ if(CAN_SPEAK) speechSynthesis.getVoices(); }catch(e){}
function speak(text, slow){
  if(!CAN_SPEAK){ speechBroken=true; showSpeechHelp(); return }
  try{
    if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=slow?0.42:0.9;
    const v=pickVoice(); if(v){ u.voice=v; u.lang=v.lang }
    let started=false; u.onstart=()=>{started=true;speechBroken=false;hideSpeechHelp()}; u.onerror=e=>{ if(e.error!=="interrupted"&&e.error!=="canceled"){speechBroken=true;showSpeechHelp()} };
    speechSynthesis.speak(u);
    setTimeout(()=>{ if(!started&&!speechSynthesis.speaking){ speechBroken=true; showSpeechHelp() } },2500);
  }catch(e){ speechBroken=true; showSpeechHelp() }
}
function enVoices(){ try{ return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)) }catch(e){ return [] } }
function pickVoice(){ const vs=enVoices(); let want=null; try{ want=localStorage.getItem("fieldnote.voice") }catch(e){}
  return vs.find(v=>v.voiceURI===want)||vs.find(v=>/^en(-|_)US/i.test(v.lang)&&v.localService)||vs.find(v=>/^en(-|_)US/i.test(v.lang))||vs[0]||null }
function voicePicker(){
  const vs=enVoices(); if(!vs.length) return "";
  const cur=pickVoice();
  return `<details class="small"><summary>🎙 เลือกเสียงผู้อ่าน (${esc(cur?cur.name:"ค่าเริ่มต้น")})</summary>

function vOpts(word,dir){
  const others=VOCAB.filter(x=>x.w!==word.w).sort(()=>Math.random()-.5).slice(0,3);
  const all=[word,...others].sort(()=>Math.random()-.5);
  return {opts:all.map(x=>dir==="en"?x.th:x.w), a:all.indexOf(word)};
}
function startVocab(){
  const {due,fresh}=vocabToday(); if(!due.length&&!fresh.length) return;
  const st=vocabState();
  // new words: meaning first, spelling later in the round; review words: spelling once they have been seen twice
  const meaning=[...fresh.map(w=>({w,kind:"mc",dir:"en",fresh:true})),...due.map((w,k)=>({w,kind:"mc",dir:k%2?"en":"th"}))].map(x=>({...x,...vOpts(x.w,x.dir)}));
  const spellNew=fresh.map(w=>({w,kind:"spell",fresh:true}));
  const spellDue=due.filter(w=>(st[w.w]?.box||0)>=2||Math.random()<.5).map(w=>({w,kind:"spell"}));
  const quiz=[...meaning.sort(()=>Math.random()-.5),...[...spellNew,...spellDue].sort(()=>Math.random()-.5)];
  const base=isWeekend()?READINGS[Math.floor(todayKey()/DAY)%READINGS.length]:null;
  const read=base?{...base,qs:base.qs.map((q,qi)=>{const sq=shuffleQ(q); return {...sq,qth:base.th.qs[qi].q,optsTh:sq.perm.map(k=>base.th.qs[qi].opts[k])}})}:null;
  V={active:true,fresh,quiz,read,phase:fresh.length?"learn":"quiz",li:0,qi:0,ri:0,ans:null,results:[],rres:[],heard:new Set(),showTh:false,start:Date.now()};

}

/* replay the vocabulary sessions that are kept, so removed tries do not leave words half-learned */
function rebuildVocabState(list){
  const st={};
  list.filter(a=>a.type==="vocab").sort((a,b)=>new Date(a.endedAt)-new Date(b.endedAt)).forEach(a=>{
    const t=dayKey(a.endedAt), byWord={};
    (a.items||[]).forEach(i=>{ if(i.word) byWord[i.word]=(byWord[i.word]??true)&&i.correct });
    Object.entries(byWord).forEach(([w,ok])=>{ const cur=st[w]?.box||0, box=ok?Math.min(BOX_DAYS.length,cur+1):1; let due=t; for(let k=0;k<BOX_DAYS[box-1];k++) due=nextDay(due); st[w]={box,due} });
  });
  saveVocabState(st);
}
async function finishVocab(){
  V.active=false;
  try{ if(CAN_SPEAK) speechSynthesis.cancel() }catch(e){}
  $v.innerHTML=`<section class="card"><p class="muted">กำลังบันทึก…</p></section>`;
  const st=vocabState(), t=todayKey(), byWord={};
  V.results.forEach(r=>{ byWord[r.w]=(byWord[r.w]??true)&&r.correct });   // a word moves up only if every item on it was right
  Object.entries(byWord).forEach(([w,ok])=>{ const cur=st[w]?.box||0; const box=ok?Math.min(BOX_DAYS.length,cur+1):1;
    let due=t; for(let i=0;i<BOX_DAYS[box-1];i++) due=nextDay(due); st[w]={box,due} });
  saveVocabState(st);
  const c=V.results.filter(r=>r.correct).length, rc=V.rres.filter(Boolean).length;
  const sp=V.results.filter(r=>r.kind==="spell");
  await finishWith({type:"vocab",setId:"vocab",subject:"อังกฤษ",topic:"คำศัพท์วันนี้",startedAt:new Date(V.start).toISOString(),endedAt:new Date().toISOString(),
    durationSec:Math.round((Date.now()-V.start)/1000),correct:c,total:V.results.length,newWords:V.fresh.length,
    spelling:{correct:sp.filter(r=>r.correct).length,total:sp.length},
    reading:V.read?{correct:rc,total:V.rres.length}:null,xp:c*5+(V.results.length-c)*2+rc*5+(V.rres.length-rc)*2,
    items:V.results.map(r=>({qid:"v:"+r.w,word:r.w,kind:r.kind,fresh:r.fresh,correct:r.correct}))});
}

let samplerP=null;

      out.textContent=text }catch(e){ out.textContent="ยังร่างคำตอบไม่ได้ ลองใหม่อีกครั้ง" } b.disabled=false };

async function setupAsk(sum){ const skips=sum.skips||[], conf=sum.conf||[];

    const out=document.getElementById("out"); btn.disabled=true; out.textContent="กำลังวิเคราะห์ อาจใช้เวลาราวครึ่งนาที…";
    const real=realAttempts(), rs=real.filter(isLesson), rk=real.filter(isSkip), rv=real.filter(a=>a.type==="vocab"), rp=progressOf(real);

    const rLv=[1,2,3].map(l=>{const it=rItems.filter(x=>x.level===l);return {level:l,n:it.length,correct:it.filter(x=>x.correct).length}});
