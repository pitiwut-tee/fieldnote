<title>สมุดคาถา</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column like a pocket field notebook; parent view is the same column with summary first. */
:root{
  --paper:#F2F6F4; --card:#FFFFFF; --ink:#16302B; --muted:#5B716B; --line:#D3E0DB;
  --accent:#1F7A8C; --accent-ink:#FFFFFF; --beak:#D9822B; --good:#2E8B57; --bad:#C0453A; --warn:#B7841C;
  --soft:#E3EEEA;
  --display:"Mitr","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1A18; --card:#172623; --ink:#E2ECE8; --muted:#97ABA5; --line:#2A3D39;
  --accent:#4FB3C6; --accent-ink:#0B1715; --beak:#E9A35A; --good:#5CC48A; --bad:#EF7C70; --warn:#E3B54E; --soft:#1E302C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1A18; --card:#172623; --ink:#E2ECE8; --muted:#97ABA5; --line:#2A3D39;
  --accent:#4FB3C6; --accent-ink:#0B1715; --beak:#E9A35A; --good:#5CC48A; --bad:#EF7C70; --warn:#E3B54E; --soft:#1E302C; color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65}
.wrap{max-width:620px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:1.7rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand small{color:var(--muted);font-size:.85rem}
.tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:999px}
.tabs a{padding:6px 14px;border-radius:999px;color:var(--ink);text-decoration:none;font-size:.9rem}
.tabs a[aria-current="page"]{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:.78rem;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.sets{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.sets{grid-template-columns:1fr 1fr}}
.set{text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.set:hover{border-color:var(--accent)}
.set .subj{font-family:var(--display);font-size:1.15rem}
.set .meta{color:var(--muted);font-size:.88rem}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--ink);width:fit-content}
.chip.l1{background:color-mix(in srgb,var(--good) 18%,transparent)}
.chip.l2{background:color-mix(in srgb,var(--warn) 22%,transparent)}
.chip.l3{background:color-mix(in srgb,var(--beak) 26%,transparent)}
.week{display:flex;gap:8px;flex-wrap:wrap}
.day{width:38px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;color:var(--muted)}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.dot.rest{border-style:dashed}
.progress{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.stage{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.prompt{font-size:1.08rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--accent)}}   /* touch screens keep a "hover" after a tap, which looked like a hint */
.optrow{display:flex;gap:6px;align-items:stretch}
.optrow .opt{flex:1}
.xopt{flex:none;width:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font:inherit;cursor:pointer}
.opt.struck{opacity:.45;text-decoration:line-through;background:var(--soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;border-bottom:2px dotted var(--accent);cursor:pointer}
details.ask{display:flex;flex-direction:column;gap:6px}
details.ask summary{cursor:pointer;color:var(--accent);font-size:.9rem;padding:4px 0}
details.ask[open]{display:flex}
.dot.leave{border-style:dashed;display:flex;align-items:center;justify-content:center;font-size:.8rem}
.padfab{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;font:inherit;font-family:var(--display);border:0;border-radius:999px;padding:10px 16px;background:var(--beak);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}
.pad{position:fixed;left:0;right:0;bottom:0;height:48vh;z-index:20;background:var(--card);border-top:2px solid var(--line);display:flex;flex-direction:column;box-shadow:0 -4px 16px rgba(0,0,0,.12)}
.pad[hidden]{display:none}
.padbar{display:flex;gap:6px;padding:8px 12px;flex-wrap:wrap}
.padbar button{font:inherit;font-size:.85rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.padbar button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,var(--card))}
.pad,.pad *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#pad-canvas{flex:1;width:100%;touch-action:none;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 32px}
body.padopen .wrap{padding-bottom:calc(48vh + 70px)}
body.padopen .padfab{bottom:calc(48vh + 10px)}
.flamebox{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:96px;padding:8px 12px;border-radius:14px;background:color-mix(in srgb,var(--beak) 16%,var(--card))}
.flamebox.out{filter:grayscale(1);opacity:.6}
.flamebig{font-family:var(--display);font-size:2.2rem;line-height:1.1}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:.75rem;padding:1px 7px;border-radius:999px;border:1px dashed var(--line);color:var(--muted)}
.badge.on{border:1px solid var(--beak);color:var(--ink);background:color-mix(in srgb,var(--beak) 18%,transparent)}
.daypanel{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-radius:10px;background:var(--soft)}
.btn.small{font-size:.82rem;padding:6px 12px}
.dot.hol{border-color:color-mix(in srgb,var(--beak) 60%,var(--line))}
.quest{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.quest:last-of-type{border-bottom:0}
.combo{color:var(--beak)}
.spellart{width:100%;max-height:180px;object-fit:cover;border-radius:10px}
.spell.glow{box-shadow:0 0 0 3px color-mix(in srgb,var(--beak) 60%,transparent)}
.celebrate{position:fixed;inset:0;z-index:50;background:rgba(10,20,18,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.celecard{position:relative;z-index:2;background:var(--card);border-radius:18px;padding:24px 20px;max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;animation:pop .35s ease-out}
.celeicon{font-size:3.4rem;line-height:1}
.celeart{max-height:200px;object-fit:contain;border-radius:12px}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (min-width:700px){
  .pad{left:auto;top:0;bottom:0;right:0;width:50vw;height:auto;border-top:0;border-left:2px solid var(--line);box-shadow:-4px 0 16px rgba(0,0,0,.12)}
  body.padopen .wrap{padding-bottom:48px;margin-left:0;margin-right:50vw;max-width:none;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:20px}
  body.padopen .padfab{top:calc(6px + env(safe-area-inset-top,0px));bottom:auto;right:14px;padding:7px 14px}
}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.opt.picked{border-color:var(--accent);border-width:2.5px;background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.trialbox{border-left:4px solid var(--accent)}
.usebox{border-left:4px solid var(--good)}
.buddy{display:flex;gap:10px;align-items:flex-start}
.bface{flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:color-mix(in srgb,var(--beak) 18%,var(--card));object-fit:cover;line-height:1}
.bubble{position:relative;flex:1;background:var(--soft);border-radius:4px 14px 14px 14px;padding:8px 12px;display:flex;flex-direction:column;gap:3px;font-size:.92rem}
.petwrap{position:relative;display:inline-flex;flex:none;align-items:flex-end;justify-content:center}
.petwrap .bface{position:relative;z-index:1}
.w-it{position:absolute;transform:translate(-50%,-50%);line-height:1;z-index:2;pointer-events:none;user-select:none;-webkit-user-select:none}
.scene .props{position:absolute!important;inset:0;z-index:1;pointer-events:none}
.prop-it{position:absolute;transform:translate(-50%,-50%);line-height:1;user-select:none;-webkit-user-select:none}
.arrange .w-it,.arrange .prop-it{pointer-events:auto;cursor:grab;touch-action:none;outline:2px dashed rgba(255,255,255,.85);outline-offset:2px;border-radius:6px}
.arrange .props{pointer-events:auto}
.arrange .hero-pet,.arrange .hero-pet *{animation:none!important}
.arrange .sel{outline:3px solid var(--beak)!important;background:rgba(255,255,255,.35)}
.wishbar{display:flex;gap:10px;align-items:center}
.islandwrap{margin:6px -6px;border-radius:18px;overflow:hidden}
.island{display:block;width:100%;height:auto;max-height:78vh}
.mnode{cursor:pointer}
.dash{display:flex;flex-direction:column;gap:14px}
.pgroup{border:1.5px solid var(--line);border-radius:16px;background:var(--card);margin:0}
.pgroup>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.pgroup>summary::-webkit-details-marker{display:none}
.pgroup>summary .pgt{font-weight:700;font-size:1.05rem}
.pgroup>summary::after{content:"แตะเพื่อเปิด ▾";font-size:.78rem;color:var(--accent);font-weight:600}
.pgroup[open]>summary::after{content:"ปิด ▴"}
.pgroup[open]{padding-bottom:8px}
.pgroup>section.card{margin:8px;box-shadow:none}
.pgbadge{background:#e2574c;color:#fff;border-radius:999px;font-size:.75rem;padding:1px 8px;margin-left:6px;vertical-align:2px}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:10px;font-size:.92rem;line-height:1.45;border-left:5px solid}
.alert.red{background:color-mix(in srgb,#e2574c 10%,var(--card));border-color:#e2574c}
.alert.amber{background:color-mix(in srgb,#f0a04b 12%,var(--card));border-color:#f0a04b}
.alert.green{background:color-mix(in srgb,#2e8b57 10%,var(--card));border-color:#2e8b57}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{display:flex;flex-direction:column;gap:2px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.kpi b{font-size:1.5rem;font-family:var(--display)}
.kpi span{font-size:.85rem}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.spstrip{display:flex;flex-wrap:wrap;gap:6px}
.spchip{font-size:.78rem;border:1.5px solid;border-radius:999px;padding:2px 8px;display:inline-flex;gap:5px;align-items:center}.spchip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.factbox{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 10%,var(--card)),var(--card));border:1.5px solid color-mix(in srgb,var(--accent) 35%,var(--line))}
.factrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fcard{font:inherit;color:var(--ink);text-align:center;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 6px;min-height:118px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.fcard .fnum{font-size:.72rem;font-weight:700;color:var(--accent)}
.fcard .fpet{font-size:2rem;line-height:1.1}
.fcard.open{border:2px solid var(--accent)}
.factbox .ftext{font-size:.98rem;line-height:1.65;color:var(--ink);background:var(--card);border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.fcard.locked{opacity:.55;cursor:default;background:var(--soft)}
.fcard.newf{border:2px solid var(--beak);animation:glowf 1.8s ease-in-out infinite}
.fcard.newf::after{content:"ใหม่";position:absolute;top:-7px;right:-4px;background:#e2574c;color:#fff;font-size:.65rem;padding:1px 6px;border-radius:8px}
@keyframes glowf{0%,100%{box-shadow:0 0 0 rgba(240,138,60,0)}50%{box-shadow:0 0 12px rgba(240,138,60,.55)}}
.labgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.labcard{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;text-align:center}
.labcard.on{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.genechip{font-family:var(--mono);font-weight:700;font-size:.9rem;background:var(--soft);border-radius:8px;padding:1px 8px}
.punnett{border-collapse:collapse;margin:6px 0}.punnett th{font-family:var(--mono);padding:4px 10px;font-size:1.05rem}
.pcell{font:inherit;font-family:var(--mono);font-weight:700;font-size:1.05rem;width:58px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.skyov{position:absolute!important;inset:0;width:auto!important;pointer-events:none;z-index:3;transition:background .6s}
.skyov svg{width:100%;height:100%;display:block}
.meteor{opacity:0;animation:meteor 5s linear infinite}
@keyframes meteor{0%{opacity:0;transform:translate(0,0)}3%{opacity:1}12%{opacity:0;transform:translate(-60px,40px)}100%{opacity:0}}
.islandwrap{position:relative}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px;margin:6px 0 12px}
.case{font:inherit;color:var(--ink);background:linear-gradient(var(--card),var(--soft));border:1px solid var(--line);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;text-align:center;position:relative}
.case .ce{font-size:1.9rem;line-height:1.2}
.case.locked{opacity:.45;cursor:default}
.case.on{border:2px solid var(--accent)}
.case.newc::after{content:"ใหม่";position:absolute;top:-6px;right:-4px;background:#e2574c;color:#fff;font-size:.65rem;padding:1px 6px;border-radius:8px}
.mnode.fog{opacity:.75}
.mnode.thirst text{filter:saturate(.4)}
.mnode .pulse{animation:pulse 1.6s ease-in-out infinite;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.9}50%{opacity:.25}}
.mnode.sel circle{filter:drop-shadow(0 0 4px rgba(47,111,143,.6))}
.fxp{position:absolute;z-index:3;line-height:1;pointer-events:none;animation:fxfloat 2.4s ease-in-out infinite}
@keyframes fxfloat{0%,100%{transform:translateY(0);opacity:.95}50%{transform:translateY(-8px);opacity:.55}}
.aura{position:absolute;inset:-6%;border-radius:50%;background:radial-gradient(circle,rgba(255,236,150,.85) 0%,rgba(255,200,90,.35) 45%,transparent 70%);animation:auraglow 2.6s ease-in-out infinite;z-index:0}
@keyframes auraglow{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.08);opacity:1}}
.bface.egg{animation:wobble 2.8s ease-in-out infinite;background:transparent}
@keyframes wobble{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-8deg)}90%{transform:rotate(7deg)}95%{transform:rotate(-4deg)}}
.growbox{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--soft)}
.nextshape{font-size:2.4rem;filter:brightness(0);opacity:.35;line-height:1}
.scene{position:relative;border-radius:16px;min-height:250px;display:flex;align-items:flex-end;justify-content:center;padding:16px;overflow:hidden}
.scenesvg{position:absolute;inset:0;width:100%;height:100%}
.scene>*:not(.scenesvg){position:relative}
.scene .hero-pet{margin-bottom:22px;z-index:2}
.scene .bface,.scene .mini .bface{background:transparent!important}
.scene .hero-pet .petwrap::after{content:"";position:absolute;left:18%;right:18%;bottom:-4px;height:12px;border-radius:50%;background:rgba(0,0,0,.18);z-index:0}
.thumb{display:block;width:100%;height:72px;border-radius:8px;overflow:hidden;position:relative}
.thumb svg{width:100%;height:100%}
.twinkle{animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
.rise{animation:rise 6s linear infinite}
@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-240px);opacity:0}}
.fall{animation:fall2 7s linear infinite}
@keyframes fall2{from{transform:translateY(0)}to{transform:translateY(250px)}}
.sway{animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.float{animation:floaty 5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.glow{animation:twinkle 3.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.twinkle,.rise,.fall,.sway,.float,.glow,.fxp,.aura,.bface.egg{animation:none}}

.scene .hero-pet{margin-bottom:18px}
.scene .others{position:absolute!important;top:10px;right:10px;display:flex;gap:6px;z-index:2}
.scene .mini{border:0;background:rgba(255,255,255,.55);border-radius:50%;padding:3px;cursor:pointer}
.stars{font-family:var(--display);font-size:1.1rem;color:var(--beak)}
.starlink{color:var(--beak);text-decoration:none;font-weight:600}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.shopitem{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 8px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.shopitem.have{border-color:color-mix(in srgb,var(--good) 50%,var(--line))}
.swatch{width:56px;height:40px;border-radius:8px;display:inline-block}
.buddyhero{background:linear-gradient(135deg,color-mix(in srgb,var(--beak) 16%,var(--card)),color-mix(in srgb,var(--accent) 12%,var(--card)));border:2px solid color-mix(in srgb,var(--beak) 45%,var(--line))}
.bbtn{border:0;background:none;padding:0;cursor:pointer;animation:bob 3s ease-in-out infinite}
.bbtn.hop{animation:hop .45s ease-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes hop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-12px) scale(1.06)}100%{transform:translateY(0) scale(1)}}
@media (prefers-reduced-motion: reduce){.bbtn,.bbtn.hop{animation:none}}
.bbtn{position:relative}
.heartpop{position:absolute;left:50%;top:20%;pointer-events:none;z-index:5;font-size:22px;animation:heartup 1.1s ease-out forwards}
@keyframes heartup{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-70px) scale(1.15)}}
.bbtn.squish .bface{animation:squish .5s ease-out}
@keyframes squish{0%{transform:scale(1)}30%{transform:scale(1.12,.9)}60%{transform:scale(.95,1.06)}100%{transform:scale(1)}}

<div class="wrap" id="app">
  <header class="top">
    <div class="brand"><h1>สมุดคาถา</h1><small>ฝึกวันละ 30–45 นาที · ต้นแบบรุ่นทดลอง</small></div>
    <nav class="tabs"><a href="#home" id="tab-home" data-v="home">ฝึกวันนี้</a><a href="#map" id="tab-map" data-v="map">แผนที่คาถา</a><a href="#den" id="tab-den" data-v="den">บ้านคู่หู</a><a href="#parent" id="tab-parent" data-v="parent">หน้าผู้ปกครอง</a></nav>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<script>
const ERR = {concept:"ยังไม่เข้าใจหลัก", forgot:"เข้าใจ แต่จำสูตรหรือวิธีคิดไม่ได้", read:"อ่านโจทย์พลาด", misopt:"อ่านตัวเลือกผิด", unclear:"โจทย์กำกวม อ่านแล้วไม่เข้าใจ", calc:"คิดเลขผิด", guess:"เดา", dontknow:"คิดไม่ออก (กดดูเฉลย)"};
const LV = {1:"ระดับ 1 · พื้นฐาน",2:"ระดับ 2 · ประยุกต์",3:"ระดับ 3 · แนวคิดวิเคราะห์"};

/* ---------- content comes from content/*.json, injected at build time (tools/build.py) ---------- */
const CONTENT=/*@@CONTENT@@*/null;
const CAL=CONTENT.calendar;
const SETS=CONTENT.sets.map(s=>{ const o=JSON.parse(JSON.stringify(s)); o.warm=o.warm||[];
  [...o.warm,...o.practice,...(o.challenge?[o.challenge]:[])].forEach(q=>q.hints=(s.hints||{})[q.id]||[]);
  o.concept=o.concept||{title:"",points:[],formulas:[],vocab:[],alts:[]}; o.concept.alts=o.concept.alts||[];
  o.current=CAL.currentSpells.includes(o.spell); return o });
const SKIP_REASONS=["การบ้านเยอะ","มีสอบ/ต้องอ่านวิชาอื่น","ไม่สบาย","เหนื่อยมาก","มีธุระ/ไปข้างนอก","อื่นๆ"];
/* ---------- spell map (from the curriculum map doc): id, realm, magic name, topic, grade, exam stars, school status ---------- */
const REALMS=CONTENT.spells.realms, SCHOOL=CONTENT.spells.school, SPELLS=CONTENT.spells.spells;

/* ---------- daily vocabulary: general academic words + science/math words + story/art words ---------- */
const VOCAB=CONTENT.vocab.map(x=>({...x}));
const MISSIONS=(CONTENT.missions&&CONTENT.missions.missions)||[];
const GUESTS=(CONTENT.guests&&CONTENT.guests.guests)||[];
const READINGS=CONTENT.readings.map((r,i)=>({text:r.text,qs:r.qs.map(q=>({q:q.q,opts:q.opts,a:q.a})),th:{text:r.th,qs:r.qs.map(q=>({q:q.qth,opts:q.optsTh}))},idx:i}));

/* ---------- test mode: open the page with #test once; results get a "test" tag ---------- */
let TEST=false;
try{ if(location.hash==="#test") localStorage.setItem("fieldnote.test","1"); TEST=localStorage.getItem("fieldnote.test")==="1" }catch(e){ TEST=location.hash==="#test" }
function leaveTest(){
  try{
    localStorage.removeItem("fieldnote.test");
    localStorage.setItem("fieldnote.attempts",JSON.stringify(JSON.parse(localStorage.getItem("fieldnote.attempts")||"[]").filter(x=>!x.test)));
    localStorage.setItem("fieldnote.fb",JSON.stringify(JSON.parse(localStorage.getItem("fieldnote.fb")||"[]").filter(x=>!x.test)));
  }catch(e){}
  TEST=false; attempts=lsRead(); if(location.hash==="#test") location.hash="#home"; view="home"; render();
}

/* ---------- fresh start on 5 Nov 2026: the trial day (4 Nov) is cleared from this browser, once ---------- */
const START_DAY=new Date(CAL.startDay+"T00:00:00").getTime();
try{
  if(Date.now()>=START_DAY&&localStorage.getItem("fieldnote.epoch")!=="2"){
    ["fieldnote.attempts","fieldnote.fb","fieldnote.vocab","fieldnote.inprogress","fieldnote.test"].forEach(k=>localStorage.removeItem(k));
    localStorage.setItem("fieldnote.epoch","2");
  }
  const keep=JSON.parse(localStorage.getItem("fieldnote.attempts")||"[]").filter(a=>new Date(a.endedAt).getTime()>=START_DAY);
  localStorage.setItem("fieldnote.attempts",JSON.stringify(keep));
}catch(e){}

/* ---------- storage: shared db when available, otherwise this browser only ---------- */
let db = null, store = "local", attempts = [], unsub = null;
const LS = "fieldnote.attempts";
function lsRead(){ try{ return JSON.parse(localStorage.getItem(LS)||"[]") }catch(e){ return [] } }
function lsWrite(a){ try{ localStorage.setItem(LS, JSON.stringify(a)) }catch(e){} }
attempts = lsRead();
setTimeout(()=>{ try{ migrateBuddy() }catch(e){} },0);
(async()=>{
  try{
    db = await window.claude?.use?.("db");
  }catch(e){ db = null }
  if(!db) return;
  const t = setTimeout(()=>{}, 10000);
  try{
    unsub = db.collection("attempts").orderBy("endedAt","desc").limit(200).onSnapshot(s=>{
      clearTimeout(t); store="db";
      attempts = s.docs.map(d=>({id:d.id,...d.data()}));
      if(view==="parent"||view==="home") render();
    }, ()=>{ clearTimeout(t) });
  }catch(e){ clearTimeout(t) }
})();
async function saveAttempt(rec){
  if(TEST) rec.test=true;
  if(db){
    try{ await db.collection("attempts").add(rec); return "db" }catch(e){}
  }
  attempts = [rec, ...attempts]; lsWrite(attempts.filter(a=>!a.example)); return "local";
}

function b64e(str){const b=new TextEncoder().encode(str);let o="";for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(o)}
function b64d(x){return new TextDecoder().decode(Uint8Array.from(atob(x),c=>c.charCodeAt(0)))}
function lsFb(){ try{ return JSON.parse(localStorage.getItem("fieldnote.fb")||"[]") }catch(e){ return [] } }
function unsent(){ return {a:lsRead().filter(x=>!x.sent), f:lsFb().filter(x=>!x.sent)} }
function markSent(){ lsWrite(lsRead().map(x=>({...x,sent:true}))); try{localStorage.setItem("fieldnote.fb",JSON.stringify(lsFb().map(x=>({...x,sent:true}))))}catch(e){} attempts=lsRead() }
/* short code: drop text the parent page can look up again by question id, then deflate */
function slim(a){ const {sent,...x}=a; return {...x, items:(x.items||[]).map(({prompt,phase,topic,spell,...i})=>i), confused:(x.confused||[]).map(({prompt,...c})=>c)} }
function fatten(a){ return {...a, items:(a.items||[]).map(i=>{const q=QBANK[i.qid]?.q; return q?{topic:q.topic,spell:q.spell,prompt:q.q,...i}:i}),
  confused:(a.confused||[]).map(c=>{const q=QBANK[c.qid]?.q; return q&&!c.prompt?{...c,prompt:q.q}:c})} }
async function packCode(obj){
  const json=JSON.stringify(obj);
  if(typeof CompressionStream==="function"){ try{
    const buf=new Uint8Array(await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer());
    let t=""; for(let i=0;i<buf.length;i+=0x8000) t+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
    return "SK2:"+btoa(t).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }catch(e){} }
  return "FIELDNOTE1:"+b64e(json);
}
async function exportCode(all){ const a=all?lsRead():unsent().a, f=all?lsFb():unsent().f; const b=getBuddy(); return (a.length||f.length)?await packCode({a:a.map(slim),f:f.map(({sent,...x})=>x),...(b?{b:{name:b.name,kind:b.kind}}:{})}):"" }

/* LINE cuts long messages (about 1,000 characters got through), so a long code is sent as numbered parts */
const PART_LEN=800;
function splitCode(code){ if(code.length<=PART_LEN) return [code];
  const id=(Date.now()%46656).toString(36).padStart(3,"0"), n=Math.ceil(code.length/PART_LEN), out=[];
  for(let i=0;i<n;i++) out.push(`SKP:${id}:${i+1}/${n}:`+code.slice(i*PART_LEN,(i+1)*PART_LEN));
  return out }
async function copyText(t,box,m,okMsg){ try{await navigator.clipboard.writeText(t);m.textContent=okMsg}catch(e){box.focus();box.select();m.textContent="กดค้างที่กล่อง แล้วเลือก \"เลือกทั้งหมด\" ก่อนคัดลอก"} }
async function renderSend(all){
  const u=unsent(); const code=await exportCode(all); const parts=code?splitCode(code):[];
  const ta=(id,v)=>`<textarea id="${id}" readonly rows="3" style="font-family:var(--mono);font-size:.75rem;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)">${v}</textarea>`;
  $v.innerHTML=`<section class="card"><h2>ส่งผลให้พ่อ</h2>
    ${code?`<p>มีผลฝึก <b>${all?lsRead().length:u.a.length}</b> ครั้ง และข้อความถึง Claude <b>${all?lsFb().length:u.f.length}</b> ข้อความ ที่ยังไม่ได้ส่ง</p>
    <ol style="margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px">
      <li>กด <b>ส่งเป็นไฟล์</b> แล้วเลือก <b>LINE</b> → เลือกพ่อ</li><li>กลับมากด <b>ส่งเรียบร้อยแล้ว</b></li></ol>
    <div class="row"><button class="btn" id="sendfile">ส่งเป็นไฟล์</button><span class="small" id="fmsg" aria-live="polite"></span></div>
    <div class="row"><button class="btn ghost" id="sent">ส่งเรียบร้อยแล้ว</button></div>
    <details><summary class="small muted" style="cursor:pointer">ส่งไฟล์ไม่ได้? ใช้วิธีคัดลอกรหัสแทน</summary><div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
    ${parts.length>1?`<p>รหัสยาว LINE ส่งทีเดียวไม่หมด เลยแบ่งเป็น <b>${parts.length} ส่วน</b> คัดลอกแล้ววางส่งใน LINE <b>ทีละส่วน ส่วนละ 1 ข้อความ</b> จนครบ แล้วกลับมากด <b>ส่งเรียบร้อยแล้ว</b></p>`
      :`<ol style="margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px">
      <li>กด <b>คัดลอกรหัส</b></li><li>เปิด LINE แล้ววางส่งให้พ่อ</li></ol>`}
    ${parts.map((p,i)=>`<div style="display:flex;flex-direction:column;gap:6px">${parts.length>1?`<b class="small">ส่วนที่ ${i+1} จาก ${parts.length}</b>`:`<p class="small muted">รหัสยาว ${code.length.toLocaleString()} ตัวอักษร</p>`}

async function importCode(raw, asTest){

    raw.split("SKP:").slice(1).forEach(seg=>{const m=seg.match(/^([a-z0-9]+):(\d+)\/(\d+):(.*)$/); if(!m) return;
      if(id&&m[1]!==id) return; id=m[1]; n=+m[3]; got[+m[2]]=m[4]});
    const miss=[]; for(let i=1;i<=n;i++) if(!(i in got)) miss.push(i);
    if(!n) throw new Error("bad");
    if(miss.length){ const er=new Error("parts"); er.miss=miss; er.n=n; throw er }

  for(const a of (data.a||[])){ what.push(`${a.topic||a.type||"ผลฝึก"} (${new Date(a.endedAt).toLocaleString("th-TH",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})})`); const id=("s-"+(a.setId||a.type)+"-"+a.endedAt).replace(/[^A-Za-z0-9_-]/g,""); const {example,...rest}=fatten(a); await db.collection("attempts").doc(id).set({...rest,via:"code",test:!!(a.test||asTest)}); n++ }

/* ---------- what to do today ---------- */
function lastDone(list){ const last={}; list.filter(isLesson).forEach(a=>{if(a.setId) last[a.setId]=Math.max(last[a.setId]||0,dayKey(a.endedAt))}); return last }
function pickLesson(list, preferCurrent, exclude){
  const last=lastDone(list), t=todayKey(), ex=exclude||[];
  /* calendar.lessonQueue: the school's order for the next lessons; the first one not done yet comes first */
  if(preferCurrent&&Array.isArray(CAL.lessonQueue)){ const q=CAL.lessonQueue.map(id=>SETS.find(s=>s.id===id)).find(s=>s&&s.kind==="lesson"&&!last[s.id]&&!ex.includes(s.id)); if(q) return q }
  const lessons=SETS.filter(s=>s.kind==="lesson"&&!ex.includes(s.id)); if(!lessons.length) return null;
  const pool=lessons.filter(s=>last[s.id]!==t), use=pool.length?pool:lessons;
  return use.slice().sort((a,b)=>(preferCurrent?(b.current?1:0)-(a.current?1:0):0)||(last[a.id]||0)-(last[b.id]||0))[0];
}
function pickProbe(list){ const done=new Set(list.filter(a=>a.type==="probe").map(a=>a.setId)); return SETS.find(s=>s.kind==="probe"&&!done.has(s.id))||null }
/* mixed exam-style sets (interleaving): one per week on a holiday, in the probe slot */
function pickMixed(list){
  const done=new Set(list.filter(a=>a.type==="mixed").map(a=>a.setId));
  const wk=weekStart(todayKey()), thisWeek=list.filter(a=>a.type==="mixed"&&dayKey(a.endedAt)>=wk&&dayKey(a.endedAt)<todayKey()).length;
  const doneToday=list.some(a=>a.type==="mixed"&&dayKey(a.endedAt)===todayKey());
  if(thisWeek>=(CAL.mixedPerWeek||1)&&!doneToday) return null;
  return SETS.find(s=>s.kind==="mixed"&&!done.has(s.id))||(doneToday?SETS.find(s=>s.kind==="mixed"&&list.some(a=>a.setId===s.id&&dayKey(a.endedAt)===todayKey())):null)||null;

function pickPassage(list){
  const done=new Set(list.filter(a=>a.type==="passage").map(a=>a.setId)), wk=weekStart(todayKey()), t=todayKey();
  const doneToday=list.find(a=>a.type==="passage"&&dayKey(a.endedAt)===t);

  return SETS.find(s=>s.kind==="passage"&&!done.has(s.id))||null;

/* questions to look at again: wrong answers, and (trial) right answers she was not sure about */
function reviewPool(list){
  const wrong=new Map();
  list.filter(isLesson).slice().sort((a,b)=>new Date(a.endedAt)-new Date(b.endedAt)).forEach(a=>(a.items||[]).forEach(x=>{
    if(x.skipped||!QBANK[x.qid]) return; const id=QBANK[x.qid].q.of||x.qid;

function startSet(set, conceptFirst, perms, dueIds){

  const due = set.kind==="lesson" ? (dueIds ? dueIds.map(id=>{const q=QBANK[id.replace(/^r:/,"")]?.q; return q&&{...recallize(q),...(id.startsWith("r:")?{_retry:true}:{})}}).filter(Boolean)

        const last={}; l.filter(isLesson).forEach(a=>(a.items||[]).forEach(x=>{last[x.qid]=Math.max(last[x.qid]||0,dayKey(a.endedAt))}));
        const m=reviewPool(l).find(q=>!d.some(x=>x.id===q.id)&&q.spell!==set.spell&&t-(last[q.id]||0)>=2*DAY);

/* old-topic sweep ("ย้อนคาถาเก่า"): a few questions a day from ม.1–2 topics, mixed, one per spell, the spell checked

function sweepQuestions(list,n){
  const bank=SETS.filter(s=>s.kind==="sweep").flatMap(s=>s.practice); if(!bank.length) return [];
  const cur=new Set(CAL.currentSpells||[]), seen=new Map(), lastSpell=new Map(), t=todayKey();
  list.filter(a=>a.type==="sweep").forEach(a=>(a.items||[]).forEach(x=>{ const d=dayKey(a.endedAt); seen.set(x.qid,Math.max(seen.get(x.qid)||0,d)); const sp=QBANK[x.qid]?.q.spell; if(sp) lastSpell.set(sp,Math.max(lastSpell.get(sp)||0,d)) }));
  const fresh=bank.filter(q=>!cur.has(q.spell)&&!seen.has(q.id));
  const bySpell=new Map(); fresh.forEach(q=>{ if(!bySpell.has(q.spell)) bySpell.set(q.spell,[]); bySpell.get(q.spell).push(q) });
  const order=[...bySpell.keys()].sort((a,b)=>(lastSpell.get(a)||0)-(lastSpell.get(b)||0)||(hashStr(a+t)%97)-(hashStr(b+t)%97));

let skipPick=null, skipMode="one", leaveDaysN=3;
const LEAVE_REASONS=["ไปค่าย","ทัศนศึกษา","ไปต่างจังหวัด/ต่างประเทศ","สอบ/งานโรงเรียนช่วงยาว","ไม่สบายหลายวัน","อื่นๆ"];
function renderSkip(){
  const p=progressOf(mine());
  const reasons=skipMode==="one"?SKIP_REASONS:LEAVE_REASONS;
  const until=new Date(); until.setDate(until.getDate()+leaveDaysN-1);
  $v.innerHTML=`<section class="card"><h2>ขอพัก</h2>
    <div class="why" role="tablist"><button data-mode="one" aria-pressed="${skipMode==="one"}">วันนี้วันเดียว</button><button data-mode="leave" aria-pressed="${skipMode==="leave"}">ไม่อยู่หลายวัน (ค่าย ทัศนศึกษา)</button></div>
    ${skipMode==="one"?`<p class="small">${p.streak?(p.freeze?`มีน้ำแข็ง 🧊 ${p.freeze} ก้อน พรุ่งนี้จะใช้ 1 ก้อนกันไฟ ${p.streak} วันไม่ให้ดับ`:`ตอนนี้ไม่มีน้ำแข็ง ไฟ ${p.streak} วันจะดับ แต่ไม่เป็นไร เริ่มใหม่ได้เสมอ`):"ไม่เป็นไร พรุ่งนี้เริ่มจุดไฟใหม่กัน"}</p>`
    :`<p class="small">ช่วงที่ลาไว้ ไฟ ${p.streak} วันจะ<b>หยุดรอ</b> ไม่ดับและไม่ใช้น้ำแข็ง กลับมาแล้วทำต่อได้เลย ลาได้ครั้งละไม่เกิน 14 วัน พ่อจะเห็นในหน้าผู้ปกครอง</p>
      <label class="small" for="ldays">กี่วัน (นับวันนี้ด้วย)</label>
      <div class="row"><button class="btn ghost" id="lminus" ${leaveDaysN<=2?"disabled":""}>−</button><b id="ldays" style="font-family:var(--mono);font-size:1.3rem">${leaveDaysN}</b><button class="btn ghost" id="lplus" ${leaveDaysN>=14?"disabled":""}>+</button>
      <span class="small muted">ถึง ${until.toLocaleDateString("th-TH",{weekday:"short",day:"numeric",month:"short"})}</span></div>`}
    <p class="small muted">เพราะอะไร</p>
    <div class="why">${reasons.map(x=>`<button data-sr="${x}" aria-pressed="${skipPick===x}">${x}</button>`).join("")}</div>
    <label class="small muted" for="skipnote">อยากเล่าเพิ่มไหม (ไม่บังคับ)</label>
    <input id="skipnote" style="font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)" placeholder="${skipMode==="one"?"เช่น มีงานกลุ่มส่งพรุ่งนี้":"เช่น ค่ายลูกเสือที่กาญจนบุรี ห้ามใช้มือถือ"}">
    <div class="row"><button class="btn" id="skipsave" ${skipPick?"":"disabled"}>บันทึก</button><button class="btn ghost" id="skipback">กลับ</button></div></section>`;
  const keep=f=>()=>{const n=document.getElementById("skipnote").value; f(); renderSkip(); document.getElementById("skipnote").value=n};
  $v.querySelectorAll("[data-mode]").forEach(b=>b.onclick=keep(()=>{skipMode=b.dataset.mode;skipPick=null}));
  $v.querySelectorAll("[data-sr]").forEach(b=>b.onclick=keep(()=>{skipPick=b.dataset.sr}));
  const lm=document.getElementById("lminus"); if(lm) lm.onclick=keep(()=>{leaveDaysN=Math.max(2,leaveDaysN-1)});
  const lp=document.getElementById("lplus"); if(lp) lp.onclick=keep(()=>{leaveDaysN=Math.min(14,leaveDaysN+1)});
  document.getElementById("skipback").onclick=()=>{view="home";render()};
  document.getElementById("skipsave").onclick=async e=>{e.target.disabled=true;
    const now=new Date().toISOString(), from=todayKey(); let to=from; for(let i=1;i<leaveDaysN;i++) to=nextDay(to);
    const base={type:"skip",reason:skipPick,memo:document.getElementById("skipnote").value.trim(),startedAt:now,endedAt:now,durationSec:0,correct:0,total:0,xp:0,items:[]};
    await saveAttempt(skipMode==="one"?{...base,setId:"skip",topic:"ขอพัก"}:{...base,setId:"leave",topic:"ลาหลายวัน",leave:true,days:leaveDaysN,from,to});
    skipPick=null; skipMode="one"; view="home"; render();};
}

const RD={where:null,chunks:[],k:0,rate:1,timer:null};

const SUP={"⁰":"0","¹":"1","²":"2","³":"3","⁴":"4","⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9","⁻":"ลบ "};
const UNIT_SAY={km:"กิโลเมตร",cm:"เซนติเมตร",mm:"มิลลิเมตร",m:"เมตร",kg:"กิโลกรัม",mg:"มิลลิกรัม",g:"กรัม",mL:"มิลลิลิตร",ml:"มิลลิลิตร",L:"ลิตร",N:"นิวตัน",Pa:"ปาสคาล",kPa:"กิโลปาสคาล",W:"วัตต์",kW:"กิโลวัตต์",kWh:"กิโลวัตต์ชั่วโมง",J:"จูล",s:"วินาที",h:"ชั่วโมง",V:"โวลต์",A:"แอมแปร์","µm":"ไมโครเมตร"};
function sayable(t){
  return String(t).replace(/PM ?2\.5/g,"พีเอ็มสองจุดห้า").replace(/ม\.(\d)/g,"มอ $1").replace(/ป\.(\d)/g,"ปอ $1")
    .replace(/([\d⁰¹²³⁴⁵⁶⁷⁸⁹]) ?(kWh|kPa|km|cm|mm|kg|mg|mL|ml|kW|µm|Pa|m|g|L|N|W|J|V|A|s|h)(?![A-Za-z²³\/])/g,(m,d,u)=>d+" "+UNIT_SAY[u]+" ")
    .replace(/(\d+)\/(\d+)/g,"$1 ส่วน $2")
    .replace(/µg\/m³/g," ไมโครกรัมต่อลูกบาศก์เมตร ").replace(/g\/cm³/g," กรัมต่อลูกบาศก์เซนติเมตร ").replace(/cm³/g," ลูกบาศก์เซนติเมตร ").replace(/m³/g," ลูกบาศก์เมตร ")
    .replace(/m²/g," ตารางเมตร ").replace(/cm²/g," ตารางเซนติเมตร ").replace(/°C/g," องศาเซลเซียส ").replace(/% ?w\/v/g," เปอร์เซ็นต์โดยมวลต่อปริมาตร ")
    .replace(/(\d)²/g,"$1 กำลังสอง ").replace(/(\d)³/g,"$1 กำลังสาม ").replace(/([⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g,m=>" ยกกำลัง "+[...m].map(c=>SUP[c]).join("")+" ")
    .replace(/√/g," รากที่สองของ ").replace(/×/g," คูณ ").replace(/÷/g," หาร ").replace(/=/g," เท่ากับ ").replace(/[−–](?=\s*\d)/g," ลบ ")
    .replace(/%/g," เปอร์เซ็นต์ ").replace(/(\d) : (\d)/g,"$1 ต่อ $2").replace(/[→]/g," ได้ ").replace(/·/g,", ").replace(/\s+/g," ").trim();
}
function chunkText(t){
  const parts=String(t).replace(/\s+/g," ").trim().split(/(?<=[ .?!;])(?=\S)/), out=[];
  for(const p of parts){ if(out.length&&(out[out.length-1].length<22||p.trim().length<6)) out[out.length-1]+=p; else out.push(p) }
  return out.filter(x=>x.trim());
}
function readStop(){ try{ speechSynthesis.cancel() }catch(e){} RD.where=null; document.querySelectorAll(".rdbox").forEach(b=>b.remove()); document.querySelectorAll("[data-read]").forEach(b=>b.textContent=b.dataset.label) }
function readAloud(where, texts, after){

  const box=document.createElement("div"); box.className="rdbox"; box.setAttribute("aria-live","off");
  let n=0; box.innerHTML=`${groups.map(g=>`<div>${g.map(c=>`<span data-ck="${n++}">${esc(c)}</span>`).join("")}</div>`).join("")}
    <div class="row" style="margin-top:8px;gap:8px"><span class="small">ความเร็ว</span><span class="why">${RD_RATES.map(([l,v])=>`<button type="button" data-rate="${v}" aria-pressed="${RD.rate===v}">${l}</button>`).join("")}</span></div>
    <div class="row" style="gap:8px">${thVoiceSelect()}</div><span class="small muted">ให้ตาวิ่งตามตัวที่ไฮไลต์ไปด้วยนะ</span>`;
  (btn.closest(".row")||btn).insertAdjacentElement("afterend",box); btn.textContent="⏹ หยุดอ่าน"; RD.box=box;
  /* changing speed or voice restarts the current phrase right away, so she hears the difference */
  const restart=()=>{ RD.gen=(RD.gen||0)+1; try{ speechSynthesis.cancel() }catch(err){} setTimeout(()=>{ if(RD.where===where) next() },60) };
  box.addEventListener("click",e=>{ const b=e.target.closest("[data-rate]"); if(!b) return; RD.rate=parseFloat(b.dataset.rate);
    try{localStorage.setItem("fieldnote.thrate",String(RD.rate))}catch(err){} box.querySelectorAll("[data-rate]").forEach(x=>x.setAttribute("aria-pressed",x===b)); restart() });
  box.addEventListener("change",e=>{ if(e.target.id!=="rdvsel") return; try{localStorage.setItem("fieldnote.thvoice",e.target.value)}catch(err){} restart() });
  if(after) after();
  let started=false;
  const next=()=>{ if(RD.where!==where) return;
    box.querySelectorAll("[data-ck]").forEach(x=>x.classList.toggle("now",+x.dataset.ck===RD.k));
    const btn=document.querySelector(`[data-read="${where}"]`)||{dataset:{}};
    if(RD.k>=RD.chunks.length){ RD.where=null; btn.textContent=btn.dataset.label; box.querySelectorAll(".now").forEach(x=>x.classList.remove("now")); return }
    const v=thVoice(), k=RD.k, gen=RD.gen||0, u=new SpeechSynthesisUtterance(sayable(RD.chunks[k])); u.lang="th-TH"; if(v){ u.voice=v; u.lang=v.lang } u.rate=RD.rate;
    u.onstart=()=>{started=true}; u.onend=()=>{ if(RD.k===k&&RD.where===where&&(RD.gen||0)===gen){ RD.k++; next() } }; u.onerror=e=>{ if(e.error!=="interrupted"&&e.error!=="canceled"){ RD.where=null; btn.textContent=btn.dataset.label; alertRead(where,"เสียงภาษาไทยยังไม่พร้อม บน iPad ไปที่ การตั้งค่า › การช่วยการเข้าถึง › เนื้อหาที่ถูกพูด › เสียง › ไทย แล้วดาวน์โหลดเสียง") } };
    try{ speechSynthesis.speak(u) }catch(e){} };
  next();
  setTimeout(()=>{ if(!started&&RD.where===where&&!speechSynthesis.speaking) alertRead(where,"ยังไม่ได้ยินเสียง? บน iPad ไปที่ การตั้งค่า › การช่วยการเข้าถึง › เนื้อหาที่ถูกพูด › เสียง › ไทย แล้วดาวน์โหลดเสียง ถ้าเปิดจาก LINE ให้เปิดใน Safari แทน") },3000);
}

/* ---------- figures inside questions (q.fig): dot plot, stem-and-leaf (one or two sided), histogram/bar chart, table ---------- */
function figHtml(f){
  if(!f) return "";
  try{
  if(f.kind==="dot"){ const step=f.step||1, n=Math.round((f.max-f.min)/step), W=Math.max(260,n*26+40), maxc=Math.max(1,...Object.values(f.counts||{})), H=maxc*13+46, x=v=>20+(v-f.min)/step*((W-40)/n);
    const tick=f.tick||(n>14?2:1); let g="";
    for(let i=0;i<=n;i++){ const v=+(f.min+i*step).toFixed(4); g+=`<line x1="${x(v)}" y1="${H-26}" x2="${x(v)}" y2="${H-20}" stroke="currentColor"/>`+(i%tick===0?`<text x="${x(v)}" y="${H-6}" font-size="11" text-anchor="middle" fill="currentColor">${v}</text>`:"") }
    Object.entries(f.counts||{}).forEach(([v,c])=>{ for(let k=0;k<c;k++) g+=`<circle cx="${x(+v)}" cy="${H-33-k*13}" r="4.6" fill="var(--accent)"/>` });
    return `<figure class="qfig"><svg viewBox="0 0 ${W} ${H}" style="max-width:${W}px" role="img" aria-label="แผนภาพจุด"><line x1="10" y1="${H-23}" x2="${W-10}" y2="${H-23}" stroke="currentColor" stroke-width="1.5"/>${g}</svg>${f.label?`<figcaption class="small muted">${esc(f.label)}</figcaption>`:""}</figure>` }
  if(f.kind==="stem"){ const two=f.rows.some(r=>r.length===3);
    return `<figure class="qfig"><table class="stemtab">${f.head?`<tr>${f.head.map((h,i)=>`<th class="${two&&i===0?"l":""}">${esc(h)}</th>`).join("")}</tr>`:""}${f.rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${two?(i===0?"l":i===1?"st":""):(i===0?"st":"")}">${esc(c)}</td>`).join("")}</tr>`).join("")}</table>${f.key?`<figcaption class="small muted">${esc(f.key)}</figcaption>`:""}</figure>` }
  if(f.kind==="hist"||f.kind==="bar"){ const v=f.values, mx=Math.max(...v), W=Math.max(260,v.length*48+50), H=190, bw=(W-50)/v.length, gap=f.kind==="hist"?0:10, y=t=>H-30-(t/mx)*(H-55);
    let g=""; v.forEach((t,i)=>{ g+=`<rect x="${40+i*bw+gap/2}" y="${y(t)}" width="${bw-gap}" height="${H-30-y(t)}" fill="color-mix(in srgb,var(--accent) 55%,transparent)" stroke="currentColor" stroke-width="1"/><text x="${40+i*bw+bw/2}" y="${y(t)-4}" font-size="11" text-anchor="middle" fill="currentColor">${t}</text>` });
    (f.labels||[]).forEach((l,i)=>{ g+=`<text x="${f.kind==="hist"&&f.edges?40+i*bw:40+i*bw+bw/2}" y="${H-14}" font-size="10.5" text-anchor="middle" fill="currentColor">${esc(l)}</text>` });
    return `<figure class="qfig"><svg viewBox="0 0 ${W} ${H}" style="max-width:${W}px" role="img" aria-label="${f.kind==="hist"?"ฮิสโทแกรม":"แผนภูมิแท่ง"}"><line x1="38" y1="${H-30}" x2="${W-6}" y2="${H-30}" stroke="currentColor"/><line x1="38" y1="12" x2="38" y2="${H-30}" stroke="currentColor"/>${g}</svg>${f.xLabel||f.yLabel?`<figcaption class="small muted">${esc([f.yLabel&&("แกนตั้ง: "+f.yLabel),f.xLabel&&("แกนนอน: "+f.xLabel)].filter(Boolean).join(" · "))}</figcaption>`:""}</figure>` }
  if(f.kind==="table") return `<figure class="qfig"><div style="overflow-x:auto"><table class="mt">${f.head?`<thead><tr>${f.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>`:""}<tbody>${f.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${f.caption?`<figcaption class="small muted">${esc(f.caption)}</figcaption>`:""}</figure>`;
  }catch(e){}
  return "";
}

const GLOSS_KEYS=Object.keys(GLOSS).sort((a,b)=>b.length-a.length);
function gloss(raw){
  let t=esc(raw); const marks=[];
  GLOSS_KEYS.forEach(k=>{ const ek=esc(k), i=t.indexOf(ek); if(i<0) return;
    marks.push(k); t=t.slice(0,i)+"\u0001"+(marks.length-1)+"\u0002"+t.slice(i+ek.length) });
  return t.replace(/\u0001(\d+)\u0002/g,(_,n)=>`<button class="term" type="button" data-t="${esc(marks[+n])}">${esc(marks[+n])}</button>`);
}
function bindGloss(){
  $v.querySelectorAll(".term").forEach(b=>b.onclick=()=>{
    const box=document.getElementById("gloss-box"); if(!box) return;
    const k=b.dataset.t; box.hidden=false; box.innerHTML=`<b>${esc(k)}</b> <span class="small">${esc(GLOSS[k]||"")}</span> <button class="btn ghost" id="gloss-x" style="border:0;padding:0 4px">ปิด</button>`;
    document.getElementById("gloss-x").onclick=()=>{box.hidden=true};
    if(S&&!S.glossed.includes(k)) S.glossed.push(k);
  });
}

function askHtml(where){

function askKey(where){ const st=S.steps[S.i]; return where==="concept"?"concept":(st.q?.id||"q") }
function bindAsk(where, extra){
  const d=$v.querySelector("details.ask"); if(d) d.ontoggle=()=>{S.askOpen=d.open?askKey(where):null};
  const b=document.getElementById("ask-send"); if(!b) return;

}

/* ---------- scratch paper for the pencil ---------- */
const PAD={open:false,strokes:[],hist:[],tool:"pen",penSeen:false};
try{ PAD.penSeen=localStorage.getItem("fieldnote.pen")==="1" }catch(e){}
function padHtml(){
  return `<button class="padfab" id="pad-toggle" type="button">${PAD.open?"✕ ปิดกระดาษทด":"✏️ กระดาษทด"}</button>
  <div class="pad" id="pad" ${PAD.open?"":"hidden"}>
    <div class="padbar"><button type="button" data-tool="pen" aria-pressed="${PAD.tool==="pen"}">✏️ ปากกา</button><button type="button" data-tool="eraser" aria-pressed="${PAD.tool==="eraser"}">🧽 ยางลบ (ลบทีละเส้น)</button>
      <button type="button" id="pad-undo">↶ ย้อน</button><button type="button" id="pad-clear">🗑 ล้าง</button></div>
    <canvas id="pad-canvas"></canvas></div>`;
}
function padSetup(){
  const tg=document.getElementById("pad-toggle"); if(!tg) return;
  tg.onclick=()=>{PAD.open=!PAD.open; document.body.classList.toggle("padopen",PAD.open); const p=document.getElementById("pad"); p.hidden=!PAD.open; tg.textContent=PAD.open?"✕ ปิดกระดาษทด":"✏️ กระดาษทด"; if(PAD.open) padDraw(true)};
  document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{PAD.tool=b.dataset.tool;document.querySelectorAll("[data-tool]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.tool===PAD.tool))});
  /* undo history: "add" a stroke, or "erase" whole strokes (so undo brings erased lines back) */
  document.getElementById("pad-undo").onclick=()=>{ const h=PAD.hist.pop(); if(!h) return;
    if(h.type==="add") PAD.strokes=PAD.strokes.filter(x=>x!==h.stroke); else if(h.type==="erase") PAD.strokes.push(...h.strokes); else if(h.type==="clear") PAD.strokes=h.strokes; padDraw() };
  document.getElementById("pad-clear").onclick=()=>{ if(PAD.strokes.length) PAD.hist.push({type:"clear",strokes:PAD.strokes}); PAD.strokes=[]; padDraw() };
  const cv=document.getElementById("pad-canvas"); let cur=null, activeId=null, erased=null;
  const pt=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top,e.pressure||0.5]};
  /* stroke eraser: any stroke passing within 14 px of the eraser is removed whole */
  const near=(s,x,y)=>s.pts.some((p,i)=>{ const q=s.pts[i-1]||p, dx=p[0]-q[0], dy=p[1]-q[1], L=dx*dx+dy*dy, t=L?Math.max(0,Math.min(1,((x-q[0])*dx+(y-q[1])*dy)/L)):0;
    const cx=q[0]+t*dx-x, cy=q[1]+t*dy-y; return cx*cx+cy*cy<196 });
  const eraseAt=([x,y])=>{ const hit=PAD.strokes.filter(s=>near(s,x,y)); if(hit.length){ PAD.strokes=PAD.strokes.filter(s=>!hit.includes(s)); erased.push(...hit); padDraw() } };
  /* palm rejection: once a pencil has been used on this device, finger/palm touches never draw; a pencil always wins */
  cv.onpointerdown=e=>{
    if(e.pointerType==="pen"){ if(!PAD.penSeen){ PAD.penSeen=true; try{localStorage.setItem("fieldnote.pen","1")}catch(err){} }
      if(cur&&cur.touch){ PAD.strokes=PAD.strokes.filter(x=>x!==cur); PAD.hist=PAD.hist.filter(h=>h.stroke!==cur); cur=null } }
    else if(PAD.penSeen&&e.pointerType==="touch") return;
    if(activeId!==null&&e.pointerType!=="pen") return;
    activeId=e.pointerId; try{cv.setPointerCapture(e.pointerId)}catch(err){} e.preventDefault();
    if(PAD.tool==="eraser"){ erased=[]; eraseAt(pt(e)); return }
    cur={tool:"pen",pts:[pt(e)],touch:e.pointerType==="touch"}; PAD.strokes.push(cur); PAD.hist.push({type:"add",stroke:cur}) };
  cv.onpointermove=e=>{ if(e.pointerId!==activeId) return; let evs=e.getCoalescedEvents?e.getCoalescedEvents():[]; if(!evs.length) evs=[e];
    if(erased){ evs.forEach(ev=>eraseAt(pt(ev))); return }
    if(cur){ evs.forEach(ev=>cur.pts.push(pt(ev))); padDraw() } };
  cv.onpointerup=cv.onpointercancel=e=>{ if(e.pointerId!==activeId) return; if(erased&&erased.length) PAD.hist.push({type:"erase",strokes:erased}); erased=null; cur=null; activeId=null };
  /* stop iPad's long-press magnifier / selection and page gestures on the pad */
  ["touchstart","touchmove"].forEach(t=>cv.addEventListener(t,ev=>ev.preventDefault(),{passive:false}));
  if(PAD.open){ document.body.classList.add("padopen"); padDraw(true) }
}
function padDraw(resize){
  const cv=document.getElementById("pad-canvas"); if(!cv||cv.offsetParent===null) return;
  const dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight;
  if(resize||cv.width!==Math.round(w*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr) }
  const g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  const ink=getComputedStyle(document.documentElement).getPropertyValue("--ink").trim()||"#16302B";
  PAD.strokes.forEach(s=>{ g.globalCompositeOperation=s.tool==="eraser"?"destination-out":"source-over"; g.strokeStyle=ink; g.lineCap="round"; g.lineJoin="round";
    if(s.pts.length===1){ const [x,y,p]=s.pts[0]; g.fillStyle=ink; g.beginPath(); g.arc(x,y,0.8+p*1.3,0,7); g.fill() }
    for(let i=1;i<s.pts.length;i++){ const [x0,y0]=s.pts[i-1],[x1,y1,p]=s.pts[i]; g.lineWidth=s.tool==="eraser"?22:1.2+p*2.6; g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke() } });
  g.globalCompositeOperation="source-over";
}
window.addEventListener("resize",()=>padDraw(true));

/* ---------- one question ---------- */
function renderStep(){
  const st = S.steps[S.i];
  if(st.kind==="concept") return renderConcept();
  if(st.kind==="passage") return renderPassage();
  if(st.kind==="rate") return renderRate();
  if(st.kind==="finish") return finishReview();
  const q = st.q, ans = S.answered;
  const canQ=!q.en&&S.set.kind!=="mixed"&&CAL.listenQuestions!==false, waitMs=Math.max(0,(CAL.listenDelaySec??20)*1000-(Date.now()-S.qStart));
  /* trials: confidence buttons and/or a reason before the answer is shown, so choosing and sending are two taps */
  const tConf=(S.trial||[]).includes("confidence"), tWhy=!!st.explain, staged=tConf||tWhy;
  const sendBtns=tConf?`<button class="btn" id="send-sure">✓ มั่นใจ ส่งคำตอบ</button><button class="btn ghost" id="send-unsure">🤔 ไม่ชัวร์ ส่งคำตอบ</button>`:`<button class="btn" id="send-plain">ส่งคำตอบ</button>`;
  const panel = !ans&&staged&&(q.num||S.pick!=null)?`<div class="feedback trialbox">
      ${tWhy?`<label class="small" for="whytext"><b>ก่อนดูเฉลย:</b> ทำไมถึงตอบแบบนี้ เขียนสั้นๆ 1–2 บรรทัด (หรือเขียนในกระดาษทดก็ได้)</label>
      <textarea id="whytext" rows="2" maxlength="300" style="font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)" placeholder="เช่น เพราะต้องเรียงข้อมูลก่อน ตัวตรงกลางคือ 7">${esc(S.whyText||"")}</textarea>`:""}
      ${tConf?`<span class="small muted">ตอบแล้วมั่นใจแค่ไหน ข้อที่ถูกแต่ไม่ชัวร์ ระบบจะเอามาให้ทวนอีกรอบ</span>`:""}
      <div class="row">${sendBtns}</div></div>`:"";
  let body;
  if(q.cover&&!ans&&!S.uncovered){
    body=`<div class="feedback trialbox"><b>🧠 ข้อนี้เคยเจอแล้ว</b><span class="small">ลองคิดคำตอบในใจหรือในกระดาษทดก่อน ว่าต้องใช้วิธีไหน ได้คำตอบอะไร แล้วค่อยกดดูตัวเลือก</span>
      <button class="btn" id="uncover" type="button">คิดแล้ว ขอดูตัวเลือก</button></div>`;
  } else if(q.num){
    const coarse=matchMedia("(pointer: coarse)").matches;
    body = `<div class="num"><input id="numin" inputmode="${coarse?"none":"decimal"}" aria-label="คำตอบ" ${ans?"disabled":""} value="${ans&&!ans.dontknow?esc(ans.raw):esc(S.numDraft||"")}"><span class="muted" style="align-self:center">${q.unit}</span>
      ${ans||staged?"":`<button class="btn" id="check">ตรวจคำตอบ</button>`}</div>
      ${ans?"":`<div class="numpad" role="group" aria-label="แป้นตัวเลข">${["7","8","9","4","5","6","1","2","3","−","0",".","⌫"].map(k=>`<button type="button" data-np="${k}" ${k==="⌫"?'aria-label="ลบ"':""}>${k}</button>`).join("")}</div>`}${panel}`;
  } else {
    body = `<div class="opts">${q.opts.map((o,k)=>{
      let c=""; if(ans){ if(k===q.a) c="right"; else if(k===ans.choice) c="wrong"; } else if(staged&&S.pick===k) c="picked";
      const struck=!ans&&S.struck.includes(k);
      return `<div class="optrow"><button class="opt ${c} ${struck?"struck":""}" data-k="${k}" ${ans?"disabled":""}>${esc(o)}</button>
        ${ans?"":`<button class="xopt" type="button" data-x="${k}" aria-pressed="${struck}" aria-label="${struck?"เอาคืน":"ตัดตัวเลือกนี้"}" title="${struck?"เอาคืน":"ตัดตัวเลือกนี้"}">${struck?"↺":"✕"}</button>`}</div>`}).join("")}</div>
      ${ans?"":`<p class="small muted">${staged?"แตะตัวเลือกเพื่อเลือก แล้วกดส่งคำตอบ · ":""}กด ✕ ท้ายข้อเพื่อตัดตัวเลือกที่ไม่ใช่แน่ๆ</p>`}${panel}`;
  }
  let fb = "";
  /* reason check: right answer on a question that has q.check → ask how she got it before showing the explanation */
  const ck=ans&&ans.correct&&q.check&&!S.checkDone?q.check:null;
  if(ck&&S.checkPick==null){
    S.checkOrder=S.checkOrder||ck.opts.map((_,i)=>i).sort(()=>Math.random()-.5);
    fb=`<div class="feedback"><b class="ok">✅ ถูกแล้ว!</b><p><b>ก่อนดูเฉลย ขอเช็กเหตุผลนิดนึง:</b> ${esc(ck.q||"เธอได้คำตอบนี้มาด้วยวิธีคิดแบบไหน")}</p>
      <div class="opts">${S.checkOrder.map(k=>`<button class="opt ckopt" data-ck="${k}">${esc(ck.opts[k])}</button>`).join("")}</div>
      <span class="small muted">เลือกเหตุผลที่ใกล้กับที่เธอคิดจริงที่สุด เหตุผลถูกได้ +5 XP</span></div>`;
  } else if(ans){
    const ckNote = q.check&&S.checkPick!=null?(S.checkPick===q.check.a?`<p class="small"><b>เหตุผลถูกด้วย +5 XP</b> เข้าใจจริง ไม่ได้ฟลุก</p>`
      :`<p class="small"><b>คำตอบถูก แต่เหตุผลยังไม่ใช่</b> เหตุผลที่ถูกคือ “${esc(q.check.opts[q.check.a])}” ${esc(q.check.ex||"")} ข้อนี้จะกลับมาให้ทวนอีกรอบนะ</p>`):"";
    const head = ans.dontknow?"ไม่เป็นไร มาดูวิธีคิดกัน (0 XP)":ans.correct?YAY[S.i%YAY.length]:OOPS[S.i%OOPS.length];
    const confNote = ans.dontknow||!ans.conf?"":ans.correct&&ans.conf==="unsure"?`<p class="small">ถูกแล้ว แต่ยังไม่ชัวร์ ระบบจะเอาข้อนี้มาให้ทวนอีกรอบ จะได้มั่นใจขึ้น</p>`
      :!ans.correct&&ans.conf==="sure"?`<p class="small"><b>มั่นใจแต่พลาด</b> ข้อแบบนี้ถ้าเข้าใจตอนนี้ จะจำได้แม่นที่สุด อ่านเฉลยช้าๆ นะ</p>`:"";
    const own = st.explain&&(ans.ownWhy||ans.ownWhyPad)?`<div class="feedback"><span class="small"><b>เหตุผลของเธอ:</b> ${ans.ownWhy?esc(ans.ownWhy):"(เขียนในกระดาษทด)"}</span><span class="small muted">ลองเทียบกับเฉลยด้านล่าง ตรงกันไหม ต่างกันตรงไหน</span></div>`:"";
    fb = `${own}<div class="feedback"><b class="${ans.correct?"ok":"no"}">${head}${q.num&&!ans.correct?` · คำตอบคือ ${q.answer} ${q.unit}`:""}</b>${ckNote}${confNote}<p>${gloss(q.ex)}</p>
      ${q.en?"":`<div>${readBtn("ex","🔊 ฟังเฉลย")}</div>`}
      ${ans.correct||ans.dontknow?"":`<span class="small muted">พลาดเพราะอะไร เลือกได้หลายข้อ (ช่วยให้ระบบเลือกข้อทบทวนได้ตรงขึ้น)</span>
      <div class="why">${Object.entries(ERR).filter(([k])=>k!=="dontknow").map(([k,v])=>`<button data-why="${k}" aria-pressed="${(S.why||[]).includes(k)}">${v}</button>`).join("")}</div>`}
      ${askHtml("question")}
    </div>
    <button class="btn" id="next">ต่อไป</button>`;
  }
  $v.innerHTML = `<section class="card">${header()}
    <span class="row" style="gap:6px"><span class="chip l${q.level}">${LV[q.level]}${S.set.kind==="mixed"&&!ans?"":" · "+esc(q.topic)}</span>${q.en?`<span class="chip">English corner</span>`:""}</span>
    ${st.passage?passageDetails():""}
    <p class="prompt">${gloss(q.q)}</p>
    ${figHtml(q.fig)}

/* concept card, one idea per screen: (1) why this topic exists — a puzzle to guess first (c.hook) or the "use" line,
   (2) each point alone with "เข้าใจแล้ว" / "ขออธิบายอีกแบบ" (c.more[i], else the next whole alternative),
   (3) a short summary with formulas and vocab. Which points needed another explanation is saved as conceptHelp. */
function conceptStages(c){ return [{t:"why"},...c.points.map((x,i)=>({t:"pt",i})),{t:"sum"}] }
function renderConcept(){
  const c=S.set.concept, st=conceptStages(c); S.cStage=S.cStage||0; const cur=st[Math.min(S.cStage,st.length-1)], n=c.points.length;
  const dots=`<div class="row" style="gap:4px;margin:4px 0">${st.map((x,k)=>`<span style="width:${k===S.cStage?18:8}px;height:8px;border-radius:4px;background:${k<=S.cStage?"var(--accent)":"var(--line)"};display:inline-block;transition:width .2s"></span>`).join("")}</div>`;

    body=h?`<span class="eyebrow">🤔 ลองคิดก่อน</span><p>${gloss(h.text)}</p>${h.q?`<p><b>${gloss(h.q)}</b></p>`:""}
      ${h.opts&&S.hookPick==null?`<div class="opts">${h.opts.map((o,k)=>`<button class="opt" data-hk="${k}">${esc(o)}</button>`).join("")}</div><p class="small muted">เดาได้เลย ไม่มีผิดถูก ไม่นับคะแนน</p>`

    body=`<span class="eyebrow">สรุปทั้งหมด</span><h2>${esc(c.title)}</h2><ul>${c.points.map(p=>`<li>${gloss(p)}</li>`).join("")}</ul>

function goalOf(list){ const m=monthKey(todayKey()); return list.find(a=>a.type==="goal"&&a.month===m)||null }
function goalProgress(list,g){
  const from=dayKey(g.endedAt), within=list.filter(a=>dayKey(a.endedAt)>=from&&monthKey(dayKey(a.endedAt))===g.month);
  if(g.metric==="metDays"){ const p=progressOf(list); return [...p.met].filter(d=>d>=from&&monthKey(d)===g.month).length }
  if(g.metric==="unlock"){ return Object.values(spellStats(list)).filter(v=>v.tier>=1).length-(g.base||0) }
  if(g.metric==="tierup"){ const a=spellStats(list), b=spellStats(list.filter(x=>dayKey(x.endedAt)<from)); return Object.entries(a).reduce((s,[k,v])=>s+Math.max(0,v.tier-(b[k]?.tier||0)),0) }
  if(g.metric==="longSolo"){ return within.filter(isLesson).flatMap(a=>a.items||[]).filter(x=>x.correct&&!x.listen&&(x.len||QBANK[x.qid]?.q.q.length||0)>180).length }
  return list.some(a=>a.type==="goaldone"&&a.setId===g.setId)?g.target:0;
}

  $v.querySelectorAll("[data-gr]").forEach(b=>b.onclick=()=>{keep();gDraft.reward=b.dataset.gr;renderHome()});
  const c=document.getElementById("gcustom"); if(c) c.oninput=()=>{gDraft.custom=c.value; document.getElementById("gsave").disabled=!c.value.trim()};
  const r=document.getElementById("greward"); if(r) r.oninput=()=>{gDraft.reward=r.value};
  const s=document.getElementById("gsave"); if(s) s.onclick=async()=>{ keep(); s.disabled=true; const o=goalOptions(list).find(x=>x.key===gDraft.key), now=new Date().toISOString(), id="goal-"+monthKey(todayKey())+"-"+Date.now().toString(36);

      base:Object.values(spellStats(list)).filter(v=>v.tier>=1).length,reward:gDraft.reward.trim(),startedAt:now,endedAt:now,durationSec:0,correct:0,total:0,xp:0,items:[]});

let _ac=null;

function petChirp(kind){ if(!petSoundOn()) return; try{ _ac=_ac||new (window.AudioContext||window.webkitAudioContext)(); const t=_ac.currentTime;
    const base={dragon:330,owl:520,fox:700,cat:640,bunny:880,wolf:440,tiger:300,panda:500,unicorn:780,whale:220,dolphin:900}[kind]||600;
    [0,0.11].forEach((d,i)=>{ const o=_ac.createOscillator(), g=_ac.createGain(); o.type="sine"; o.frequency.setValueAtTime(base*(i?1.25:1),t+d); o.frequency.exponentialRampToValueAtTime(base*(i?1.5:1.18),t+d+0.09);
      g.gain.setValueAtTime(0.0001,t+d); g.gain.exponentialRampToValueAtTime(0.12,t+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.12); o.connect(g).connect(_ac.destination); o.start(t+d); o.stop(t+d+0.14) }) }catch(e){} }

  petChirp(kind);
  const st=bondState(), t=todayKey(), b=st[kind]||{pts:0,d:0,pats:0}; if(b.d!==t){ b.d=t; b.pats=0 } if(b.pats<PAT_DAY){ b.pats++; b.pts++ } st[kind]=b; lsSet("fieldnote.bond",st);
  const bb=document.getElementById("bondbox"); if(bb) bb.innerHTML=bondHtml(kind,petName(kind),mine()) }

function numStats(xs){ const v=xs.map(Number).filter(x=>isFinite(x)).sort((a,b)=>a-b); if(!v.length) return null; const n=v.length;
  return {n,mean:v.reduce((s,x)=>s+x,0)/n,med:n%2?v[(n-1)/2]:(v[n/2-1]+v[n/2])/2,min:v[0],max:v[n-1]} }

  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*";
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return; const url=URL.createObjectURL(f), img=new Image();

const BOX_DAYS=[1,2,4,7,14];

function vocabState(){ try{ return JSON.parse(localStorage.getItem("fieldnote.vocab")||"{}") }catch(e){ return {} } }
function saveVocabState(v){ try{ localStorage.setItem("fieldnote.vocab",JSON.stringify(v)) }catch(e){} }
function isWeekend(){ const d=new Date().getDay(); return d===0||d===3||d===6 }
function vocabToday(){
  const st=vocabState(), t=todayKey();
  return {due:VOCAB.filter(x=>st[x.w]&&st[x.w].due<=t).sort((a,b)=>st[a.w].due-st[b.w].due).slice(0,8), fresh:VOCAB.filter(x=>!st[x.w]).slice(0,5)};
}
/* pronunciation: the browser's own English voice (works on iPad and Android Chrome) */

const CAN_SPEAK = typeof speechSynthesis!=="undefined" && typeof SpeechSynthesisUtterance!=="undefined";

let speechBroken = !CAN_SPEAK;
try{ if(CAN_SPEAK) speechSynthesis.getVoices(); }catch(e){}
function speak(text, slow){
  if(!CAN_SPEAK){ speechBroken=true; showSpeechHelp(); return }
  try{
    if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=slow?0.42:0.9;
    const v=pickVoice(); if(v){ u.voice=v; u.lang=v.lang }
    let started=false; u.onstart=()=>{started=true;speechBroken=false;hideSpeechHelp()}; u.onerror=e=>{ if(e.error!=="interrupted"&&e.error!=="canceled"){speechBroken=true;showSpeechHelp()} };
    speechSynthesis.speak(u);
    setTimeout(()=>{ if(!started&&!speechSynthesis.speaking){ speechBroken=true; showSpeechHelp() } },2500);
  }catch(e){ speechBroken=true; showSpeechHelp() }
}
function enVoices(){ try{ return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)) }catch(e){ return [] } }
function pickVoice(){ const vs=enVoices(); let want=null; try{ want=localStorage.getItem("fieldnote.voice") }catch(e){}
  return vs.find(v=>v.voiceURI===want)||vs.find(v=>/^en(-|_)US/i.test(v.lang)&&v.localService)||vs.find(v=>/^en(-|_)US/i.test(v.lang))||vs[0]||null }

/* replay the vocabulary sessions that are kept, so removed tries do not leave words half-learned */
function rebuildVocabState(list){
  const st={};
  list.filter(a=>a.type==="vocab").sort((a,b)=>new Date(a.endedAt)-new Date(b.endedAt)).forEach(a=>{
    const t=dayKey(a.endedAt), byWord={};
    (a.items||[]).forEach(i=>{ if(i.word) byWord[i.word]=(byWord[i.word]??true)&&i.correct });
    Object.entries(byWord).forEach(([w,ok])=>{ const cur=st[w]?.box||0, box=ok?Math.min(BOX_DAYS.length,cur+1):1; let due=t; for(let k=0;k<BOX_DAYS[box-1];k++) due=nextDay(due); st[w]={box,due} });
  });
  saveVocabState(st);
}
async function finishVocab(){
  V.active=false;
  try{ if(CAN_SPEAK) speechSynthesis.cancel() }catch(e){}
  $v.innerHTML=`<section class="card"><p class="muted">กำลังบันทึก…</p></section>`;
  const st=vocabState(), t=todayKey(), byWord={};
  V.results.forEach(r=>{ byWord[r.w]=(byWord[r.w]??true)&&r.correct });   // a word moves up only if every item on it was right
  Object.entries(byWord).forEach(([w,ok])=>{ const cur=st[w]?.box||0; const box=ok?Math.min(BOX_DAYS.length,cur+1):1;
    let due=t; for(let i=0;i<BOX_DAYS[box-1];i++) due=nextDay(due); st[w]={box,due} });
  saveVocabState(st);
  const c=V.results.filter(r=>r.correct).length, rc=V.rres.filter(Boolean).length;
  const sp=V.results.filter(r=>r.kind==="spell");
  await finishWith({type:"vocab",setId:"vocab",subject:"อังกฤษ",topic:"คำศัพท์วันนี้",startedAt:new Date(V.start).toISOString(),endedAt:new Date().toISOString(),
    durationSec:Math.round((Date.now()-V.start)/1000),correct:c,total:V.results.length,newWords:V.fresh.length,
    spelling:{correct:sp.filter(r=>r.correct).length,total:sp.length},
    reading:V.read?{correct:rc,total:V.rres.length}:null,xp:c*5+(V.results.length-c)*2+rc*5+(V.rres.length-rc)*2,
    items:V.results.map(r=>({qid:"v:"+r.w,word:r.w,kind:r.kind,fresh:r.fresh,correct:r.correct}))});
}

/* ---------- real time and sky: day/night by the clock, the real moon phase, and real sky/calendar events ---------- */
const SYNODIC=29.530588853, NEWMOON0=Date.UTC(2000,0,6,18,14);
function moonAge(t){ return (((t-NEWMOON0)/86400000)%SYNODIC+SYNODIC)%SYNODIC }
function moonInfo(t){ const a=moonAge(t), f=(1-Math.cos(2*Math.PI*a/SYNODIC))/2, wax=a<SYNODIC/2, d=Math.max(1,Math.min(15,Math.round(wax?a:a-SYNODIC/2)));
  return {age:a,lit:Math.round(f*100),wax,name:a<0.8||a>SYNODIC-0.8?"เดือนดับ (จันทร์มืด)":Math.abs(a-SYNODIC/2)<0.8?"วันเพ็ญ (จันทร์เต็มดวง)":`${wax?"ข้างขึ้น":"ข้างแรม"} ${d} ค่ำ`} }
function moonSvg(t,r=14){ const a=moonAge(t), k=Math.cos(2*Math.PI*a/SYNODIC), wax=a<SYNODIC/2, rx=Math.abs(k)*r;
  /* lit part: half disc on the lit side + an ellipse that adds (gibbous) or removes (crescent) light */
  const side=wax?1:0, half=`M0 ${-r} A${r} ${r} 0 0 ${side} 0 ${r}`, term=`A${rx.toFixed(2)} ${r} 0 0 ${(k>0)===wax?1-side:side} 0 ${-r}Z`;
  return `<circle r="${r}" fill="#3a4466" opacity=".45"/><path d="${half} ${term}" fill="#fff6c9"/><circle r="${r}" fill="none" stroke="#fff6c9" stroke-opacity=".35"/>` }
function skyNow(t){ const h=new Date(t).getHours()+new Date(t).getMinutes()/60; return h>=18.5||h<6?"night":h>=17.3?"dusk":h<7?"dawn":"day" }

  ${unclear.length?`<section class="card"><h3>โจทย์ที่ลูกบอกว่ากำกวม</h3>

  ${(()=>{const dm=pool.filter(a=>a.type==="daymode"); return dm.length?`<section class="card"><h3>เปลี่ยนประเภทวันหรือลดระดับ</h3>

  </div></section>

  </section>
  <section class="card"><h3>ให้ Claude วิเคราะห์</h3>
    <p class="small muted">สรุปจุดแข็ง จุดที่ต้องระวัง และคำแนะนำสำหรับพ่อ จากข้อมูลด้านบน</p>
    <button class="btn" id="ask" hidden>วิเคราะห์ตอนนี้</button>

  groupParent();
  const ex=document.getElementById("ex"); if(ex) ex.onchange=()=>{showExamples=ex.checked;renderParent()};
  const dt=document.getElementById("deltest"); if(dt) dt.onclick=async()=>{
    if(dt.dataset.armed!=="1"){dt.dataset.armed="1";dt.textContent="กดอีกครั้งเพื่อยืนยันการลบ";return}
    dt.disabled=true; const m=document.getElementById("delmsg"); m.textContent="กำลังลบ…";
    try{ for(const a of attempts.filter(a=>a.test&&a.id)) await db.collection("attempts").doc(a.id).delete();
         for(const f of fbList.filter(f=>f.test&&f.id)) await db.collection("feedback").doc(f.id).delete();
         m.textContent="ลบแล้ว"; }catch(e){ m.textContent="ลบไม่สำเร็จ ลองใหม่อีกครั้ง"; dt.disabled=false } };
  const ig=document.getElementById("impgo"); if(ig) ig.onclick=async()=>{const msg=document.getElementById("impmsg");ig.disabled=true;msg.textContent="กำลังนำเข้า…";
    try{const {n,k}=await importCode(document.getElementById("imp").value, document.getElementById("imptest").checked);msg.textContent=`นำเข้าแล้ว ${n} ครั้ง และข้อความ ${k} ข้อความ`;}
    catch(e){msg.textContent=e.message==="bad"?"ไม่พบรหัส ต้องมีคำว่า SK2: หรือ FIELDNOTE1: อยู่ในข้อความที่วาง"
      :e.message==="parts"?`ยังขาดส่วนที่ ${e.miss.join(", ")} (จากทั้งหมด ${e.n} ส่วน) คัดลอกทุกส่วนจาก LINE มาวางต่อกันในกล่องเดียว แล้วกดใหม่`
      :e.message==="cut"?`รหัสไม่ครบ (ได้มา ${(e.len||0).toLocaleString()} ตัวอักษร) น่าจะถูกตัดตอนส่งหรือคัดลอก ให้ลูกเปิดเมนู "ส่งให้พ่อ" ดูความยาวรหัสเทียบกัน ถ้า LINE แบ่งเป็นหลายข้อความ ให้คัดลอกทุกข้อความมาวางต่อกัน`
      :`อ่านรหัสได้ แต่บันทึกไม่สำเร็จ (${e.message||e}) ลองกดใหม่อีกครั้ง`}ig.disabled=false;};
  function bindImpClear(){ const c=document.getElementById("impclear"); if(c) c.onclick=()=>{lastImport="";const bx=document.getElementById("impfmsg"); if(bx) bx.innerHTML=""} }
  bindImpClear();
  const imf=document.getElementById("impfile"); if(imf) imf.onchange=async()=>{const box=document.getElementById("impfmsg"); const files=[...imf.files]; if(!files.length) return;
    box.innerHTML=`<p class="small">กำลังนำเข้า ${files.length} ไฟล์…</p>`; let n=0,k=0; const bad=[], what=[];
    for(const f of files){ try{ const r=await importCode(await f.text(), document.getElementById("imptest").checked); n+=r.n; k+=r.k; what.push(...r.what) }catch(e){ bad.push(f.name) } }
    lastImport=(n||k?`<div class="feedback" style="border-left:4px solid var(--ok,#2e7d32)"><b>✅ ได้รับแล้ว ${n} รายการ${k?` และข้อความถึง Claude ${k} ข้อความ`:""}</b>
        <ul class="small" style="margin:6px 0 0;padding-left:1.2em">${what.slice(-12).map(w=>`<li>${esc(w)}</li>`).join("")}</ul>
        <span class="small muted">รายการที่เคยนำเข้าแล้วจะถูกเขียนทับ ไม่นับซ้ำ สรุปด้านบนอัปเดตแล้ว</span></div>`:"")
      +(bad.length?`<p class="small" style="color:var(--warn)">❌ อ่านไม่ได้: ${esc(bad.join(", "))} ไฟล์นี้ไม่ใช่ไฟล์จากแอป หรือไม่ครบ ให้ลูกส่งใหม่</p>`:"")
      +(!n&&!k&&!bad.length?`<p class="small">ไฟล์นี้ไม่มีผลใหม่</p>`:"")
      +`<button class="btn ghost" id="impclear" style="margin-top:6px">ปิดข้อความนี้</button>`;
    const bx=document.getElementById("impfmsg"); if(bx) bx.innerHTML=lastImport; bindImpClear();
    imf.value=""; };
  const mdec=async(id,decision)=>{ const m=document.getElementById("mmsg-"+id), note=($v.querySelector(`[data-mnote="${id}"]`)?.value||"").trim();
    if(decision==="change"&&!note){ m.textContent="พิมพ์สิ่งที่อยากให้ปรับก่อน"; return }
    m.textContent="กำลังบันทึก…"; try{ await db.collection("feedback").add({kind:"mission",missionId:id,decision,note,at:new Date().toISOString()}); m.textContent=decision==="approve"?"อนุมัติแล้ว":"ส่งแล้ว" }catch(e){ m.textContent="บันทึกไม่สำเร็จ ลองใหม่" } };
  $v.querySelectorAll("[data-mok]").forEach(b=>b.onclick=()=>mdec(b.dataset.mok,"approve"));
  const gsdec=async(id,decision)=>{ const m=document.getElementById("gsmsg-"+id), note=($v.querySelector(`[data-gsnote="${id}"]`)?.value||"").trim();
    if(decision==="change"&&!note){ m.textContent="พิมพ์สิ่งที่อยากให้ปรับก่อน"; return }

    try{ await db.collection("feedback").add({kind:"goal",goalId:id,decision,note,at:new Date().toISOString()}); m.textContent="บันทึกแล้ว" }catch(e){ m.textContent="บันทึกไม่สำเร็จ ลองใหม่" } };
  $v.querySelectorAll("[data-gok]").forEach(b=>b.onclick=()=>gdec(b.dataset.gok,"ok"));

let samplerP=null;
async function setupAnswers(conf){
  const btns=[...$v.querySelectorAll("[data-ans]")]; if(!btns.length) return;
  samplerP ??= (window.claude?.use?.("sample")??Promise.resolve(null)).catch(()=>null);
  const sample=await samplerP; if(!sample) return;
  btns.forEach(b=>{ if(!document.body.contains(b)) return; b.hidden=false; b.onclick=async()=>{
    const c=conf[+b.dataset.ans], out=document.getElementById("ans-"+b.dataset.ans); b.disabled=true; out.textContent="กำลังร่างคำตอบ…";
    try{ const {text}=await sample(`ลูกสาว ม.2 กำลังฝึกเรื่อง "${c.topic||""}" แล้วพิมพ์ถามว่า "${c.ask}"${c.prompt?` ระหว่างทำโจทย์นี้: "${c.prompt}"`:" ระหว่างอ่านการ์ดสรุปเนื้อหา"}
เขียนคำตอบภาษาไทยให้พ่ออ่านให้ลูกฟังได้เลย สั้น 3–6 ประโยค ใช้ภาษาง่าย ยกตัวอย่างตัวเลขเล็กๆ 1 ตัวอย่าง ตอบตรงสิ่งที่ถาม ไม่เฉลยคำตอบของโจทย์ตรงๆ ถ้าคำถามกำกวมให้ตอบความหมายที่น่าจะเป็นที่สุด`,{onText:({text})=>{out.textContent=text}});
      out.textContent=text }catch(e){ out.textContent="ยังร่างคำตอบไม่ได้ ลองใหม่อีกครั้ง" } b.disabled=false };
  });
}
async function setupAsk(sum){ const skips=sum.skips||[], conf=sum.conf||[];
  const btn=document.getElementById("ask"); if(!btn) return;
  samplerP ??= (window.claude?.use?.("sample")??Promise.resolve(null)).catch(()=>null);
  const sample=await samplerP; if(!sample||!document.body.contains(btn)) return;
  btn.hidden=false;
  btn.onclick=async()=>{
    const out=document.getElementById("out"); btn.disabled=true; out.textContent="กำลังวิเคราะห์ อาจใช้เวลาราวครึ่งนาที…";
    const real=realAttempts(), rs=real.filter(isLesson), rk=real.filter(isSkip), rv=real.filter(a=>a.type==="vocab"), rp=progressOf(real);
    const rItems=rs.flatMap(a=>a.items||[]).filter(x=>!x.skipped);
    if(!rs.length&&!rk.length){ out.textContent="ยังไม่มีข้อมูลจริงให้วิเคราะห์ ข้อมูลตัวอย่างและข้อมูลทดสอบไม่ถูกนับ"; btn.disabled=false; return; }
    const rLv=[1,2,3].map(l=>{const it=rItems.filter(x=>x.level===l);return {level:l,n:it.length,correct:it.filter(x=>x.correct).length}});
    const rErr={}; rItems.filter(x=>!x.correct).forEach(x=>(x.errorTypes&&x.errorTypes.length?x.errorTypes:[x.errorType||"unspecified"]).forEach(k=>{rErr[k]=(rErr[k]||0)+1}));
    const data={skips:rk.map(k=>({date:k.endedAt,reason:k.reason,memo:k.memo})),confused:rs.flatMap(a=>(a.confused||[]).map(c=>({...c,date:a.endedAt}))),notes:fbList.filter(f=>!f.test).slice(0,10).map(f=>f.text),
      sessions:rs.map(a=>({topic:a.topic,date:a.endedAt,minutes:Math.round(a.durationSec/60),correct:a.correct,total:a.total,rating:a.rating,memo:a.memo,
      wrong:(a.items||[]).filter(x=>x.correct===false).map(x=>({topic:x.topic,level:x.level,error:x.errorType,hints:x.hints}))})),accuracyByLevel:rLv,errors:rErr,streak:{days:rp.streak,freezeLeft:rp.freeze,goalDays:rp.goalDays},vocab:{sessions:rv.length,correct:rv.reduce((s,a)=>s+a.correct,0),total:rv.reduce((s,a)=>s+a.total,0)}};
    const _unused={skips:skips.map(k=>({date:k.endedAt,reason:k.reason,memo:k.memo})),confused:conf,sessions:sum.all.map(a=>({topic:a.topic,date:a.endedAt,minutes:Math.round(a.durationSec/60),correct:a.correct,total:a.total,rating:a.rating,memo:a.memo,example:!!a.example,
      wrong:(a.items||[]).filter(x=>x.correct===false).map(x=>({topic:x.topic,level:x.level,error:x.errorType}))})),accuracyByLevel:sum.lv,errors:sum.errs};
    try{
      const {text}=await sample(`คุณเป็นโค้ชการเรียนที่ช่วยพ่อติดตามลูกสาว ม.2 ที่เตรียมสอบเข้า ม.4 แนวโรงเรียนวิทยาศาสตร์ เขียนภาษาไทย สั้น ชัด ไม่เกิน 180 คำ แบ่ง 3 หัวข้อ: "ทำได้ดี", "ต้องระวัง", "พ่อควรทำอะไรสัปดาห์นี้" (2–3 ข้อ ทำได้จริง น้ำเสียงให้กำลังใจ ไม่กดดันลูก) ถ้าข้อมูลน้อย ให้บอกตรงๆ ว่ายังสรุปไม่ได้มาก ใช้เฉพาะข้อมูลที่ให้มา ซึ่งเป็นข้อมูลจริงทั้งหมด\n\nข้อมูล:\n${JSON.stringify(data)}`,
        {onText:({text})=>{out.textContent=text}});
      analysisText=text; out.textContent=text;
    }catch(e){ out.textContent = e.code==="rate_limited"?"เรียกใช้ถี่เกินไป ลองใหม่อีกสักครู่":"ยังวิเคราะห์ไม่ได้ในตอนนี้"; }
    btn.disabled=false;
  };
}

function route(){ const h=location.hash.replace("#",""); if(h==="parent"){view="parent"} else if(h==="map"){view="map"} else if(h==="den"){view="den";denMsg=""} else if(!["session","intro","feedback","done","skip","send","vocab","mission","notes","words"].includes(view)){view="home"} else if(view==="done"){view="home"} render() }
window.addEventListener("hashchange",route);
route();
</script>
