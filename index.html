<style>

:root[data-theme="dark"]{

  --accent:#4FB3C6; --accent-ink:#0B1715; --beak:#E9A35A; --good:#5CC48A; --bad:#EF7C70; --warn:#E3B54E; --soft:#1E302C; color-scheme:dark}

.wrap{max-width:620px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

.quest{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}

.combo{color:var(--beak)}
.spellart{width:100%;max-height:180px;object-fit:cover;border-radius:10px}

.celecard{position:relative;z-index:2;background:var(--card);border-radius:18px;padding:24px 20px;max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;animation:pop .35s ease-out}
.celeicon{font-size:3.4rem;line-height:1}
.celeart{max-height:200px;object-fit:contain;border-radius:12px}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (min-width:700px){
  .pad{left:auto;top:0;bottom:0;right:0;width:50vw;height:auto;border-top:0;border-left:2px solid var(--line);box-shadow:-4px 0 16px rgba(0,0,0,.12)}

  body.padopen .padfab{top:calc(6px + env(safe-area-inset-top,0px));bottom:auto;right:14px;padding:7px 14px}

.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.opt.picked{border-color:var(--accent);border-width:2.5px;background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.trialbox{border-left:4px solid var(--accent)}
.usebox{border-left:4px solid var(--good)}
.rdbox{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--soft);line-height:1.9}
.rdbox span[data-ck]{border-radius:4px;padding:1px 0;transition:background .15s}
.rdbox span.now{background:color-mix(in srgb,var(--beak) 35%,transparent)}
.passage{background:var(--soft);border-radius:12px;padding:14px 16px;line-height:1.85;display:flex;flex-direction:column;gap:10px}

.opt:disabled{cursor:default}
.num{display:flex;gap:8px;flex-wrap:wrap}

.btn{font:inherit;font-family:var(--display);border:0;text-decoration:none;display:inline-block;border-radius:12px;padding:11px 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer;width:fit-content}

.feedback{border-radius:12px;padding:12px 14px;background:var(--soft);display:flex;flex-direction:column;gap:8px}

.vocab span{font-size:.85rem;border:1px dashed var(--line);border-radius:8px;padding:3px 9px}

.rate{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--mono);font-size:1.35rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:7.5em 1fr 3.2em;gap:8px;align-items:center;font-size:.88rem}

.topic{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}

.pill{font-size:.78rem;padding:2px 10px;border-radius:999px;white-space:nowrap}

.example{font-size:.75rem;color:var(--beak);border:1px solid var(--beak);border-radius:6px;padding:0 6px}
.analysis{white-space:pre-wrap;font-size:.94rem}
.note{font-size:.84rem;color:var(--muted)}
.hero{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.flame{font-family:var(--display);font-size:1.6rem;display:flex;align-items:center;gap:6px}
.flame.out{filter:grayscale(1);opacity:.55}
.ice{font-size:.9rem;color:var(--muted)}
.xpbar{flex:1;min-width:160px;display:flex;flex-direction:column;gap:4px}
.xpbar .progress{height:10px}
.xpbar .progress>i{background:var(--beak)}
.dot.ice{border-color:#7DB9E8;background:color-mix(in srgb,#7DB9E8 35%,transparent)}
.pick{border:2px solid var(--accent)}
.mission{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.mission:first-of-type{border-top:0}
.mission.done{opacity:.75}

.spells{display:grid;grid-template-columns:1fr;gap:8px}

.spell{font:inherit;text-align:left;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
button.spell{cursor:pointer} button.spell:hover{border-color:var(--accent)}
.spell.shadow{background:transparent;border-style:dashed;color:var(--muted)}
.spell.faded{opacity:.6}
.spell b{font-family:var(--display);font-weight:500}
.pips{display:flex;gap:4px;align-items:center}
.pips i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);display:inline-block}
.pips i.on1{background:var(--good);border-color:var(--good)} .pips i.on2{background:var(--warn);border-color:var(--warn)} .pips i.on3{background:var(--beak);border-color:var(--beak)}
.vword{font-family:var(--display);font-size:1.8rem}
.vex{font-style:italic}
.reading{background:var(--soft);border-radius:12px;padding:12px 14px;line-height:1.8}

</style>

 / ชุดคอสตูม", "ex": "She designed a costume for the mage character.", "exTh": "เธอออกแบบชุดให้ตัวละครจอมเวท", "cat": "art"}, {"w": "scene", "th": "ฉาก", "ex": "The last scene of the story made everyone cry.", "exTh": "ฉากสุดท้ายของเรื่องทำให้ทุกคนร้องไห้", "cat": "art"}, {"w": "detail", "th": "รายละเอียด", "ex": "Look at the small details in the background.", "exTh": "ดูรายละเอียดเล็กๆ ในฉากหลังสิ", "cat": "art"}, {"w": "pressure", "th": "ความดัน", "ex": "The pressure of water is greater at the bottom of the lake.", "exTh": "ความดันของน้ำที่ก้นทะเลสาบมากกว่าที่ผิวน้ำ", "cat": "sci"}, {"w": "float", "th": "ลอย", "ex": "A wooden boat can float on the river.", "exTh": "เรือไม้ลอยอยู่บนแม่น้ำได้", "cat": "sci"}, {"w": "sink", "th": "จม", "ex": "A small stone will sink in water.", "exTh": "ก้อนหินเล็กๆ จะจมในน้ำ", "cat": "sci"}, {"w": "weight", "th": "น้ำหนัก", "ex": "The robot checked the weight of each box.", "exTh": "หุ่นยนต์ตรวจน้ำหนักของกล่องแต่ละใบ", "cat": "sci"}, {"w": "surface", "th": "ผิว / พื้นผิว", "ex": "Leaves were floating on the surface of the pond.", "exTh": "ใบไม้ลอยอยู่บนผิวน้ำในสระ", "cat": "sci"}, {"w": "frequency", "th": "ความถี่", "ex": "Write the frequency of each score in the table.", "exTh": "เขียนความถี่ของแต่ละคะแนนลงในตาราง", "cat": "sci"}, {"w": "range", "th": "พิสัย / ช่วง", "ex": "The range of the scores is 34 points.", "exTh": "พิสัยของคะแนนเท่ากับ 34 คะแนน", "cat": "sci"}, {"w": "equation", "th": "สมการ", "ex": "She wrote an equation to find the missing number.", "exTh": "เธอเขียนสมการเพื่อหาจำนวนที่หายไป", "cat": "sci"}, {"w": "goal", "th": "เป้าหมาย", "ex": "Her goal is to pass the science-school exam.", "exTh": "เป้าหมายของเธอคือสอบผ่านข้อสอบโรงเรียนวิทยาศาสตร์", "cat": "gen"}, {"w": "mistake", "th": "ความผิดพลาด", "ex": "Everyone makes mistakes when they learn something new.", "exTh": "ทุกคนทำพลาดได้ตอนเรียนเรื่องใหม่", "cat": "gen"}, {"w": "confident", "th": "มั่นใจ", "ex": "After a week of practice, she felt more confident.", "exTh": "หลังฝึกมาหนึ่งสัปดาห์ เธอรู้สึกมั่นใจขึ้น", "cat": "gen"}, {"w": "support", "th": "สนับสนุน / ช่วยเหลือ", "ex": "Her teammates always support each other in a hard match.", "exTh": "เพื่อนร่วมทีมของเธอช่วยกันเสมอเวลาแข่งเกมยากๆ", "cat": "gen"}, {"w": "quickly", "th": "อย่างรวดเร็ว", "ex": "The creature quickly hid behind a rock.", "exTh": "เจ้าสัตว์ตัวนั้นรีบหลบหลังก้อนหินอย่างรวดเร็ว", "cat": "gen"}, {"w": "unusual", "th": "ผิดปกติ / แปลก", "ex": "The sensor recorded an unusual temperature.", "exTh": "เซนเซอร์บันทึกอุณหภูมิที่ผิดปกติได้", "cat": "gen"}, {"w": "remember", "th": "จำได้ / จดจำ", "ex": "Can you remember the rule for exponents?", "exTh": "เธอจำกฎของเลขยกกำลังได้ไหม", "cat": "gen"}, {"w": "palette", "th": "จานสี", "ex": "She mixed blue and yellow on her palette.", "exTh": "เธอผสมสีฟ้ากับสีเหลืองบนจานสี", "cat": "art"}, {"w": "canvas", "th": "ผ้าใบวาดภาพ", "ex": "The painter stretched a new canvas on the frame.", "exTh": "จิตรกรขึงผ้าใบใหม่บนกรอบ", "cat": "art"}, {"w": "hero", "th": "วีรบุรุษ / ตัวเอก", "ex": "The hero of the story is a young swordsman.", "exTh": "ตัวเอกของเรื่องคือนักดาบหนุ่ม", "cat": "art"}, {"w": "stage", "th": "เวที", "ex": "The dance group bowed on the stage.", "exTh": "วงเต้นโค้งคำนับบนเวที", "cat": "art"}, {"w": "bright", "th": "สดใส / สว่าง", "ex": "Use bright colours for a happy scene.", "exTh": "ใช้สีสดใสสำหรับฉากที่มีความสุข", "cat": "art"}], "readings": [{"text": "Mina wanted to draw her cat. First, she made a quick sketch. Then she looked closely to observe the shadow under its chin. She did not get it right the first time, but she was patient. After three tries, the result looked almost alive.", "th": "มินาอยากวาดแมวของเธอ อย่างแรก เธอร่างภาพอย่างเร็วๆ แล้วมองให้ดีเพื่อสังเกตเงาใต้คางของมัน ครั้งแรกเธอยังทำไม่ได้ แต่เธออดทน หลังลองไปสามครั้ง ผลงานก็ดูเกือบเหมือนมีชีวิต", "qs": [{"q": "What did Mina do first?", "opts": ["She made a quick sketch.", "She shaded the shadow.", "She bought a cat.", "She gave up."], "a": 0, "qth": "มินาทำอะไรเป็นอย่างแรก", "optsTh": ["เธอร่างภาพอย่างเร็วๆ", "เธอแรเงาส่วนที่เป็นเงา", "เธอซื้อแมว", "เธอยอมแพ้"]}, {"q": "Which word means she did not give up easily?", "opts": ["patient", "curious", "ancient", "gentle"], "a": 0, "qth": "คำไหนแปลว่าเธอไม่ยอมแพ้ง่ายๆ", "optsTh": ["อดทน", "อยากรู้อยากเห็น", "โบราณ", "อ่อนโยน"]}]}, {"text": "In an experiment, a class put the same amount of sugar into three cups of water. The only variable they changed was the temperature. The sugar dissolved fastest in the hottest cup. Their data shows that heat can increase how fast sugar dissolves.", "th": "ในการทดลอง ห้องเรียนหนึ่งใส่น้ำตาลปริมาณเท่ากันลงในน้ำสามแก้ว ตัวแปรเดียวที่เปลี่ยนคืออุณหภูมิ น้ำตาลละลายเร็วที่สุดในแก้วที่ร้อนที่สุด ข้อมูลของพวกเขาแสดงว่าความร้อนช่วยให้น้ำตาลละลายเร็วขึ้น", "qs": [{"q": "What did the class change?", "opts": ["The temperature", "The amount of sugar", "The type of cup", "The amount of water"], "a": 0, "qth": "ห้องเรียนเปลี่ยนอะไร", "optsTh": ["อุณหภูมิ", "ปริมาณน้ำตาล", "ชนิดของแก้ว", "ปริมาณน้ำ"]}, {"q": "What does the evidence show?", "opts": ["Heat makes sugar dissolve faster.", "Cold makes sugar dissolve faster.", "Sugar never dissolves.", "All cups were the same."], "a": 0, "qth": "หลักฐานแสดงว่าอะไร", "optsTh": ["ความร้อนทำให้น้ำตาลละลายเร็วขึ้น", "ความเย็นทำให้น้ำตาลละลายเร็วขึ้น", "น้ำตาลไม่ละลายเลย", "ทุกแก้วเหมือนกันหมด"]}]}, {"text": "A small robot woke up alone on an island. It did not know how to live there, so it decided to observe the animals. Every day it recorded data: when the birds ate, where the deer slept, and how the weather changed. After one month, the robot could predict the rain one day before it came.", "th": "หุ่นยนต์ตัวเล็กตื่นขึ้นมาตัวคนเดียวบนเกาะ มันไม่รู้ว่าจะอยู่ที่นั่นอย่างไร จึงตัดสินใจสังเกตสัตว์ต่างๆ ทุกวันมันจดข้อมูลไว้ว่า นกกินอาหารเมื่อไร กวางนอนที่ไหน และอากาศเปลี่ยนไปอย่างไร ผ่านไปหนึ่งเดือน หุ่นยนต์ทำนายได้ว่าฝนจะตกล่วงหน้าหนึ่งวัน", "qs": [{"q": "How did the robot learn about the island?", "opts": ["It observed the animals and recorded data.", "It read a book.", "It asked a teacher.", "It already knew everything."], "a": 0, "qth": "หุ่นยนต์เรียนรู้เรื่องเกาะได้อย่างไร", "optsTh": ["มันสังเกตสัตว์และจดข้อมูลไว้", "มันอ่านหนังสือ", "มันถามครู", "มันรู้ทุกอย่างอยู่แล้ว"]}, {"q": "What does 'predict' mean in this story?", "opts": ["say what will happen before it happens", "forget something", "draw a picture", "sleep for a long time"], "a": 0, "qth": "คำว่า predict ในเรื่องนี้หมายถึงอะไร", "optsTh": ["บอกว่าจะเกิดอะไรก่อนที่จะเกิดขึ้น", "ลืมบางอย่าง", "วาดรูป", "นอนหลับนานๆ"]}]}, {"text": "In a 5 vs 5 online game, Mali's team played 20 matches this week. They won 14 matches. Her friend said, \"Our win rate is 14 percent.\" Mali laughed and explained the correct answer. The total was 20, not 100, so the win rate was 14 out of 20.", "th": "ในเกมออนไลน์แบบ 5 ต่อ 5 ทีมของมะลิเล่นไป 20 แมตช์ในสัปดาห์นี้ ชนะ 14 แมตช์ เพื่อนของเธอบอกว่า \"อัตราชนะของเราคือ 14 เปอร์เซ็นต์\" มะลิหัวเราะแล้วอธิบายคำตอบที่ถูก ทั้งหมดคือ 20 ไม่ใช่ 100 อัตราชนะจึงเป็น 14 จาก 20", "qs": [{"q": "What is the team's real win rate?", "opts": ["70 percent", "14 percent", "20 percent", "34 percent"], "a": 0, "qth": "อัตราชนะจริงของทีมคือเท่าไร", "optsTh": ["70 เปอร์เซ็นต์", "14 เปอร์เซ็นต์", "20 เปอร์เซ็นต์", "34 เปอร์เซ็นต์"]}, {"q": "What mistake did the friend make?", "opts": ["He thought the total was 100.", "He counted the wins wrong.", "He forgot to play.", "He used the average."], "a": 0, "qth": "เพื่อนผิดตรงไหน", "optsTh": ["เขาคิดว่าทั้งหมดคือ 100", "เขานับจำนวนที่ชนะผิด", "เขาลืมเล่น", "เขาใช้ค่าเฉลี่ย"]}]}, {"text": "Scientists study pocket-sized creatures in a forest. They estimate the population by catching 40 creatures, putting a small tag on each one, and letting them go. A week later they catch 50 creatures, and 10 of them have tags. Using this ratio, they estimate that about 200 creatures live in the forest.", "th": "นักวิทยาศาสตร์ศึกษาสัตว์ตัวจิ๋วในป่า พวกเขาประมาณจำนวนประชากรโดย function b64e(str){const b=new TextEncoder().encode(str);let o="";for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(o)}
function b64d(x){return new TextDecoder().decode(Uint8Array.from(atob(x),c=>c.charCodeAt(0)))}
function lsFb(){ try{ return JSON.parse(localStorage.getItem("fieldnote.fb")||"[]") }catch(e){ return [] } }

/* short code: drop text the parent page can look up again by question id, then deflate */
function slim(a){ const {sent,...x}=a; return {...x, items:(x.items||[]).map(({prompt,phase,topic,spell,...i})=>i), confused:(x.confused||[]).map(({prompt,...c})=>c)} }
function fatten(a){ return {...a, items:(a.items||[]).map(i=>{const q=QBANK[i.qid]?.q; return q?{topic:q.topic,spell:q.spell,prompt:q.q,...i}:i}),
  confused:(a.confused||[]).map(c=>{const q=QBANK[c.qid]?.q; return q&&!c.prompt?{...c,prompt:q.q}:c})} }
async function packCode(obj){
  const json=JSON.stringify(obj);
  if(typeof CompressionStream==="function"){ try{
    const buf=new Uint8Array(await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer());
    let t=""; for(let i=0;i<buf.length;i+=0x8000) t+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
    return "SK2:"+btoa(t).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }catch(e){} }
  return "FIELDNOTE1:"+b64e(json);
}

async function importCode(raw, asTest){
  let data; const m2=raw.match(/SK2:([A-Za-z0-9_-]+)/), m1=raw.match(/FIELDNOTE1:([A-Za-z0-9+/=\s]+)/);
  if(m2){ const c=m2[1].replace(/-/g,"+").replace(/_/g,"/"); const bin=atob(c+"=".repeat((4-c.length%4)%4));
    const bytes=Uint8Array.from(bin,ch=>ch.charCodeAt(0));
    data=JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text()); }
  else if(m1) data=JSON.parse(b64d(m1[1].replace(/\s/g,""))); else throw new Error("bad");
  let n=0,k=0;
  for(const a of (data.a||[])){ const id=("s-"+(a.setId||a.type)+"-"+a.endedAt).replace(/[^A-Za-z0-9_-]/g,""); const {example,...rest}=fatten(a); await db.collection("attempts").doc(id).set({...rest,via:"code",test:!!(a.test||asTest)}); n++ }
  for(const f of (data.f||[])){ const id=("f-"+f.at).replace(/[^A-Za-z0-9_-]/g,""); await db.collection("feedback").doc(id).set({...f,test:!!(f.test||asTest)}); k++ }
  return {n,k};
}

function dayKey(iso){ const d=new Date(iso); d.setHours(0,0,0,0); return d.getTime() }
function todayKey(){ return dayKey(new Date().toISOString()) }
function nextDay(d){ const t=new Date(d); t.setDate(t.getDate()+1); t.setHours(0,0,0,0); return t.getTime() }
function weekStart(d){ const t=new Date(d); t.setHours(0,0,0,0); t.setDate(t.getDate()-((t.getDay()+6)%7)); return t.getTime() }
function xpOf(a){ if(isSkip(a)||a.type==="daymode") return 0; if(typeof a.xp==="number") return a.xp; return (a.correct||0)*10+((a.total||0)-(a.correct||0))*5+20 }
function itemXp(items){ return items.reduce((s,x)=>s+(x.skipped||x.dontknow?0:x.correct?10:5),0) }

/* ---------- day types: school day or holiday (Thai public holidays, school days off, weekends), plus a manual switch ---------- */
const LEVELS={full:{label:"เต็ม",mins:"ราว 90 นาที แบ่งทำ 3 ช่วง",units:3,probe:true},mid:{label:"กลาง",mins:"ราว 60 นาที",units:2,probe:true},light:{label:"เบา",mins:"ราว 40 นาที",units:1,probe:false}};
const LOWER_REASONS=["มีธุระครอบครัว","ไปเที่ยว/ออกนอกบ้าน","การบ้านหรืองานเยอะ","เรียนพิเศษ/กิจกรรม","ไม่สบาย","อื่นๆ"];
const MILESTONES=[3,7,14,30,50,100,200,365];
function isoDay(dk){ const d=new Date(dk); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0") }
function baseDay(dk){
  const ds=isoDay(dk), wd=new Date(dk).getDay();
  if(CAL.holidays&&CAL.holidays[ds]) return {kind:"holiday",name:CAL.holidays[ds]};
  if(CAL.schoolOff&&CAL.schoolOff[ds]) return {kind:"holiday",name:CAL.schoolOff[ds]};
  for(const b of CAL.schoolBreaks||[]) if(ds>=b.from&&ds<=b.to) return {kind:"holiday",name:b.name};
  if(wd===0||wd===6) return {kind:"holiday",name:wd===6?"วันเสาร์":"วันอาทิตย์"};
  return {kind:"school",name:"วันไปโรงเรียน"};
}
function dayModes(list){ const m={}; list.filter(a=>a.type==="daymode").sort((a,b)=>new Date(a.endedAt)-new Date(b.endedAt)).forEach(a=>{m[a.day]={...(m[a.day]||{}),...a}}); return m }
function dayInfo(dk, modes){
  const b=baseDay(dk), o=modes[isoDay(dk)]||{};
  const kind=o.kind||b.kind, level=kind==="school"?"school":(o.level||"full");
  const name=o.kind&&o.kind!==b.kind?(o.kind==="holiday"?"หยุดเรียน (แจ้งเอง)":"ไปโรงเรียน (แจ้งเอง)"):b.name;
  return {kind,level,name,override:!!o.kind&&o.kind!==b.kind,lowered:kind==="holiday"&&level!=="full",reason:o.reason||""};
}

/* ---------- weekly quests ---------- */
function questStatus(list, wk, upto, met){
  const inWeek=a=>{const k=dayKey(a.endedAt); return k>=wk&&k<=upto};
  let metDays=0; for(let d=wk; d<=upto; d=nextDay(d)) if(met.has(d)) metDays++;
  const spelled=list.filter(a=>a.type==="vocab"&&inWeek(a)).reduce((s,a)=>s+(a.items||[]).filter(i=>i.kind==="spell"&&i.correct).length,0);
  let tierUp=0;
  if(metDays>=0){ const before=spellStats(list.filter(a=>dayKey(a.endedAt)<wk)), after=spellStats(list.filter(a=>dayKey(a.endedAt)<=upto));
    for(const [k,v] of Object.entries(after)) if(v.tier>(before[k]?.tier||0)) tierUp++; }
  const q=[{key:"days",label:"จุดไฟให้ครบ 5 วัน",have:metDays,need:5},{key:"tier",label:"ทำให้คาถาขึ้นขั้น 1 ครั้ง",have:tierUp,need:1},{key:"spell",label:"สะกดคำศัพท์ถูก 20 คำ",have:spelled,need:20}];
  return {q,all:q.every(x=>x.have>=x.need)};
}

function progressOf(list){
  const modes=dayModes(list);
  const byDay=new Map(), skipDays=new Set(), leaveDays=new Set(), vocabDays=new Set(), units=new Map(), probes=new Map(), met=new Set();
  list.forEach(a=>{ const k=dayKey(a.endedAt);
    if(a.type==="daymode") return;
    if(a.type==="mission"){ byDay.set(k,(byDay.get(k)||0)+xpOf(a)); return }   /* real-world mission: XP only, not a daily unit */
    if(isSkip(a)){ if(a.leave&&a.from&&a.to){ for(let d=a.from; d<=a.to; d=nextDay(d)) leaveDays.add(d) } else skipDays.add(k); return }
    byDay.set(k,(byDay.get(k)||0)+xpOf(a));
    if(a.type==="vocab") vocabDays.add(k); else { units.set(k,(units.get(k)||0)+1); if(a.type==="probe"||a.type==="mixed"||a.type==="passage") probes.set(k,(probes.get(k)||0)+1) } });
  const probeCount=SETS.filter(s=>s.kind==="probe").length, firstProbe={};
  list.filter(a=>a.type==="probe").forEach(a=>{const k=dayKey(a.endedAt); firstProbe[a.setId]=Math.min(firstProbe[a.setId]??Infinity,k)});
  const probesLeft=d=>probeCount-Object.values(firstProbe).filter(x=>x<d).length>0;
  const today=todayKey();
  const noVocabToday=(()=>{try{const v=vocabToday();return !v.due.length&&!v.fresh.length}catch(e){return false}})();
  const need=d=>{ const info=dayInfo(d,modes); if(info.level==="school") return {units:1,probe:false,info}; const L=LEVELS[info.level]; return {units:L.units,probe:L.probe&&probesLeft(d),info} };
  const isMet=d=>{ const n=need(d); return (vocabDays.has(d)||(d===today&&noVocabToday))&&(units.get(d)||0)>=n.units&&(!n.probe||(probes.get(d)||0)>=1) };
  const keys=[...byDay.keys(),...skipDays,...[...leaveDays].filter(d=>d<=today)];
  let streak=0, best=0, freeze=0, goalDays=0; const frozen=new Set(), earned=[], questDone=new Set();
  if(keys.length){
    for(let d=Math.min(...keys); d<=today; d=nextDay(d)){
      const xp=byDay.get(d)||0;
      if(isMet(d)){ met.add(d); goalDays++; streak++; best=Math.max(best,streak);
        if(goalDays%5===0&&freeze<FREEZE_MAX){freeze++;earned.push({d,why:"ทำภารกิจครบ 5 วัน"})}
        if((units.get(d)||0)>need(d).units&&freeze<FREEZE_MAX){freeze++;earned.push({d,why:"ทำชุดฝึกเกินภารกิจของวันนั้น"})}
      } else if(leaveDays.has(d)){
        /* planned leave (camp, trip): the flame waits, no ice used */
      } else if(d<today){
        if(freeze>0&&streak>0){freeze--;frozen.add(d)} else streak=0;
      }
      const wk=weekStart(d);
      if(!questDone.has(wk)&&met.has(d)&&questStatus(list,wk,d,met).all){ questDone.add(wk); if(freeze<FREEZE_MAX){freeze++;earned.push({d,why:"ภารกิจประจำสัปดาห์ครบ"})} }
    }
  }
  const n=need(today), u=units.get(today)||0, pr=probes.get(today)||0;
  return {streak,best,freeze,goalDays,frozen,skipDays,byDay,met,todayXp:byDay.get(today)||0,leaveDays,onLeave:leaveDays.has(today),
    unitsToday:u,probesToday:pr,lessonToday:u-pr>=1||(u>=1&&!n.probe),vocabToday:vocabDays.has(today),noVocabToday,need:n,info:n.info,modes,
    goalToday:met.has(today),earnedToday:earned.filter(e=>e.d===today),quests:questStatus(list,weekStart(today),today,met),questDoneThisWeek:questDone.has(weekStart(today))};
}

/* ---------- what to do today ---------- */
function lastDone(list){ const last={}; list.filter(isLesson).forEach(a=>{if(a.setId) last[a.setId]=Math.max(last[a.setId]||0,dayKey(a.endedAt))}); return last }
function pickLesson(list, preferCurrent, exclude){
  const last=lastDone(list), t=todayKey(), ex=exclude||[];
  const lessons=SETS.filter(s=>s.kind==="lesson"&&!ex.includes(s.id)); if(!lessons.length) return null;
  const pool=lessons.filter(s=>last[s.id]!==t), use=pool.length?pool:lessons;
  return use.slice().sort((a,b)=>(preferCurrent?(b.current?1:0)-(a.current?1:0):0)||(last[a.id]||0)-(last[b.id]||0))[0];
}
function pickProbe(list){ const done=new Set(list.filter(a=>a.type==="probe").map(a=>a.setId)); return SETS.find(s=>s.kind==="probe"&&!done.has(s.id))||null }
/* mixed exam-style sets (interleaving): one per week on a holiday, in the probe slot */
function pickMixed(list){
  const done=new Set(list.filter(a=>a.type==="mixed").map(a=>a.setId));
  const wk=weekStart(todayKey()), thisWeek=list.filter(a=>a.type==="mixed"&&dayKey(a.endedAt)>=wk&&dayKey(a.endedAt)<todayKey()).length;
  const doneToday=list.some(a=>a.type==="mixed"&&dayKey(a.endedAt)===todayKey());
  if(thisWeek>=(CAL.mixedPerWeek||1)&&!doneToday) return null;
  return SETS.find(s=>s.kind==="mixed"&&!done.has(s.id))||(doneToday?SETS.find(s=>s.kind==="mixed"&&list.some(a=>a.setId===s.id&&dayKey(a.endedAt)===todayKey())):null)||null;
}
/* weekly Thai science reading passage: in the probe slot on a holiday that has no mixed set */
function pickPassage(list){
  const done=new Set(list.filter(a=>a.type==="passage").map(a=>a.setId)), wk=weekStart(todayKey()), t=todayKey();
  const doneToday=list.find(a=>a.type==="passage"&&dayKey(a.endedAt)===t);
  if(doneToday) return SETS.find(s=>s.id===doneToday.setId)||null;
  if(list.filter(a=>a.type==="passage"&&dayKey(a.endedAt)>=wk).length>=(CAL.passagePerWeek||1)) return null;
  return SETS.find(s=>s.kind==="passage"&&!done.has(s.id))||null;
}
function planToday(list, p){
  const wd=new Date().getDay(), school=p.info.kind==="school";
  const repair=school&&wd===5&&reviewPool(list).length+dueQuestions(list,3).length>=4;
  const doneToday=list.filter(a=>isLesson(a)&&dayKey(a.endedAt)===todayKey()).map(a=>a.setId);
  const lesson=repair?null:pickLesson(list, school);
  const mixed=school?null:pickMixed(list);
  const passage=school||mixed?null:pickPassage(list);
  const probe=school||mixed||passage?null:pickProbe(list);
  const extra=p.info.level==="full"?pickLesson(list,false,[...(lesson?[lesson.id]:[]),...doneToday]):null;
  return {repair,lesson,probe,mixed,passage,extra};
}
function recommend(list){ return pickLesson(list,true) }
/* questions to look at again: wrong answers, and (trial) right answers she was not sure about */
function reviewPool(list){
  const wrong=new Map();
  list.filter(isLesson).slice().sort((a,b)=>new Date(a.endedAt)-new Date(b.endedAt)).forEach(a=>(a.items||[]).forEach(x=>{
    if(x.skipped||!QBANK[x.qid]) return;
    if(x.correct===false||(x.correct&&x.conf==="unsure")) wrong.set(x.qid,+new Date(a.endedAt)); else if(x.correct) wrong.delete(x.qid);
  }));
  return [...wrong.entries()].sort((a,b)=>a[1]-b[1]).map(([qid])=>QBANK[qid].q);
}
/* spaced review: spells not practised for a while come back, one question each (questions she has seen before) */
const SPACING=[3,4,7,14];   // days before a spell is due again, by tier 0..3
function dueQuestions(list, n, avoidSpells){
  const ss=spellStats(list), t=todayKey(), avoid=new Set(avoidSpells||[]);
  const seen=new Map();   // qid -> last day seen
  list.filter(isLesson).forEach(a=>(a.items||[]).forEach(x=>{ if(!x.skipped&&QBANK[x.qid]) seen.set(x.qid,Math.max(seen.get(x.qid)||0,dayKey(a.endedAt))) }));
  const due=Object.entries(ss).filter(([sp,v])=>!avoid.has(sp)&&v.idle>=SPACING[v.tier]).sort((a,b)=>b[1].idle/SPACING[b[1].tier]-a[1].idle/SPACING[a[1].tier]);
  const out=[];
  for(const [sp] of due){
    const qs=[...seen.entries()].filter(([id,d])=>QBANK[id].q.spell===sp&&!QBANK[id].q.optional&&t-d>=3*DAY).sort((a,b)=>a[1]-b[1]);
    const pick=qs.find(([id])=>QBANK[id].q.level<=2)||qs[0];
    if(pick) out.push(QBANK[pick[0]].q);
    if(out.length>=n) break;
  }
  return out;
}
/* trial features for this week (calendar.json "trials": {"2026-11-05":["confidence"], ...}) */
const TRIAL_NAMES={confidence:"ปุ่ม มั่นใจ / ไม่ชัวร์ ก่อนส่งคำตอบ",explain:"เขียนเหตุผลก่อนดูเฉลย (ชุดละ 1 ข้อ)"};
function trialsToday(){ return ((CAL.trials||{})[isoDay(todayKey())]||[]).filter(k=>TRIAL_NAMES[k]) }
function shuffleQ(q, perm){
  if(q.num) return q;
  let idx=perm&&perm.length===q.opts.length?perm:null;
  if(!idx){ idx=q.opts.map((_,k)=>k); for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]} }
  return {...q,opts:idx.map(k=>q.opts[k]),a:idx.indexOf(q.a),perm:idx};
}

/* ---------- spell tiers ---------- */
function spellStats(list){
  const st={};
  list.filter(isLesson).forEach(a=>{
    const d=dayKey(a.endedAt);
    (a.items||[]).forEach(x=>{
      if(x.skipped) return; const sp=x.spell||QBANK[x.qid]?.q.spell; if(!sp||!x.level) return;
      const o=st[sp]??={days:{},last:0}; const dd=o.days[d]??={1:[0,0],2:[0,0],3:[0,0]};
      dd[x.level][0]++; if(x.correct) dd[x.level][1]++; o.last=Math.max(o.last,d);
    });
  });
  const out={}, t=todayKey();
  for(const [sp,o] of Object.entries(st)){
    const days=Object.entries(o.days).map(([d,v])=>({d:+d,v}));
    const n1=days.reduce((s,x)=>s+x.v[1][0],0), c1=days.reduce((s,x)=>s+x.v[1][1],0);
    const t1=n1>=3&&c1/n1>=0.8;
    const d2=days.filter(x=>x.v[2][0]>=2&&x.v[2][1]/x.v[2][0]>=0.7).length;
    const t2=t1&&d2>=2;
    const d3=days.filter(x=>x.v[3][0]>=1&&x.v[3][1]/x.v[3][0]>=0.6).map(x=>x.d).sort((a,b)=>a-b);
    const t3=t2&&d3.length>=2&&d3[d3.length-1]-d3[0]>=7*DAY;
    const tier=t3?3:t2?2:t1?1:0, idle=Math.round((t-o.last)/DAY);
    out[sp]={tier,idle,faded:(tier===2&&idle>14)||(tier===3&&idle>21),n1,c1,d2,d3:d3.length};
  }
  return out;
}
const TIER=["ยังไม่ปลดล็อก","🌱 ฝึกหัด","✨ ชำนาญ","👑 ปรมาจารย์"];
function nextStep(sp,info){
  if(!info||info.tier===0) return "ตอบข้อพื้นฐานให้ถูก 80% (อย่างน้อย 3 ข้อ) เพื่อปลดล็อกขั้นฝึกหัด";
  if(info.tier===1) return `ทำข้อประยุกต์ให้ถูก 70% ใน 2 วันที่ต่างกัน (ทำได้แล้ว ${info.d2} วัน)`;
  if(info.tier===2) return "ทำข้อแนวข้อสอบโรงเรียนวิทยาศาสตร์ให้ถูก 60% ใน 2 วันที่ห่างกันอย่างน้อย 7 วัน";
  return "ปรมาจารย์แล้ว แวะมาทบทวนบ้าง คาถาจะได้ไม่จาง";
}

/* ---------- lesson sessions ---------- */
function startSet(set, conceptFirst, perms, dueIds){
  const probe=set.kind==="probe", mixed=set.kind==="mixed";
  /* spaced review: a lesson's warm-up gets 1 question from a spell that is due again */
  const due = set.kind==="lesson" ? (dueIds ? dueIds.map(id=>QBANK[id]?.q).filter(Boolean)
    : dueQuestions(mine(),1,[set.spell,...set.warm.map(q=>q.spell)])) : [];
  const warm = [...set.warm.map(q=>({kind:"q",phase:"อุ่นเครื่อง (ทบทวนของเก่า)",q})),...due.map(q=>({kind:"q",phase:"ทบทวนตามรอบ (คาถาที่ไม่ได้ใช้มาหลายวัน)",q,due:true}))];
  const card = {kind:"concept",phase:"การ์ดสรุปเนื้อหา"};
  const passage=set.kind==="passage";
  const steps = (passage?[
    {kind:"passage",phase:"อ่านบทความ (อ่านเองเงียบๆ)"},
    ...set.practice.map(q=>({kind:"q",phase:"ตอบจากบทความ",q,passage:true})),
    {kind:"rate",phase:"ปิดท้าย"}
  ]:mixed?[
    ...set.practice.map(q=>({kind:"q",phase:"ชุดผสมแบบข้อสอบ",q})),
    {kind:"rate",phase:"ปิดท้าย"}
  ]:probe?[
    ...set.practice.map(q=>({kind:"q",phase:"ด่านสำรวจ",q})),
    ...(set.concept&&set.concept.points&&set.concept.points.length?[{kind:"concept",phase:"สรุปหลังผ่านด่าน"}]:[]),
    {kind:"rate",phase:"ปิดท้าย"}
  ]:[
    ...(conceptFirst?[card,...warm]:[...warm,card]),
    ...set.practice.map(q=>({kind:"q",phase:"ฝึกทำ",q})),
    ...(set.challenge?[{kind:"q",phase:"ข้อท้าทาย (ไม่บังคับ)",q:set.challenge,optional:true}]:[]),
    {kind:"rate",phase:"ปิดท้าย"}
  ]).map((st,k)=>st.q?{...st,q:shuffleQ(st.q,perms&&perms[k])}:st);   // the right answer is not always the first choice
  const trial=trialsToday(); markExplain(steps, trial);
  S = {mode:"set", active:true, set, conceptFirst, steps, dueIds:due.map(q=>q.id), trial, trialVote:{}, i:0, start:Date.now(), qStart:Date.now(), items:[], answered:null, why:null, rating:null, hints:0, struck:[], glossed:[], askOpen:null, confused:[], altShown:0, pick:null, whyText:""};
  PAD.strokes=[]; saveProgress();
  view="session"; render(); window.scrollTo({top:0});
}
/* trial "explain": one question per set (the first level-3 one, else the hardest) asks for a reason before the answer shows */
function markExplain(steps, trial){
  if(!trial.includes("explain")) return;
  const qs=steps.filter(st=>st.kind==="q"&&!st.optional); if(!qs.length) return;
  const top=qs.find(st=>st.q.level===3)||qs.slice().sort((a,b)=>b.q.level-a.q.level)[0]; top.explain=true;
}
function startReview(n, title){
  const list=mine(), repair=n>5;
  /* the Friday repair set also brings back up to 3 spells that are due (spaced review), not only mistakes */
  const due=repair?dueQuestions(list,3):[], dueIds=new Set(due.map(q=>q.id));
  const qs=[...due,...reviewPool(list).filter(q=>!dueIds.has(q.id))].slice(0,n||5); if(!qs.length) return;
  for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]]}
  const t=title||"ทบทวนข้อที่เคยพลาด";
  const steps=[...qs.map(q=>({kind:"q",phase:dueIds.has(q.id)?t+" · ทบทวนตามรอบ":t,q:shuffleQ(q),due:dueIds.has(q.id)})),{kind:"finish",phase:"เสร็จ"}];
  const trial=trialsToday(); markExplain(steps, trial);
  S = {mode:"review", set:{id:repair?"repair":"review",subject:"ทบทวน",topic:t}, steps, trial, trialVote:{},
       active:true, i:0, start:Date.now(), qStart:Date.now(), items:[], answered:null, why:null, hints:0, struck:[], glossed:[], askOpen:null, confused:[], altShown:0, pick:null, whyText:""};
  view="session"; render(); window.scrollTo({top:0});
}

function render(){
  const tab = view==="parent"?"parent":view==="map"?"map":"home";
  document.querySelectorAll(".tabs a").forEach(a=>a.setAttribute("aria-current", a.dataset.v===tab?"page":"false"));
  if(view==="home") return renderHome();
  if(view==="map") return renderMap();
  if(view==="intro") return renderIntro();
  if(view==="feedback") return renderFeedback();
  if(view==="send") return renderSend(false);
  if(view==="skip") return renderSkip();
  if(view==="session") return renderStep();
  if(view==="vocab") return renderVocab();
  if(view==="done") return renderDone();
  if(view==="parent") return renderParent();
  if(view==="mission") return renderMission();
}

function flameHtml(p){
  const next=MILESTONES.find(m=>m>p.streak), got=MILESTONES.filter(m=>p.best>=m);
  const total=p.need.units+(p.need.probe?0:0)+1, doneCount=missionsDone(p);
  return `<div class="hero">
    <div class="flamebox ${p.streak?"":"out"}"><span class="flamebig">🔥 ${p.streak}</span><span class="small">วันติดต่อกัน</span></div>
    <div style="display:flex;flex-direction:column;gap:4px;flex:1;min-width:150px">
      <span class="small">สถิติสูงสุด <b>${p.best}</b> วัน · 🧊 น้ำแข็ง ${p.freeze}/${FREEZE_MAX}</span>
      ${next?`<span class="small muted">อีก ${next-p.streak} วันถึง 🏅 ${next} วัน</span>`:""}
      <div class="badges">${MILESTONES.slice(0,Math.max(got.length+2,4)).map(m=>`<span class="badge ${p.best>=m?"on":""}" title="${p.best>=m?"ได้แล้ว":"ยังไม่ถึง"}">🏅${m}</span>`).join("")}</div>
    </div></div>
    <div class="xpbar"><div class="stage"><span>ภารกิจวันนี้ ${doneCount.done}/${doneCount.total}</span><span>XP วันนี้ <b>${p.todayXp}</b></span></div>

function missionList(p){
  const lv=p.info.level, probeLeft=p.need.probe, u=p.unitsToday, nonProbe=u-p.probesToday;
  const m=[{key:"lesson",done:nonProbe>=1||(!probeLeft&&u>=1)},{key:"vocab",done:p.vocabToday||p.noVocabToday}];
  if(lv==="full"||lv==="mid") m.push({key:"probe",done:probeLeft?p.probesToday>=1:u>=2});
  if(lv==="full") m.push({key:"extra",done:u>=3});
  return m;
}

/* ---------- read aloud in Thai: phrase by phrase, the phrase being read is highlighted so her eyes follow the text
   (reading-while-listening trains reading; listening instead of reading does not). Questions: only after she has
   tried reading for a while, and never in mixed exam-style sets. ---------- */
const RD={where:null,chunks:[],k:0,slow:false,timer:null};
try{ RD.slow=localStorage.getItem("fieldnote.thslow")==="1" }catch(e){}
function thVoice(){ try{ return speechSynthesis.getVoices().find(v=>/^th/i.test(v.lang))||null }catch(e){ return null } }
const SUP={"⁰":"0","¹":"1","²":"2","³":"3","⁴":"4","⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9","⁻":"ลบ "};
function sayable(t){
  return String(t)
    .replace(/µg\/m³/g," ไมโครกรัมต่อลูกบาศก์เมตร ").replace(/g\/cm³/g," กรัมต่อลูกบาศก์เซนติเมตร ").replace(/cm³/g," ลูกบาศก์เซนติเมตร ").replace(/m³/g," ลูกบาศก์เมตร ")
    .replace(/m²/g," ตารางเมตร ").replace(/cm²/g," ตารางเซนติเมตร ").replace(/°C/g," องศาเซลเซียส ").replace(/% ?w\/v/g," เปอร์เซ็นต์โดยมวลต่อปริมาตร ")
    .replace(/(\d)²/g,"$1 กำลังสอง ").replace(/(\d)³/g,"$1 กำลังสาม ").replace(/([⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g,m=>" ยกกำลัง "+[...m].map(c=>SUP[c]).join("")+" ")
    .replace(/√/g," รากที่สองของ ").replace(/×/g," คูณ ").replace(/÷/g," หาร ").replace(/=/g," เท่ากับ ").replace(/[−–](?=\s*\d)/g," ลบ ")
    .replace(/%/g," เปอร์เซ็นต์ ").replace(/(\d) ?: ?(\d)/g,"$1 ต่อ $2").replace(/[→]/g," ได้ ").replace(/·/g,", ").replace(/\s+/g," ").trim();
}
function chunkText(t){
  const parts=String(t).replace(/\s+/g," ").trim().split(/(?<=[ .?!;])(?=\S)/), out=[];
  for(const p of parts){ if(out.length&&(out[out.length-1].length<22||p.trim().length<6)) out[out.length-1]+=p; else out.push(p) }
  return out.filter(x=>x.trim());
}
function readStop(){ try{ speechSynthesis.cancel() }catch(e){} RD.where=null; document.querySelectorAll(".rdbox").forEach(b=>b.remove()); document.querySelectorAll("[data-read]").forEach(b=>b.textContent=b.dataset.label) }
function readAloud(where, texts, after){
  if(RD.where===where){ readStop(); return }
  readStop();
  if(!CAN_SPEAK){ alertRead(where,"เครื่องนี้ใช้เสียงอ่านไม่ได้ ลองเปิดใน Safari หรือ Chrome"); return }
  const btn=document.querySelector(`[data-read="${where}"]`); if(!btn) return;
  RD.where=where; const groups=texts.map(t=>chunkText(t)); RD.chunks=groups.flat(); RD.k=0;
  const box=document.createElement("div"); box.className="rdbox"; box.setAttribute("aria-live","off");
  let n=0; box.innerHTML=`${groups.map(g=>`<div>${g.map(c=>`<span data-ck="${n++}">${esc(c)}</span>`).join("")}</div>`).join("")}
    <div class="row" style="margin-top:6px"><label class="small row" style="gap:6px"><input type="checkbox" id="rdslow" ${RD.slow?"checked":""}> อ่านช้าลง</label><span class="small muted">ให้ตาวิ่งตามตัวที่ไฮไลต์</span></div>`;
  btn.insertAdjacentElement("afterend",box); btn.textContent="⏹ หยุดอ่าน";
  box.querySelector("#rdslow").onchange=e=>{RD.slow=e.target.checked; try{localStorage.setItem("fieldnote.thslow",RD.slow?"1":"0")}catch(err){}};
  if(after) after();
  const v=thVoice(); let started=false;
  const next=()=>{ if(RD.where!==where) return;
    box.querySelectorAll("[data-ck]").forEach(x=>x.classList.toggle("now",+x.dataset.ck===RD.k));
    if(RD.k>=RD.chunks.length){ RD.where=null; btn.textContent=btn.dataset.label; box.querySelectorAll(".now").forEach(x=>x.classList.remove("now")); return }
    const u=new SpeechSynthesisUtterance(sayable(RD.chunks[RD.k])); u.lang="th-TH"; if(v) u.voice=v; u.rate=RD.slow?0.75:1;
    u.onstart=()=>{started=true}; u.onend=()=>{RD.k++; next()}; u.onerror=e=>{ if(e.error!=="interrupted"&&e.error!=="canceled"){ RD.where=null; btn.textContent=btn.dataset.label; alertRead(where,"เสียงภาษาไทยยังไม่พร้อม บน iPad ไปที่ การตั้งค่า › การช่วยการเข้าถึง › เนื้อหาที่ถูกพูด › เสียง › ไทย แล้วดาวน์โหลดเสียง") } };
    try{ speechSynthesis.speak(u) }catch(e){} };
  next();
  setTimeout(()=>{ if(!started&&RD.where===where&&!speechSynthesis.speaking) alertRead(where,"ยังไม่ได้ยินเสียง? บน iPad ไปที่ การตั้งค่า › การช่วยการเข้าถึง › เนื้อหาที่ถูกพูด › เสียง › ไทย แล้วดาวน์โหลดเสียง ถ้าเปิดจาก LINE ให้เปิดใน Safari แทน") },3000);
}
function alertRead(where,msg){ const b=document.querySelector(`[data-read="${where}"]`); if(!b) return; let n=document.getElementById("rdmsg"); if(!n){ n=document.createElement("p"); n.id="rdmsg"; n.className="small"; n.style.color="var(--warn)"; b.insertAdjacentElement("afterend",n) } n.textContent=msg }

};
const GLOSS_KEYS=Object.keys(GLOSS).sort((a,b)=>b.length-a.length);
function gloss(raw){
  let t=esc(raw); const marks=[];
  GLOSS_KEYS.forEach(k=>{ const ek=esc(k), i=t.indexOf(ek); if(i<0) return;
    marks.push(k); t=t.slice(0,i)+"\u0001"+(marks.length-1)+"\u0002"+t.slice(i+ek.length) });
  return t.replace(/\u0001(\d+)\u0002/g,(_,n)=>`<button class="term" type="button" data-t="${esc(marks[+n])}">${esc(marks[+n])}</button>`);
}
function bindGloss(){
  $v.querySelectorAll(".term").forEach(b=>b.onclick=()=>{
    const box=document.getElementById("gloss-box"); if(!box) return;
    const k=b.dataset.t; box.hidden=false; box.innerHTML=`<b>${esc(k)}</b> <span class="small">${esc(GLOSS[k]||"")}</span> <button class="btn ghost" id="gloss-x" style="border:0;padding:0 4px">ปิด</button>`;
    document.getElementById("gloss-x").onclick=()=>{box.hidden=true};
    if(S&&!S.glossed.includes(k)) S.glossed.push(k);
  });
}

/* ---------- scratch paper for the pencil ---------- */
const PAD={open:false,strokes:[],tool:"pen",penSeen:false};
function padHtml(){
  return `<button class="padfab" id="pad-toggle" type="button">${PAD.open?"✕ ปิดกระดาษทด":"✏️ กระดาษทด"}</button>
  <div class="pad" id="pad" ${PAD.open?"":"hidden"}>
    <div class="padbar"><button type="button" data-tool="pen" aria-pressed="${PAD.tool==="pen"}">✏️ ปากกา</button><button type="button" data-tool="eraser" aria-pressed="${PAD.tool==="eraser"}">🧽 ยางลบ</button>
      <button type="button" id="pad-undo">↶ ย้อน</button><button type="button" id="pad-clear">🗑 ล้าง</button></div>
    <canvas id="pad-canvas"></canvas></div>`;
}
function padSetup(){
  const tg=document.getElementById("pad-toggle"); if(!tg) return;
  tg.onclick=()=>{PAD.open=!PAD.open; document.body.classList.toggle("padopen",PAD.open); const p=document.getElementById("pad"); p.hidden=!PAD.open; tg.textContent=PAD.open?"✕ ปิดกระดาษทด":"✏️ กระดาษทด"; if(PAD.open) padDraw(true)};
  document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{PAD.tool=b.dataset.tool;document.querySelectorAll("[data-tool]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.tool===PAD.tool))});
  document.getElementById("pad-undo").onclick=()=>{PAD.strokes.pop();padDraw()};
  document.getElementById("pad-clear").onclick=()=>{PAD.strokes=[];padDraw()};
  const cv=document.getElementById("pad-canvas"); let cur=null;
  const pt=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top,e.pressure||0.5]};
  cv.onpointerdown=e=>{ if(e.pointerType==="pen") PAD.penSeen=true; if(PAD.penSeen&&e.pointerType==="touch") return; // palm rests while writing with the pencil
    cv.setPointerCapture(e.pointerId); cur={tool:PAD.tool,pts:[pt(e)]}; PAD.strokes.push(cur); e.preventDefault() };
  cv.onpointermove=e=>{ if(!cur) return; (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>cur.pts.push(pt(ev))); padDraw() };
  cv.onpointerup=cv.onpointercancel=()=>{cur=null};
  if(PAD.open){ document.body.classList.add("padopen"); padDraw(true) }
}
function padDraw(resize){
  const cv=document.getElementById("pad-canvas"); if(!cv||cv.offsetParent===null) return;
  const dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight;
  if(resize||cv.width!==Math.round(w*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr) }
  const g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  const ink=getComputedStyle(document.documentElement).getPropertyValue("--ink").trim()||"#16302B";
  PAD.strokes.forEach(s=>{ g.globalCompositeOperation=s.tool==="eraser"?"destination-out":"source-over"; g.strokeStyle=ink; g.lineCap="round"; g.lineJoin="round";
    for(let i=1;i<s.pts.length;i++){ const [x0,y0]=s.pts[i-1],[x1,y1,p]=s.pts[i]; g.lineWidth=s.tool==="eraser"?22:1.2+p*2.6; g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke() } });
  g.globalCompositeOperation="source-over";
}
window.addEventListener("resize",()=>padDraw(true));

/* ---------- one question ---------- */
function renderStep(){
  const st = S.steps[S.i];

  const q = st.q, ans = S.answered;

      ${tConf?`<span class="small muted">ตอบแล้วมั่นใจแค่ไหน ข้อที่ถูกแต่ไม่ชัวร์ ระบบจะเอามาให้ทวนอีกรอบ</span>`:""}
      <div class="row">${sendBtns}</div></div>`:"";
  let body;
  if(q.num){
    body = `<div class="num"><input id="numin" inputmode="decimal" aria-label="คำตอบ" ${ans?"disabled":""} value="${ans&&!ans.dontknow?esc(ans.raw):esc(S.numDraft||"")}"><span class="muted" style="align-self:center">${q.unit}</span>

    body = `<div class="opts">${q.opts.map((o,k)=>{

      const struck=!ans&&S.struck.includes(k);

      ${ans?"":`<p class="small muted">${staged?"แตะตัวเลือกเพื่อเลือก แล้วกดส่งคำตอบ · ":""}กด ✕ ท้ายข้อเพื่อตัดตัวเลือกที่ไม่ใช่แน่ๆ</p>`}${panel}`;
  }
  let fb = "";
  if(ans){
    const head = ans.dontknow?"ไม่เป็นไร มาดูวิธีคิดกัน (0 XP)":ans.correct?YAY[S.i%YAY.length]:OOPS[S.i%OOPS.length];
    const confNote = ans.dontknow||!ans.conf?"":ans.correct&&ans.conf==="unsure"?`<p class="small">ถูกแล้ว แต่ยังไม่ชัวร์ ระบบจะเอาข้อนี้มาให้ทวนอีกรอบ จะได้มั่นใจขึ้น</p>`
      :!ans.correct&&ans.conf==="sure"?`<p class="small"><b>มั่นใจแต่พลาด</b> ข้อแบบนี้ถ้าเข้าใจตอนนี้ จะจำได้แม่นที่สุด อ่านเฉลยช้าๆ นะ</p>`:"";
    const own = st.explain&&(ans.ownWhy||ans.ownWhyPad)?`<div class="feedback"><span class="small"><b>เหตุผลของเธอ:</b> ${ans.ownWhy?esc(ans.ownWhy):"(เขียนในกระดาษทด)"}</span><span class="small muted">ลองเทียบกับเฉลยด้านล่าง ตรงกันไหม ต่างกันตรงไหน</span></div>`:"";
    fb = `${own}<div class="feedback"><b class="${ans.correct?"ok":"no"}">${head}${q.num&&!ans.correct?` · คำตอบคือ ${q.answer} ${q.unit}`:""}</b>${confNote}<p>${gloss(q.ex)}</p>
      ${q.en?"":`<div>${readBtn("ex","🔊 ฟังเฉลย")}</div>`}
      ${ans.correct||ans.dontknow?"":`<span class="small muted">พลาดเพราะอะไร เลือกได้หลายข้อ (ช่วยให้ระบบเลือกข้อทบทวนได้ตรงขึ้น)</span>

    ${st.passage?passageDetails():""}
    <p class="prompt">${gloss(q.q)}</p>
    <div class="feedback" id="gloss-box" hidden></div>
    ${canQ&&!ans?`<div>${readBtn("q",waitMs?"🔊 ฟังโจทย์ (ลองอ่านเองก่อนนะ)":"🔊 ฟังโจทย์",waitMs>0)}</div>`:""}
    ${q.parts&&!ans?(S.partsShown?`<div class="feedback usebox"><b>🧩 แบ่งโจทย์ให้ดูทีละส่วน</b>
      <span class="small"><b>โจทย์ให้อะไรมา</b></span><ul style="margin:0;padding-left:1.2em">${(q.parts.given||[]).map(g=>`<li class="small">${esc(g)}</li>`).join("")}</ul>
      <span class="small"><b>โจทย์ถามอะไร</b> ${esc(q.parts.ask||"")}</span>${q.parts.watch?`<span class="small"><b>ระวัง</b> ${esc(q.parts.watch)}</span>`:""}</div>`
      :`<div><button class="btn ghost small" id="parts" type="button">🧩 ช่วยแบ่งโจทย์</button></div>`):""}
    ${S.hints?`<div class="feedback">${q.hints.slice(0,S.hints).map((h,k)=>`<span class="small"><b>คำใบ้ ${k+1}</b> ${esc(h)}</span>`).join("")}</div>`:""}
    ${body}${fb}

    ${st.optional&&!ans?`<button class="btn ghost" id="skip">ข้ามข้อนี้</button>`:""}</div>
  </section>${padHtml()}`;
  bindGloss(); padSetup();

  if(qb){ if(qb.disabled) RD.timer=setTimeout(()=>{ qb.disabled=false; qb.dataset.label="🔊 ฟังโจทย์"; if(RD.where!=="q") qb.textContent="🔊 ฟังโจทย์" },waitMs);
    qb.onclick=()=>readAloud("q",[q.q,...(q.num?[]:q.opts.map((o,k)=>`ตัวเลือกที่ ${k+1}: ${o}`))],()=>{S.listenQ=(S.listenQ||0)+1}) }
  const eb=$v.querySelector('[data-read="ex"]'); if(eb) eb.onclick=()=>readAloud("ex",[q.ex],()=>{S.listenEx=(S.listenEx||0)+1});

}
function answer(a){ readStop(); S.answered={...a,at:Date.now()}; if(!a.dontknow) S.why=[]; const y=window.scrollY; renderStep(); window.scrollTo({top:y}) }

async function finishWith(rec){
  if(S&&rec.type!=="vocab"){ S.active=false; if(S.mode==="set") clearProgress() }
  PAD.open=false; document.body.classList.remove("padopen");
  const prevList=mine(), before=progressOf(prevList), ssB=spellStats(prevList);
  const where=await saveAttempt(rec);
  const list=attempts.includes(rec)?mine():[rec,...mine()];
  const after=progressOf(list), ssA=spellStats(list);
  /* celebrations: only for things that matter, so they stay special */
  const cele=[];
  SPELLS.forEach(sp=>{ const tA=ssA[sp.id]?.tier||0, tB=ssB[sp.id]?.tier||0; if(tA>tB) cele.push({kind:"tier",sp,tier:tA}) });
  Object.keys(REALMS).forEach(rk=>{ const sps=SPELLS.filter(s=>s.realm===rk);
    if(sps.every(s=>(ssA[s.id]?.tier||0)>=1)&&!sps.every(s=>(ssB[s.id]?.tier||0)>=1)) cele.push({kind:"realm",rk}) });
  MILESTONES.filter(m=>after.best>=m&&before.best<m).forEach(m=>cele.push({kind:"milestone",m}));
  if(after.questDoneThisWeek&&!before.questDoneThisWeek) cele.push({kind:"quest"});
  if(after.freeze>before.freeze) cele.push({kind:"ice",why:after.earnedToday.map(e=>e.why).join(", ")});
  S={...S,where,rec,before,after,list,cele,ci:0}; view="done"; render(); window.scrollTo({top:0});
}

    ${(m.questions||[]).length?`<div class="feedback"><b>สรุปผลภารกิจ</b>${!okRows&&!done?`<span class="small muted">บันทึกข้อมูลให้ได้อย่างน้อย ${need} แถวก่อน แล้วค่อยตอบ</span>`:""}
      ${m.questions.map(q=>`<label class="small" for="mq-${q.id}">${esc(q.q)}${q.optional?" (ไม่บังคับ)":""}</label>
      <textarea id="mq-${q.id}" data-q="${q.id}" rows="2" maxlength="500" ${done||!okRows?"disabled":""} style="font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)">${esc((done?rec.answers?.[q.id]:st.ans[q.id])||"")}</textarea>`).join("")}</div>`:""}
    ${done&&stats?`<div class="feedback usebox"><b>ระบบคำนวณให้เทียบกับที่เธอคิด</b><span class="small">ข้อมูล ${stats.n} ค่า · ค่าเฉลี่ย ${r1(stats.mean)} · มัธยฐาน ${r1(stats.med)} · ต่ำสุด ${stats.min} · สูงสุด ${stats.max} · พิสัย ${r1(stats.max-stats.min)}</span></div>`:""}
    ${done?`<p><b>ภารกิจนี้สำเร็จแล้ว +${rec.xp} XP 🌏</b></p>${store!=="db"&&!rec.sent?`<p class="small muted">อย่าลืมส่งผลให้พ่อดูนะ พ่ออยากเห็นข้อมูลที่เก็บมา</p>`:""}`
      :`<button class="btn" id="msave" ${okRows&&okAns?"":"disabled"}>ส่งภารกิจ รับ ${m.xp||100} XP</button>`}
    <button class="btn ghost" id="mback" style="border:0;padding-left:0">← กลับ</button></section>`;
  const keep=()=>mSave(m.id,st);

  $v.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{st.rows.splice(+b.dataset.del,1);keep();renderMission()});
  const ar=document.getElementById("addrow"); if(ar) ar.onclick=()=>{ const vals=[...$v.querySelectorAll(".mi")].map(i=>i.value.trim()); if(vals.every(v=>!v)) return;
    if(R.numCol!=null&&!isFinite(parseFloat(vals[R.numCol]))){ $v.querySelector(`.mi[data-c="${R.numCol}"]`).focus(); return }
    st.rows.push(vals); keep(); renderMission() };
  document.getElementById("mback").onclick=()=>{view="home";render()};
  const sb=document.getElementById("msave"); if(sb) sb.onclick=async()=>{ sb.disabled=true; sb.textContent="กำลังบันทึก…"; const now=new Date().toISOString();
    await saveAttempt({type:"mission",setId:m.id,topic:m.title,startedAt:now,endedAt:now,durationSec:0,correct:0,total:0,xp:m.xp||100,items:[],rows:st.rows,answers:st.ans,stepsDone:st.steps.filter(Boolean).length});
    attempts=store==="db"?attempts:lsRead(); renderMission(); window.scrollTo({top:0}) };
}

function pickArt(id, done){

  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f) return; const url=URL.createObjectURL(f), img=new Image();
    img.onload=()=>{ const max=360, k=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement("canvas");
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);

/* ---------- vocabulary (spaced boxes: 1, 2, 4, 7, 14 days) ---------- */
const BOX_DAYS=[1,2,4,7,14];

function vocabState(){ try{ return JSON.parse(localStorage.getItem("fieldnote.vocab")||"{}") }catch(e){ return {} } }
function saveVocabState(v){ try{ localStorage.setItem("fieldnote.vocab",JSON.stringify(v)) }catch(e){} }
function isWeekend(){ const d=new Date().getDay(); return d===0||d===3||d===6 }
function vocabToday(){
  const st=vocabState(), t=todayKey();
  return {due:VOCAB.filter(x=>st[x.w]&&st[x.w].due<=t).sort((a,b)=>st[a.w].due-st[b.w].due).slice(0,8), fresh:VOCAB.filter(x=>!st[x.w]).slice(0,5)};
}
/* pronunciation: the browser's own English voice (works on iPad and Android Chrome) */
/* Some in-app browsers (LINE, Facebook, the Claude app) hide the voice engine, so detect it and offer a way out */
const CAN_SPEAK = typeof speechSynthesis!=="undefined" && typeof SpeechSynthesisUtterance!=="undefined";
const UA = navigator.userAgent||"";
const IN_APP = /Line\/|FBAN|FBAV|Instagram|; wv\)|Claude/i.test(UA);
const IS_ANDROID = /Android/i.test(UA);
let speechBroken = !CAN_SPEAK;
try{ if(CAN_SPEAK) speechSynthesis.getVoices(); }catch(e){}
function speak(text, slow){
  if(!CAN_SPEAK){ speechBroken=true; showSpeechHelp(); return }
  try{
    if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=slow?0.42:0.9;
    const v=pickVoice(); if(v){ u.voice=v; u.lang=v.lang }
    let started=false; u.onstart=()=>{started=true;speechBroken=false;hideSpeechHelp()}; u.onerror=e=>{ if(e.error!=="interrupted"&&e.error!=="canceled"){speechBroken=true;showSpeechHelp()} };
    speechSynthesis.speak(u);
    setTimeout(()=>{ if(!started&&!speechSynthesis.speaking){ speechBroken=true; showSpeechHelp() } },2500);
  }catch(e){ speechBroken=true; showSpeechHelp() }
}
function enVoices(){ try{ return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)) }catch(e){ return [] } }
function pickVoice(){ const vs=enVoices(); let want=null; try{ want=localStorage.getItem("fieldnote.voice") }catch(e){}
  return vs.find(v=>v.voiceURI===want)||vs.find(v=>/^en(-|_)US/i.test(v.lang)&&v.localService)||vs.find(v=>/^en(-|_)US/i.test(v.lang))||vs[0]||null }
function voicePicker(){
  const vs=enVoices(); if(!vs.length) return "";
  const cur=pickVoice();
  return `<details class="small"><summary>🎙 เลือกเสียงผู้อ่าน (${esc(cur?cur.name:"ค่าเริ่มต้น")})</summary>
    <div class="row" style="margin-top:6px"><select id="voice-sel" style="font:inherit;padding:6px;border-radius:8px;max-width:100%">${vs.map(v=>`<option value="${esc(v.voiceURI)}" ${cur&&v.voiceURI===cur.voiceURI?"selected":""}>${esc(v.name)} · ${esc(v.lang)}</option>`).join("")}</select>
    <button class="btn ghost" id="voice-try" type="button">ลองฟัง</button></div></details>`;
}
function bindVoicePicker(){
  const sel=document.getElementById("voice-sel"); if(!sel) return;
  sel.onchange=()=>{ try{ localStorage.setItem("fieldnote.voice",sel.value) }catch(e){} speak("Hello! Let's learn new words.") };
  document.getElementById("voice-try").onclick=()=>speak("Hello! Let's learn new words.");
}
try{ if(CAN_SPEAK) speechSynthesis.onvoiceschanged=()=>{ if(view==="vocab"&&!document.getElementById("voice-sel")) renderVocab() } }catch(e){}

    ${chrome}<p class="small muted">ระหว่างนี้อ่านออกเสียงเองไปก่อนได้ ปุ่มต่อไปจะกดได้ตามปกติ</p></div>`;

function showSpeechHelp(){ if(document.getElementById("speech-help")) return; const box=document.getElementById("speech-slot"); if(box){ box.innerHTML=speechHelpHtml(); } const vn=document.getElementById("vn"); if(vn&&V&&V.phase==="learn") vn.disabled=false }

function vOpts(word,dir){
  const others=VOCAB.filter(x=>x.w!==word.w).sort(()=>Math.random()-.5).slice(0,3);
  const all=[word,...others].sort(()=>Math.random()-.5);
  return {opts:all.map(x=>dir==="en"?x.th:x.w), a:all.indexOf(word)};
}
function startVocab(){
  const {due,fresh}=vocabToday(); if(!due.length&&!fresh.length) return;
  const st=vocabState();
  // new words: meaning first, spelling later in the round; review words: spelling once they have been seen twice
  const meaning=[...fresh.map(w=>({w,kind:"mc",dir:"en",fresh:true})),...due.map((w,k)=>({w,kind:"mc",dir:k%2?"en":"th"}))].map(x=>({...x,...vOpts(x.w,x.dir)}));
  const spellNew=fresh.map(w=>({w,kind:"spell",fresh:true}));
  const spellDue=due.filter(w=>(st[w.w]?.box||0)>=2||Math.random()<.5).map(w=>({w,kind:"spell"}));
  const quiz=[...meaning.sort(()=>Math.random()-.5),...[...spellNew,...spellDue].sort(()=>Math.random()-.5)];
  const base=isWeekend()?READINGS[Math.floor(todayKey()/DAY)%READINGS.length]:null;
  const read=base?{...base,qs:base.qs.map((q,qi)=>{const sq=shuffleQ(q); return {...sq,qth:base.th.qs[qi].q,optsTh:sq.perm.map(k=>base.th.qs[qi].opts[k])}})}:null;
  V={active:true,fresh,quiz,read,phase:fresh.length?"learn":"quiz",li:0,qi:0,ri:0,ans:null,results:[],rres:[],heard:new Set(),showTh:false,start:Date.now()};
  view="vocab"; render(); window.scrollTo({top:0});
}

/* replay the vocabulary sessions that are kept, so removed tries do not leave words half-learned */
function rebuildVocabState(list){
  const st={};
  list.filter(a=>a.type==="vocab").sort((a,b)=>new Date(a.endedAt)-new Date(b.endedAt)).forEach(a=>{
    const t=dayKey(a.endedAt), byWord={};
    (a.items||[]).forEach(i=>{ if(i.word) byWord[i.word]=(byWord[i.word]??true)&&i.correct });
    Object.entries(byWord).forEach(([w,ok])=>{ const cur=st[w]?.box||0, box=ok?Math.min(BOX_DAYS.length,cur+1):1; let due=t; for(let k=0;k<BOX_DAYS[box-1];k++) due=nextDay(due); st[w]={box,due} });
  });
  saveVocabState(st);

async function finishVocab(){
  V.active=false;
  try{ if(CAN_SPEAK) speechSynthesis.cancel() }catch(e){}
  $v.innerHTML=`<section class="card"><p class="muted">กำลังบันทึก…</p></section>`;
  const st=vocabState(), t=todayKey(), byWord={};
  V.results.forEach(r=>{ byWord[r.w]=(byWord[r.w]??true)&&r.correct });   // a word moves up only if every item on it was right
  Object.entries(byWord).forEach(([w,ok])=>{ const cur=st[w]?.box||0; const box=ok?Math.min(BOX_DAYS.length,cur+1):1;
    let due=t; for(let i=0;i<BOX_DAYS[box-1];i++) due=nextDay(due); st[w]={box,due} });
  saveVocabState(st);
  const c=V.results.filter(r=>r.correct).length, rc=V.rres.filter(Boolean).length;
  const sp=V.results.filter(r=>r.kind==="spell");
  await finishWith({type:"vocab",setId:"vocab",subject:"อังกฤษ",topic:"คำศัพท์วันนี้",startedAt:new Date(V.start).toISOString(),endedAt:new Date().toISOString(),
    durationSec:Math.round((Date.now()-V.start)/1000),correct:c,total:V.results.length,newWords:V.fresh.length,
    spelling:{correct:sp.filter(r=>r.correct).length,total:sp.length},
    reading:V.read?{correct:rc,total:V.rres.length}:null,xp:c*5+(V.results.length-c)*2+rc*5+(V.rres.length-rc)*2,
    items:V.results.map(r=>({qid:"v:"+r.w,word:r.w,kind:r.kind,fresh:r.fresh,correct:r.correct}))});
}
