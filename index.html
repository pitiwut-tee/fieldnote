<style>
/* Layout: one narrow column like a pocket field notebook; parent view is the same column with summary first. */
:root{
  --paper:#F2F6F4; --card:#FFFFFF; --ink:#16302B; --muted:#5B716B; --line:#D3E0DB;
  --accent:#1F7A8C; --accent-ink:#FFFFFF; --beak:#D9822B; --good:#2E8B57; --bad:#C0453A; --warn:#B7841C;
  --soft:#E3EEEA;

  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1A18; --card:#172623; --ink:#E2ECE8; --muted:#97ABA5; --line:#2A3D39;
  --accent:#4FB3C6; --accent-ink:#0B1715; --beak:#E9A35A; --good:#5CC48A; --bad:#EF7C70; --warn:#E3B54E; --soft:#1E302C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1A18; --card:#172623; --ink:#E2ECE8; --muted:#97ABA5; --line:#2A3D39;
  --accent:#4FB3C6; --accent-ink:#0B1715; --beak:#E9A35A; --good:#5CC48A; --bad:#EF7C70; --warn:#E3B54E; --soft:#1E302C; color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65}
.wrap{max-width:620px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:1.7rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand small{color:var(--muted);font-size:.85rem}
.tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:999px}
.tabs a{padding:6px 14px;border-radius:999px;color:var(--ink);text-decoration:none;font-size:.9rem}
.tabs a[aria-current="page"]{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:.78rem;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.sets{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.sets{grid-template-columns:1fr 1fr}}
.set{text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.set:hover{border-color:var(--accent)}
.set .subj{font-family:var(--display);font-size:1.15rem}
.set .meta{color:var(--muted);font-size:.88rem}

.chip.l2{background:color-mix(in srgb,var(--warn) 22%,transparent)}
.chip.l3{background:color-mix(in srgb,var(--beak) 26%,transparent)}
.week{display:flex;gap:8px;flex-wrap:wrap}
.day{width:38px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;color:var(--muted)}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line)}

.dot.rest{border-style:dashed}
.progress{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.stage{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.prompt{font-size:1.08rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}

.btn{font:inherit;font-family:var(--display);border:0;border-radius:12px;padding:11px 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer;width:fit-content}

.feedback{border-radius:12px;padding:12px 14px;background:var(--soft);display:flex;flex-direction:column;gap:8px}

.why{display:flex;gap:6px;flex-wrap:wrap}
.why button{font:inherit;font-size:.85rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.why button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,var(--card))}
.concept{display:flex;flex-direction:column;gap:10px}
.concept ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.formula{font-family:var(--mono);background:var(--soft);border-radius:10px;padding:10px 12px;overflow-x:auto;font-size:.92rem}
.vocab{display:flex;gap:6px;flex-wrap:wrap}
.vocab span{font-size:.85rem;border:1px dashed var(--line);border-radius:8px;padding:3px 9px}
.vocab span i{font-style:normal;color:var(--muted)}
.rate{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--mono);font-size:1.35rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:7.5em 1fr 3.2em;gap:8px;align-items:center;font-size:.88rem}
.bar .track{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar .track i{display:block;height:100%}
.bar .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.topic{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.topic:last-child{border-bottom:0}
.pill{font-size:.78rem;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill.g{background:color-mix(in srgb,var(--good) 20%,transparent)}
.pill.y{background:color-mix(in srgb,var(--warn) 24%,transparent)}
.pill.r{background:color-mix(in srgb,var(--bad) 20%,transparent)}
.log{display:flex;flex-direction:column;gap:10px}
.logi{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.example{font-size:.75rem;color:var(--beak);border:1px solid var(--beak);border-radius:6px;padding:0 6px}
.analysis{white-space:pre-wrap;font-size:.94rem}
.note{font-size:.84rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

function b64e(str){const b=new TextEncoder().encode(str);let o="";for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(o)}
function b64d(x){return new TextDecoder().decode(Uint8Array.from(atob(x),c=>c.charCodeAt(0)))}
function lsFb(){ try{ return JSON.parse(localStorage.getItem("fieldnote.fb")||"[]") }catch(e){ return [] } }
function unsent(){ return {a:lsRead().filter(x=>!x.sent), f:lsFb().filter(x=>!x.sent)} }
function markSent(){ lsWrite(lsRead().map(x=>({...x,sent:true}))); try{localStorage.setItem("fieldnote.fb",JSON.stringify(lsFb().map(x=>({...x,sent:true}))))}catch(e){} attempts=lsRead() }
function exportCode(all){ const a=all?lsRead():unsent().a, f=all?lsFb():unsent().f; return (a.length||f.length)?"FIELDNOTE1:"+b64e(JSON.stringify({a:a.map(({sent,...x})=>x),f:f.map(({sent,...x})=>x)})):"" }

    <button class="btn ghost" id="sback" style="border:0;padding-left:0">← กลับหน้าแรก</button></section>`;
  document.getElementById("sback").onclick=()=>{view="home";render()};

  if(!code) return;

    try{await navigator.clipboard.writeText(t.value);m.textContent="คัดลอกแล้ว ไปวางใน LINE ได้เลย"}catch(e){t.focus();t.select();m.textContent="กดค้างที่กล่องรหัสแล้วเลือกคัดลอก"}};
  document.getElementById("sent").onclick=()=>{markSent();view="home";render()};
}
async function importCode(raw){
  const m=raw.match(/FIELDNOTE1:([A-Za-z0-9+/=\s]+)/); if(!m) throw new Error("bad");
  const data=JSON.parse(b64d(m[1].replace(/\s/g,"")));
  let n=0,k=0;
  for(const a of (data.a||[])){ const id=("s-"+(a.setId||a.type)+"-"+a.endedAt).replace(/[^A-Za-z0-9_-]/g,""); const {example,...rest}=a; await db.collection("attempts").doc(id).set({...rest,via:"code"}); n++ }
  for(const f of (data.f||[])){ const id=("f-"+f.at).replace(/[^A-Za-z0-9_-]/g,""); await db.collection("feedback").doc(id).set(f); k++ }
  return {n,k};
}

function startSet(set, conceptFirst){
  const warm = set.warm.map(q=>({kind:"q",phase:"อุ่นเครื่อง (ทบทวนของเก่า)",q}));
  const card = {kind:"concept",phase:"การ์ดสรุปเนื้อหา"};
  const steps = [
    ...(conceptFirst?[card,...warm]:[...warm,card]),
    ...set.practice.map(q=>({kind:"q",phase:"ฝึกทำ",q})),
    {kind:"q",phase:"ข้อท้าทาย (ไม่บังคับ)",q:set.challenge,optional:true},
    {kind:"rate",phase:"ปิดท้าย"}
  ];
  S = {set, conceptFirst, steps, i:0, start:Date.now(), qStart:Date.now(), items:[], answered:null, why:null, rating:null, hints:0, confused:[], altShown:0};
  view="session"; render();
}

function render(){
  document.getElementById("tab-home").setAttribute("aria-current", view==="parent"?"false":"page");
  document.getElementById("tab-parent")?.setAttribute("aria-current", view==="parent"?"page":"false");
  if(view==="home") return renderHome();
  if(view==="intro") return renderIntro();
  if(view==="feedback") return renderFeedback();
  if(view==="send") return renderSend(false);
  if(view==="skip") return renderSkip();
  if(view==="session") return renderStep();
  if(view==="done") return renderDone();
  if(view==="parent") return renderParent();
}

  try{ const a=JSON.parse(localStorage.getItem("fieldnote.fb")||"[]"); a.unshift(rec); localStorage.setItem("fieldnote.fb",JSON.stringify(a)) }catch(e){}

function renderFeedback(){
  $v.innerHTML=`<section class="card"><h2>เขียนถึง Claude</h2>
    <p class="small muted">ไม่มีถูกผิด ตัวอย่าง: "ข้อเอลฟ์ขำดี อยากได้แบบนี้อีก" "การ์ดสรุปยาวไป" "อยากเปลี่ยนสีเป็นโทนม่วง"</p>

const YAY=["ถูกต้อง","ถูกต้อง เก่งมาก","เป๊ะ!","ถูก เวทนี้ใช้ได้","ใช่เลย"];
const OOPS=["ยังไม่ใช่ แต่ไม่เป็นไร","เกือบแล้ว","ยังไม่ถูก ลองดูเฉลยกัน","พลาดนิดเดียว"];
function header(){
  const pct = Math.round(S.i/(S.steps.length-1)*100);
  return `<div class="stage"><span>${esc(S.set.topic)}</span><span>${S.steps[S.i].phase}</span></div>
  <div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div>`;
}

function renderStep(){
  const st = S.steps[S.i];
  if(st.kind==="concept") return renderConcept();
  if(st.kind==="rate") return renderRate();
  const q = st.q, ans = S.answered;
  let body;
  if(q.num){
    body = `<div class="num"><input id="numin" inputmode="decimal" aria-label="คำตอบ" ${ans?"disabled":""} value="${ans?esc(ans.raw):""}"><span class="muted" style="align-self:center">${q.unit}</span>
      ${ans?"":`<button class="btn" id="check">ตรวจคำตอบ</button>`}</div>`;
  } else {
    body = `<div class="opts">${q.opts.map((o,k)=>{
      let c=""; if(ans){ if(k===q.a) c="right"; else if(k===ans.choice) c="wrong"; }
      return `<button class="opt ${c}" data-k="${k}" ${ans?"disabled":""}>${esc(o)}</button>`}).join("")}</div>`;
  }
  let fb = "";
  if(ans){
    fb = `<div class="feedback"><b class="${ans.correct?"ok":"no"}">${ans.correct?YAY[S.i%YAY.length]:OOPS[S.i%OOPS.length]}${q.num&&!ans.correct?` คำตอบคือ ${q.answer} ${q.unit}`:""}</b><p>${esc(q.ex)}</p>
      ${ans.correct?"":`<span class="small muted">พลาดเพราะอะไร (ช่วยให้ระบบเลือกข้อทบทวนได้ตรงขึ้น)</span>
      <div class="why">${Object.entries(ERR).map(([k,v])=>`<button data-why="${k}" aria-pressed="${S.why===k}">${v}</button>`).join("")}</div>`}
    </div>
    <button class="btn" id="next">ต่อไป</button>`;
  }
  $v.innerHTML = `<section class="card">${header()}
    <span class="chip l${q.level}">${LV[q.level]} · ${esc(q.topic)}</span>
    <p class="prompt">${esc(q.q)}</p>
    ${S.hints?`<div class="feedback">${q.hints.slice(0,S.hints).map((h,k)=>`<span class="small"><b>คำใบ้ ${k+1}</b> ${esc(h)}</span>`).join("")}</div>`:""}
    ${body}${fb}
    <div class="row">${!ans&&S.hints<q.hints.length?`<button class="btn ghost" id="hint">ขอคำใบ้ (${S.hints}/${q.hints.length})</button>`:""}
    ${st.optional&&!ans?`<button class="btn ghost" id="skip">ข้ามข้อนี้</button>`:""}
    ${ans&&!ans.correct?`<button class="btn ghost" id="confq">${S.confused.some(c=>c.qid===q.id)?"บันทึกแล้ว พ่อกับ Claude จะช่วยดู":"ยังงงอยู่ ขอให้ช่วย"}</button>`:""}</div>
  </section>`;
  if(!ans){
    if(q.num){
      const go=()=>{const raw=document.getElementById("numin").value.trim().replace(/,/g,"");const v=parseFloat(raw);if(raw===""||isNaN(v))return;
        answer({raw, correct:Math.abs(v-q.answer)<=q.tol});};
      document.getElementById("check").onclick=go;
      document.getElementById("numin").onkeydown=e=>{if(e.key==="Enter")go()};
      document.getElementById("numin").focus();
    } else $v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer({choice:+b.dataset.k,correct:+b.dataset.k===q.a}));
    const hb=document.getElementById("hint"); if(hb) hb.onclick=()=>{S.hints++;renderStep()};
    const sk=document.getElementById("skip"); if(sk) sk.onclick=()=>{S.items.push({qid:q.id,topic:q.topic,level:q.level,skipped:true,timeSec:0});advance()};
  } else {
    $v.querySelectorAll("[data-why]").forEach(b=>b.onclick=()=>{S.why=b.dataset.why;renderStep()});
    const cq=document.getElementById("confq"); if(cq) cq.onclick=()=>{if(!S.confused.some(c=>c.qid===q.id))S.confused.push({where:"question",qid:q.id,topic:q.topic,prompt:q.q});renderStep()};
    document.getElementById("next").onclick=()=>{
      S.items.push({qid:q.id,topic:q.topic,level:q.level,phase:st.phase,correct:ans.correct,errorType:ans.correct?null:(S.why||"unspecified"),hints:S.hints,timeSec:Math.round((ans.at-S.qStart)/1000),prompt:q.q});
      advance();
    };
  }
}
function answer(a){ S.answered={...a,at:Date.now()}; S.why=null; renderStep() }
function advance(){ S.i++; S.answered=null; S.why=null; S.hints=0; S.qStart=Date.now(); renderStep(); window.scrollTo({top:0}) }

function renderConcept(){
  const c=S.set.concept;
  $v.innerHTML=`<section class="card concept">${header()}
    <h2>${esc(c.title)}</h2>
    <ul>${c.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
    ${c.formulas.map(f=>`<div class="formula">${esc(f)}</div>`).join("")}
    <div><span class="eyebrow">คำศัพท์อังกฤษวันนี้</span><div class="vocab">${c.vocab.map(([e,t])=>`<span>${e} <i>${t}</i></span>`).join("")}</div></div>
    ${c.alts.slice(0,S.altShown).map(a=>`<div class="feedback"><b>${esc(a.label)}</b>${a.lines.map(l=>`<p class="small">${esc(l)}</p>`).join("")}</div>`).join("")}
    <div class="row"><button class="btn" id="next">เข้าใจแล้ว ไปต่อ</button>
    ${S.altShown<c.alts.length?`<button class="btn ghost" id="alt">ยังไม่เข้าใจ อธิบายอีกแบบ</button>`:`<button class="btn ghost" id="confc">${S.confused.some(x=>x.where==="concept")?"บันทึกแล้ว พ่อกับ Claude จะช่วยดู":"ยังงงอยู่ ขอให้ช่วย"}</button>`}</div></section>`;
  const al=document.getElementById("alt"); if(al) al.onclick=()=>{S.altShown++;renderConcept()};
  const cc=document.getElementById("confc"); if(cc) cc.onclick=()=>{if(!S.confused.some(x=>x.where==="concept"))S.confused.push({where:"concept",topic:S.set.topic});renderConcept()};
  document.getElementById("next").onclick=()=>{S.conceptSec=Math.round((Date.now()-S.qStart)/1000);advance()};
}

function renderRate(){
  $v.innerHTML=`<section class="card">${header()}
    <h2>วันนี้รู้สึกอย่างไร</h2>
    <div class="rate">${["ง่าย","พอดี","ยาก"].map(r=>`<button class="btn ${S.rating===r?"":"ghost"}" data-r="${r}">${r}</button>`).join("")}</div>
    <label class="small muted" for="memo">อยากบอกอะไรเพิ่มไหม (ไม่บังคับ)</label>
    <input id="memo" style="font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)" placeholder="เช่น ข้อปลาสนุกดี / การ์ดสรุปยาวไป">
    <button class="btn" id="save" ${S.rating?"":"disabled"}>บันทึกและจบวันนี้</button></section>`;
  $v.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const m=document.getElementById("memo").value;S.rating=b.dataset.r;renderRate();document.getElementById("memo").value=m});
  document.getElementById("save").onclick=async e=>{
    e.target.disabled=true; e.target.textContent="กำลังบันทึก…";
    const items=S.items, scored=items.filter(x=>!x.skipped);
    const rec={setId:S.set.id,subject:S.set.subject,topic:S.set.topic,startedAt:new Date(S.start).toISOString(),endedAt:new Date().toISOString(),
      durationSec:Math.round((Date.now()-S.start)/1000),conceptSec:S.conceptSec||0,rating:S.rating,memo:document.getElementById("memo").value.trim(),
      correct:scored.filter(x=>x.correct).length,total:scored.length,altShown:S.altShown,confused:S.confused,items};
    S.where = await saveAttempt(rec); S.rec=rec; view="done"; render();
  };
}

function renderDone(){
  const r=S.rec, mins=Math.max(1,Math.round(r.durationSec/60));
  const byL=[1,2,3].map(l=>{const it=r.items.filter(x=>x.level===l&&!x.skipped);return `${LV[l].split(" · ")[0]}: ${it.filter(x=>x.correct).length}/${it.length}`}).join(" · ");
  $v.innerHTML=`<section class="card"><span class="eyebrow">เสร็จแล้ว</span><h2>ทำได้ ${r.correct} จาก ${r.total} ข้อ ใน ${mins} นาที</h2>
    <p class="muted">${byL}</p>
    <p class="small muted">${S.where==="db"?"บันทึกแล้ว พ่อเห็นสรุปได้จากหน้าผู้ปกครอง":"บันทึกไว้ในเครื่องนี้แล้ว อย่าลืมส่งผลให้พ่อนะ"}</p>
    <div class="row"><button class="btn" id="home">กลับหน้าแรก</button><button class="btn ghost" id="fb2">เขียนถึง Claude</button>${S.where==="local"?`<button class="btn" id="send2">ส่งผลให้พ่อ</button>`:""}</div></section>`;
  const s2=document.getElementById("send2"); if(s2) s2.onclick=()=>{view="send";render()};
  document.getElementById("fb2").onclick=()=>{view="feedback";render()};
  document.getElementById("home").onclick=()=>{location.hash="#home";view="home";render()};
}

/* ---------- parent view ---------- */
let showExamples = true, analysisText = "", fbList = [];
(async()=>{ const d=await (window.claude?.use?.("db")??Promise.resolve(null)).catch(()=>null); if(!d) return;
  try{ d.collection("feedback").orderBy("at","desc").limit(30).onSnapshot(s=>{fbList=s.docs.map(x=>x.data());if(view==="parent")render()},()=>{}) }catch(e){} })();
function renderParent(){
  const pool = showExamples ? attempts : realAttempts();
  const all = pool.filter(a=>!isSkip(a)), skips = pool.filter(isSkip);
  const conf = all.flatMap(a=>(a.confused||[]).map(c=>({...c,date:a.endedAt})));
  const hasEx = attempts.some(a=>a.example);
  const items = all.flatMap(a=>a.items||[]).filter(x=>!x.skipped);
  const mins = Math.round(all.reduce((s,a)=>s+(a.durationSec||0),0)/60);
  const acc = items.length? Math.round(items.filter(x=>x.correct).length/items.length*100):0;
  const lv = [1,2,3].map(l=>{const it=items.filter(x=>x.level===l);return {l,n:it.length,p:it.length?Math.round(it.filter(x=>x.correct).length/it.length*100):0}});
  const topics = {}; items.forEach(x=>{(topics[x.topic]??={n:0,c:0}).n++; if(x.correct) topics[x.topic].c++});
  const errs = {}; items.filter(x=>!x.correct).forEach(x=>{errs[x.errorType||"unspecified"]=(errs[x.errorType||"unspecified"]||0)+1});
  const talk = items.filter(x=>!x.correct && (x.errorType==="concept"||x.level===3)).slice(0,3);
  const ratings = all.map(a=>a.rating).filter(Boolean);
  const hardRun = ratings.slice(0,3).filter(r=>r==="ยาก").length;
  const empty = !all.length;
  $v.innerHTML = `
  <section class="card">
    <div class="row" style="justify-content:space-between"><h2>ภาพรวม</h2>
      ${hasEx?`<label class="small row" style="gap:6px"><input type="checkbox" id="ex" ${showExamples?"checked":""}> แสดงข้อมูลตัวอย่าง</label>`:""}</div>
    ${empty?`<p class="muted">ยังไม่มีการฝึก เมื่อลูกทำชุดแรกเสร็จ หรือนำเข้ารหัสจากเครื่องลูก สรุปจะขึ้นที่นี่</p>`:`
    <div class="stats">
      <div class="stat"><b>${all.length}</b><span>ครั้งที่ฝึก</span></div>
      <div class="stat"><b>${mins}</b><span>นาทีรวม</span></div>
      <div class="stat"><b>${acc}%</b><span>ตอบถูก</span></div>
    </div>
    <p class="note">เวลาคือช่วงที่เปิดหน้าเว็บ ใช้ดูแนวโน้ม ไม่ใช่เวลาที่ตั้งใจจริงทั้งหมด</p>`}
  </section>
  ${db?`<section class="card"><h3>นำเข้าผลจากเครื่องลูก</h3>
    <p class="small muted">วางรหัสที่ลูกส่งมาทาง LINE (ขึ้นต้นด้วย FIELDNOTE1:) ส่งรหัสเดิมซ้ำได้ ระบบไม่นับซ้ำ</p>
    <textarea id="imp" rows="3" style="font-family:var(--mono);font-size:.75rem;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)"></textarea>
    <div class="row"><button class="btn" id="impgo">นำเข้า</button><span class="small" id="impmsg" aria-live="polite"></span></div></section>`:""}
  ${empty?"":`
  <section class="card"><h3>ความแม่นตามระดับความยาก</h3><div class="bars">
    ${lv.map(x=>`<div class="bar"><span>${LV[x.l].split(" · ")[1]}</span><span class="track"><i style="width:${x.p}%;background:var(${x.l===1?"--good":x.l===2?"--warn":"--beak"})"></i></span><span class="v">${x.n?x.p+"%":"–"}</span></div>`).join("")}
  </div></section>
  <section class="card"><h3>แผนที่หัวข้อ</h3><div>
    ${Object.entries(topics).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).map(([t,v])=>{const p=v.c/v.n;const cls=p>=.8?"g":p>=.5?"y":"r";const lab=p>=.8?"แน่น":p>=.5?"พอได้":"ต้องทบทวน";
      return `<div class="topic"><span>${esc(t)} <span class="muted small">(${v.c}/${v.n})</span></span><span class="pill ${cls}">${lab}</span></div>`}).join("")}
  </div></section>
  <section class="card"><h3>ข้อที่ผิด ผิดเพราะอะไร</h3><div class="bars">
    ${Object.keys(errs).length?Object.entries(errs).map(([k,n])=>`<div class="bar"><span>${ERR[k]||"ไม่ระบุ"}</span><span class="track"><i style="width:${Math.min(100,n*20)}%;background:var(--bad)"></i></span><span class="v">${n}</span></div>`).join(""):`<p class="muted small">ยังไม่มีข้อผิด</p>`}
  </div>
  <p class="note">ผิดเพราะไม่เข้าใจหลัก ต้องอธิบายใหม่ ผิดเพราะอ่านพลาดหรือคิดเลขผิด ต้องฝึกความรอบคอบ คนละวิธีแก้กัน</p></section>
  <section class="card"><h3>ลูกขอให้ช่วย</h3>
    ${conf.length?conf.slice(0,5).map(c=>`<div class="logi"><span class="chip">${c.where==="concept"?"การ์ดสรุป":"โจทย์"} · ${esc(c.topic)}</span>${c.prompt?`<span class="small">${esc(c.prompt)}</span>`:`<span class="small muted">อ่านคำอธิบายครบทุกแบบแล้วยังงง</span>`}</div>`).join("")+`<p class="note">ถามผมในแชตได้ เช่น "ช่วยเขียนคำอธิบายใหม่เรื่องนี้" ผมจะใส่ไว้ในชุดถัดไป</p>`:`<p class="muted small">ยังไม่มีคำขอ</p>`}
  </section>
  <section class="card"><h3>วันที่ขอพัก</h3>
    ${skips.length?skips.slice(0,7).map(k=>`<div class="logi"><span class="small muted">${new Date(k.endedAt).toLocaleDateString("th-TH",{weekday:"short",day:"numeric",month:"short"})}</span><span>${esc(k.reason||"-")}${k.memo?` · “${esc(k.memo)}”`:""}</span></div>`).join(""):`<p class="muted small">ยังไม่มีวันที่ขอพัก</p>`}
  </section>
  <section class="card"><h3>ข้อที่ควรนั่งคุยกัน</h3>
    ${talk.length?talk.map(x=>`<div class="logi"><span class="chip l${x.level}">${esc(x.topic)}</span><span class="small">${esc(x.prompt||x.qid)}</span></div>`).join(""):`<p class="muted small">ยังไม่มีข้อที่ต้องคุย</p>`}
    ${hardRun>=2?`<p class="small" style="color:var(--warn)">ลูกกด "ยาก" ${hardRun} ครั้งจาก 3 ครั้งล่าสุด อาจถึงเวลาลดระดับหรือคุยกันก่อน</p>`:""}
  </section>
  <section class="card"><h3>บันทึกการฝึก</h3><div class="log">
    ${all.slice(0,10).map(a=>`<div class="logi"><div class="row" style="justify-content:space-between"><b>${esc(a.topic)}</b>${a.example?`<span class="example">ตัวอย่าง</span>`:""}</div>
      <span class="small muted">${new Date(a.endedAt).toLocaleDateString("th-TH",{weekday:"short",day:"numeric",month:"short"})} · ${Math.round(a.durationSec/60)} นาที · ถูก ${a.correct}/${a.total} · รู้สึก${a.rating||"-"}</span>
      ${a.memo?`<span class="small">“${esc(a.memo)}”</span>`:""}</div>`).join("")}
  </div></section>
  <section class="card"><h3>ข้อความที่ลูกเขียนถึง Claude</h3>
    ${fbList.length?fbList.slice(0,5).map(f=>`<div class="logi"><span class="small muted">${new Date(f.at).toLocaleDateString("th-TH",{day:"numeric",month:"short"})}</span><span>${esc(f.text)}</span></div>`).join(""):`<p class="muted small">ยังไม่มีข้อความ</p>`}
  </section>
  <section class="card"><h3>ให้ Claude วิเคราะห์</h3>
    <p class="small muted">สรุปจุดแข็ง จุดที่ต้องระวัง และคำแนะนำสำหรับพ่อ จากข้อมูลด้านบน</p>
    <button class="btn" id="ask" hidden>วิเคราะห์ตอนนี้</button>
    <p class="analysis" id="out">${esc(analysisText)}</p>
  </section>`}`;
  const ex=document.getElementById("ex"); if(ex) ex.onchange=()=>{showExamples=ex.checked;renderParent()};
  const ig=document.getElementById("impgo"); if(ig) ig.onclick=async()=>{const msg=document.getElementById("impmsg");ig.disabled=true;msg.textContent="กำลังนำเข้า…";
    try{const {n,k}=await importCode(document.getElementById("imp").value);msg.textContent=`นำเข้าแล้ว ${n} ครั้ง และข้อความ ${k} ข้อความ`;}
    catch(e){msg.textContent="รหัสไม่ถูกต้อง ตรวจว่าคัดลอกมาครบทั้งข้อความ"}ig.disabled=false;};
  setupAsk({all,lv,topics,errs,ratings,skips,conf});
}
let samplerP=null;
async function setupAsk(sum){ const skips=sum.skips||[], conf=sum.conf||[];
  const btn=document.getElementById("ask"); if(!btn) return;
  samplerP ??= (window.claude?.use?.("sample")??Promise.resolve(null)).catch(()=>null);
  const sample=await samplerP; if(!sample||!document.body.contains(btn)) return;
  btn.hidden=false;
  btn.onclick=async()=>{
    const out=document.getElementById("out"); btn.disabled=true; out.textContent="กำลังวิเคราะห์ อาจใช้เวลาราวครึ่งนาที…";
    const data={skips:skips.map(k=>({date:k.endedAt,reason:k.reason,memo:k.memo})),confused:conf,sessions:sum.all.map(a=>({topic:a.topic,date:a.endedAt,minutes:Math.round(a.durationSec/60),correct:a.correct,total:a.total,rating:a.rating,memo:a.memo,example:!!a.example,
      wrong:(a.items||[]).filter(x=>x.correct===false).map(x=>({topic:x.topic,level:x.level,error:x.errorType}))})),accuracyByLevel:sum.lv,errors:sum.errs};
    try{
      const {text}=await sample(`คุณเป็นโค้ชการเรียนที่ช่วยพ่อติดตามลูกสาว ม.2 ที่เตรียมสอบเข้า ม.4 แนวโรงเรียนวิทยาศาสตร์ เขียนภาษาไทย สั้น ชัด ไม่เกิน 180 คำ แบ่ง 3 หัวข้อ: "ทำได้ดี", "ต้องระวัง", "พ่อควรทำอะไรสัปดาห์นี้" (2–3 ข้อ ทำได้จริง น้ำเสียงให้กำลังใจ ไม่กดดันลูก) ถ้าข้อมูลน้อย ให้บอกตรงๆ ว่ายังสรุปไม่ได้มาก ข้อมูลที่ example=true เป็นข้อมูลตัวอย่าง ให้ระบุว่าเป็นตัวอย่าง\n\nข้อมูล:\n${JSON.stringify(data)}`,
        {onText:({text})=>{out.textContent=text}});
      analysisText=text; out.textContent=text;
    }catch(e){ out.textContent = e.code==="rate_limited"?"เรียกใช้ถี่เกินไป ลองใหม่อีกสักครู่":"ยังวิเคราะห์ไม่ได้ในตอนนี้"; }
    btn.disabled=false;
  };
}

function route(){ const h=location.hash.replace("#",""); if(false){} else if(!["session","intro","feedback","done","skip","send"].includes(view)){view="home"} else if(view==="done"){view="home"} render() }
window.addEventListener("hashchange",route);
route();
</script>
</body></html>
