<style>
/* Layout: one narrow column like a pocket field notebook; parent view is the same column with summary first. */
:root{
  --paper:#F2F6F4; --card:#FFFFFF; --ink:#16302B; --muted:#5B716B; --line:#D3E0DB;
  --accent:#1F7A8C; --accent-ink:#FFFFFF; --beak:#D9822B; --good:#2E8B57; --bad:#C0453A; --warn:#B7841C;
  --soft:#E3EEEA;
  --display:"Mitr","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1A18; --card:#172623; --ink:#E2ECE8; --muted:#97ABA5; --line:#2A3D39;
  --accent:#4FB3C6; --accent-ink:#0B1715; --beak:#E9A35A; --good:#5CC48A; --bad:#EF7C70; --warn:#E3B54E; --soft:#1E302C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1A18; --card:#172623; --ink:#E2ECE8; --muted:#97ABA5; --line:#2A3D39;
  --accent:#4FB3C6; --accent-ink:#0B1715; --beak:#E9A35A; --good:#5CC48A; --bad:#EF7C70; --warn:#E3B54E; --soft:#1E302C; color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65}
.wrap{max-width:620px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:1.7rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand small{color:var(--muted);font-size:.85rem}
.tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:999px}
.tabs a{padding:6px 14px;border-radius:999px;color:var(--ink);text-decoration:none;font-size:.9rem}
.tabs a[aria-current="page"]{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:.78rem;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.sets{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.sets{grid-template-columns:1fr 1fr}}
.set{text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.set:hover{border-color:var(--accent)}
.set .subj{font-family:var(--display);font-size:1.15rem}
.set .meta{color:var(--muted);font-size:.88rem}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--ink);width:fit-content}
.chip.l1{background:color-mix(in srgb,var(--good) 18%,transparent)}
.chip.l2{background:color-mix(in srgb,var(--warn) 22%,transparent)}
.chip.l3{background:color-mix(in srgb,var(--beak) 26%,transparent)}
.week{display:flex;gap:8px;flex-wrap:wrap}
.day{width:38px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;color:var(--muted)}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.dot.rest{border-style:dashed}
.progress{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.stage{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.prompt{font-size:1.08rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--accent)}}   /* touch screens keep a "hover" after a tap, which looked like a hint */
.optrow{display:flex;gap:6px;align-items:stretch}
.optrow .opt{flex:1}
.xopt{flex:none;width:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font:inherit;cursor:pointer}
.opt.struck{opacity:.45;text-decoration:line-through;background:var(--soft)}
.term{font:inherit;color:inherit;background:none;border:0;padding:0;border-bottom:2px dotted var(--accent);cursor:pointer}
details.ask{display:flex;flex-direction:column;gap:6px}
details.ask summary{cursor:pointer;color:var(--accent);font-size:.9rem;padding:4px 0}
details.ask[open]{display:flex}
.dot.leave{border-style:dashed;display:flex;align-items:center;justify-content:center;font-size:.8rem}
.padfab{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;font:inherit;font-family:var(--display);border:0;border-radius:999px;padding:10px 16px;background:var(--beak);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}
.pad{position:fixed;left:0;right:0;bottom:0;height:48vh;z-index:20;background:var(--card);border-top:2px solid var(--line);display:flex;flex-direction:column;box-shadow:0 -4px 16px rgba(0,0,0,.12)}
.pad[hidden]{display:none}
.padbar{display:flex;gap:6px;padding:8px 12px;flex-wrap:wrap}
.padbar button{font:inherit;font-size:.85rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.padbar button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,var(--card))}
#pad-canvas{flex:1;width:100%;touch-action:none;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 32px}
body.padopen .wrap{padding-bottom:calc(48vh + 70px)}
body.padopen .padfab{bottom:calc(48vh + 10px)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.opt:disabled{cursor:default}
.num{display:flex;gap:8px;flex-wrap:wrap}
.num input{font:inherit;font-family:var(--mono);padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:10ch}
.btn{font:inherit;font-family:var(--display);border:0;text-decoration:none;display:inline-block;border-radius:12px;padding:11px 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer;width:fit-content}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--beak);outline-offset:2px}
.feedback{border-radius:12px;padding:12px 14px;background:var(--soft);display:flex;flex-direction:column;gap:8px}
.feedback b.ok{color:var(--good)} .feedback b.no{color:var(--bad)}
.why{display:flex;gap:6px;flex-wrap:wrap}
.why button{font:inherit;font-size:.85rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.why button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,var(--card))}
.concept{display:flex;flex-direction:column;gap:10px}
.concept ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.formula{font-family:var(--mono);background:var(--soft);border-radius:10px;padding:10px 12px;overflow-x:auto;font-size:.92rem}
.vocab{display:flex;gap:6px;flex-wrap:wrap}
.vocab span{font-size:.85rem;border:1px dashed var(--line);border-radius:8px;padding:3px 9px}
.vocab span i{font-style:normal;color:var(--muted)}
.rate{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--mono);font-size:1.35rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:7.5em 1fr 3.2em;gap:8px;align-items:center;font-size:.88rem}
.bar .track{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar .track i{display:block;height:100%}
.bar .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.topic{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.topic:last-child{border-bottom:0}
.pill{font-size:.78rem;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill.g{background:color-mix(in srgb,var(--good) 20%,transparent)}
.pill.y{background:color-mix(in srgb,var(--warn) 24%,transparent)}
.pill.r{background:color-mix(in srgb,var(--bad) 20%,transparent)}
.log{display:flex;flex-direction:column;gap:10px}
.logi{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.example{font-size:.75rem;color:var(--beak);border:1px solid var(--beak);border-radius:6px;padding:0 6px}
.analysis{white-space:pre-wrap;font-size:.94rem}
.note{font-size:.84rem;color:var(--muted)}
.hero{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.flame{font-family:var(--display);font-size:1.6rem;display:flex;align-items:center;gap:6px}
.flame.out{filter:grayscale(1);opacity:.55}
.ice{font-size:.9rem;color:var(--muted)}
.xpbar{flex:1;min-width:160px;display:flex;flex-direction:column;gap:4px}
.xpbar .progress{height:10px}
.xpbar .progress>i{background:var(--beak)}
.dot.ice{border-color:#7DB9E8;background:color-mix(in srgb,#7DB9E8 35%,transparent)}
.pick{border:2px solid var(--accent)}
.mission{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.mission:first-of-type{border-top:0}
.mission.done{opacity:.75}
.mcheck{flex:none;width:30px;height:30px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-family:var(--display)}
.realm summary{cursor:pointer;padding:6px 0}
.realm h3 small{color:var(--muted);font-family:var(--body);font-size:.8rem;font-weight:400}
.spells{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:560px){.spells{grid-template-columns:1fr 1fr}}
.spell{font:inherit;text-align:left;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
button.spell{cursor:pointer} button.spell:hover{border-color:var(--accent)}
.spell.shadow{background:transparent;border-style:dashed;color:var(--muted)}
.spell.faded{opacity:.6}
.spell b{font-family:var(--display);font-weight:500}
.pips{display:flex;gap:4px;align-items:center}
.pips i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);display:inline-block}
.pips i.on1{background:var(--good);border-color:var(--good)} .pips i.on2{background:var(--warn);border-color:var(--warn)} .pips i.on3{background:var(--beak);border-color:var(--beak)}
.vword{font-family:var(--display);font-size:1.8rem}
.vex{font-style:italic}
.reading{background:var(--soft);border-radius:12px;padding:12px 14px;line-height:1.8}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<script>

const LV = {1:"ระดับ 1 · พื้นฐาน",2:"ระดับ 2 · ประยุกต์",3:"ระดับ 3 · แนวคิดวิเคราะห์"};

const SETS = [
{ id:"math-stats-1", spell:"m22", subject:"คณิตศาสตร์", topic:"สถิติ: ค่าเฉลี่ย มัธยฐาน ฐานนิยม", grade:"ม.2", mins:"30–40 นาที", current:true,
  warm:[
    {id:"tw1",topic:"ร้อยละ",level:1,q:"ร้อยละ 40 ของ 35 คือเท่าใด",opts:["14","87.5","12","21"],a:0,ex:"(40 ÷ 100) × 35 = 14 หรือคิดว่า 10% ของ 35 คือ 3.5 แล้วคูณ 4"},
    {id:"tw2",topic:"จำนวนเต็ม",level:1,q:"เช้านี้บนภูเขาอุณหภูมิ −4 °C ตอนบ่ายสูงขึ้น 11 °C ตอนบ่ายอุณหภูมิกี่องศา",opts:["7","−15","15","−7"],a:0,ex:"−4 + 11 = 7 °C"}
  ],
  concept:{title:"ค่ากลางของข้อมูล ใน 3 นาที",

      "มัธยฐาน (median) = เรียงข้อมูลจากน้อยไปมากก่อน แล้วดูตัวที่อยู่ตรงกลาง ถ้าข้อมูลมีจำนวนคู่ ให้เอาสองตัวกลางมาเฉลี่ยกัน",

    vocab:[["mean","ค่าเฉลี่ยเลขคณิต"],["median","มัธยฐาน"],["mode","ฐานนิยม"],["outlier","ค่าผิดปกติ"]]},
  practice:[

    {id:"tp2",topic:"มัธยฐาน",level:1,q:"จำนวนภาพสเก็ตช์ที่วาดในแต่ละวันของสัปดาห์: 3, 8, 2, 5, 4, 9, 1 มัธยฐานคือเท่าใด",opts:["4","5","4.57","9"],a:0,ex:"เรียงก่อน: 1, 2, 3, 4, 5, 8, 9 ตัวกลาง (ตัวที่ 4) คือ 4 ข้อ 5 คือตัวกลางของรายการที่ยังไม่ได้เรียง ซึ่งเป็นกับดักที่เจอบ่อยมาก"},

    {id:"tp7",topic:"มัธยฐาน",level:2,en:true,q:"English corner: Five numbers are 8, 15, x, 10, 20 (not in order). Their median is 12. What is x?  (median = มัธยฐาน · not in order = ยังไม่ได้เรียง)",opts:["12","13","11","10"],a:0,ex:"เรียงตัวที่รู้ค่า: 8, 10, 15, 20 มัธยฐานของ 5 ตัวคือตัวที่ 3 ถ้าให้ตัวที่ 3 เป็น 12 ได้ x ต้องอยู่ระหว่าง 10 กับ 15 และเท่ากับ 12 พอดี ลองแทน 11: เรียงเป็น 8, 10, 11, 15, 20 มัธยฐานคือ 11 ไม่ใช่ 12"},
    {id:"tp5",topic:"ค่าเฉลี่ย",level:2,q:"ศิษย์จอมเวทสอบภาคปฏิบัติ 4 ครั้งได้ 72, 85, 78, 81 คะแนน ครั้งที่ 5 ต้องได้กี่คะแนน ค่าเฉลี่ยทั้ง 5 ครั้งจึงเท่ากับ 80 พอดี (อาจารย์ไม่ปัดเศษให้นะ)",opts:["84","80","79","86"],a:0,ex:"ค่าเฉลี่ย 80 จาก 5 ครั้ง แปลว่าผลรวมต้องเป็น 80 × 5 = 400 ตอนนี้มี 72 + 85 + 78 + 81 = 316 ครั้งที่ 5 ต้องได้ 400 − 316 = 84"},
    {id:"tp6",topic:"เลือกค่ากลาง",level:3,q:"ร้านกาแฟเล็กๆ มีคน 5 คน เงินเดือน (บาท) 12,000 / 13,000 / 14,000 / 15,000 / 96,000 (คนสุดท้ายคือเจ้าของร้าน จ่ายให้ตัวเอง) ถ้าอยากบอกคนมาสมัครงานว่า \"พนักงานทั่วไปได้เงินประมาณเท่าไร\" ควรใช้ค่าใด",opts:["มัธยฐาน 14,000 บาท เพราะไม่ถูกค่าที่สูงผิดปกติดึงขึ้น","ค่าเฉลี่ย 30,000 บาท เพราะใช้ข้อมูลครบทุกคน","ค่าเฉลี่ยของค่าต่ำสุดกับสูงสุด 54,000 บาท","ฐานนิยม เพราะเป็นค่าที่พบบ่อยที่สุด"],a:0,ex:"ค่าเฉลี่ยคือ 150,000 ÷ 5 = 30,000 บาท ซึ่งสูงกว่าเงินเดือนของพนักงานทุกคน เพราะ 96,000 ดึงขึ้น มัธยฐาน 14,000 บอกภาพจริงได้ดีกว่า ส่วนฐานนิยมใช้ไม่ได้ เพราะไม่มีค่าซ้ำ"},
    {id:"tp8",topic:"ค่ากลางเปลี่ยนเมื่อข้อมูลเปลี่ยน",level:3,q:"ปาร์ตี้ผู้กล้า 5 คนมีเลเวล 3, 5, 7, 9, 11 (ค่าเฉลี่ย 7 มัธยฐาน 7) แล้วคนเลเวล 11 แอบไปฟาร์มมอนสเตอร์คนเดียวทั้งคืนจนเป็นเลเวล 41 ข้อใดถูกต้อง",opts:["ค่าเฉลี่ยกลายเป็น 13 แต่มัธยฐานยังเป็น 7","ทั้งค่าเฉลี่ยและมัธยฐานกลายเป็น 13","ค่าเฉลี่ยกลายเป็น 13 และมัธยฐานกลายเป็น 9","ค่าเฉลี่ยกลายเป็น 37 แต่มัธยฐานยังเป็น 7"],a:0,ex:"ผลรวมใหม่ 3 + 5 + 7 + 9 + 41 = 65 แล้ว 65 ÷ 5 = 13 ส่วนตัวกลางของ 3, 5, 7, 9, 41 ยังเป็น 7 เพราะเปลี่ยนแค่ตัวท้ายสุด ค่าเฉลี่ยไวต่อค่าสุดโต่ง มัธยฐานไม่ไว"}

    q:"กิลด์นักผจญภัยมีสมาชิก 30 คน วัดพลังเวทได้ค่าเฉลี่ย 62 หน่วย ภายหลังพบว่าลูกแก้ววัดพลังเสีย อ่านค่าของ 3 คนต่ำไปคนละ 10 หน่วย ค่าเฉลี่ยที่ถูกต้องของกิลด์คือกี่หน่วย",

  concept:{title:"อัตราส่วนและร้อยละ ใน 3 นาที",
    points:["อัตราส่วน a : b คือการเทียบปริมาณสองอย่าง เช่น สุนัข 24 ตัว ต่อ แมว 16 ตัว เขียนเป็น 24 : 16",
      "คูณหรือหารทั้งสองข้างด้วยจำนวนเดียวกัน ได้อัตราส่วนที่เท่ากัน 24 : 16 = 3 : 2 (หารด้วย 8)",
      "ร้อยละ คือส่วนต่อ 100 ร้อยละ 25 = 25/100 = 0.25"],
    formulas:["ร้อยละ p ของ N  =  (p ÷ 100) × N","ส่วน คิดเป็นร้อยละเท่าใดของทั้งหมด  =  (ส่วน ÷ ทั้งหมด) × 100"],

  practice:[
    {id:"mp1",topic:"อัตราส่วน",level:1,q:"จอมเวทสายเก็บของสะสมคาถาได้ 40 บท เป็นคาถาไร้สาระ (เช่น คาถาทำให้ดอกไม้บานทั้งทุ่ง) 24 บท ที่เหลือเป็นคาถาต่อสู้ อัตราส่วนอย่างต่ำของคาถาไร้สาระต่อคาถาต่อสู้คือข้อใด",opts:["3 : 2","2 : 3","24 : 40","3 : 5"],a:0,ex:"คาถาต่อสู้ = 40 − 24 = 16 บท ได้ 24 : 16 หารทั้งสองข้างด้วย 8 เป็น 3 : 2 ข้อ 3 : 5 คือไร้สาระต่อทั้งหมด ซึ่งโจทย์ไม่ได้ถาม"},
    {id:"mp2",topic:"ร้อยละ",level:1,q:"กล่องสีไม้มี 80 แท่ง หักไปแล้วร้อยละ 25 (ใครทำตก ยอมรับมาซะดีๆ) สีที่หักมีกี่แท่ง",opts:["20","25","32","60"],a:0,ex:"(25 ÷ 100) × 80 = 20 หรือคิดว่าร้อยละ 25 คือหนึ่งในสี่ของ 80"},
    {id:"mp7",topic:"อัตราส่วน",level:1,en:true,q:"English corner: A shelter has 12 cats and 18 dogs. What is the ratio of cats to dogs in simplest form?  (shelter = สถานพักพิงสัตว์ · simplest form = อย่างต่ำ)",opts:["2 : 3","3 : 2","12 : 30","2 : 5"],a:0,ex:"cats : dogs = 12 : 18 หารด้วย 6 ทั้งสองข้าง ได้ 2 : 3 ระวังลำดับ cats to dogs คือแมวขึ้นก่อน ส่วน 2 : 5 คือแมวต่อสัตว์ทั้งหมด"},
    {id:"mp3",topic:"ร้อยละ",level:2,q:"นับนกในบึงได้ 250 ตัว เป็นนกกระยาง 60 ตัว นกกระยางคิดเป็นร้อยละเท่าใดของนกทั้งหมด",opts:["24","60","25","40"],a:0,ex:"(60 ÷ 250) × 100 = 24"},
    {id:"mp4",topic:"อัตราส่วน",level:2,q:"ผสมสีน้ำโทนเขียวพาสเทลด้วยสีฟ้าต่อสีเหลืองในอัตราส่วน 2 : 5 ถ้าใช้สีเหลือง 350 หยด ต้องใช้สีฟ้ากี่หยด จึงได้สีเดิมเป๊ะ",opts:["140","175","875","70"],a:0,ex:"สีเหลือง 5 ส่วน = 350 หยด ดังนั้น 1 ส่วน = 70 หยด สีฟ้า 2 ส่วน = 140 หยด คนวาดรูปใช้อัตราส่วนแบบนี้เวลาผสมสีให้ได้โทนเดิมซ้ำ"},
    {id:"mp5",topic:"ร้อยละ",level:2,q:"ลูกแมวหนัก 800 กรัม ผ่านไปหนึ่งเดือนน้ำหนักเพิ่มขึ้นร้อยละ 25 ตอนนี้ลูกแมวหนักกี่กรัม",opts:["1,000","825","200","1,025"],a:0,ex:"เพิ่มขึ้น 25% ของ 800 = 200 กรัม รวมเป็น 800 + 200 = 1,000 กรัม ข้อ 200 คือส่วนที่เพิ่ม ไม่ใช่น้ำหนักใหม่"},
    {id:"mp6",topic:"อัตราส่วน",level:3,q:"หมู่บ้านกลางป่ามีมนุษย์และเอลฟ์รวม 84 คน อัตราส่วนมนุษย์ต่อเอลฟ์เป็น 4 : 3 ต้องมีเอลฟ์ย้ายเข้ามาเพิ่มกี่คน อัตราส่วนจึงจะเป็น 1 : 1 (ระหว่างนี้ไม่มีใครย้ายออก เอลฟ์อายุยืน ไม่ต้องห่วง)",opts:["12","6","16","48"],a:0,ex:"84 แบ่งเป็น 7 ส่วน ส่วนละ 12 คน มนุษย์ 48 คน เอลฟ์ 36 คน ต้องเพิ่มเอลฟ์ 48 − 36 = 12 คน"},
    {id:"mp8",topic:"ร้อยละ",level:3,q:"ร้านเครื่องเขียนลดราคาพู่กันชุดหนึ่ง 20% แล้วช่วงปลายเดือนลดอีก 10% จากราคาที่ลดแล้ว สรุปว่าราคาสุดท้ายถูกกว่าราคาเดิมกี่เปอร์เซ็นต์",opts:["28","30","25","32"],a:0,ex:"สมมติราคาเดิม 100 บาท ลด 20% เหลือ 80 บาท ลดอีก 10% ของ 80 คือ 8 บาท เหลือ 72 บาท จึงถูกลง 100 − 72 = 28% ไม่ใช่ 30% เพราะครั้งที่สองลดจากราคาที่ต่ำลงแล้ว"}

  challenge:{id:"mc1",topic:"อัตราส่วน (ประยุกต์)",level:3,num:true,answer:400,tol:0,unit:"ตัว",

  practice:[

/* ---------- test mode: open the page with #test once; results get a "test" tag ---------- */
let TEST=false;
try{ if(location.hash==="#test") localStorage.setItem("fieldnote.test","1"); TEST=localStorage.getItem("fieldnote.test")==="1" }catch(e){ TEST=location.hash==="#test" }
function leaveTest(){
  try{
    localStorage.removeItem("fieldnote.test");
    localStorage.setItem("fieldnote.attempts",JSON.stringify(JSON.parse(localStorage.getItem("fieldnote.attempts")||"[]").filter(x=>!x.test)));
    localStorage.setItem("fieldnote.fb",JSON.stringify(JSON.parse(localStorage.getItem("fieldnote.fb")||"[]").filter(x=>!x.test)));
  }catch(e){}
  TEST=false; attempts=lsRead(); if(location.hash==="#test") location.hash="#home"; view="home"; render();
}

/* ---------- storage: shared db when available, otherwise this browser only ---------- */
let db = null, store = "local", attempts = [], unsub = null;
const LS = "fieldnote.attempts";
function lsRead(){ try{ return JSON.parse(localStorage.getItem(LS)||"[]") }catch(e){ return [] } }
function lsWrite(a){ try{ localStorage.setItem(LS, JSON.stringify(a)) }catch(e){} }
attempts = lsRead();
(async()=>{
  try{
    db = await window.claude?.use?.("db");
  }catch(e){ db = null }
  if(!db) return;
  const t = setTimeout(()=>{}, 10000);
  try{
    unsub = db.collection("attempts").orderBy("endedAt","desc").limit(200).onSnapshot(s=>{
      clearTimeout(t); store="db";
      attempts = s.docs.map(d=>({id:d.id,...d.data()}));
      if(view==="parent"||view==="home") render();
    }, ()=>{ clearTimeout(t) });
  }catch(e){ clearTimeout(t) }
})();
async function saveAttempt(rec){
  if(TEST) rec.test=true;
  if(db){
    try{ await db.collection("attempts").add(rec); return "db" }catch(e){}
  }
  attempts = [rec, ...attempts]; lsWrite(attempts.filter(a=>!a.example)); return "local";
}

function b64e(str){const b=new TextEncoder().encode(str);let o="";for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(o)}
function b64d(x){return new TextDecoder().decode(Uint8Array.from(atob(x),c=>c.charCodeAt(0)))}
function lsFb(){ try{ return JSON.parse(localStorage.getItem("fieldnote.fb")||"[]") }catch(e){ return [] } }
function unsent(){ return {a:lsRead().filter(x=>!x.sent), f:lsFb().filter(x=>!x.sent)} }
function markSent(){ lsWrite(lsRead().map(x=>({...x,sent:true}))); try{localStorage.setItem("fieldnote.fb",JSON.stringify(lsFb().map(x=>({...x,sent:true}))))}catch(e){} attempts=lsRead() }
/* short code: drop text the parent page can look up again by question id, then deflate */
function slim(a){ const {sent,...x}=a; return {...x, items:(x.items||[]).map(({prompt,phase,topic,spell,...i})=>i), confused:(x.confused||[]).map(({prompt,...c})=>c)} }
function fatten(a){ return {...a, items:(a.items||[]).map(i=>{const q=QBANK[i.qid]?.q; return q?{topic:q.topic,spell:q.spell,prompt:q.q,...i}:i}),
  confused:(a.confused||[]).map(c=>{const q=QBANK[c.qid]?.q; return q&&!c.prompt?{...c,prompt:q.q}:c})} }
async function packCode(obj){
  const json=JSON.stringify(obj);
  if(typeof CompressionStream==="function"){ try{
    const buf=new Uint8Array(await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer());
    let t=""; for(let i=0;i<buf.length;i+=0x8000) t+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
    return "SK2:"+btoa(t).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }catch(e){} }
  return "FIELDNOTE1:"+b64e(json);
}
async function exportCode(all){ const a=all?lsRead():unsent().a, f=all?lsFb():unsent().f; return (a.length||f.length)?await packCode({a:a.map(slim),f:f.map(({sent,...x})=>x)}):"" }

  const u=unsent(); const code=await exportCode(all);
  $v.innerHTML=`<section class="card"><h2>ส่งผลให้พ่อ</h2>
    ${code?`<p>มีผลฝึก <b>${all?lsRead().length:u.a.length}</b> ครั้ง และข้อความถึง Claude <b>${all?lsFb().length:u.f.length}</b> ข้อความ ที่ยังไม่ได้ส่ง</p>
    <ol style="margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px">
      <li>กด <b>คัดลอกรหัส</b></li><li>เปิด LINE แล้ววางส่งให้พ่อ</li><li>กลับมากด <b>ส่งเรียบร้อยแล้ว</b></li></ol>
    <p class="small muted">รหัสยาว ${code.length.toLocaleString()} ตัวอักษร</p>
    <textarea id="code" readonly rows="4" style="font-family:var(--mono);font-size:.75rem;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)">${code}</textarea>
    <div class="row"><button class="btn" id="copy">คัดลอกรหัส</button><button class="btn ghost" id="sent">ส่งเรียบร้อยแล้ว</button></div>
    <p class="small" id="cmsg" aria-live="polite"></p>`:`<p class="muted">ส่งครบทุกครั้งแล้ว ไม่มีผลค้างส่ง</p>
    <button class="btn ghost" id="resend">ต้องการส่งทั้งหมดอีกครั้ง</button>`}

async function importCode(raw, asTest){
  let data; const m2=raw.match(/SK2:([A-Za-z0-9_-]+)/), m1=raw.match(/FIELDNOTE1:([A-Za-z0-9+/=\s]+)/);
  if(m2){ const c=m2[1].replace(/-/g,"+").replace(/_/g,"/"); const bin=atob(c+"=".repeat((4-c.length%4)%4));
    const bytes=Uint8Array.from(bin,ch=>ch.charCodeAt(0));
    data=JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text()); }
  else if(m1) data=JSON.parse(b64d(m1[1].replace(/\s/g,""))); else throw new Error("bad");
  let n=0,k=0;
  for(const a of (data.a||[])){ const id=("s-"+(a.setId||a.type)+"-"+a.endedAt).replace(/[^A-Za-z0-9_-]/g,""); const {example,...rest}=fatten(a); await db.collection("attempts").doc(id).set({...rest,via:"code",test:!!(a.test||asTest)}); n++ }
  for(const f of (data.f||[])){ const id=("f-"+f.at).replace(/[^A-Za-z0-9_-]/g,""); await db.collection("feedback").doc(id).set({...f,test:!!(f.test||asTest)}); k++ }
  return {n,k};
}

const WARM_SPELL={tw1:"m3",tw2:"m1",mw1:"m1",mw2:"m1",sw1:"s7",sw2:"s2"};
const QBANK={};

/* ---------- XP, streak and ice ---------- */
const GOAL=60, FREEZE_MAX=2, DAY=86400000;
function realAttempts(){ return attempts.filter(a=>!a.example&&!a.test) }
function mine(){ return TEST ? attempts.filter(a=>!a.example) : realAttempts() }
function isSkip(a){ return a.type==="skip" }
function isLesson(a){ return !isSkip(a) && a.type!=="vocab" }
function dayKey(iso){ const d=new Date(iso); d.setHours(0,0,0,0); return d.getTime() }
function todayKey(){ return dayKey(new Date().toISOString()) }
function nextDay(d){ const t=new Date(d); t.setDate(t.getDate()+1); t.setHours(0,0,0,0); return t.getTime() }
function xpOf(a){ if(isSkip(a)) return 0; if(typeof a.xp==="number") return a.xp; return (a.correct||0)*10+((a.total||0)-(a.correct||0))*5+20 }
function itemXp(items){ return items.reduce((s,x)=>s+(x.skipped||x.dontknow?0:x.correct?10:5),0) }
function progressOf(list){
  /* a day counts when both missions are done: one lesson set (or review) and the daily vocabulary */
  const byDay=new Map(), skipDays=new Set(), lessonDays=new Set(), vocabDays=new Set(), met=new Set();
  const leaveDays=new Set();
  list.forEach(a=>{const k=dayKey(a.endedAt);
    if(isSkip(a)){ if(a.leave&&a.from&&a.to){ for(let d=a.from; d<=a.to; d=nextDay(d)) leaveDays.add(d) } else skipDays.add(k); return }
    byDay.set(k,(byDay.get(k)||0)+xpOf(a)); (a.type==="vocab"?vocabDays:lessonDays).add(k)});
  const noVocabToday=(()=>{try{const v=vocabToday();return !v.due.length&&!v.fresh.length}catch(e){return false}})();
  const today=todayKey(), keys=[...byDay.keys(),...skipDays,...[...leaveDays].filter(d=>d<=todayKey())];
  let streak=0, freeze=0, goalDays=0; const frozen=new Set(), earned=[];
  if(keys.length){
    for(let d=Math.min(...keys); d<=today; d=nextDay(d)){
      const xp=byDay.get(d)||0;
      if(lessonDays.has(d)&&(vocabDays.has(d)||(d===today&&noVocabToday))){ met.add(d);
        goalDays++; streak++;
        if(goalDays%5===0&&freeze<FREEZE_MAX){freeze++;earned.push({d,why:"ถึงเป้าครบ 5 วัน"})}
        if(xp>=GOAL*2&&freeze<FREEZE_MAX){freeze++;earned.push({d,why:"เก็บ XP ได้ 120 ขึ้นไปในวันเดียว"})}
      } else if(leaveDays.has(d)){
        /* planned leave (camp, trip): the flame waits, no ice used */
      } else if(d<today){
        if(freeze>0&&streak>0){freeze--;frozen.add(d)} else streak=0;
      }
    }
  }
  const todayXp=byDay.get(today)||0;
  return {streak,freeze,goalDays,frozen,skipDays,byDay,met,todayXp,lessonToday:lessonDays.has(today),leaveDays,onLeave:leaveDays.has(today),vocabToday:vocabDays.has(today),goalToday:met.has(today),earnedToday:earned.filter(e=>e.d===today)};
}

/* ---------- what to do today ---------- */
function recommend(list){
  const last={}; list.filter(isLesson).forEach(a=>{if(a.setId) last[a.setId]=Math.max(last[a.setId]||0,dayKey(a.endedAt))});
  const t=todayKey(), pool=SETS.filter(s=>last[s.id]!==t);
  return (pool.length?pool:SETS).slice().sort((a,b)=>(last[a.id]||0)-(last[b.id]||0)||(b.current?1:0)-(a.current?1:0))[0];
}
function reviewPool(list){
  const wrong=new Map();
  list.filter(isLesson).slice().sort((a,b)=>new Date(a.endedAt)-new Date(b.endedAt)).forEach(a=>(a.items||[]).forEach(x=>{
    if(x.skipped||!QBANK[x.qid]) return;
    if(x.correct===false) wrong.set(x.qid,+new Date(a.endedAt)); else if(x.correct) wrong.delete(x.qid);
  }));
  return [...wrong.entries()].sort((a,b)=>a[1]-b[1]).map(([qid])=>QBANK[qid].q);
}
function shuffleQ(q, perm){
  if(q.num) return q;
  let idx=perm&&perm.length===q.opts.length?perm:null;
  if(!idx){ idx=q.opts.map((_,k)=>k); for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]} }
  return {...q,opts:idx.map(k=>q.opts[k]),a:idx.indexOf(q.a),perm:idx};
}

/* ---------- spell tiers ---------- */
function spellStats(list){
  const st={};
  list.filter(isLesson).forEach(a=>{
    const d=dayKey(a.endedAt);
    (a.items||[]).forEach(x=>{
      if(x.skipped) return; const sp=x.spell||QBANK[x.qid]?.q.spell; if(!sp||!x.level) return;
      const o=st[sp]??={days:{},last:0}; const dd=o.days[d]??={1:[0,0],2:[0,0],3:[0,0]};
      dd[x.level][0]++; if(x.correct) dd[x.level][1]++; o.last=Math.max(o.last,d);
    });
  });
  const out={}, t=todayKey();
  for(const [sp,o] of Object.entries(st)){
    const days=Object.entries(o.days).map(([d,v])=>({d:+d,v}));
    const n1=days.reduce((s,x)=>s+x.v[1][0],0), c1=days.reduce((s,x)=>s+x.v[1][1],0);
    const t1=n1>=3&&c1/n1>=0.8;
    const d2=days.filter(x=>x.v[2][0]>=2&&x.v[2][1]/x.v[2][0]>=0.7).length;
    const t2=t1&&d2>=2;
    const d3=days.filter(x=>x.v[3][0]>=1&&x.v[3][1]/x.v[3][0]>=0.6).map(x=>x.d).sort((a,b)=>a-b);
    const t3=t2&&d3.length>=2&&d3[d3.length-1]-d3[0]>=7*DAY;
    const tier=t3?3:t2?2:t1?1:0, idle=Math.round((t-o.last)/DAY);
    out[sp]={tier,idle,faded:(tier===2&&idle>14)||(tier===3&&idle>21),n1,c1,d2,d3:d3.length};
  }
  return out;
}

const GLOSS_KEYS=Object.keys(GLOSS).sort((a,b)=>b.length-a.length);
function gloss(raw){
  let t=esc(raw); const marks=[];
  GLOSS_KEYS.forEach(k=>{ const ek=esc(k), i=t.indexOf(ek); if(i<0) return;
    marks.push(k); t=t.slice(0,i)+"\u0001"+(marks.length-1)+"\u0002"+t.slice(i+ek.length) });
  return t.replace(/\u0001(\d+)\u0002/g,(_,n)=>`<button class="term" type="button" data-t="${esc(marks[+n])}">${esc(marks[+n])}</button>`);
}
function bindGloss(){
  $v.querySelectorAll(".term").forEach(b=>b.onclick=()=>{
    const box=document.getElementById("gloss-box"); if(!box) return;
    const k=b.dataset.t; box.hidden=false; box.innerHTML=`<b>${esc(k)}</b> <span class="small">${esc(GLOSS[k]||"")}</span> <button class="btn ghost" id="gloss-x" style="border:0;padding:0 4px">ปิด</button>`;
    document.getElementById("gloss-x").onclick=()=>{box.hidden=true};
    if(S&&!S.glossed.includes(k)) S.glossed.push(k);
  });
}

const PAD={open:false,strokes:[],tool:"pen",penSeen:false};
function padHtml(){
  return `<button class="padfab" id="pad-toggle" type="button">${PAD.open?"✕ ปิดกระดาษทด":"✏️ กระดาษทด"}</button>
  <div class="pad" id="pad" ${PAD.open?"":"hidden"}>
    <div class="padbar"><button type="button" data-tool="pen" aria-pressed="${PAD.tool==="pen"}">✏️ ปากกา</button><button type="button" data-tool="eraser" aria-pressed="${PAD.tool==="eraser"}">🧽 ยางลบ</button>
      <button type="button" id="pad-undo">↶ ย้อน</button><button type="button" id="pad-clear">🗑 ล้าง</button></div>
    <canvas id="pad-canvas"></canvas></div>`;
}
function padSetup(){
  const tg=document.getElementById("pad-toggle"); if(!tg) return;
  tg.onclick=()=>{PAD.open=!PAD.open; document.body.classList.toggle("padopen",PAD.open); const p=document.getElementById("pad"); p.hidden=!PAD.open; tg.textContent=PAD.open?"✕ ปิดกระดาษทด":"✏️ กระดาษทด"; if(PAD.open) padDraw(true)};
  document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{PAD.tool=b.dataset.tool;document.querySelectorAll("[data-tool]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.tool===PAD.tool))});
  document.getElementById("pad-undo").onclick=()=>{PAD.strokes.pop();padDraw()};
  document.getElementById("pad-clear").onclick=()=>{PAD.strokes=[];padDraw()};
  const cv=document.getElementById("pad-canvas"); let cur=null;
  const pt=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top,e.pressure||0.5]};
  cv.onpointerdown=e=>{ if(e.pointerType==="pen") PAD.penSeen=true; if(PAD.penSeen&&e.pointerType==="touch") return; // palm rests while writing with the pencil
    cv.setPointerCapture(e.pointerId); cur={tool:PAD.tool,pts:[pt(e)]}; PAD.strokes.push(cur); e.preventDefault() };
  cv.onpointermove=e=>{ if(!cur) return; (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>cur.pts.push(pt(ev))); padDraw() };
  cv.onpointerup=cv.onpointercancel=()=>{cur=null};
  if(PAD.open){ document.body.classList.add("padopen"); padDraw(true) }
}
function padDraw(resize){
  const cv=document.getElementById("pad-canvas"); if(!cv||cv.offsetParent===null) return;
  const dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight;
  if(resize||cv.width!==Math.round(w*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr) }
  const g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  const ink=getComputedStyle(document.documentElement).getPropertyValue("--ink").trim()||"#16302B";
  PAD.strokes.forEach(s=>{ g.globalCompositeOperation=s.tool==="eraser"?"destination-out":"source-over"; g.strokeStyle=ink; g.lineCap="round"; g.lineJoin="round";
    for(let i=1;i<s.pts.length;i++){ const [x0,y0]=s.pts[i-1],[x1,y1,p]=s.pts[i]; g.lineWidth=s.tool==="eraser"?22:1.2+p*2.6; g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke() } });
  g.globalCompositeOperation="source-over";
}

/* ---------- one question ---------- */
function renderStep(){
  const st = S.steps[S.i];
  if(st.kind==="concept") return renderConcept();
  if(st.kind==="rate") return renderRate();
  if(st.kind==="finish") return finishReview();
  const q = st.q, ans = S.answered;
  let body;
  if(q.num){
    body = `<div class="num"><input id="numin" inputmode="decimal" aria-label="คำตอบ" ${ans?"disabled":""} value="${ans&&!ans.dontknow?esc(ans.raw):""}"><span class="muted" style="align-self:center">${q.unit}</span>
      ${ans?"":`<button class="btn" id="check">ตรวจคำตอบ</button>`}</div>`;
  } else {
    body = `<div class="opts">${q.opts.map((o,k)=>{
      let c=""; if(ans){ if(k===q.a) c="right"; else if(k===ans.choice) c="wrong"; }
      const struck=!ans&&S.struck.includes(k);
      return `<div class="optrow"><button class="opt ${c} ${struck?"struck":""}" data-k="${k}" ${ans?"disabled":""}>${esc(o)}</button>
        ${ans?"":`<button class="xopt" type="button" data-x="${k}" aria-pressed="${struck}" aria-label="${struck?"เอาคืน":"ตัดตัวเลือกนี้"}" title="${struck?"เอาคืน":"ตัดตัวเลือกนี้"}">${struck?"↺":"✕"}</button>`}</div>`}).join("")}</div>
      ${ans?"":`<p class="small muted">กด ✕ ท้ายข้อเพื่อตัดตัวเลือกที่ไม่ใช่แน่ๆ</p>`}`;
  }
  let fb = "";
  if(ans){
    const head = ans.dontknow?"ไม่เป็นไร มาดูวิธีคิดกัน (0 XP)":ans.correct?YAY[S.i%YAY.length]:OOPS[S.i%OOPS.length];
    fb = `<div class="feedback"><b class="${ans.correct?"ok":"no"}">${head}${q.num&&!ans.correct?` · คำตอบคือ ${q.answer} ${q.unit}`:""}</b><p>${gloss(q.ex)}</p>
      ${ans.correct||ans.dontknow?"":`<span class="small muted">พลาดเพราะอะไร (ช่วยให้ระบบเลือกข้อทบทวนได้ตรงขึ้น)</span>
      <div class="why">${Object.entries(ERR).filter(([k])=>k!=="dontknow").map(([k,v])=>`<button data-why="${k}" aria-pressed="${S.why===k}">${v}</button>`).join("")}</div>`}
      ${ans.correct?"":askHtml("question")}
    </div>
    <button class="btn" id="next">ต่อไป</button>`;
  }
  $v.innerHTML = `<section class="card">${header()}
    <span class="row" style="gap:6px"><span class="chip l${q.level}">${LV[q.level]} · ${esc(q.topic)}</span>${q.en?`<span class="chip">English corner</span>`:""}</span>
    <p class="prompt">${gloss(q.q)}</p>
    <div class="feedback" id="gloss-box" hidden></div>
    ${S.hints?`<div class="feedback">${q.hints.slice(0,S.hints).map((h,k)=>`<span class="small"><b>คำใบ้ ${k+1}</b> ${esc(h)}</span>`).join("")}</div>`:""}
    ${body}${fb}
    <div class="row">${!ans&&S.hints<q.hints.length?`<button class="btn ghost" id="hint">ขอคำใบ้ (${S.hints}/${q.hints.length})</button>`:""}
    ${!ans?`<button class="btn ghost" id="dontknow">🤔 ยังคิดไม่ออก ดูเฉลย</button>`:""}
    ${st.optional&&!ans?`<button class="btn ghost" id="skip">ข้ามข้อนี้</button>`:""}</div>
  </section>${padHtml()}`;
  bindGloss(); padSetup();
  if(!ans){
    if(q.num){
      const go=()=>{const raw=document.getElementById("numin").value.trim().replace(/,/g,"");const v=parseFloat(raw);if(raw===""||isNaN(v))return;
        answer({raw, correct:Math.abs(v-q.answer)<=q.tol});};
      document.getElementById("check").onclick=go;
      document.getElementById("numin").onkeydown=e=>{if(e.key==="Enter")go()};
    } else {
      $v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer({choice:+b.dataset.k,correct:+b.dataset.k===q.a}));
      $v.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{const k=+b.dataset.x; S.struck=S.struck.includes(k)?S.struck.filter(x=>x!==k):[...S.struck,k]; const y=window.scrollY; renderStep(); window.scrollTo({top:y})});
    }
    const hb=document.getElementById("hint"); if(hb) hb.onclick=()=>{S.hints++;const y=window.scrollY;renderStep();window.scrollTo({top:y})};
    document.getElementById("dontknow").onclick=()=>{S.why="dontknow"; answer({choice:-1,raw:"",correct:false,dontknow:true})};
    const sk=document.getElementById("skip"); if(sk) sk.onclick=()=>{S.items.push({qid:q.id,topic:q.topic,level:q.level,spell:q.spell,skipped:true,timeSec:0});advance()};
  } else {
    $v.querySelectorAll("[data-why]").forEach(b=>b.onclick=()=>{S.why=b.dataset.why;const y=window.scrollY;renderStep();window.scrollTo({top:y})});
    bindAsk("question",{topic:q.topic,qid:q.id,prompt:q.q});
    document.getElementById("next").onclick=()=>{
      S.items.push({qid:q.id,topic:q.topic,level:q.level,spell:q.spell,phase:st.phase,correct:ans.correct,dontknow:!!ans.dontknow,errorType:ans.correct?null:(ans.dontknow?"dontknow":(S.why||"unspecified")),hints:S.hints,struck:S.struck.length,timeSec:Math.round((ans.at-S.qStart)/1000),prompt:q.q});
      advance();
    };
  }
}
function answer(a){ S.answered={...a,at:Date.now()}; if(!a.dontknow) S.why=null; const y=window.scrollY; renderStep(); window.scrollTo({top:y}) }
function advance(){ S.i++; S.answered=null; S.why=null; S.hints=0; S.struck=[]; S.askOpen=null; S.qStart=Date.now(); PAD.strokes=[]; saveProgress(); renderStep(); window.scrollTo({top:0}) }

function saveProgress(){
  if(!S||S.mode!=="set") return;
  try{ localStorage.setItem("fieldnote.inprogress",JSON.stringify({setId:S.set.id,conceptFirst:S.conceptFirst,day:todayKey(),i:S.i,start:S.start,items:S.items,confused:S.confused,altShown:S.altShown,conceptSec:S.conceptSec||0,glossed:S.glossed,
    perms:S.steps.map(x=>x.q?.perm||null)})) }catch(e){}
}
function clearProgress(){ try{ localStorage.removeItem("fieldnote.inprogress") }catch(e){} }
function pendingSet(){
  if(S&&S.mode==="set"&&S.active) return {live:true,set:S.set,i:S.i,n:S.steps.length};
  try{ const p=JSON.parse(localStorage.getItem("fieldnote.inprogress")||"null"); if(!p||p.day!==todayKey()) return null;
    const set=SETS.find(s=>s.id===p.setId); return set?{live:false,set,i:p.i,n:null,saved:p}:null }catch(e){ return null }
}
function resumeSet(){
  const p=pendingSet(); if(!p) return;
  if(p.live){ view="session"; render(); return }
  const sv=p.saved; startSet(p.set, sv.conceptFirst, sv.perms);
  Object.assign(S,{i:sv.i,start:sv.start,items:sv.items||[],confused:sv.confused||[],altShown:sv.altShown||0,conceptSec:sv.conceptSec,glossed:sv.glossed||[]});
  render();
}

  const before=progressOf(mine());

  const list=attempts.includes(rec)?mine():[rec,...mine()];
  S={...S,where,rec,before,after:progressOf(list),list}; view="done"; render(); window.scrollTo({top:0});
}

/* pronunciation: the browser's own English voice (works on iPad and Android Chrome) */
/* Some in-app browsers (LINE, Facebook, the Claude app) hide the voice engine, so detect it and offer a way out */
const CAN_SPEAK = typeof speechSynthesis!=="undefined" && typeof SpeechSynthesisUtterance!=="undefined";
const UA = navigator.userAgent||"";
const IN_APP = /Line\/|FBAN|FBAV|Instagram|; wv\)|Claude/i.test(UA);
const IS_ANDROID = /Android/i.test(UA);
let speechBroken = !CAN_SPEAK;
try{ if(CAN_SPEAK) speechSynthesis.getVoices(); }catch(e){}
function speak(text, slow){
  if(!CAN_SPEAK){ speechBroken=true; showSpeechHelp(); return }
  try{
    if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=slow?0.42:0.9;
    const v=pickVoice(); if(v){ u.voice=v; u.lang=v.lang }
    let started=false; u.onstart=()=>{started=true;speechBroken=false;hideSpeechHelp()}; u.onerror=e=>{ if(e.error!=="interrupted"&&e.error!=="canceled"){speechBroken=true;showSpeechHelp()} };
    speechSynthesis.speak(u);
    setTimeout(()=>{ if(!started&&!speechSynthesis.speaking){ speechBroken=true; showSpeechHelp() } },2500);
  }catch(e){ speechBroken=true; showSpeechHelp() }
}
function enVoices(){ try{ return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)) }catch(e){ return [] } }
function pickVoice(){ const vs=enVoices(); let want=null; try{ want=localStorage.getItem("fieldnote.voice") }catch(e){}
  return vs.find(v=>v.voiceURI===want)||vs.find(v=>/^en(-|_)US/i.test(v.lang)&&v.localService)||vs.find(v=>/^en(-|_)US/i.test(v.lang))||vs[0]||null }
function voicePicker(){
  const vs=enVoices(); if(!vs.length) return "";
  const cur=pickVoice();
  return `<details class="small"><summary>🎙 เลือกเสียงผู้อ่าน (${esc(cur?cur.name:"ค่าเริ่มต้น")})</summary>
    <div class="row" style="margin-top:6px"><select id="voice-sel" style="font:inherit;padding:6px;border-radius:8px;max-width:100%">${vs.map(v=>`<option value="${esc(v.voiceURI)}" ${cur&&v.voiceURI===cur.voiceURI?"selected":""}>${esc(v.name)} · ${esc(v.lang)}</option>`).join("")}</select>
    <button class="btn ghost" id="voice-try" type="button">ลองฟัง</button></div></details>`;
}
function bindVoicePicker(){
  const sel=document.getElementById("voice-sel"); if(!sel) return;
  sel.onchange=()=>{ try{ localStorage.setItem("fieldnote.voice",sel.value) }catch(e){} speak("Hello! Let's learn new words.") };
  document.getElementById("voice-try").onclick=()=>speak("Hello! Let's learn new words.");
}
try{ if(CAN_SPEAK) speechSynthesis.onvoiceschanged=()=>{ if(view==="vocab"&&!document.getElementById("voice-sel")) renderVocab() } }catch(e){}

function showSpeechHelp(){ if(document.getElementById("speech-help")) return; const box=document.getElementById("speech-slot"); if(box){ box.innerHTML=speechHelpHtml(); } const vn=document.getElementById("vn"); if(vn&&V&&V.phase==="learn") vn.disabled=false }
function hideSpeechHelp(){ const h=document.getElementById("speech-help"); if(h) h.remove() }
function vOpts(word,dir){
  const others=VOCAB.filter(x=>x.w!==word.w).sort(()=>Math.random()-.5).slice(0,3);
  const all=[word,...others].sort(()=>Math.random()-.5);
  return {opts:all.map(x=>dir==="en"?x.th:x.w), a:all.indexOf(word)};
}
function startVocab(){
  const {due,fresh}=vocabToday(); if(!due.length&&!fresh.length) return;
  const st=vocabState();
  // new words: meaning first, spelling later in the round; review words: spelling once they have been seen twice
  const meaning=[...fresh.map(w=>({w,kind:"mc",dir:"en",fresh:true})),...due.map((w,k)=>({w,kind:"mc",dir:k%2?"en":"th"}))].map(x=>({...x,...vOpts(x.w,x.dir)}));
  const spellNew=fresh.map(w=>({w,kind:"spell",fresh:true}));
  const spellDue=due.filter(w=>(st[w.w]?.box||0)>=2||Math.random()<.5).map(w=>({w,kind:"spell"}));
  const quiz=[...meaning.sort(()=>Math.random()-.5),...[...spellNew,...spellDue].sort(()=>Math.random()-.5)];
  const base=isWeekend()?READINGS[Math.floor(todayKey()/DAY)%READINGS.length]:null;
  const read=base?{...base,qs:base.qs.map((q,qi)=>{const sq=shuffleQ(q); return {...sq,qth:base.th.qs[qi].q,optsTh:sq.perm.map(k=>base.th.qs[qi].opts[k])}})}:null;
  V={active:true,fresh,quiz,read,phase:fresh.length?"learn":"quiz",li:0,qi:0,ri:0,ans:null,results:[],rres:[],heard:new Set(),showTh:false,start:Date.now()};
  view="vocab"; render(); window.scrollTo({top:0});
}
const sayBtn=(id,label)=>`<button class="btn ghost" id="${id}" type="button">🔊 ${label}</button>`;

          <p>คำที่ถูกคือ <b style="font-family:var(--mono);font-size:1.1rem">${esc(it.w.w)}</b>${ans.correct?"":` · ที่พิมพ์มา <span style="font-family:var(--mono)">${esc(ans.raw)}</span>`}</p>
          ${ans.correct?"":`<p class="small">${ans.retype?"ลองพิมพ์คำที่ถูกอีกครั้ง ช่วยให้มือจำตัวสะกด":""}</p>`}</div>
          ${!ans.correct&&ans.retype?`<p class="small" id="rmsg" aria-live="polite"></p>`:""}

      <div class="opts">${it.opts.map((o,k)=>{let c="";if(ans){if(k===it.a)c="right";else if(k===ans.choice)c="wrong"}return `<button class="opt ${c}" data-k="${k}" ${ans?"disabled":""}>${esc(o)}</button>`}).join("")}</div>
      ${ans?`<div class="feedback"><b class="${ans.correct?"ok":"no"}">${ans.correct?"ถูก +5 XP":"ยังไม่ใช่ +2 XP"}</b><p><b>${esc(it.w.w)}</b> = ${esc(it.w.th)}</p><p class="vex small">“${esc(it.w.ex)}”</p><p class="small muted">${esc(it.w.exTh)}</p>

async function finishVocab(){
  V.active=false;
  try{ if(CAN_SPEAK) speechSynthesis.cancel() }catch(e){}
  $v.innerHTML=`<section class="card"><p class="muted">กำลังบันทึก…</p></section>`;
  const st=vocabState(), t=todayKey(), byWord={};
  V.results.forEach(r=>{ byWord[r.w]=(byWord[r.w]??true)&&r.correct });   // a word moves up only if every item on it was right
  Object.entries(byWord).forEach(([w,ok])=>{ const cur=st[w]?.box||0; const box=ok?Math.min(BOX_DAYS.length,cur+1):1;
    let due=t; for(let i=0;i<BOX_DAYS[box-1];i++) due=nextDay(due); st[w]={box,due} });
  saveVocabState(st);
  const c=V.results.filter(r=>r.correct).length, rc=V.rres.filter(Boolean).length;
  const sp=V.results.filter(r=>r.kind==="spell");
  await finishWith({type:"vocab",setId:"vocab",subject:"อังกฤษ",topic:"คำศัพท์วันนี้",startedAt:new Date(V.start).toISOString(),endedAt:new Date().toISOString(),
    durationSec:Math.round((Date.now()-V.start)/1000),correct:c,total:V.results.length,newWords:V.fresh.length,
    spelling:{correct:sp.filter(r=>r.correct).length,total:sp.length},
    reading:V.read?{correct:rc,total:V.rres.length}:null,xp:c*5+(V.results.length-c)*2+rc*5+(V.rres.length-rc)*2,
    items:V.results.map(r=>({qid:"v:"+r.w,word:r.w,kind:r.kind,fresh:r.fresh,correct:r.correct}))});
}

  const ex=document.getElementById("ex"); if(ex) ex.onchange=()=>{showExamples=ex.checked;renderParent()};

let samplerP=null;
async function setupAnswers(conf){
  const btns=[...$v.querySelectorAll("[data-ans]")]; if(!btns.length) return;
  samplerP ??= (window.claude?.use?.("sample")??Promise.resolve(null)).catch(()=>null);
  const sample=await samplerP; if(!sample) return;
  btns.forEach(b=>{ if(!document.body.contains(b)) return; b.hidden=false; b.onclick=async()=>{
    const c=conf[+b.dataset.ans], out=document.getElementById("ans-"+b.dataset.ans); b.disabled=true; out.textContent="กำลังร่างคำตอบ…";
    try{ const {text}=await sample(`ลูกสาว ม.2 กำลังฝึกเรื่อง "${c.topic||""}" แล้วพิมพ์ถามว่า "${c.ask}"${c.prompt?` ระหว่างทำโจทย์นี้: "${c.prompt}"`:" ระหว่างอ่านการ์ดสรุปเนื้อหา"}
เขียนคำตอบภาษาไทยให้พ่ออ่านให้ลูกฟังได้เลย สั้น 3–6 ประโยค ใช้ภาษาง่าย ยกตัวอย่างตัวเลขเล็กๆ 1 ตัวอย่าง ตอบตรงสิ่งที่ถาม ไม่เฉลยคำตอบของโจทย์ตรงๆ ถ้าคำถามกำกวมให้ตอบความหมายที่น่าจะเป็นที่สุด`,{onText:({text})=>{out.textContent=text}});
      out.textContent=text }catch(e){ out.textContent="ยังร่างคำตอบไม่ได้ ลองใหม่อีกครั้ง" } b.disabled=false };
  });
}
async function setupAsk(sum){ const skips=sum.skips||[], conf=sum.conf||[];
  const btn=document.getElementById("ask"); if(!btn) return;
  samplerP ??= (window.claude?.use?.("sample")??Promise.resolve(null)).catch(()=>null);
  const sample=await samplerP; if(!sample||!document.body.contains(btn)) return;
  btn.hidden=false;
  btn.onclick=async()=>{
    const out=document.getElementById("out"); btn.disabled=true; out.textContent="กำลังวิเคราะห์ อาจใช้เวลาราวครึ่งนาที…";
    const real=realAttempts(), rs=real.filter(isLesson), rk=real.filter(isSkip), rv=real.filter(a=>a.type==="vocab"), rp=progressOf(real);
    const rItems=rs.flatMap(a=>a.items||[]).filter(x=>!x.skipped);
    if(!rs.length&&!rk.length){ out.textContent="ยังไม่มีข้อมูลจริงให้วิเคราะห์ ข้อมูลตัวอย่างและข้อมูลทดสอบไม่ถูกนับ"; btn.disabled=false; return; }
    const rLv=[1,2,3].map(l=>{const it=rItems.filter(x=>x.level===l);return {level:l,n:it.length,correct:it.filter(x=>x.correct).length}});
    const rErr={}; rItems.filter(x=>!x.correct).forEach(x=>{rErr[x.errorType||"unspecified"]=(rErr[x.errorType||"unspecified"]||0)+1});
    const data={skips:rk.map(k=>({date:k.endedAt,reason:k.reason,memo:k.memo})),confused:rs.flatMap(a=>(a.confused||[]).map(c=>({...c,date:a.endedAt}))),notes:fbList.filter(f=>!f.test).slice(0,10).map(f=>f.text),
      sessions:rs.map(a=>({topic:a.topic,date:a.endedAt,minutes:Math.round(a.durationSec/60),correct:a.correct,total:a.total,rating:a.rating,memo:a.memo,
      wrong:(a.items||[]).filter(x=>x.correct===false).map(x=>({topic:x.topic,level:x.level,error:x.errorType,hints:x.hints}))})),accuracyByLevel:rLv,errors:rErr,streak:{days:rp.streak,freezeLeft:rp.freeze,goalDays:rp.goalDays},vocab:{sessions:rv.length,correct:rv.reduce((s,a)=>s+a.correct,0),total:rv.reduce((s,a)=>s+a.total,0)}};
    const _unused={skips:skips.map(k=>({date:k.endedAt,reason:k.reason,memo:k.memo})),confused:conf,sessions:sum.all.map(a=>({topic:a.topic,date:a.endedAt,minutes:Math.round(a.durationSec/60),correct:a.correct,total:a.total,rating:a.rating,memo:a.memo,example:!!a.example,
      wrong:(a.items||[]).filter(x=>x.correct===false).map(x=>({topic:x.topic,level:x.level,error:x.errorType}))})),accuracyByLevel:sum.lv,errors:sum.errs};
    try{
      const {text}=await sample(`คุณเป็นโค้ชการเรียนที่ช่วยพ่อติดตามลูกสาว ม.2 ที่เตรียมสอบเข้า ม.4 แนวโรงเรียนวิทยาศาสตร์ เขียนภาษาไทย สั้น ชัด ไม่เกิน 180 คำ แบ่ง 3 หัวข้อ: "ทำได้ดี", "ต้องระวัง", "พ่อควรทำอะไรสัปดาห์นี้" (2–3 ข้อ ทำได้จริง น้ำเสียงให้กำลังใจ ไม่กดดันลูก) ถ้าข้อมูลน้อย ให้บอกตรงๆ ว่ายังสรุปไม่ได้มาก ใช้เฉพาะข้อมูลที่ให้มา ซึ่งเป็นข้อมูลจริงทั้งหมด\n\nข้อมูล:\n${JSON.stringify(data)}`,
        {onText:({text})=>{out.textContent=text}});
      analysisText=text; out.textContent=text;
    }catch(e){ out.textContent = e.code==="rate_limited"?"เรียกใช้ถี่เกินไป ลองใหม่อีกสักครู่":"ยังวิเคราะห์ไม่ได้ในตอนนี้"; }
    btn.disabled=false;
  };
}

function route(){ const h=location.hash.replace("#",""); if(false){} else if(h==="map"){view="map"} else if(!["session","intro","feedback","done","skip","send","vocab"].includes(view)){view="home"} else if(view==="done"){view="home"} render() }
window.addEventListener("hashchange",route);
route();
</script>
