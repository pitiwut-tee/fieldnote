<style>

:root[data-theme="dark"]{

.daypanel{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-radius:10px;background:var(--soft)}

.combo{color:var(--beak)}
.spellart{width:100%;max-height:180px;object-fit:cover;border-radius:10px}

.celebrate{position:fixed;inset:0;z-index:50;background:rgba(10,20,18,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.celecard{position:relative;z-index:2;background:var(--card);border-radius:18px;padding:24px 20px;max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;animation:pop .35s ease-out}
.celeicon{font-size:3.4rem;line-height:1}

.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}

.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}

.num{display:flex;gap:8px;flex-wrap:wrap}
.num input{font:inherit;font-family:var(--mono);padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);width:10ch}
.btn{font:inherit;font-family:var(--display);border:0;text-decoration:none;display:inline-block;border-radius:12px;padding:11px 18px;background:var(--accent);color:var(--accent-ink);cursor:pointer;width:fit-content}

.small{font-size:.86rem}

.xpbar .progress{height:10px}

.dot.ice{border-color:#7DB9E8;background:color-mix(in srgb,#7DB9E8 35%,transparent)}

.spells{display:grid;grid-template-columns:1fr;gap:8px}

.spell{font:inherit;text-align:left;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
button.spell{cursor:pointer} button.spell:hover{border-color:var(--accent)}
.spell.shadow{background:transparent;border-style:dashed;color:var(--muted)}

ม: 6 ปรากฏ 3 ครั้ง มากที่สุด จึงเป็น 6", "ถ้าเพิ่ม 100 เข้าไปอีกตัว ค่าเฉลี่ยกลายเป็น 136 ÷ 8 = 17 แต่มัธยฐานเป็น (6 + 6) ÷ 2 = 6 เท่าเดิม"]}]}, "practice": [{"id": "tp1", "topic": "ค่าเฉลี่ย", "level": 1, "q": "คะแนนสอบย่อย 5 ครั้งเป็น 7, 9, 6, 8, 10 คะแนนเฉลี่ยคือเท่าใด", "opts": ["8", "7.5", "9", "40"], "a": 0, "ex": "7 + 9 + 6 + 8 + 10 = 40 แล้ว 40 ÷ 5 = 8 ข้อ 40 คือผลรวม ยังไม่ได้หาร"}, {"id": "tp2", "topic": "มัธยฐาน", "level": 1, "q": "จำนวนภาพสเก็ตช์ที่วาดในแต่ละวันของสัปดาห์: 3, 8, 2, 5, 4, 9, 1 มัธยฐานคือเท่าใด", "opts": ["4", "5", "4.57", "9"], "a": 0, "ex": "เรียงก่อน: 1, 2, 3, 4, 5, 8, 9 ตัวกลาง (ตัวที่ 4) คือ 4 ข้อ 5 คือตัวกลางของรายการที่ยังไม่ได้เรียง ซึ่งเป็นกับดักที่เจอบ่อยมาก"}, {"id": "tp3", "topic": "ฐานนิยม", "level": 1, "q": "จำนวนตอนอนิเมะที่เพื่อน 8 คนดูจบในสัปดาห์นี้: 4, 6, 4, 7, 2, 4, 6, 3 ฐานนิยมคือเท่าใด", "opts": ["4", "6", "4.5", "5"], "a": 0, "ex": "4 ปรากฏ 3 ครั้ง มากที่สุด ส่วน 4.5 คือค่าเฉลี่ย (36 ÷ 8)"}, {"id": "tp4", "topic": "มัธยฐาน", "level": 2, "q": "ความสูง (ซม.) ของต้นอ่อน 6 ต้น: 12, 15, 9, 20, 14, 11 มัธยฐานคือเท่าใด", "opts": ["13", "12", "14", "13.5"], "a": 0, "ex": "เรียง: 9, 11, 12, 14, 15, 20 ข้อมูลมี 6 ตัว (จำนวนคู่) ตัวกลางคือ 12 กับ 14 เฉลี่ยกันได้ (12 + 14) ÷ 2 = 13 ส่วน 13.5 คือค่าเฉลี่ยทั้งชุด"}, {"id": "tp7", "topic": "มัธยฐาน", "level": 2, "en": true, "q": "English corner: Five numbers are 8, 15, x, 10, 20 (not in order). Their median is 12. What is x?  (median = มัธยฐาน · not in order = ยังไม่ได้เรียง)", "opts": ["12", "13", "11", "10"], "a": 0, "ex": "เรียงตัวที่รู้ค่า: 8, 10, 15, 20 มัธยฐานของ 5 ตัวคือตัวที่ 3 ถ้าให้ตัวที่ 3 เป็น 12 ได้ x ต้องอยู่ระหว่าง 10 กับ 15 และเท่ากับ 12 พอดี ลองแทน 11: เรียงเป็น 8, 10, 11, 15, 20 มัธยฐานคือ 11 ไม่ใช่ 12"}, {"id": "tp5", "topic": "ค่าเฉลี่ย", "level": 2, "q": "ศิษย์จอมเวทสอบภาคปฏิบัติ 4 ครั้งได้ 72, 85, 78, 81 คะแนน ครั้งที่ 5 ต้องได้กี่คะแนน ค่าเฉลี่ยทั้ง 5 ครั้งจึงเท่ากับ 80 พอดี (อาจารย์ไม่ปัดเศษให้นะ)", "opts": ["84", "80", "79", "86"], "a": 0, "ex": "ค่าเฉลี่ย 8 function b64e(str){const b=new TextEncoder().encode(str);let o="";for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(o)}
function b64d(x){return new TextDecoder().decode(Uint8Array.from(atob(x),c=>c.charCodeAt(0)))}
function lsFb(){ try{ return JSON.parse(localStorage.getItem("fieldnote.fb")||"[]") }catch(e){ return [] } }
function unsent(){ return {a:lsRead().filter(x=>!x.sent), f:lsFb().filter(x=>!x.sent)} }
function markSent(){ lsWrite(lsRead().map(x=>({...x,sent:true}))); try{localStorage.setItem("fieldnote.fb",JSON.stringify(lsFb().map(x=>({...x,sent:true}))))}catch(e){} attempts=lsRead() }
/* short code: drop text the parent page can look up again by question id, then deflate */
function slim(a){ const {sent,...x}=a; return {...x, items:(x.items||[]).map(({prompt,phase,topic,spell,...i})=>i), confused:(x.confused||[]).map(({prompt,...c})=>c)} }
function fatten(a){ return {...a, items:(a.items||[]).map(i=>{const q=QBANK[i.qid]?.q; return q?{topic:q.topic,spell:q.spell,prompt:q.q,...i}:i}),
  confused:(a.confused||[]).map(c=>{const q=QBANK[c.qid]?.q; return q&&!c.prompt?{...c,prompt:q.q}:c})} }
async function packCode(obj){
  const json=JSON.stringify(obj);
  if(typeof CompressionStream==="function"){ try{
    const buf=new Uint8Array(await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer());
    let t=""; for(let i=0;i<buf.length;i+=0x8000) t+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
    return "SK2:"+btoa(t).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }catch(e){} }
  return "FIELDNOTE1:"+b64e(json);
}
async function exportCode(all){ const a=all?lsRead():unsent().a, f=all?lsFb():unsent().f; return (a.length||f.length)?await packCode({a:a.map(slim),f:f.map(({sent,...x})=>x)}):"" }

async function importCode(raw, asTest){

  if(m2){ const c=m2[1].replace(/-/g,"+").replace(/_/g,"/"); const bin=atob(c+"=".repeat((4-c.length%4)%4));
    const bytes=Uint8Array.from(bin,ch=>ch.charCodeAt(0));

function isoDay(dk){ const d=new Date(dk); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0") }

function questStatus(list, wk, upto, met){
  const inWeek=a=>{const k=dayKey(a.endedAt); return k>=wk&&k<=upto};
  let metDays=0; for(let d=wk; d<=upto; d=nextDay(d)) if(met.has(d)) metDays++;
  const spelled=list.filter(a=>a.type==="vocab"&&inWeek(a)).reduce((s,a)=>s+(a.items||[]).filter(i=>i.kind==="spell"&&i.correct).length,0);
  let tierUp=0;
  if(metDays>=0){ const before=spellStats(list.filter(a=>dayKey(a.endedAt)<wk)), after=spellStats(list.filter(a=>dayKey(a.endedAt)<=upto));
    for(const [k,v] of Object.entries(after)) if(v.tier>(before[k]?.tier||0)) tierUp++; }
  const q=[{key:"days",label:"จุดไฟให้ครบ 5 วัน",have:metDays,need:5},{key:"tier",label:"ทำให้คาถาขึ้นขั้น 1 ครั้ง",have:tierUp,need:1},{key:"spell",label:"สะกดคำศัพท์ถูก 20 คำ",have:spelled,need:20}];
  return {q,all:q.every(x=>x.have>=x.need)};
}

function progressOf(list){
  const modes=dayModes(list);

  list.forEach(a=>{ const k=dayKey(a.endedAt);
    if(a.type==="daymode") return;

    byDay.set(k,(byDay.get(k)||0)+xpOf(a));
    if(a.type==="vocab") vocabDays.add(k); else { units.set(k,(units.get(k)||0)+1); if(a.type==="probe") probes.set(k,(probes.get(k)||0)+1) } });
  const probeCount=SETS.filter(s=>s.kind==="probe").length, firstProbe={};
  list.filter(a=>a.type==="probe").forEach(a=>{const k=dayKey(a.endedAt); firstProbe[a.setId]=Math.min(firstProbe[a.setId]??Infinity,k)});

function lastDone(list){ const last={}; list.filter(isLesson).forEach(a=>{if(a.setId) last[a.setId]=Math.max(last[a.setId]||0,dayKey(a.endedAt))}); return last }
function pickLesson(list, preferCurrent, exclude){
  const last=lastDone(list), t=todayKey(), ex=exclude||[];
  const lessons=SETS.filter(s=>s.kind!=="probe"&&!ex.includes(s.id)); if(!lessons.length) return null;
  const pool=lessons.filter(s=>last[s.id]!==t), use=pool.length?pool:lessons;
  return use.slice().sort((a,b)=>(preferCurrent?(b.current?1:0)-(a.current?1:0):0)||(last[a.id]||0)-(last[b.id]||0))[0];
}
function pickProbe(list){ const done=new Set(list.filter(a=>a.type==="probe").map(a=>a.setId)); return SETS.find(s=>s.kind==="probe"&&!done.has(s.id))||null }
function planToday(list, p){
  const wd=new Date().getDay(), school=p.info.kind==="school";
  const repair=school&&wd===5&&reviewPool(list).length>=4;
  const doneToday=list.filter(a=>isLesson(a)&&dayKey(a.endedAt)===todayKey()).map(a=>a.setId);

  const probe=school?null:pickProbe(list);

}
function recommend(list){ return pickLesson(list,true) }
function reviewPool(list){
  const wrong=new Map();
  list.filter(isLesson).slice().sort((a,b)=>new Date(a.endedAt)-new Date(b.endedAt)).forEach(a=>(a.items||[]).forEach(x=>{
    if(x.skipped||!QBANK[x.qid]) return;
    if(x.correct===false) wrong.set(x.qid,+new Date(a.endedAt)); else if(x.correct) wrong.delete(x.qid);

function shuffleQ(q, perm){
  if(q.num) return q;
  let idx=perm&&perm.length===q.opts.length?perm:null;
  if(!idx){ idx=q.opts.map((_,k)=>k); for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]} }
  return {...q,opts:idx.map(k=>q.opts[k]),a:idx.indexOf(q.a),perm:idx};
}

/* ---------- spell tiers ---------- */
function spellStats(list){
  const st={};
  list.filter(isLesson).forEach(a=>{
    const d=dayKey(a.endedAt);
    (a.items||[]).forEach(x=>{
      if(x.skipped) return; const sp=x.spell||QBANK[x.qid]?.q.spell; if(!sp||!x.level) return;
      const o=st[sp]??={days:{},last:0}; const dd=o.days[d]??={1:[0,0],2:[0,0],3:[0,0]};
      dd[x.level][0]++; if(x.correct) dd[x.level][1]++; o.last=Math.max(o.last,d);
    });
  });
  const out={}, t=todayKey();
  for(const [sp,o] of Object.entries(st)){
    const days=Object.entries(o.days).map(([d,v])=>({d:+d,v}));
    const n1=days.reduce((s,x)=>s+x.v[1][0],0), c1=days.reduce((s,x)=>s+x.v[1][1],0);
    const t1=n1>=3&&c1/n1>=0.8;
    const d2=days.filter(x=>x.v[2][0]>=2&&x.v[2][1]/x.v[2][0]>=0.7).length;
    const t2=t1&&d2>=2;
    const d3=days.filter(x=>x.v[3][0]>=1&&x.v[3][1]/x.v[3][0]>=0.6).map(x=>x.d).sort((a,b)=>a-b);
    const t3=t2&&d3.length>=2&&d3[d3.length-1]-d3[0]>=7*DAY;
    const tier=t3?3:t2?2:t1?1:0, idle=Math.round((t-o.last)/DAY);
    out[sp]={tier,idle,faded:(tier===2&&idle>14)||(tier===3&&idle>21),n1,c1,d2,d3:d3.length};
  }
  return out;
}

      <div class="row"><button class="btn" id="dm-kind">${i.kind==="school"?"ใช่ วันนี้หยุดเรียน":"ใช่ วันนี้ไปโรงเรียน"}</button><button class="btn ghost" id="dm-cancel">ยกเลิก</button></div>`;
  } else {
    body=`<div class="row" style="gap:6px">${i.kind==="holiday"?`<button class="btn ghost small" id="dm-lower">${i.lowered?"เปลี่ยนระดับ":"วันนี้มีธุระ ขอลดระดับ"}</button>`:""}

  }
  return `<div class="daypanel"><p class="small">${head}</p>${p.goalToday?"":body}</div>`;
}
function bindDayPanel(p){
  const on=(id,f)=>{const e=document.getElementById(id); if(e) e.onclick=f};
  on("dm-lower",()=>{dmOpen="lower";dmLevel=null;dmReason=null;renderHome()});
  on("dm-switch",()=>{dmOpen="kind";renderHome()});
  on("dm-cancel",()=>{dmOpen=null;renderHome()});
  $v.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{dmLevel=b.dataset.lv;renderHome()});
  $v.querySelectorAll("[data-rs]").forEach(b=>b.onclick=()=>{dmReason=b.dataset.rs;renderHome()});
  const save=async rec=>{ const now=new Date().toISOString(); await saveAttempt({type:"daymode",setId:"daymode",topic:"ประเภทวัน",day:isoDay(todayKey()),startedAt:now,endedAt:now,durationSec:0,correct:0,total:0,xp:0,items:[],...rec}); dmOpen=null; renderHome() };
  on("dm-save",()=>save({kind:"holiday",level:dmLevel,reason:dmLevel==="full"?"":dmReason}));
  on("dm-kind",()=>save(p.info.kind==="school"?{kind:"holiday",level:"full",reason:"โรงเรียนหยุด"}:{kind:"school",reason:"ต้องไปโรงเรียน"}));
}

let skipPick=null, skipMode="one", leaveDaysN=3;
const LEAVE_REASONS=["ไปค่าย","ทัศนศึกษา","ไปต่างจังหวัด/ต่างประเทศ","สอบ/งานโรงเรียนช่วงยาว","ไม่สบายหลายวัน","อื่นๆ"];
function renderSkip(){
  const p=progressOf(mine());
  const reasons=skipMode==="one"?SKIP_REASONS:LEAVE_REASONS;
  const until=new Date(); until.setDate(until.getDate()+leaveDaysN-1);
  $v.innerHTML=`<section class="card"><h2>ขอพัก</h2>
    <div class="why" role="tablist"><button data-mode="one" aria-pressed="${skipMode==="one"}">วันนี้วันเดียว</button><button data-mode="leave" aria-pressed="${skipMode==="leave"}">ไม่อยู่หลายวัน (ค่าย ทัศนศึกษา)</button></div>
    ${skipMode==="one"?`<p class="small">${p.streak?(p.freeze?`มีน้ำแข็ง 🧊 ${p.freeze} ก้อน พรุ่งนี้จะใช้ 1 ก้อนกันไฟ ${p.streak} วันไม่ให้ดับ`:`ตอนนี้ไม่มีน้ำแข็ง ไฟ ${p.streak} วันจะดับ แต่ไม่เป็นไร เริ่มใหม่ได้เสมอ`):"ไม่เป็นไร พรุ่งนี้เริ่มจุดไฟใหม่กัน"}</p>`
    :`<p class="small">ช่วงที่ลาไว้ ไฟ ${p.streak} วันจะ<b>หยุดรอ</b> ไม่ดับและไม่ใช้น้ำแข็ง กลับมาแล้วทำต่อได้เลย ลาได้ครั้งละไม่เกิน 14 วัน พ่อจะเห็นในหน้าผู้ปกครอง</p>
      <label class="small" for="ldays">กี่วัน (นับวันนี้ด้วย)</label>
      <div class="row"><button class="btn ghost" id="lminus" ${leaveDaysN<=2?"disabled":""}>−</button><b id="ldays" style="font-family:var(--mono);font-size:1.3rem">${leaveDaysN}</b><button class="btn ghost" id="lplus" ${leaveDaysN>=14?"disabled":""}>+</button>
      <span class="small muted">ถึง ${until.toLocaleDateString("th-TH",{weekday:"short",day:"numeric",month:"short"})}</span></div>`}
    <p class="small muted">เพราะอะไร</p>
    <div class="why">${reasons.map(x=>`<button data-sr="${x}" aria-pressed="${skipPick===x}">${x}</button>`).join("")}</div>
    <label class="small muted" for="skipnote">อยากเล่าเพิ่มไหม (ไม่บังคับ)</label>
    <input id="skipnote" style="font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)" placeholder="${skipMode==="one"?"เช่น มีงานกลุ่มส่งพรุ่งนี้":"เช่น ค่ายลูกเสือที่กาญจนบุรี ห้ามใช้มือถือ"}">
    <div class="row"><button class="btn" id="skipsave" ${skipPick?"":"disabled"}>บันทึก</button><button class="btn ghost" id="skipback">กลับ</button></div></section>`;
  const keep=f=>()=>{const n=document.getElementById("skipnote").value; f(); renderSkip(); document.getElementById("skipnote").value=n};
  $v.querySelectorAll("[data-mode]").forEach(b=>b.onclick=keep(()=>{skipMode=b.dataset.mode;skipPick=null}));
  $v.querySelectorAll("[data-sr]").forEach(b=>b.onclick=keep(()=>{skipPick=b.dataset.sr}));
  const lm=document.getElementById("lminus"); if(lm) lm.onclick=keep(()=>{leaveDaysN=Math.max(2,leaveDaysN-1)});
  const lp=document.getElementById("lplus"); if(lp) lp.onclick=keep(()=>{leaveDaysN=Math.min(14,leaveDaysN+1)});
  document.getElementById("skipback").onclick=()=>{view="home";render()};
  document.getElementById("skipsave").onclick=async e=>{e.target.disabled=true;
    const now=new Date().toISOString(), from=todayKey(); let to=from; for(let i=1;i<leaveDaysN;i++) to=nextDay(to);
    const base={type:"skip",reason:skipPick,memo:document.getElementById("skipnote").value.trim(),startedAt:now,endedAt:now,durationSec:0,correct:0,total:0,xp:0,items:[]};
    await saveAttempt(skipMode==="one"?{...base,setId:"skip",topic:"ขอพัก"}:{...base,setId:"leave",topic:"ลาหลายวัน",leave:true,days:leaveDaysN,from,to});
    skipPick=null; skipMode="one"; view="home"; render();};
}

const GLOSS_KEYS=Object.keys(GLOSS).sort((a,b)=>b.length-a.length);
function gloss(raw){
  let t=esc(raw); const marks=[];
  GLOSS_KEYS.forEach(k=>{ const ek=esc(k), i=t.indexOf(ek); if(i<0) return;
    marks.push(k); t=t.slice(0,i)+"\u0001"+(marks.length-1)+"\u0002"+t.slice(i+ek.length) });
  return t.replace(/\u0001(\d+)\u0002/g,(_,n)=>`<button class="term" type="button" data-t="${esc(marks[+n])}">${esc(marks[+n])}</button>`);
}
function bindGloss(){
  $v.querySelectorAll(".term").forEach(b=>b.onclick=()=>{
    const box=document.getElementById("gloss-box"); if(!box) return;
    const k=b.dataset.t; box.hidden=false; box.innerHTML=`<b>${esc(k)}</b> <span class="small">${esc(GLOSS[k]||"")}</span> <button class="btn ghost" id="gloss-x" style="border:0;padding:0 4px">ปิด</button>`;
    document.getElementById("gloss-x").onclick=()=>{box.hidden=true};
    if(S&&!S.glossed.includes(k)) S.glossed.push(k);
  });
}

/* ---------- scratch paper for the pencil ---------- */
const PAD={open:false,strokes:[],tool:"pen",penSeen:false};
function padHtml(){
  return `<button class="padfab" id="pad-toggle" type="button">${PAD.open?"✕ ปิดกระดาษทด":"✏️ กระดาษทด"}</button>
  <div class="pad" id="pad" ${PAD.open?"":"hidden"}>
    <div class="padbar"><button type="button" data-tool="pen" aria-pressed="${PAD.tool==="pen"}">✏️ ปากกา</button><button type="button" data-tool="eraser" aria-pressed="${PAD.tool==="eraser"}">🧽 ยางลบ</button>
      <button type="button" id="pad-undo">↶ ย้อน</button><button type="button" id="pad-clear">🗑 ล้าง</button></div>
    <canvas id="pad-canvas"></canvas></div>`;
}
function padSetup(){
  const tg=document.getElementById("pad-toggle"); if(!tg) return;
  tg.onclick=()=>{PAD.open=!PAD.open; document.body.classList.toggle("padopen",PAD.open); const p=document.getElementById("pad"); p.hidden=!PAD.open; tg.textContent=PAD.open?"✕ ปิดกระดาษทด":"✏️ กระดาษทด"; if(PAD.open) padDraw(true)};
  document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{PAD.tool=b.dataset.tool;document.querySelectorAll("[data-tool]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.tool===PAD.tool))});
  document.getElementById("pad-undo").onclick=()=>{PAD.strokes.pop();padDraw()};
  document.getElementById("pad-clear").onclick=()=>{PAD.strokes=[];padDraw()};
  const cv=document.getElementById("pad-canvas"); let cur=null;
  const pt=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top,e.pressure||0.5]};
  cv.onpointerdown=e=>{ if(e.pointerType==="pen") PAD.penSeen=true; if(PAD.penSeen&&e.pointerType==="touch") return; // palm rests while writing with the pencil
    cv.setPointerCapture(e.pointerId); cur={tool:PAD.tool,pts:[pt(e)]}; PAD.strokes.push(cur); e.preventDefault() };
  cv.onpointermove=e=>{ if(!cur) return; (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>cur.pts.push(pt(ev))); padDraw() };
  cv.onpointerup=cv.onpointercancel=()=>{cur=null};
  if(PAD.open){ document.body.classList.add("padopen"); padDraw(true) }
}
function padDraw(resize){
  const cv=document.getElementById("pad-canvas"); if(!cv||cv.offsetParent===null) return;
  const dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight;
  if(resize||cv.width!==Math.round(w*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr) }
  const g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  const ink=getComputedStyle(document.documentElement).getPropertyValue("--ink").trim()||"#16302B";
  PAD.strokes.forEach(s=>{ g.globalCompositeOperation=s.tool==="eraser"?"destination-out":"source-over"; g.strokeStyle=ink; g.lineCap="round"; g.lineJoin="round";
    for(let i=1;i<s.pts.length;i++){ const [x0,y0]=s.pts[i-1],[x1,y1,p]=s.pts[i]; g.lineWidth=s.tool==="eraser"?22:1.2+p*2.6; g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke() } });
  g.globalCompositeOperation="source-over";
}
window.addEventListener("resize",()=>padDraw(true));

/* ---------- one question ---------- */
function renderStep(){
  const st = S.steps[S.i];
  if(st.kind==="concept") return renderConcept();
  if(st.kind==="rate") return renderRate();
  if(st.kind==="finish") return finishReview();
  const q = st.q, ans = S.answered;
  let body;
  if(q.num){
    body = `<div class="num"><input id="numin" inputmode="decimal" aria-label="คำตอบ" ${ans?"disabled":""} value="${ans&&!ans.dontknow?esc(ans.raw):""}"><span class="muted" style="align-self:center">${q.unit}</span>
      ${ans?"":`<button class="btn" id="check">ตรวจคำตอบ</button>`}</div>`;
  } else {
    body = `<div class="opts">${q.opts.map((o,k)=>{
      let c=""; if(ans){ if(k===q.a) c="right"; else if(k===ans.choice) c="wrong"; }
      const struck=!ans&&S.struck.includes(k);
      return `<div class="optrow"><button class="opt ${c} ${struck?"struck":""}" data-k="${k}" ${ans?"disabled":""}>${esc(o)}</button>
        ${ans?"":`<button class="xopt" type="button" data-x="${k}" aria-pressed="${struck}" aria-label="${struck?"เอาคืน":"ตัดตัวเลือกนี้"}" title="${struck?"เอาคืน":"ตัดตัวเลือกนี้"}">${struck?"↺":"✕"}</button>`}</div>`}).join("")}</div>
      ${ans?"":`<p class="small muted">กด ✕ ท้ายข้อเพื่อตัดตัวเลือกที่ไม่ใช่แน่ๆ</p>`}`;
  }
  let fb = "";
  if(ans){
    const head = ans.dontknow?"ไม่เป็นไร มาดูวิธีคิดกัน (0 XP)":ans.correct?YAY[S.i%YAY.length]:OOPS[S.i%OOPS.length];
    fb = `<div class="feedback"><b class="${ans.correct?"ok":"no"}">${head}${q.num&&!ans.correct?` · คำตอบคือ ${q.answer} ${q.unit}`:""}</b><p>${gloss(q.ex)}</p>
      ${ans.correct||ans.dontknow?"":`<span class="small muted">พลาดเพราะอะไร เลือกได้หลายข้อ (ช่วยให้ระบบเลือกข้อทบทวนได้ตรงขึ้น)</span>
      <div class="why">${Object.entries(ERR).filter(([k])=>k!=="dontknow").map(([k,v])=>`<button data-why="${k}" aria-pressed="${(S.why||[]).includes(k)}">${v}</button>`).join("")}</div>`}
      ${ans.correct?"":askHtml("question")}
    </div>
    <button class="btn" id="next">ต่อไป</button>`;
  }
  $v.innerHTML = `<section class="card">${header()}
    <span class="row" style="gap:6px"><span class="chip l${q.level}">${LV[q.level]} · ${esc(q.topic)}</span>${q.en?`<span class="chip">English corner</span>`:""}</span>
    <p class="prompt">${gloss(q.q)}</p>
    <div class="feedback" id="gloss-box" hidden></div>
    ${S.hints?`<div class="feedback">${q.hints.slice(0,S.hints).map((h,k)=>`<span class="small"><b>คำใบ้ ${k+1}</b> ${esc(h)}</span>`).join("")}</div>`:""}
    ${body}${fb}
    <div class="row">${!ans&&S.hints<q.hints.length?`<button class="btn ghost" id="hint">ขอคำใบ้ (${S.hints}/${q.hints.length})</button>`:""}
    ${!ans?`<button class="btn ghost" id="dontknow">🤔 ยังคิดไม่ออก ดูเฉลย</button>`:""}
    ${st.optional&&!ans?`<button class="btn ghost" id="skip">ข้ามข้อนี้</button>`:""}</div>
  </section>${padHtml()}`;
  bindGloss(); padSetup();
  if(!ans){
    if(q.num){
      const go=()=>{const raw=document.getElementById("numin").value.trim().replace(/,/g,"");const v=parseFloat(raw);if(raw===""||isNaN(v))return;
        answer({raw, correct:Math.abs(v-q.answer)<=q.tol});};
      document.getElementById("check").onclick=go;
      document.getElementById("numin").onkeydown=e=>{if(e.key==="Enter")go()};
    } else {
      $v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer({choice:+b.dataset.k,correct:+b.dataset.k===q.a}));
      $v.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{const k=+b.dataset.x; S.struck=S.struck.includes(k)?S.struck.filter(x=>x!==k):[...S.struck,k]; const y=window.scrollY; renderStep(); window.scrollTo({top:y})});
    }
    const hb=document.getElementById("hint"); if(hb) hb.onclick=()=>{S.hints++;const y=window.scrollY;renderStep();window.scrollTo({top:y})};
    document.getElementById("dontknow").onclick=()=>{S.why=["dontknow"]; answer({choice:-1,raw:"",correct:false,dontknow:true})};

  const top=`<div class="stage"><span>คำศัพท์วันนี้</span><span>${V.phase==="learn"?`คำใหม่ ${V.li+1}/${V.fresh.length}`:V.phase==="quiz"?`ทดสอบ ${V.qi+1}/${V.quiz.length}`:`อ่านสั้นๆ`}</span></div>${voicePicker()}`;
  setTimeout(bindVoicePicker,0);
  if(V.phase==="learn"){
    const w=V.fresh[V.li], heard=speechBroken||V.heard.has(w.w);
    $v.innerHTML=`<section class="card">${top}<span class="eyebrow">คำใหม่</span>
      <span class="vword">${esc(w.w)}</span><p><b>${esc(w.th)}</b></p>
      <div class="row">${sayBtn("say-w","ฟังคำนี้")}${sayBtn("say-slow","ฟังช้าๆ")}</div>
      <p class="small ${heard?"muted":""}" style="${heard?"":"color:var(--beak)"}">${speechBroken?"อ่านออกเสียงเองดังๆ หนึ่งรอบ":heard?"ฟังแล้ว ลองพูดตามดังๆ หนึ่งรอบ":"กดฟังเสียงก่อนนะ แล้วพูดตามดังๆ"}</p>
      <div id="speech-slot">${speechBroken?speechHelpHtml():""}</div>
      <div class="feedback"><p class="vex">“${esc(w.ex)}”</p>
        ${V.showTh?`<p class="small">${esc(w.exTh)}</p>`:`<button class="btn ghost" id="show-th" style="border:0;padding:0">ลองเดาความหมายก่อน แล้วกดดูคำแปล</button>`}
        <div class="row">${sayBtn("say-ex","ฟังประโยค")}${sayBtn("say-ex-slow","ฟังช้าๆ")}</div></div>
      <button class="btn" id="vn" ${heard?"":"disabled"}>${V.li+1<V.fresh.length?"ต่อไป":"ไปทดสอบ"}</button></section>`;
    bindSay("say-w",w.w,false,()=>{if(!V.heard.has(w.w)){V.heard.add(w.w);renderVocab()}});
    bindSay("say-slow",w.w,true,()=>{if(!V.heard.has(w.w)){V.heard.add(w.w);renderVocab()}});
    bindSay("say-ex",w.ex,false); bindSay("say-ex-slow",w.ex,true);
    const st=document.getElementById("show-th"); if(st) st.onclick=()=>{V.showTh=true;renderVocab()};
    document.getElementById("vn").onclick=()=>{ V.showTh=false; if(V.li+1<V.fresh.length) V.li++; else V.phase="quiz"; renderVocab() };
    return;
  }
  if(V.phase==="quiz"){
    const it=V.quiz[V.qi], ans=V.ans;
    const next=()=>{ V.results.push({w:it.w.w,kind:it.kind,correct:ans.correct,fresh:!!it.fresh}); V.ans=null;
      if(V.qi+1<V.quiz.length) V.qi++; else if(V.read) V.phase="read"; else return finishVocab();
      renderVocab(); window.scrollTo({top:0}); };
    if(it.kind==="spell"){
      const hint=it.w.w[0]+" "+"_ ".repeat(it.w.w.length-1).trim();
      $v.innerHTML=`<section class="card">${top}
        <p class="small muted">ฝึกสะกด${it.fresh?" · คำใหม่":" · ทบทวน"} · ฟังเสียงแล้วพิมพ์คำภาษาอังกฤษ</p>
        <p><b>${esc(it.w.th)}</b></p>
        <p style="font-family:var(--mono);letter-spacing:.15em">${esc(hint)} <span class="small muted" style="letter-spacing:0">(${it.w.w.length} ตัว)</span></p>
        <div class="row">${sayBtn("say-w","ฟังเสียง")}${sayBtn("say-slow","ฟังช้าๆ")}</div><div id="speech-slot"></div>
        <div class="num"><input id="spin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="พิมพ์คำศัพท์" style="width:14ch" ${ans&&!ans.retype?"disabled":""} value="${ans&&!ans.retype?esc(ans.raw):""}">
        ${ans?"":`<button class="btn" id="check">ตรวจ</button>`}</div>
        ${ans?`<div class="feedback"><b class="${ans.correct?"ok":"no"}">${ans.correct?"สะกดถูก +5 XP":"ยังไม่ถูก +2 XP"}</b>
          <p>คำที่ถูกคือ <b style="font-family:var(--mono);font-size:1.1rem">${esc(it.w.w)}</b>${ans.correct?"":` · ที่พิมพ์มา <span style="font-family:var(--mono)">${esc(ans.raw)}</span>`}</p>
          ${ans.correct?"":`<p class="small">${ans.retype?"ลองพิมพ์คำที่ถูกอีกครั้ง ช่วยให้มือจำตัวสะกด":""}</p>`}</div>
          ${!ans.correct&&ans.retype?`<p class="small" id="rmsg" aria-live="polite"></p>`:""}
          <button class="btn" id="vn" ${!ans.correct&&ans.retype?"disabled":""}>ต่อไป</button>`:""}
      </section>`;
      bindSay("say-w",it.w.w,false); bindSay("say-slow",it.w.w,true);
      const inp=document.getElementById("spin");
      if(!ans){
        if(!speechBroken) setTimeout(()=>speak(it.w.w),150);
        const go=()=>{const raw=inp.value.trim(); if(!raw) return; const ok=raw.toLowerCase()===it.w.w.toLowerCase(); V.ans={raw,correct:ok,retype:!ok}; renderVocab(); const i2=document.getElementById("spin"); if(i2&&!ok) i2.focus()};
        document.getElementById("check").onclick=go; inp.onkeydown=e=>{if(e.key==="Enter")go()}; inp.focus();
      } else {
        if(!ans.correct&&ans.retype){
          const ok=()=>inp.value.trim().toLowerCase()===it.w.w.toLowerCase();
          inp.oninput=()=>{ const good=ok(); document.getElementById("vn").disabled=!good; document.getElementById("rmsg").textContent=good?"เยี่ยม จำตัวสะกดได้แล้ว":(inp.value.trim()?"ยังไม่ตรง ลองดูตัวสะกดด้านบนอีกที":"") };
          inp.onkeydown=e=>{ if(e.key==="Enter"&&ok()) next() };
          document.getElementById("vn").onclick=()=>{ if(ok()) next() };
          inp.focus();
        } else document.getElementById("vn").onclick=next;
      }
      return;
    }
    $v.innerHTML=`<section class="card">${top}
      <p class="small muted">${it.dir==="en"?"คำนี้แปลว่าอะไร":"คำภาษาอังกฤษของคำนี้คืออะไร"}${it.fresh?" · คำใหม่":" · ทบทวน"}</p>
      <div class="row"><span class="vword">${esc(it.dir==="en"?it.w.w:it.w.th)}</span>${it.dir==="en"?sayBtn("say-w","ฟัง"):""}</div><div id="speech-slot"></div>
      <div class="opts">${it.opts.map((o,k)=>{let c="";if(ans){if(k===it.a)c="right";else if(k===ans.choice)c="wrong"}return `<button class="opt ${c}" data-k="${k}" ${ans?"disabled":""}>${esc(o)}</button>`}).join("")}</div>
      ${ans?`<div class="feedback"><b class="${ans.correct?"ok":"no"}">${ans.correct?"ถูก +5 XP":"ยังไม่ใช่ +2 XP"}</b><p><b>${esc(it.w.w)}</b> = ${esc(it.w.th)}</p><p class="vex small">“${esc(it.w.ex)}”</p><p class="small muted">${esc(it.w.exTh)}</p>
        <div class="row">${sayBtn("say-a","ฟังคำนี้")}</div></div>
      <button class="btn" id="vn">ต่อไป</button>`:""}</section>`;
    bindSay("say-w",it.w.w,false); bindSay("say-a",it.w.w,false);
    if(!ans) $v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{V.ans={choice:+b.dataset.k,correct:+b.dataset.k===it.a};renderVocab()});
    else document.getElementById("vn").onclick=next;
    return;
  }
  if(V.phase==="read"){
    const q=V.read.qs[V.ri], ans=V.ans;
    $v.innerHTML=`<section class="card">${top}<span class="eyebrow">อ่านภาษาอังกฤษสั้นๆ (พุธ เสาร์ อาทิตย์)</span>
      <div class="reading">${esc(V.read.text)}</div>
      <div class="row">${sayBtn("say-r","ฟังทั้งเรื่อง")}</div><div id="speech-slot"></div>
      <p class="prompt">${esc(q.q)}</p>
      <div class="opts">${q.opts.map((o,k)=>{let c="";if(ans){if(k===q.a)c="right";else if(k===ans.choice)c="wrong"}return `<button class="opt ${c}" data-k="${k}" ${ans?"disabled":""}>${esc(o)}</button>`}).join("")}</div>
      ${ans?`<div class="feedback"><b class="${ans.correct?"ok":"no"}">${ans.correct?"ถูก +5 XP":"ยังไม่ใช่ ลองอ่านอีกรอบ +2 XP"}</b>
        <p class="small"><b>คำถาม:</b> ${esc(q.qth)}</p>
        <ul class="small" style="margin:0;padding-left:1.2em">${q.opts.map((o,k)=>`<li>${k===q.a?"✅ ":""}${esc(o)} = ${esc(q.optsTh[k])}</li>`).join("")}</ul>
        <details class="small"><summary>ดูคำแปลทั้งเรื่อง</summary><p>${esc(V.read.th.text)}</p></details></div>
        <button class="btn" id="vn">ต่อไป</button>`:""}</section>`;
    bindSay("say-r",V.read.text,true);
    if(!ans) $v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{V.ans={choice:+b.dataset.k,correct:+b.dataset.k===q.a};renderVocab()});
    else document.getElementById("vn").onclick=()=>{ V.rres.push(ans.correct); V.ans=null; if(V.ri+1<V.read.qs.length){V.ri++;renderVocab()} else finishVocab() };
  }
}
/* replay the vocabulary sessions that are kept, so removed tries do not leave words half-learned */
function rebuildVocabState(list){
  const st={};
  list.filter(a=>a.type==="vocab").sort((a,b)=>new Date(a.endedAt)-new Date(b.endedAt)).forEach(a=>{
    const t=dayKey(a.endedAt), byWord={};
    (a.items||[]).forEach(i=>{ if(i.word) byWord[i.word]=(byWord[i.word]??true)&&i.correct });
    Object.entries(byWord).forEach(([w,ok])=>{ const cur=st[w]?.box||0, box=ok?Math.min(BOX_DAYS.length,cur+1):1; let due=t; for(let k=0;k<BOX_DAYS[box-1];k++) due=nextDay(due); st[w]={box,due} });
  });
  saveVocabState(st);
}
async function finishVocab(){
  V.active=false;
  try{ if(CAN_SPEAK) speechSynthesis.cancel() }catch(e){}
  $v.innerHTML=`<section class="card"><p class="muted">กำลังบันทึก…</p></section>`;
  const st=vocabState(), t=todayKey(), byWord={};
  V.results.forEach(r=>{ byWord[r.w]=(byWord[r.w]??true)&&r.correct });   // a word moves up only if every item on it was right
  Object.entries(byWord).forEach(([w,ok])=>{ const cur=st[w]?.box||0; const box=ok?Math.min(BOX_DAYS.length,cur+1):1;
    let due=t; for(let i=0;i<BOX_DAYS[box-1];i++) due=nextDay(due); st[w]={box,due} });
  saveVocabState(st);
  const c=V.results.filter(r=>r.correct).length, rc=V.rres.filter(Boolean).length;
  const sp=V.results.filter(r=>r.kind==="spell");
  await finishWith({type:"vocab",setId:"vocab",subject:"อังกฤษ",topic:"คำศัพท์วันนี้",startedAt:new Date(V.start).toISOString(),endedAt:new Date().toISOString(),
    durationSec:Math.round((Date.now()-V.start)/1000),correct:c,total:V.results.length,newWords:V.fresh.length,
    spelling:{correct:sp.filter(r=>r.correct).length,total:sp.length},
    reading:V.read?{correct:rc,total:V.rres.length}:null,xp:c*5+(V.results.length-c)*2+rc*5+(V.rres.length-rc)*2,
    items:V.results.map(r=>({qid:"v:"+r.w,word:r.w,kind:r.kind,fresh:r.fresh,correct:r.correct}))});
}

  const got=SPELLS.filter(s=>(ss[s.id]?.tier||0)>=1).length;
  const cnt=[1,2,3].map(t=>SPELLS.filter(s=>(ss[s.id]?.tier||0)===t).length);
  $v.innerHTML=`<section class="card"><span class="eyebrow">แผนที่คาถา</span>
    <h2>เก็บคาถาได้ ${got} จาก ${SPELLS.length}</h2>
    <p class="small">🌱 ฝึกหัด ${cnt[0]} · ✨ ชำนาญ ${cnt[1]} · 👑 ปรมาจารย์ ${cnt[2]}</p>
    <p class="small muted">ทุกคาถามี 3 ขั้น ฝึกหัด (พื้นฐาน) → ชำนาญ (ประยุกต์ ต้องทำได้ 2 วัน) → ปรมาจารย์ (แนวข้อสอบโรงเรียนวิทยาศาสตร์ ต้องทำได้ห่างกัน 1 สัปดาห์) คาถาที่ไม่ได้ใช้นานจะจางลง ทบทวนสั้นๆ ก็กลับมาเต็ม ★ คือความถี่ที่ออกสอบคณิต · คาถาที่ปลดล็อกแล้ว ใส่รูปที่วาดเองเป็นการ์ดได้</p>
    <p class="small" id="artmsg" aria-live="polite"></p>
  </section>
  ${realmOrder.map(rk=>{const sps=SPELLS.filter(s=>s.realm===rk);const g=sps.filter(s=>(ss[s.id]?.tier||0)>=1).length;
    const open=sps.some(sp=>SETS.some(s=>s.spell===sp.id)||ss[sp.id]||sp.id===artTarget);
    return `<details class="realm" ${open?"open":""}><summary><h3 style="display:inline">${REALMS[rk]} <small>เก็บแล้ว ${g}/${sps.length}${open?"":" · แตะเพื่อดู"}</small></h3></summary><div class="spells" style="margin-top:8px">
    ${sps.map(sp=>{const sets=SETS.filter(s=>s.spell===sp.id), info=ss[sp.id], tier=info?.tier||0, art=tier>=1?getArt(sp.id):null;
      const pips=[1,2,3].map(t=>`<i class="${tier>=t?"on"+t:""}"></i>`).join("");
      const stars=sp.stars?` <span class="small" style="color:var(--beak)">${"★".repeat(sp.stars)}</span>`:"";
      const school=sp.school==="not"?`<span class="chip">ยังไม่ได้เรียนที่โรงเรียน</span>`:CAL.currentSpells.includes(sp.id)?`<span class="chip l2">กำลังเรียนอยู่</span>`:"";
      if(!sets.length&&!info) return `<div class="spell shadow"><b>${esc(sp.name)}${stars}</b><span class="small">${esc(sp.topic)} · ${sp.grade}</span>
        <span class="row" style="gap:6px"><span class="small">🔒 คาถาที่รอให้ค้นพบ</span>${school}</span></div>`;
      return `<div class="spell ${info?.faded?"faded":""} ${sp.id===artTarget?"glow":""}" id="sp-${sp.id}">
        ${art?`<img class="spellart" src="${art}" alt="การ์ดคาถา ${esc(sp.name)}">`:""}

        <span class="small muted">${esc(sp.topic)} · ${sp.grade}</span>
        <span class="row" style="gap:8px"><span class="pips" aria-label="${TIER[tier]}">${pips}</span><span class="small">${TIER[tier]}</span>${school}</span>

    ${conf.length?conf.slice(0,8).map((c,i)=>`<div class="logi"><span class="chip">${c.where==="concept"?"การ์ดสรุป":"โจทย์"} · ${esc(c.topic||"")}</span>
      ${c.ask?`<span><b>ลูกถาม:</b> “${esc(c.ask)}”</span>`:""}${c.prompt?`<span class="small muted">${esc(c.prompt)}</span>`:""}
      ${c.ask?`<button class="btn ghost" data-ans="${i}" hidden>ให้ Claude ช่วยร่างคำตอบ</button><p class="small analysis" id="ans-${i}"></p>`:""}</div>`).join("")
      +`<p class="note">คำตอบที่ Claude ร่างให้ คุณพ่ออ่านแล้วเล่าให้ลูกฟัง หรือส่งทาง LINE ก็ได้ ถ้าเรื่องไหนงงซ้ำ บอกผมในแชต ผมจะเพิ่มคำอธิบายในบทเรียน</p>`:`<p class="muted small">ยังไม่มีคำถาม</p>`}
  </section>
  ${unclear.length?`<section class="card"><h3>โจทย์ที่ลูกบอกว่ากำกวม</h3>
    ${unclear.slice(0,8).map(x=>`<div class="logi"><span class="small">${esc(x.prompt||x.qid)}</span><span class="small muted">${esc(x.qid)}</span></div>`).join("")}
    <p class="note">ส่งรายการนี้ให้ Claude ในแชตได้ ผมจะเขียนโจทย์ให้ชัดขึ้น</p></section>`:""}
  ${(()=>{const dm=pool.filter(a=>a.type==="daymode"); return dm.length?`<section class="card"><h3>เปลี่ยนประเภทวันหรือลดระดับ</h3>
    ${dm.slice(0,10).map(k=>`<div class="logi"><span class="small muted">${esc(k.day)}</span><span>${k.kind==="school"?"แจ้งว่าไปโรงเรียน":k.level&&k.level!=="full"?`วันหยุด ลดเป็นระดับ${LEVELS[k.level].label}`:"แจ้งว่าวันหยุด/หยุดเรียน"}${k.reason?` · ${esc(k.reason)}`:""}</span></div>`).join("")}
    <p class="note">วันหยุดปกติเป็นระดับเต็ม ราว 90 นาที ถ้าลดระดับบ่อย อาจถึงเวลาคุยกันเรื่องปริมาณ</p></section>`:""})()}
  <section class="card"><h3>วันที่ขอพัก</h3>
    ${skips.length?skips.slice(0,7).map(k=>`<div class="logi"><span class="small muted">${new Date(k.endedAt).toLocaleDateString("th-TH",{weekday:"short",day:"numeric",month:"short"})}</span><span>${esc(k.reason||"-")}${k.memo?` · “${esc(k.memo)}”`:""}</span></div>`).join(""):`<p class="muted small">ยังไม่มีวันที่ขอพัก</p>`}
  </section>
  <section class="card"><h3>ข้อที่ควรนั่งคุยกัน</h3>
    ${talk.length?talk.map(x=>`<div class="logi"><span class="chip l${x.level}">${esc(x.topic)}</span><span class="small">${esc(x.prompt||x.qid)}</span></div>`).join(""):`<p class="muted small">ยังไม่มีข้อที่ต้องคุย</p>`}
    ${hardRun>=2?`<p class="small" style="color:var(--warn)">ลูกกด "ยาก" หรือ "ยากมาก" ${hardRun} ครั้งจาก 3 ครั้งล่าสุด อาจถึงเวลาลดระดับหรือคุยกันก่อน</p>`:""}
  </section>
  <section class="card"><h3>บันทึกการฝึก</h3><div class="log">
    ${all.slice(0,10).map(a=>`<div class="logi"><div class="row" style="justify-content:space-between"><b>${esc(a.topic)}</b>${a.example?`<span class="example">ตัวอย่าง</span>`:a.test?`<span class="example">ทดสอบ</span>`:""}</div>
      <span class="small muted">${new Date(a.endedAt).toLocaleDateString("th-TH",{weekday:"short",day:"numeric",month:"short"})} · ${Math.round(a.durationSec/60)} นาที · ถูก ${a.correct}/${a.total} · รู้สึก${a.rating||"-"}</span>
      ${a.memo?`<span class="small">“${esc(a.memo)}”</span>`:""}</div>`).join("")}
  </div></section>
  <section class="card"><h3>ข้อความที่ลูกเขียนถึง Claude</h3>
    ${fbList.filter(f=>showExamples||!f.test).length?fbList.filter(f=>showExamples||!f.test).slice(0,5).map(f=>`<div class="logi"><span class="small muted">${new Date(f.at).toLocaleDateString("th-TH",{day:"numeric",month:"short"})}${f.test?` <span class="example">ทดสอบ</span>`:""}</span><span>${esc(f.text)}</span></div>`).join(""):`<p class="muted small">ยังไม่มีข้อความ</p>`}
  </section>
  <section class="card"><h3>ให้ Claude วิเคราะห์</h3>
    <p class="small muted">สรุปจุดแข็ง จุดที่ต้องระวัง และคำแนะนำสำหรับพ่อ จากข้อมูลด้านบน</p>
    <button class="btn" id="ask" hidden>วิเคราะห์ตอนนี้</button>
    <p class="analysis" id="out">${esc(analysisText)}</p>
  </section>`}`;
  const ex=document.getElementById("ex"); if(ex) ex.onchange=()=>{showExamples=ex.checked;renderParent()};
  const dt=document.getElementById("deltest"); if(dt) dt.onclick=async()=>{
    if(dt.dataset.armed!=="1"){dt.dataset.armed="1";dt.textContent="กดอีกครั้งเพื่อยืนยันการลบ";return}
    dt.disabled=true; const m=document.getElementById("delmsg"); m.textContent="กำลังลบ…";
    try{ for(const a of attempts.filter(a=>a.test&&a.id)) await db.collection("attempts").doc(a.id).delete();
         for(const f of fbList.filter(f=>f.test&&f.id)) await db.collection("feedback").doc(f.id).delete();
         m.textContent="ลบแล้ว"; }catch(e){ m.textContent="ลบไม่สำเร็จ ลองใหม่อีกครั้ง"; dt.disabled=false } };
  const ig=document.getElementById("impgo"); if(ig) ig.onclick=async()=>{const msg=document.getElementById("impmsg");ig.disabled=true;msg.textContent="กำลังนำเข้า…";
    try{const {n,k}=await importCode(document.getElementById("imp").value, document.getElementById("imptest").checked);msg.textContent=`นำเข้าแล้ว ${n} ครั้ง และข้อความ ${k} ข้อความ`;}
    catch(e){msg.textContent="รหัสไม่ถูกต้อง ตรวจว่าคัดลอกมาครบทั้งข้อความ"}ig.disabled=false;};
  setupAsk({all,lv,topics,errs,ratings,skips,conf});
  setupAnswers(conf);
}
let samplerP=null;
async function setupAnswers(conf){
  const btns=[...$v.querySelectorAll("[data-ans]")]; if(!btns.length) return;
  samplerP ??= (window.claude?.use?.("sample")??Promise.resolve(null)).catch(()=>null);
  const sample=await samplerP; if(!sample) return;
  btns.forEach(b=>{ if(!document.body.contains(b)) return; b.hidden=false; b.onclick=async()=>{
    const c=conf[+b.dataset.ans], out=document.getElementById("ans-"+b.dataset.ans); b.disabled=true; out.textContent="กำลังร่างคำตอบ…";
    try{ const {text}=await sample(`ลูกสาว ม.2 กำลังฝึกเรื่อง "${c.topic||""}" แล้วพิมพ์ถามว่า "${c.ask}"${c.prompt?` ระหว่างทำโจทย์นี้: "${c.prompt}"`:" ระหว่างอ่านการ์ดสรุปเนื้อหา"}
เขียนคำตอบภาษาไทยให้พ่ออ่านให้ลูกฟังได้เลย สั้น 3–6 ประโยค ใช้ภาษาง่าย ยกตัวอย่างตัวเลขเล็กๆ 1 ตัวอย่าง ตอบตรงสิ่งที่ถาม ไม่เฉลยคำตอบของโจทย์ตรงๆ ถ้าคำถามกำกวมให้ตอบความหมายที่น่าจะเป็นที่สุด`,{onText:({text})=>{out.textContent=text}});
      out.textContent=text }catch(e){ out.textContent="ยังร่างคำตอบไม่ได้ ลองใหม่อีกครั้ง" } b.disabled=false };
  });
}
async function setupAsk(sum){ const skips=sum.skips||[], conf=sum.conf||[];
  const btn=document.getElementById("ask"); if(!btn) return;
  samplerP ??= (window.claude?.use?.("sample")??Promise.resolve(null)).catch(()=>null);
  const sample=await samplerP; if(!sample||!document.body.contains(btn)) return;
  btn.hidden=false;
  btn.onclick=async()=>{
    const out=document.getElementById("out"); btn.disabled=true; out.textContent="กำลังวิเคราะห์ อาจใช้เวลาราวครึ่งนาที…";
    const real=realAttempts(), rs=real.filter(isLesson), rk=real.filter(isSkip), rv=real.filter(a=>a.type==="vocab"), rp=progressOf(real);
    const rItems=rs.flatMap(a=>a.items||[]).filter(x=>!x.skipped);
    if(!rs.length&&!rk.length){ out.textContent="ยังไม่มีข้อมูลจริงให้วิเคราะห์ ข้อมูลตัวอย่างและข้อมูลทดสอบไม่ถูกนับ"; btn.disabled=false; return; }
    const rLv=[1,2,3].map(l=>{const it=rItems.filter(x=>x.level===l);return {level:l,n:it.length,correct:it.filter(x=>x.correct).length}});
    const rErr={}; rItems.filter(x=>!x.correct).forEach(x=>(x.errorTypes&&x.errorTypes.length?x.errorTypes:[x.errorType||"unspecified"]).forEach(k=>{rErr[k]=(rErr[k]||0)+1}));
    const data={skips:rk.map(k=>({date:k.endedAt,reason:k.reason,memo:k.memo})),confused:rs.flatMap(a=>(a.confused||[]).map(c=>({...c,date:a.endedAt}))),notes:fbList.filter(f=>!f.test).slice(0,10).map(f=>f.text),
      sessions:rs.map(a=>({topic:a.topic,date:a.endedAt,minutes:Math.round(a.durationSec/60),correct:a.correct,total:a.total,rating:a.rating,memo:a.memo,
      wrong:(a.items||[]).filter(x=>x.correct===false).map(x=>({topic:x.topic,level:x.level,error:x.errorType,hints:x.hints}))})),accuracyByLevel:rLv,errors:rErr,streak:{days:rp.streak,freezeLeft:rp.freeze,goalDays:rp.goalDays},vocab:{sessions:rv.length,correct:rv.reduce((s,a)=>s+a.correct,0),total:rv.reduce((s,a)=>s+a.total,0)}};
    const _unused={skips:skips.map(k=>({date:k.endedAt,reason:k.reason,memo:k.memo})),confused:conf,sessions:sum.all.map(a=>({topic:a.topic,date:a.endedAt,minutes:Math.round(a.durationSec/60),correct:a.correct,total:a.total,rating:a.rating,memo:a.memo,example:!!a.example,
      wrong:(a.items||[]).filter(x=>x.correct===false).map(x=>({topic:x.topic,level:x.level,error:x.errorType}))})),accuracyByLevel:sum.lv,errors:sum.errs};
    try{
      const {text}=await sample(`คุณเป็นโค้ชการเรียนที่ช่วยพ่อติดตามลูกสาว ม.2 ที่เตรียมสอบเข้า ม.4 แนวโรงเรียนวิทยาศาสตร์ เขียนภาษาไทย สั้น ชัด ไม่เกิน 180 คำ แบ่ง 3 หัวข้อ: "ทำได้ดี", "ต้องระวัง", "พ่อควรทำอะไรสัปดาห์นี้" (2–3 ข้อ ทำได้จริง น้ำเสียงให้กำลังใจ ไม่กดดันลูก) ถ้าข้อมูลน้อย ให้บอกตรงๆ ว่ายังสรุปไม่ได้มาก ใช้เฉพาะข้อมูลที่ให้มา ซึ่งเป็นข้อมูลจริงทั้งหมด\n\nข้อมูล:\n${JSON.stringify(data)}`,
        {onText:({text})=>{out.textContent=text}});
      analysisText=text; out.textContent=text;
    }catch(e){ out.textContent = e.code==="rate_limited"?"เรียกใช้ถี่เกินไป ลองใหม่อีกสักครู่":"ยังวิเคราะห์ไม่ได้ในตอนนี้"; }
    btn.disabled=false;
  };
}

function route(){ const h=location.hash.replace("#",""); if(false){} else if(h==="map"){view="map"} else if(!["session","intro","feedback","done","skip","send","vocab"].includes(view)){view="home"} else if(view==="done"){view="home"} render() }
window.addEventListener("hashchange",route);
route();
</script>
