.alerts{display:flex;flex-direction:column;gap:6px}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

.spstrip{display:flex;flex-wrap:wrap;gap:6px}
.spchip{font-size:.78rem;border:1.5px solid;border-radius:999px;padding:2px 8px;display:inline-flex;gap:5px;align-items:center}.spchip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.factbox{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 10%,var(--card)),var(--card));border:1.5px solid color-mix(in srgb,var(--accent) 35%,var(--line))}
.factrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fcard{font:inherit;color:var(--ink);text-align:center;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 6px;min-height:118px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.fcard .fnum{font-size:.72rem;font-weight:700;color:var(--accent)}

.fcard.newf{border:2px solid var(--beak);animation:glowf 1.8s ease-in-out infinite}
.fcard.newf::after{content:"ใหม่";position:absolute;top:-7px;right:-4px;background:#e2574c;color:#fff;font-size:.65rem;padding:1px 6px;border-radius:8px}
@keyframes glowf{0%,100%{box-shadow:0 0 0 rgba(240,138,60,0)}50%{box-shadow:0 0 12px rgba(240,138,60,.55)}}
.labgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.labcard{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;text-align:center}
.labcard.on{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.genechip{font-family:var(--mono);font-weight:700;font-size:.9rem;background:var(--soft);border-radius:8px;padding:1px 8px}
.punnett{border-collapse:collapse;margin:6px 0}.punnett th{font-family:var(--mono);padding:4px 10px;font-size:1.05rem}
.pcell{font:inherit;font-family:var(--mono);font-weight:700;font-size:1.05rem;width:58px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.skyov{position:absolute!important;inset:0;width:auto!important;pointer-events:none;z-index:0;transition:background .6s}
.skyov svg{width:100%;height:100%;display:block}
.meteor{opacity:0;animation:meteor 5s linear infinite}
@keyframes meteor{0%{opacity:0;transform:translate(0,0)}3%{opacity:1}12%{opacity:0;transform:translate(-60px,40px)}100%{opacity:0}}
.islandwrap{position:relative}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px;margin:6px 0 12px}
.case{font:inherit;color:var(--ink);background:linear-gradient(var(--card),var(--soft));border:1px solid var(--line);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;text-align:center;position:relative}
.case .ce{font-size:1.9rem;line-height:1.2}
.case.locked{opacity:.45;cursor:default}
.case.on{border:2px solid var(--accent)}
.case.newc::after{content:"ใหม่";position:absolute;top:-6px;right:-4px;background:#e2574c;color:#fff;font-size:.65rem;padding:1px 6px;border-radius:8px}
.mnode.fog{opacity:.75}
.mnode.thirst text{filter:saturate(.4)}
.mnode .pulse{animation:pulse 1.6s ease-in-out infinite;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.9}50%{opacity:.25}}
.mnode.sel circle{filter:drop-shadow(0 0 4px rgba(47,111,143,.6))}
.fxp{position:absolute;z-index:3;line-height:1;pointer-events:none;animation:fxfloat 2.4s ease-in-out infinite}

.aura{position:absolute;inset:-6%;border-radius:50%;background:radial-gradient(circle,rgba(255,236,150,.85) 0%,rgba(255,200,90,.35) 45%,transparent 70%);animation:auraglow 2.6s ease-in-out infinite;z-index:0}

.bface.egg{animation:wobble 2.8s ease-in-out infinite;background:transparent}
@keyframes wobble{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-8deg)}90%{transform:rotate(7deg)}95%{transform:rotate(-4deg)}}
.growbox{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--soft)}
.nextshape{font-size:2.4rem;filter:brightness(0);opacity:.35;line-height:1}
.scene{position:relative;border-radius:16px;min-height:250px;display:flex;align-items:flex-end;justify-content:center;padding:16px;overflow:hidden}
.scenesvg{position:absolute;inset:0;width:100%;height:100%}
.scene>*:not(.scenesvg){position:relative}
.scene .hero-pet{margin-bottom:22px;z-index:2}
.scene .bface,.scene .mini .bface{background:transparent!important}
.scene .hero-pet .petwrap::after{content:"";position:absolute;left:18%;right:18%;bottom:-4px;height:12px;border-radius:50%;background:rgba(0,0,0,.18);z-index:0}
.thumb{display:block;width:100%;height:72px;border-radius:8px;overflow:hidden;position:relative}
.thumb svg{width:100%;height:100%}
.twinkle{animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
.rise{animation:rise 6s linear infinite}
@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-240px);opacity:0}}
.fall{animation:fall2 7s linear infinite}
@keyframes fall2{from{transform:translateY(0)}to{transform:translateY(250px)}}
.sway{animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.float{animation:floaty 5s ease-in-out infinite}

.glow{animation:twinkle 3.2s ease-in-out infinite}

.scene .hero-pet{margin-bottom:18px}
.scene .others{position:absolute!important;top:10px;right:10px;display:flex;gap:6px;z-index:2}
.scene .mini{border:0;background:rgba(255,255,255,.55);border-radius:50%;padding:3px;cursor:pointer}
.stars{font-family:var(--display);font-size:1.1rem;color:var(--beak)}
.starlink{color:var(--beak);text-decoration:none;font-weight:600}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}

.swatch{width:56px;height:40px;border-radius:8px;display:inline-block}

.bbtn{border:0;background:none;padding:0;cursor:pointer;animation:bob 3s ease-in-out infinite}
.bbtn.hop{animation:hop .45s ease-out}

@keyframes hop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-12px) scale(1.06)}100%{transform:translateY(0) scale(1)}}
@media (prefers-reduced-motion: reduce){.bbtn,.bbtn.hop{animation:none}}
.bbtn{position:relative}
.heartpop{position:absolute;left:50%;top:20%;pointer-events:none;z-index:5;font-size:22px;animation:heartup 1.1s ease-out forwards}
@keyframes heartup{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-70px) scale(1.15)}}

.scene .hero-pet{transition:left 1.6s ease-in-out;z-index:2}
.zz{position:absolute;right:-4px;top:-6px;font-size:20px;animation:fxfloat 2.4s ease-in-out infinite;pointer-events:none;z-index:4}

de": "ม.1", "mins": "ราว 20 นาที", "added": "2026-11-04", "warm": [], "challenge": null, "concept": {"title": "สรุปอัตราส่วน สัดส่วน ร้อยละ หลังผ่านด่าน", "points": ["อัตราส่วน a : b ทำให้เป็นอย่างต่ำได้โดยหารทั้งสองข้างด้วยจำนวนเดียวกัน และต้องดูลำดับให้ตรงกับที่โจทย์ถาม", "สัดส่วน a : b = c : d คูณไขว้ได้ a × d = b × c ใช้หาตัวที่หายไป", "อัตราส่วนสามจำนวน: ทำตัวที่ซ้ำกันให้เท่ากันก่อน เช่น a : b = 2 : 3 และ b : c = 4 : 5 ทำ b เป็น 12 ได้ a : b : c = 8 : 12 : 15", "ร้อยละที่เปลี่ยนไป = (ส่วนที่เปลี่ยน ÷ ค่าเดิม) × 100 ใช้ \"ค่าเดิม\" เป็นตัวหารเสมอ", "แบ่งตามอัตราส่วน: รวมส่วนทั้งหมดก่อน แล้วหาว่า 1 ส่วนมีค่าเท่าใด"], "formulas": ["a : b = c : d  →  a × d = b × c", "ร้อยละที่เปลี่ยน = (ค่าใหม่ − ค่าเดิม) ÷ ค่าเดิม × 100"], "vocab": [["ratio", "อัตราส่วน"], ["proportion", "สัดส่วน"], ["percent", "ร้อยละ"], ["scale", "มาตราส่วน"]], "alts": [], "use": "ส่วนลด สูตรอาหาร แผนที่ย่อส่วน และการเปรียบเทียบค่าฝุ่นหรือค่าไฟเดือนนี้กับเดือนก่อน ใช้อัตราส่วนและร้อยละทั้งหมด"}, "practice": [{"id": "pr1", "topic": "อัตราส่วนอย่างต่ำ", "level": 1, "q": "อัตราส่วน 24 : 36 เขียนเป็นอัตราส่วนอย่างต่ำได้ตามข้อใด", "opts": ["2 : 3", "3 : 2", "4 : 6", "12 : 18"], "a": 0, "ex": "อัตราส่วนอย่างต่ำคือหารจนหารต่อไม่ได้ เราหารทั้งสองข้างด้วย 12 (ตัวหารร่วมมากของ 24 กับ 36) ได้ 2 : 3 ถ้าเลือก 4 : 6 หรือ 12 : 18 ก็เท่ากันจริง แต่ยังหารต่อได้ เลยยังไม่ใช่อย่างต่ำ", "ctx": "pure", "ctxAuto": true}, {"id": "pr2", "topic": "ร้อยละ", "level": 1, "q": "ร้อยละ 30 ของ 250 คือเท่าใด", "opts": ["75", "7.5", "83.3", "220"], "a": 0, "ex": "หาร้อยละของจำนวน เราคูณแบบนี้: 30/100 × 250 = 75 ถ้าได้ 220 แปลว่าเอา 250 − 30 คือลบตัวเลขร้อยละไปตรงๆ ซึ่งพลาดกันบ่อย", "ctx": "pure", "ctxAuto": true}, {"id": "pr3", "topic": "สัดส่วน", "level": 1, "q": "ถ้า 3 : 5 = x : 40 แล้ว x มีค่าเท่าใด", "opts": ["24", "38", "15", "66.7"], "a": 0, "ex": "อัตราส่วนต้องคูณด้วยเลขเดียวกันทั้งสองข้าง 5 คูณ 8 ได้ 40 เราจึงคูณ 3 ด้วย 8 ได้ 24 (หรือคูณไขว้ 5x = 120 ก็ได้) ถ้าได้ 38 แปลว่าคิดแบบบวก (5 + 35 = 40 เลยเอา 3 + 35) ซึ่งใช้กับอัตราส่วนไม่ได้ จำไว้ว่าอัตราส่วนเป็นเรื่องคูณ ไม่ใช่บวก", "ctx": "pure", "ctxAuto": true}, {"id": "pr4", "topic": "ร้อยละ", "level": 1, "q": "18 คิดเป็นร้อยละเท่าใดของ 72", "opts": ["25%", "400%", "18%", "54%"], "a": 0, "ex": "เอาส่วนที่สนใจหารด้วยทั้งหมด แล้วคูณ 100: 18 ÷ 72 × 100 = 25% ถ้าได้ 400% แปลว่าหารกลับด้าน (72 ÷ 18)", "ctx": "pure", "ctxAuto": true}, {"id": "pr5", "topic": "อัตราส่วนสามจำนวน", "level": 2, "q": "ถ้า a : b = 2 : 3 และ b : c = 4 : 5 แล้ว a : b : c เท่ากับข้อใด", "opts": ["8 : 12 : 15", "2 : 3 : 5", "2 : 7 : 5", "8 : 12 : 20"], "a": 0, "ex": "จะต่ออัตราส่วนได้ b ต้องเท่ากันก่อน 2 : 3 คูณ 4 ได้ 8 : 12 และ 4 : 5 คูณ 3 ได้ 12 : 15 พอ b เป็น 12 ทั้งคู่ ก็รวมเป็น 8 : 12 : 15 ถ้าได้ 2 : 3 : 5 แปลว่าเอามาต่อกันตรงๆ ทั้งที่ b ในสองอัตราส่วนยังไม่เท่ากัน ตรงนี้พลาดกันเยอะ", "ctx": "pure", "ctxAuto": true}, {"id": "pr6", "topic": "ส่วนลด", "level": 2, "q": "เสื้อฮู้ดลายจอมเวทราคา 600 บาท ลดราคา 15% ต้องจ่ายเงินเท่าใด", "opts": ["510 บาท", "585 บาท", "90 บาท", "690 บาท"], "a": 0, "ex": "หาส่วนลดก่อน 15% ของ 600 = 90 บาท แล้วจ่าย 600 − 90 = 510 บาท ถ้าได้ 585 แปลว่าลดไปแค่ 15 บาท ส่วน 90 คือตัวส่วนลด ยังไม่ใช่ราคาที่จ่าย", "ctx": "fun", "ctxAuto": true}, {"id": "pr7", "topic": "มาตราส่วน", "level": 2, "en": true, "q": "English corner: A map scale is 1 : 50,000. Two villages are 6 cm apart on the map. What is the real distance between them?  (map scale = มาตราส่วนแผนที่ · apart = ห่างกัน · real distance = ระยะทางจริง)", "opts": ["3 km", "30 km", "300 m", "0.6 km"], "a": 0, "ex": "ระยะจริง = 6 × 50,000 = 300,000 cm = 3,000 m = 3 km ถ้าได้ 30 km หรือ 300 m แปลว่าตอนแปลงหน่วยเลื่อนจุดทศนิยมผิดไปหนึ่งตำแหน่ง ส่วน 0.6 km มาจากหาร 300,000 ด้วย 500,000 แทนที่จะหารด้วย 100,000 จำไว้ว่า 1 km = 100,000 cm", "ctx": "pure", "ctxAuto": true}, {"id": "pr8", "topic": "ร้อยละที่เพิ่มขึ้น", "level": 2, "q": "ช่องสอนวาดรูปมีผู้ติดตาม 1,250 คน เดือนนี้เพิ่มเป็น 1,500 คน ผู้ติดตามเพิ่มขึ้นร้อยละเท่าใด", "opts": ["20%", "16.7%", "25%", "250%"], "a": 0, "ex": "ร้อยละที่เปลี่ยนต้องเทียบกับค่าเดิมเสมอ เพิ่มขึ้น 1,500 − 1,250 = 250 คน เทียบกับค่าเดิม 250 ÷ 1,250 × 100 = 20% ถ้าได้ 16.7% แปลว่าหารด้วยค่าใหม่ 1,500 ซึ่งเป็นจุดที่พลาดกันบ่อย", "ctx": "fun", "ctxAuto": true}, {"id": "pr9", "topic": "แบ่งตามอัตราส่วน", "level": 3, "q": "นักผจญภัย 3 คนลงเงินซื้อแผนที่สมบัติ 400, 600 และ 1,000 เหรียญ แล้วพบสมบัติ 8,000 เหรียญ ตกลงแบ่งตามสัดส่วนเงินที่ลง คนที่ลง 600 เหรียญจะได้สมบัติกี่เหรียญ", "opts": ["2,400 เหรียญ", "2,667 เหรียญ", "1,600 เหรียญ", "4,000 เหรียญ"], "a": 0, "ex": "แบ่งตามสัดส่วนเงินที่ลง: 400 : 600 : 1,000 = 2 : 3 : 5 รวม 10 ส่วน 1 ส่วน = 800 เหรียญ คนที่ลง 600 ได้ 3 ส่วน = 2,400 เหรียญ ถ้าได้ 2,667 แปลว่าแบ่งเท่ากันทุกคน ซึ่งไม่ได้ตามสัดส่วน ส่วน 1,600 และ 4,000 คือส่วนของอีกสองคน", "ctx": "life", "ctxAuto": true, "parts": {"given": ["3 คนลงเงิน 400, 600 และ 1,000 เหรียญ", "พบสมบัติ 8,000 เหรียญ", "แบ่งตามสัดส่วนเงินที่ลง"], "ask": "สมบัติที่คนลง 600 เหรียญได้ (เหรียญ)", "watch": "ถามเฉพาะส่วนของคนที่ลง 600 เหรียญ"}}, {"id": "pr10", "topic": "ปรับอัตราส่วน", "level": 3, "q": "นักวาดผสมสีชมพูพาสเทลจากสีขาวต่อสีแดงในอัตราส่วน 7 : 1 ได้สีผสมแล้ว 400 mL แต่อยากให้อ่อนลงเป็นอัตราส่วน 9 : 1 ต้องเติมสีขาวอีกกี่ mL (ไม่เติมสีแดง)", "opts": ["100 mL", "50 mL", "200 mL", "25 mL"], "a": 0, "ex": "400 mL แบ่งเป็น 8 ส่วน ส่วนละ 50 mL ได้สีขาว 350 mL สีแดง 50 mL ถ้าอยากให้ขาว : แดง = 9 : 1 โดยแดงยังเท่าเดิม 50 mL สีขาวต้องเป็น 9 × 50 = 450 mL เราจึงเติม 450 − 350 = 100 mL ถ้าได้ 50 mL แปลว่าเพิ่มแค่ 1 ส่วน แต่จริงๆ ต้องเพิ่ม 2 ส่วน", "ctx": "fun", "ctxAuto": true, "parts": {"given": ["สีขาว : สีแดง = 7 : 1", "มีสีผสมแล้ว 400 mL", "อยากให้เป็น 9 : 1 โดยเติมแต่สีขาว"], "ask": "ปริมาณสีขาวที่ต้องเติมเพิ่ม (mL)", "watch": "400 mL คือสีผสมรวม ไม่ใช่สีขาวอย่างเดียว"}}], "hints": {"pr1": ["หาจำนวนที่หารทั้ง 24 และ 36 ลงตัวมากที่สุด"], "pr2": ["ร้อยละ 30 = 30/100"], "pr3": ["5 คูณเท่าไรได้ 40", "คูณ 3 ด้วยจำนวนเดียวกัน"], "pr4": ["(ส่วน ÷ ทั้งหมด) × 100"], "pr5": ["ทำให้ b ในสองอัตราส่วนเป็นจำนวนเดียวกัน", "ค.ร.น. ของ 3 กับ 4 คือ 12"], "pr6": ["หาส่วนลดก่อน: 15% ของ 600", "แล้วลบออกจากราคาเต็ม"], "pr7": ["1 cm บนแผนที่ = 50,000 cm จริง", "100,000 cm = 1 km"], "pr8": ["เพิ่มขึ้นกี่คน", "เทียบกับจำนวนเดิม ไม่ใช่จำนวนใหม่"], "pr9": ["ทำอัตราส่วน 400 : 600 : 1,000 ให้อย่างต่ำ", "รวมส่วนทั้งหมดแล้วหา 1 ส่วน"], "pr10": ["หาว่าตอนนี้มีสีขาวกับสีแดงอย่างละกี่ mL", "สีแดงคงเดิม สีขาวต้องเป็น 9 เท่าของสีแดง"]}}, {"id": "probe-pythagoras", "kind": "probe", "spell": "m17", "subject": "คณิตศาสตร์", "topic": "ด่านสำรวจ: ทฤษฎีบทพีทาโกรัส", "grade": "ม.2", "mins": "ราว 20 นาที", "added": "2026-11-04", "warm": [], "challenge": null, "concept": {"title": "สรุปทฤษฎีบทพีทาโกรัส หลังผ่านด่าน", "points": ["ใช้กับสามเหลี่ยมมุมฉากเท่านั้น: ด้านตรงข้ามมุมฉาก (c) ยาวที่สุดเสมอ อีกสองด้าน (a, b) คือด้านประกอบมุมฉาก", "a² + b² = c² หาด้านยาวที่สุดให้บวก หาด้านประกอบมุมฉากให้ลบ: a² = c² − b²", "บทกลับ: ถ้าด้านทั้งสามของสามเหลี่ยมทำให้ a² + b² = c² จริง สามเหลี่ยมนั้นเป็นมุมฉาก และมุมฉากอยู่ตรงข้ามด้านที่ยาวที่สุด", "ชุดตัวเลขที่ควรจำ: 3-4-5, 5-12-13, 8-15-17, 7-24-25, 9-40-41 และพหุคูณของมัน เช่น 6-8-10", "โจทย์เดินหลายทิศ หรือกล่องสามมิติ: รวมระยะในแนวเดียวกันก่อน หรือใช้พีทาโกรัสสองครั้ง"], "formulas": ["a² + b² = c²   (c = ด้านตรงข้ามมุมฉาก)", "เส้นทแยงมุมกล่อง = √(กว้าง² + ยาว² + สูง²)"], "vocab": [["right triangle", "สามเหลี่ยมมุมฉาก"], ["hypotenuse", "ด้านตรงข้ามมุมฉาก"], ["leg", "ด้านประกอบมุมฉาก"], ["diagonal", "เส้นทแยงมุม"]], "alts": [], "use": "ขนาดจอทีวีหรือมือถือที่บอกเป็นนิ้ว วัดตามแนวทแยง จอ 16 : 9 ขนาด 55 นิ้วจึงกว้างประมาณ 48 นิ้ว ช่างก่อสร้างก็ใช้ด้าน 3-4-5 เช็กว่ามุมห้องตั้งฉากจริง"}, "practice": [{"id": "py1", "topic": "หาด้านตรงข้ามมุมฉาก", "level": 1, "q": "สามเหลี่ยมมุมฉากมีด้านประกอบมุมฉากยาว 6 cm และ 8 cm ด้านตรงข้ามมุมฉากยาวเท่าใด", "opts": ["10 cm", "14 cm", "48 cm", "100 cm"], "a": 0, "ex": "หาด้านที่ยาวที่สุด เราเลยเอากำลังสองมาบวกกัน: 6² + 8² = 36 + 64 = 100 แล้วถอดราก √100 = 10 cm ถ้าได้ 100 cm แปลว่าลืมถอดราก ส่วน 14 cm คือเอาด้านมาบวกกันตรงๆ ซึ่งใช้ไม่ได้", "ctx": "pure", "ctxAuto": true}, {"id": "py2", "topic": "หาด้านประกอบมุมฉาก", "level": 1, "q": "สามเหลี่ยมมุมฉากมีด้านตรงข้ามมุมฉากยาว 13 cm และด้านประกอบมุมฉากด้านหนึ่งยาว 5 cm อีกด้านยาวเท่าใด", "opts": ["12 cm", "8 cm", "√194 cm", "18 cm"], "a": 0, "ex": "13 เป็นด้านที่ยาวที่สุดอยู่แล้ว เราเลยเอากำลังสองมาลบกัน: 13² − 5² = 169 − 25 = 144 แล้ว √144 = 12 cm ถ้าได้ √194 แปลว่าเอา 169 + 25 ซึ่งบวกทั้งที่ 13 เป็นด้านยาวที่สุด พลาดตรงนี้กันเยอะ", "ctx": "pure", "ctxAuto": true}, {"id": "py3", "topic": "ด้านตรงข้ามมุมฉาก", "level": 1, "q": "ในสามเหลี่ยมมุมฉาก ด้านใดยาวที่สุดเสมอ", "opts": ["ด้านตรงข้ามมุมฉาก", "ด้านประกอบมุมฉากที่อยู่แนวนอน", "ด้านที่อยู่ด้านล่างของรูป", "บอกไม่ได้ ขึ้นกับรูป"], "a": 0, "ex": "จากสูตร c² = a² + b² ค่า c² ได้จากการเอา a² กับ b² มาบวกกัน มันเลยมากกว่า a² และ b² เสมอ ด้านตรงข้ามมุมฉากจึงยาวที่สุดเสมอ ไม่ว่าจะวาดรูปหมุนไปทางไหน", "ctx": "pure", "ctxAuto": true}, {"id": "py4", "topic": "บทกลับ", "level": 1, "q": "ด้านสามด้านชุดใดประกอบเป็นสามเหลี่ยมมุมฉาก", "opts": ["7, 24, 25", "4, 5, 6", "5, 10, 12", "6, 8, 12"], "a": 0, "ex": "ลองบวกกำลังสองของสองด้านสั้นแล้วเทียบ: 7² + 24² = 49 + 576 = 625 = 25² ใช่จริง ส่วนชุดอื่นไม่ลงตัว: 16 + 25 = 41 ≠ 36 · 25 + 100 = 125 ≠ 144 · 36 + 64 = 100 ≠ 144", "ctx": "pure", "ctxAuto": true}, {"id": "py5", "topic": "บันไดพิงผนัง", "level": 2, "q": "บันไดยาว 2.5 m พิงผนังตั้งตรง ตีนบันไดห่างจากผนัง 0.7 m ปลายบันไดแตะผนังสูงจากพื้นเท่าใด", "opts": ["2.4 m", "1.8 m", "2.6 m", "3.2 m"], "a": 0, "ex": "บันไดคือด้านตรงข้ามมุมฉาก เราเลยลบกำลังสอง: ความสูง² = 2.5² − 0.7² = 6.25 − 0.49 = 5.76 สูง √5.76 = 2.4 m ถ้าได้ 2.6 m แปลว่าบวกกำลังสองแทนการลบ ส่วน 1.8 m คือเอาความยาวมาลบกันตรงๆ", "ctx": "earth", "ctxAuto": true}, {"id": "py6", "topic": "เส้นทแยงมุม", "level": 2, "q": "จอแท็บเล็ตสำหรับวาดรูปเป็นสี่เหลี่ยมผืนผ้า กว้าง 9 นิ้ว ยาว 12 นิ้ว เส้นทแยงมุมของจอยาวเท่าใด", "opts": ["15 นิ้ว", "21 นิ้ว", "13 นิ้ว", "225 นิ้ว"], "a": 0, "ex": "9² + 12² = 81 + 144 = 225 แล้ว √225 = 15 นิ้ว (เป็นชุด 3-4-5 คูณ 3 ถ้าจำชุดนี้ได้จะเร็วขึ้นเยอะ) ถ้าได้ 225 แปลว่าลืมถอดราก ส่วน 21 ิมาตร 27 ลูกบาศก์เซนติเมตร", "cat": "sci"}, {"w": "distance", "th": "ระยะทาง", "ex": "The robot measured the distance to the lighthouse.", "exTh": "หุ่นยนต์วัดระยะทางไปถึงประภาคาร", "cat": "sci"}, {"w": "practice", "th": "ฝึกซ้อม", "ex": "The dance group practices every evening after school.", "exTh": "ทีมเต้นฝึกซ้อมทุกเย็นหลังเลิกเรียน", "cat": "gen"}, {"w": "improve", "th": "พัฒนาให้ดีขึ้น", "ex": "Her drawings improve a little every week.", "exTh": "ภาพวาดของเธอดีขึ้นทีละนิดทุกสัปดาห์", "cat": "gen"}, {"w": "choose", "th": "เลือก", "ex": "Choose the answer that makes the most sense.", "exTh": "เลือกคำตอบที่สมเหตุสมผลที่สุด", "cat": "gen"}, {"w": "careful", "th": "ระมัดระวัง", "ex": "Be careful when you pour hot water.", "exTh": "ระวังตอนเทน้ำร้อนด้วยนะ", "cat": "gen"}, {"w": "discover", "th": "ค้นพบ", "ex": "The explorers discovered a cave full of glowing stones.", "exTh": "นักสำรวจค้นพบถ้ำที่เต็มไปด้วยหินเรืองแสง", "cat": "gen"}, {"w": "protect", "th": "ปกป้อง", "ex": "The swordsman promised to protect the village.", "exTh": "นักดาบสัญญาว่าจะปกป้องหมู่บ้าน", "cat": "gen"}, {"w": "prepare", "th": "เตรียม", "ex": "She prepared her pencils the night before the exam.", "exTh": "เธอเตรียมดินสอไว้ตั้งแต่คืนก่อนสอบ", "cat": "gen"}, {"w": "outline", "th": "เส้นโครงร่าง", "ex": "Draw a light outline first, then add the details.", "exTh": "วาดเส้นโครงร่างบางๆ ก่อน แล้วค่อยเติมรายละเอียด", "cat": "art"}, {"w": "brush", "th": "พู่กัน / แปรง", "ex": "Use a soft brush for the sky.", "exTh": "ใช้พู่กันขนนุ่มระบายท้องฟ้า", "cat": "art"}, {"w": "rhythm", "th": "จังหวะ", "ex": "The dancers moved together to the rhythm.", "exTh": "นักเต้นขยับพร้อมกันตามจังหวะ", "cat": "art"}, {"w": "glow", "th": "เรืองแสง", "ex": "The magic stone began to glow in the dark.", "exTh": "หินเวทเริ่มเรืองแสงในความมืด", "cat": "art"}, {"w": "costume", "th": "ชุดแต่งกาย / ชุดคอสตูม", "ex": "She designed a costume for the mage character.", "exTh": "เธอออกแบบชุดให้ตัวละครจอมเวท", "cat": "art"}, {"w": "scene", "th": "ฉาก", "ex": "The last scene of the story made everyone cry.", "exTh": "ฉากสุดท้ายของเรื่องทำให้ทุกคนร้องไห้", "cat": "art"}, {"w": "detail", "th": "รายละเอียด", "ex": "Look at the small details in the background.", "exTh": "ดูรายละเอียดเล็กๆ ในฉากหลังสิ", "cat": "art"}, {"w": "pressure", "th": "ความดัน", "ex": "The pressure of water is greater at the bottom of the lake.", "exTh": "ความดันของน้ำที่ก้นทะเลสาบมากกว่าที่ผิวน้ำ", "cat": "sci"}, {"w": "float", "th": "ลอย", "ex": "A wooden boat can float on the river.", "exTh": "เรือไม้ลอยอยู่บนแม่น้ำได้", "cat": "sci"}, {"w": "sink", "th": "จม", "ex": "A small stone will sink in water.", "exTh": "ก้อนหินเล็กๆ จะจมในน้ำ", "cat": "sci"}, {"w": "weight", "th": "น้ำหนัก", "ex": "The robot checked the weight of each box.", "exTh": "หุ่นยนต์ตรวจน้ำหนักของกล่องแต่ละใบ", "cat": "sci"}, {"w": "surface", "th": "ผิว / พื้นผิว", "ex": "Leaves were floating on the surface of the pond.", "exTh": "ใบไม้ลอยอยู่บนผิวน้ำในสระ", "cat": "sci"}, {"w": "frequency", "th": "ความถี่", "ex": "Write the frequency of each score in the table.", "exTh": "เขียนความถี่ของแต่ละคะแนนลงในตาราง", "cat": "sci"}, {"w": "range", "th": "พิสัย / ช่วง", "ex": "The range of the scores is 34 points.", "exTh": "พิสัยของคะแนนเท่ากับ 34 คะแนน", "cat": "sci"}, {"w": "equation", "th": "สมการ", "ex": "She wrote an equation to find the missing number.", "exTh": "เธอเขียนสมการเพื่อหาจำนวนที่หายไป", "cat": "sci"}, {"w": "goal", "th": "เป้าหมาย", "ex": "Her goal is to pass the science-school exam.", "exTh": "เป้าหมายของเธอคือสอบผ่านข้อสอบโรงเรียนวิทยาศาสตร์", "cat": "gen"}, {"w": "mistake", "th": "ความผิดพลาด", "ex": "Everyone makes mistakes when they learn something new.", "exTh": "ทุกคนทำพลาดได้ตอนเรียนเรื่องใหม่", "cat": "gen"}, {"w": "confident", "th": "มั่นใจ", "ex": "After a week of practice, she felt more confident.", "exTh": "หลังฝึกมาหนึ่งสัปดาห์ เธอรู้สึกมั่นใจขึ้น", "cat": "gen"}, {"w": "support", "th": "สนับสนุน / ช่วยเหลือ", "ex": "Her teammates always support each other in a hard match.", "exTh": "เพื่อนร่วมทีมของเธอช่วยกันเสมอเวลาแข่งเกมยากๆ", "cat": "gen"}, {"w": "quickly", "th": "อย่างรวดเร็ว", "ex": "The creature quickly hid behind a rock.", "exTh": "เจ้าสัตว์ตัวนั้นรีบหลบหลังก้อนหินอย่างรวดเร็ว", "cat": "gen"}, {"w": "unusual", "th": "ผิดปกติ / แปลก", "ex": "The sensor recorded an unusual temperature.", "exTh": "เซนเซอร์บันทึกอุณหภูมิที่ผิดปกติได้", "cat": "gen"}, {"w": "remember", "th": "จำได้ / จดจำ", "ex": "Can you remember the rule for exponents?", "exTh": "เธอจำกฎของเลขยกกำลังได้ไหม", "cat": "gen"}, {"w": "palette", "th": "จานสี", "ex": "She mixed blue and yellow on her palette.", "exTh": "เธอผสมสีฟ้ากับสีเหลืองบนจานสี", "cat": "art"}, {"w": "canvas", "th": "ผ้าใบวาดภาพ", "ex": "The painter stretched a new canvas on the frame.", "exTh": "จิตรกรขึงผ้าใบใหม่บนกรอบ", "cat": "art"}, {"w": "hero", "th": "วีรบุรุษ / ตัวเอก", "ex": "The hero of the story is a young swordsman.", "exTh": "ตัวเอกของเรื่องคือนักดาบหนุ่ม", "cat": "art"}, {"w": "stage", "th": "เวที", "ex": "The dance group bowed on the stage.", "exTh": "วงเต้นโค้งคำนับบนเวที", "cat": "art"}, {"w": "bright", "th": "สดใส / สว่าง", "ex": "Use bright colours for a happy scene.", "exTh": "ใช้สีสดใสสำหรับฉากที่มีความสุข", "cat": "art"}], "readings": [{"text": "Mina wanted to draw her cat. First, she made a quick sketch. Then she looked closely to observe the shadow under its chin. She did not get it right the first time, but she was patient. After three tries, the result looked almost alive.", "th": "มินาอยากวาดแมวของเธอ อย่างแรก เธอร่างภาพอย่างเร็วๆ แล้วมองให้ดีเพื่อสังเกตเงาใต้คางของมัน ครั้งแรกเธอยังทำไม่ได้ แต่เธออดทน หลังลองไปสามครั้ง ผลงานก็ดูเกือบเหมือนมีชีวิต", "qs": [{"q": "What did Mina do first?", "opts": ["She made a quick sketch.", "She shaded the shadow.", "She bought a cat.", "She gave up."], "a": 0, "qth": "มินาทำอะไรเป็นอย่างแรก", "optsTh": ["เธอร่างภาพอย่างเร็วๆ", "เธอแรเงาส่วนที่เป็นเงา", "เธอซื้อแมว", "เธอยอมแพ้"]}, {"q": "Which word means she did not give up easily?", "opts": ["patient", "curious", "ancient", "gentle"], "a": 0, "qth": "คำไหนแปลว่าเธอไม่ยอมแพ้ง่ายๆ", "optsTh": ["อดทน", "อยากรู้อยากเห็น", "โบราณ", "อ่อนโยน"]}]}, {"text": "In an experiment, a class put the same amount of sugar into three cups of water. The only variable they changed was the temperature. The sugar dissolved fastest in the hottest cup. Their data shows that heat can increase how fast sugar dissolves.", "th": "ในการทดลอง ห้องเรียนหนึ่งใส่น้ำตาลปริมาณเท่ากันลงในน้ำสามแก้ว ตัวแปรเดียวที่เปลี่ยนคืออุณหภูมิ น้ำตาลละลายเร็วที่สุดในแก้วที่ร้อนที่สุด ข้อมูลของพวกเขาแสดงว่าความร้อนช่วยให้น้ำตาลละลายเร็วขึ้น", "qs": [{"q": "What did the class change?", "opts": ["The temperature", "The amount of sugar", "The type of cup", "The amount of water"], "a": 0, "qth": "ห้องเรียนเปลี่ยนอะไร", "optsTh": ["อุณหภูมิ", "ปริมาณน้ำตาล", "ชนิดของแก้ว", "ปริมาณน้ำ"]}, {"q": "What does the evidence show?", "opts": ["Heat makes sugar dissolve faster.", "Cold makes sugar dissolve faster.", "Sugar never dissolves.", "All cups were the same."], "a": 0, "qth": "หลักฐานแสดงว่าอะไร", "optsTh": ["ความร้อนทำให้น้ำตาลละลายเร็วขึ้น", "ความเย็นทำให้น้ำตาลละลายเร็วขึ้น", "น้ำตาลไม่ละลายเลย", "ทุกแก้วเหมือนกันหมด"]}]}, {"text": "A small robot woke up alone on an island. It did not know how to live there, so it decided to observe the animals. Every day it recorded data: when the birds ate, where the deer slept, and how the weather changed. After one month, the robot could predict the rain one day before it came.", "th": "หุ่นยนต์ตัวเล็กตื่นขึ้นมาตัวคนเดียวบนเกาะ มันไม่รู้ว่าจะอยู่ที่นั่นอย่างไร จึงตัดสินใจสังเกตสัตว์ต่างๆ ทุกวันมันจดข้อมูลไว้ว่า นกกินอาหารเมื่อไร กวางนอนที่ไหน และอากาศเปลี่ยนไปอย่างไร ผ่านไปหนึ่งเดือน หุ่นยนต์ทำนายได้ว่าฝนจะตกล่วงหน้าหนึ่งวัน", "qs": [{"q": "How did the robot learn about the island?", "opts": ["It observed the animals and recorded data.", "It read a book.", "It asked a teacher.", "It already knew everything."], "a": 0, "qth": "หุ่นยนต์เรียนรู้เรื่องเกาะได้อย่างไร", "optsTh": ["มันสังเกตสัตว์และจดข้อมูลไว้", "มันอ่านหนังสือ", "มันถามครู", "มันรู้ทุกอย่างอยู่แล้ว"]}, {"q": "What does 'predict' mean in this story?", "opts": ["say what will happen before it happens", "forget something", "draw a picture", "sleep for a long time"], "a": 0, "qth": "คำว่า predict ในเรื่องนี้หมายถึงอะไร", "optsTh": ["บอกว่าจะเกิดอะไรก่อนที่จะเกิดขึ้น", "ลืมบางอย่าง", "วาดรูป", "นอนหลับนานๆ"]}]}, {"text": "In a 5 vs 5 online game, Mali's team played 20 matches this week. They won 14 matches. Her friend said, \"Our win rate is 14 percent.\" Mali laughed and explained the correct answer. The total was 20, not 100, so the win rate was 14 out of 20.", "th": "ในเกมออนไลน์แบบ 5 ต่อ 5 ทีมของมะลิเล่นไป 20 แมตช์ในสัปดาห์นี้ ชนะ 14 แมตช์ เพื่อนของเธอบอกว่า \"อัตราชนะของเราคือ 14 เปอร์เซ็นต์\" มะลิหัวเราะแล้วอธิบายคำตอบที่ถูก ทั้งหมดคือ 20 ไม่ใช่ 100 อัตราชนะจึงเป็น 14 จาก 20", "qs": [{"q": "What is the team's real win rate?", "opts": ["70 percent", "14 percent", "20 percent", "34 percent"], "a": 0, "qth": "อัตราชนะจริงของทีมคือเท่าไร", "optsTh": ["70 เปอร์เซ็นต์", "14 เปอร์เซ็นต์", "20 เปอร์เซ็นต์", "34 เปอร์เซ็นต์"]}, {"q": "What mistake did the friend make?", "opts": ["He thought the total was 100.", "He counted the wins wrong.", "He forgot to play.", "He used the average."], "a": 0, "qth": "เพื่อนผิดตรงไหน", "optsTh": ["เขาคิดว่าทั้งหมดคือ 100", "เขานับจำนวนที่ชนะผิด", "เขาลืมเล่น", "เขาใช้ค่าเฉลี่ย"]}]}, {"text": "Scientists study pocket-sized creatures in a forest. They estimate the population by catching 40 creatures, putting a small tag on each one, and letting them go. A week later they catch 50 creatures, and 10 of them have tags. Using this ratio, they estimate that about 200 creatures live in the forest.", "th": "นักวิทยาศาสตร์ศึกษาสัตว์ตัวจิ๋วในป่า พวกเขาประมาณจำนวนประชากรโดยจับมา 40 ตัว ติดป้ายเล็กๆ ไว้ทุกตัว แล้วปล่อยไป หนึ่งสัปดาห์ต่อมาจับใหม่ 50 ตัว มี 10 ตัวที่มีป้าย เมื่อใช้อัตราส่วนนี้ พวกเขาประมาณว่ามีสัตว์อยู่ในป่าราว 200 ตัว", "qs": [{"q": "Why did the scientists put tags on the creatures?", "opts": ["To estimate how many live in the forest", "To give them names", "To make them faster", "To sell them"], "a": 0, "qth": "ทำไมนักวิทยาศาสตร์ต้องติดป้ายให้สัตว์", "optsTh": ["เพื่อประมาณว่ามีสัตว์อยู่ในป่ากี่ตัว", "เพื่อตั้งชื่อให้", "เพื่อให้มันวิ่งเร็วขึ้น", "เพื่อเอาไปขาย"]}, {"q": "Which number shows the ratio of tagged creatures in the second catch?", "opts": ["10 out of 50", "40 out of 50", "10 out of 40", "50 out of 200"], "a": 0, "qth": "ตัวเลขไหนคืออัตราส่วนของสัตว์ที่มีป้ายในการจับครั้งที่สอง", "optsTh": ["10 จาก 50", "40 จาก 50", "10 จาก 40", "50 จาก 200"]}]}, {"text": "A dance group of five members practices for a new song. Their teacher measures each member's practice time in hours: 3, 4, 4, 5, and 9. The member who practiced 9 hours was preparing a solo part. The teacher says the median is a better way to describe the usual practice time than the mean.", "th": "วงเต้นที่มีสมาชิกห้าคนซ้อมเพลงใหม่ ครูจดเวลาซ้อมของสมาชิกแต่ละคนเป็นชั่วโมงได้ 3, 4, 4, 5 และ 9 คนที่ซ้อม 9 ชั่วโมงกำลังเตรียมท่อนโซโล่ ครูบอกว่ามัธยฐานบอกเวลาซ้อมตามปกติได้ดีกว่าค่าเฉลี่ย", "qs": [{"q": "What is the median practice time?", "opts": ["4 hours", "5 hours", "9 hours", "3 hours"], "a": 0, "qth": "มัธยฐานของเวลาซ้อมคือเท่าไร", "optsTh": ["4 ชั่วโมง", "5 ชั่วโมง", "9 ชั่วโมง", "3 ชั่วโมง"]}, {"q": "Why is the median better here?", "opts": ["Because 9 hours is much larger than the others", "Because the mean is always wrong", "Because there are five members", "Because the song is new"], "a": 0, "qth": "ทำไมมัธยฐานจึงเหมาะกว่าในกรณีนี้", "optsTh": ["เพราะ 9 ชั่วโมงมากกว่าคนอื่นมาก", "เพราะค่าเฉลี่ยผิดเสมอ", "เพราะมีสมาชิกห้าคน", "เพราะเป็นเพลงใหม่"]}]}, {"text": "An apprentice dropped two jars, and the salt and sand spilled out and got mixed together. Her teacher was not angry. \"Let's separate them,\" he said. First, they added water and stirred until the salt dissolved. Then they used a filter to catch the sand. Last, they left the salty water near a warm window. After a few days, small white crystals appeared.", "th": "ศิษย์ฝึกหัดทำโหลหล่นสองใบ เกลือกับทรายจึงหล่นปนกันเป็นของผสม อาจารย์ไม่โกรธ \"มาแยกมันกันเถอะ\" เขาพูด อย่างแรก พวกเขาเติมน้ำแล้วคนจนเกลือละลาย จากนั้นใช้ที่กรองดักทรายไว้ สุดท้าย พวกเขาวางน้ำเกลือไว้ใกล้หน้าต่างที่อุ่นๆ ผ่านไปไม่กี่วัน ผลึกสีขาวเล็กๆ ก็ปรากฏขึ้น", "qs": [{"q": "What did they use to catch the sand?", "opts": ["a filter", "a magnet", "a brush", "a warm window"], "a": 0, "qth": "พวกเขาใช้อะไรดักทราย", "optsTh": ["ที่กรอง", "แม่เหล็ก", "พู่กัน", "หน้าต่างที่อุ่นๆ"]}, {"q": "Where did the white crystals come from?", "opts": ["the salty water", "the sand", "the broken jar", "the teacher's pocket"], "a": 0, "qth": "ผลึกสีขาวมาจากไหน", "optsTh": ["น้ำเกลือ", "ทราย", "โหลที่แตก", "กระเป๋าของอาจารย์"]}]}, {"text": "Ploy is drawing a map for her fantasy story. On her map, 1 centimetre stands for 2 kilometres. On the map, the castle and the forest are 5 centimetres apart. She draws a light outline of the river first. Then she adds small details, like bridges and boats, with a thin brush.", "th": "พลอยกำลังวาดแผนที่สำหรับเรื่องแฟนตาซีของเธอ บนแผนที่ 1 เซนติเมตรแทนระยะ 2 กิโลเมตร บนแผนที่ ปราสาทกับป่าห่างกัน 5 เซนติเมตร เธอวาดเส้นโครงร่างของแม่น้ำบางๆ ก่อน แล้วจึงเติมรายละเอียดเล็กๆ อย่างสะพานและเรือด้วยพู่กันเส้นเล็ก", "qs": [{"q": "How far is the castle from the forest in the story world?", "opts": ["10 kilometres", "5 kilometres", "2 kilometres", "7 kilometres"], "a": 0, "qth": "ในโลกของเรื่อง ปราสาทอยู่ห่างจากป่าเท่าไร", "optsTh": ["10 กิโลเมตร", "5 กิโลเมตร", "2 กิโลเมตร", "7 กิโลเมตร"]}, {"q": "What does Ploy draw first?", "opts": ["a light outline of the river", "the bridges", "the boats", "the castle walls"], "a": 0, "qth": "พลอยวาดอะไรก่อน", "optsTh": ["เส้นโครงร่างบางๆ ของแม่น้ำ", "สะพาน", "เรือ", "กำแพงปราสาท"]}]}], "calendar": {"note": "วันหยุดจากประกาศวันหยุดสถาบันการเงิน ธปท. (ใกล้เคียงวันหยุดราชการ) ตรวจกับปฏิทิน ป Air4Thai ของกรมควบคุมมลพิษ (ฟรี) หรือเปิดเว็บ air4thai.pcd.go.th", "หน้านี้ในแอปไว้จดข้อมูล (หรือสมุดก็ได้)", "ไม่บังคับ: กระดาษกราฟกับดินสอสี ไว้วาดกราฟเส้น"], "parentNote": "น้องมีมือถือของตัวเอง ลงแอป Air4Thai เองได้ ให้เลือกสถานีวัดที่ใกล้บ้านที่สุด 1 สถานี และใช้สถานีเดิมตลอด ช่วงท้ายอยากให้พ่อนั่งฟังน้องเล่าผล 10 นาที", "steps": [{"title": "เลือกสถานี", "text": "ในแอปเลือกสถานีวัดที่ใกล้บ้านที่สุด จดชื่อสถานีไว้ในช่องสังเกตของวันแรก"}, {"title": "จดทุกวัน เวลาเดิม", "text": "ทุกวันช่วงเวลาเดียวกัน (เช่น หลังกลับถึงบ้าน) จดค่า PM2.5 หน่วย µg/m³ ถ้าแอปมีค่าเฉลี่ย 24 ชั่วโมง ให้จดค่านั้น ระวังอย่าจดค่า AQI ซึ่งเป็นคนละตัวกัน"}, {"title": "สังเกตอากาศ", "text": "จดสั้นๆ ว่าวันนั้นท้องฟ้าเป็นอย่างไร มีลมไหม ฝนตกไหม ฟ้าหม่นไหม"}, {"title": "คำนวณเอง", "text": "ครบ 14 วัน (อย่างน้อย 10 วัน) หาค่าเฉลี่ย มัธยฐาน และพิสัยด้วยตัวเองในกระดาษทด ส่งแล้วระบบจะคำนวณให้เทียบ"}, {"title": "เทียบกับมาตรฐาน", "text": "มาตรฐานของไทยสำหรับ PM2.5 เฉลี่ย 24 ชั่วโมงคือไม่เกิน 37.5 µg/m³ นับว่ามีกี่วันที่เกิน"}, {"title": "เล่าให้พ่อฟัง", "text": "เล่าว่าค้นพบอะไร และจะแนะนำคนในบ้านอย่างไร"}], "record": {"cols": ["วันที่", "PM2.5 (µg/m³)", "สังเกตอะไรได้บ้าง"], "placeholders": ["15 พ.ย.", "32", "ฟ้าหม่น ไม่มีลม"], "numCol": 1, "min": 10, "target": 14, "hint": "จดวันละ 1 แถว เวลาเดิมทุกวัน ข้อมูลเก็บไว้ในเครื่องนี้ ค่อยๆ เพิ่มได้"}, "questions": [{"id": "q1", "q": "ค่าเฉลี่ย มัธยฐาน และพิสัยที่เธอคำนวณได้เท่าไร ค่าไหนบอกภาพฝุ่นของบ้านเราได้ดีกว่ากัน เพราะอะไร"}, {"id": "q2", "q": "มีกี่วันที่ค่าเกิน 37.5 µg/m³ คิดเป็นร้อยละเท่าไรของวันที่จด"}, {"id": "q3", "q": "วันที่ฝุ่นสูงกับวันที่ฝุ่นต่ำ อากาศต่างกันอย่างไร (ลม ฝน ท้องฟ้า) เธอคิดว่าเป็นเพราะอะไร"}, {"id": "q4", "q": "ถ้าให้แนะนำคนในบ้าน 1 อย่างจากข้อมูลนี้ จะแนะนำอะไร"}, {"id": "q5", "q": "อยากรู้อะไรต่อจากภารกิจนี้", "optional": true}], "approvedNote": "Approved by dad in chat on 2026-11-05; she has her own phone and installs the app herself."}]}, "letters": {"note": "Short letters from her companion, written by the content run (Wed/Sun). This repo is public: no names, no school, no personal details; learning only. The app shows the newest letter whose date has come.", "letters": [{"id": "letter-2026-11-05", "date": "2026-11-05", "text": "สวัสดี! นี่จดหมายฉบับแรกจากเรานะ\n\nตั้งแต่วันนี้ เราจะอยู่ในสมุดเล่มนี้ด้วยกัน มีของใหม่ที่อยากเล่าให้ฟังนิดนึง\n\n🔊 ถ้าโจทย์ยาวๆ อ่านแล้วงง ลองอ่านเองก่อนสักพัก แล้วกดฟังได้ ให้ตาวิ่งตามตัวที่ไฮไลต์ไปด้วยนะ\n🧩 ข้อยากๆ มีปุ่มช่วยแบ่งโจทย์ ว่าโจทย์ให้อะไร ถามอะไร\n🎯 เดือนนี้อยากพิชิตอะไร ตั้งเป้าเองได้เลย ถ้าอยากได้รางวัล เดี๋ยวเราช่วยคุยกับพ่อให้\n\nถ้าตรงไหนงง กด \"พิมพ์ถามตรงจุดที่งง\" ได้ทุกเมื่อ เราจะอ่านทุกคำถาม แล้วตอบกลับในจดหมายฉบับหน้า\n\nข้อที่พลาดไม่ได้แปลว่าไม่เก่งนะ แปลว่าเราเจอสิ่งที่ต้องฝึกแล้ว ค่อยๆ ไปด้วยกัน"}, {"id": "letter-2026-11-06", "date": "2026-11-06", "text": "เมื่อวานเธอถามว่า \"มัธยฐานใช้ตอนไหน\" คำถามดีมากเลย\n\nใช้ตอนที่ข้อมูลมีค่าแปลกๆ โผล่มาสักตัว เช่น อุณหภูมิ 7 วันปกติราว 31–33 °C แต่มีวันเดียวที่เครื่องวัดโดนแดดจนขึ้น 45 °C ค่าเฉลี่ยจะโดนตัว 45 ดึงขึ้นไปจนสูงกว่าเกือบทุกวัน แต่มัธยฐานดูแค่ตัวตรงกลางหลังเรียง เลยไม่สนตัวแปลกๆ นั้น\n\nจำง่ายๆ: มีค่าสุดโต่ง ใช้มัธยฐาน · ข้อมูลไม่ใช่ตัวเลข เช่น สีที่ชอบ ใช้ฐานนิยม · ข้อมูลธรรมดาไม่มีตัวแปลก ใช้ค่าเฉลี่ย\n\nอีกเรื่องที่เราเห็น: ข้อท้าทายเมื่อวาน เธอใช้เวลาคิดเกือบ 5 นาทีจนตอบถูก ไม่ยอมแพ้แบบนี้แหละที่ทำให้เก่งขึ้นจริง\n\nต่อไปข้อที่เคยพลาด เราจะไม่เอาข้อเดิมมาให้ทำซ้ำแล้วนะ จะเป็นข้อแฝดที่ใช้วิธีคิดเดียวกันแต่ตัวเลขใหม่ บางข้อจะให้พิมพ์คำตอบเอง ลองดูว่ารอบนี้ทำได้ไหม"}, {"id": "letter-2026-11-08", "date": "2026-11-08", "text": "วันก่อนเธอถามว่า \"มีวิธีคิดเร็วๆ ไหม\" ตอนเทียบ 2¹⁰ กับ 10³ มีจ้า\n\nเคล็ดลับคือจำไว้ตัวเดียว: 2¹⁰ = 1,024 (คอมพิวเตอร์ใช้เลขนี้บ่อยมาก) พอรู้ตัวนี้ก็เทียบกับ 10³ = 1,000 ได้ทันที\nถ้าลืม ให้เพิ่มสองเท่าไปเรื่อยๆ 2, 4, 8, 16, 32 แล้ว 32 × 32 = 1,024 เร็วกว่านับทีละตัวเยอะ\n\nอีกเรื่องที่เราเห็น: ข้อนั้นเธออ่านคำอธิบายนานหลายนาที แล้วยังถามต่อ แบบนี้คือการเรียนจริงๆ ไม่ใช่แค่ผ่านไป\n\nทริคเล็กๆ เรื่องแบ่งตัวสองเท่า: ตอนเริ่มยังไม่นับเป็นการแบ่งนะ เขียนตาราง 0 นาที 1 ตัว, รอบแรก 2 ตัว, รอบสอง 4 ตัว จะไม่นับเกิน\n\nพรุ่งนี้มีแขกพิเศษมาเยี่ยมเกาะด้วย แค่ทำทบทวนวันละ 3 ข้อให้ครบ 2 วัน การดึงความจำออกมาบ่อยๆ แบบนี้ช่วยให้จำได้นานที่สุดเลย"}, {"id": "letter-2026-11-09", "date": "2026-11-09", "text": "เมื่อวานเธอเขียนไว้ที่ข้อเส้นขนานว่า \"ยังไม่เคยเรียน\" ถูกต้องเลย ข้อนั้นเราใส่มาเกินเอง ขอโทษนะ เรื่องเส้นขนานจะได้เรียนกันจริงๆ ทีหลัง แต่ที่น่าทึ่งคือรอบทบทวนเธอค่อยๆ คิดจนทำข้อนั้นถูกด้วย\n\nชุดผสมเมื่อวานยากจริง เพราะมันสลับหลายเรื่องในชุดเดียว ข้อสอบจริงก็เป็นแบบนี้ ตอนนี้ยังพลาดเยอะไม่เป็นไร ชุดแบบนี้มีไว้ให้เราเห็นว่าเรื่องไหนต้องกลับไปฝึก\n\nสิ่งที่เราเห็นเมื่อวานตอนเช้า: บทเรียนสารละลาย ข้อคิดวิเคราะห์ 3 ข้อ เธอตอบถูก และตอบคำถาม \"ทำไม\" ถูกทั้ง 3 ข้อ ข้อท้าทายใช้เวลา 3 นาทีแล้วทำได้ แปลว่าเข้าใจเหตุผล ไม่ได้เดา\n\nทริคแบ่งตามอัตราส่วน: รวมส่วน → หา 1 ส่วน → คูณกับส่วนที่โจทย์ถาม แล้วอ่านคำถามท้ายโจทย์อีกรอบว่าถามของใคร\n\nพ่อตกลงเรื่องรางวัลเป้าหมายเดือนนี้แล้ว!\n\nพรุ่งนี้มีของใหม่: \"ย้อนคาถาเก่า\" วันละ 5 ข้อสั้นๆ จากเรื่องที่เคยเรียนตอน ม.1–2 ลืมไปบ้างก็ไม่แปลก การดึงกลับมาบ่อยๆ คือวิธีทำให้จำได้นาน"}, {"id": "letter-2026-11-10", "date": "2026-11-10", "text": "เมื่อวานบทแผนภาพต้น-ใบ เธอทำถูก 10 จาก 11 ข้อ ข้อท้าทายที่ต้องใช้พิสัยหาใบที่หายไปก่อน แล้วค่อยหาค่าเฉลี่ย เธอพิมพ์คำตอบเองและเลือกเหตุผลถูกด้วย แบบนี้คือคิดเป็นสองขั้นได้แล้ว\n\nข้อที่กดว่าไม่รู้ (หาใบ x จากค่าเฉลี่ย) มีทริคเดียว: รู้ค่าเฉลี่ย → คูณจำนวนข้อมูลได้ผลรวม → ลบค่าที่รู้ ก็ได้ค่าที่หายไป เดี๋ยวจะมีข้อแฝดให้ลองในรอบทบทวน\n\nทริคความหนาแน่น: ดูหน่วย g/cm³ กรัมอยู่บน แปลว่าเอามวลตั้ง หารด้วยปริมาตร ถ้าได้คำตอบมากกว่า 1 ทั้งที่ของลอยน้ำ ให้สงสัยว่าหารกลับด้าน\n\nในหุบเขามังกร เธอเติมตารางพันเนตต์ถูกและบอกอัตราส่วน 1/2 ได้ถูก เรื่องนี้เป็นของ ม.3 ด้วยนะ\n\nส่วนการ์ดสตูดิโอ วงจรเกมที่เธอเขียนวนกลับมาที่ \"เรียนบทเรียน\" พอดี นักออกแบบเกมเรียกแบบนี้ว่าวงจรที่ปิดสนิท\n\nวันเสาร์นี้ภารกิจวัดฝุ่น PM2.5 เริ่มแล้ว เราจะได้ใช้ค่าเฉลี่ยกับข้อมูลจริงที่เธอเก็บเอง"}, {"id": "letter-2026-11-11", "date": "2026-11-11", "text": "ตอบคำถามเรื่องหน่วย Pa ก่อนนะ Pa อ่านว่า ปาสคาล เป็นหน่วยของความดัน ความดัน = แรง ÷ พื้นที่ ถ้าแรง 1 นิวตันกดลงบนพื้นที่ 1 ตารางเมตร ความดันคือ 1 Pa ข้อคนยืน 600 N บนรองเท้า 0.02 m² ก็คือ 600 ÷ 0.02 = 30000 Pa เรื่องนี้ออกสอบด้วย วันนี้เราเลยมีบทเรียนเรื่องความดันให้โดยเฉพาะ เริ่มจากปริศนาช้างกับรองเท้าส้นเข็ม ลองเดาก่อนนะ\n\nเมื่อวานตอนเขียนคู่มือผู้เล่นข้อตกผลึก {name}คิดต่อน้ำ 100 g ก่อน แล้วค่อยคูณ 2 ตามน้ำ 200 g และยังบอกด้วยว่าถ้าได้ 45 แปลว่าลืมคูณ นี่คือวิธีคิดของคนที่เข้าใจจริง ไม่ใช่แค่จำ\n\nข้อเปรียบเทียบสองกิลด์ คิดค่าเฉลี่ยถูกแล้ว แต่พลาดตอนอ่านคำท้ายตัวเลือก ทริคคือ อ่านตัวเลือกให้จบทั้งประโยคก่อนกด\n\nนักสืบยีน: คำตัดสินสองตัวถูกทั้งคู่ และให้เหตุผลจากหลักฐานด้วย เก่งมาก\n\nวันเสาร์นี้มีชุดผสมชุดใหม่ สลับคณิตกับวิทย์แบบข้อสอบจริง และภารกิจวัดฝุ่นก็เริ่มวันเดียวกัน"}]}, "decisions": {"note": "Dad's answers to her monthly goal rewards, copied from the parent page's feedback docs (kind:'goal') by the content run. goals: {goalId: {status:'ok'|'talk', note}}. No personal details: this repo is public.", "goals": {"goal-2026-11-mw7anhed": {"status": "ok", "note": ""}}}, "variants": {"note": "Twin questions for review: same idea as the original question (key = its id), new numbers and situation. The app uses a twin she hasn't seen instead of repeating the original. Written by the content run for questions she got wrong.", "variants": {"ms2p2": [{"id": "ms2p2~v1", "ctx": "pure", "q": "ข้อมูล 15 ตัว เมื่อเรียงจากน้อยไปมากแล้ว มัธยฐานคือข้อมูลตัวที่เท่าใด", "opts": ["ตัวที่ 8", "ตัวที่ 7.5", "ตัวที่ 7", "ตัวที่ 15"], "a": 0, "ex": "ตำแหน่งกลางคือ (15 + 1) ÷ 2 = 8 ตัวที่ 8 มีซ้าย 7 ตัว ขวา 7 ตัว อยู่ตรงกลางพอดี ถ้าได้ 7.5 แปลว่าลืมบวก 1 ก่อนหาร จำไว้ว่า (n + 1) ÷ 2 เสมอ", "hints": ["ใช้ (n + 1) ÷ 2", "ลองนับดูว่าตัวที่ได้ มีซ้ายกับขวาเท่ากันไหม"]}, {"id": "ms2p2~v2", "ctx": "pure", "q": "ข้อมูล 20 ตัว เมื่อเรียงจากน้อยไปมากแล้ว มัธยฐานหาจากข้อมูลตัวใด", "opts": ["ค่าเฉลี่ยของตัวที่ 10 กับตัวที่ 11", "ตัวที่ 10 ตัวเดียว", "ตัวที่ 11 ตัวเดียว", "ค่าเฉลี่ยของตัวที่ 11 กับตัวที่ 12"], "a": 0, "e function b64e(str){const b=new TextEncoder().encode(str);let o="";for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(o)}
function b64d(x){return new TextDecoder().decode(Uint8Array.from(atob(x),c=>c.charCodeAt(0)))}
function lsFb(){ try{ return JSON.parse(localStorage.getItem("fieldnote.fb")||"[]") }catch(e){ return [] } }
function unsent(){ return {a:lsRead().filter(x=>!x.sent), f:lsFb().filter(x=>!x.sent)} }
function markSent(){ lsWrite(lsRead().map(x=>({...x,sent:true}))); try{localStorage.setItem("fieldnote.fb",JSON.stringify(lsFb().map(x=>({...x,sent:true}))))}catch(e){} attempts=lsRead() }
/* short code: drop text the parent page can look up again by question id, then deflate */
function slim(a){ const {sent,...x}=a; return {...x, items:(x.items||[]).map(({prompt,phase,topic,spell,...i})=>i), confused:(x.confused||[]).map(({prompt,...c})=>c)} }
function fatten(a){ return {...a, items:(a.items||[]).map(i=>{const q=QBANK[i.qid]?.q; return q?{topic:q.topic,spell:q.spell,prompt:q.q,...i}:i}),
  confused:(a.confused||[]).map(c=>{const q=QBANK[c.qid]?.q; return q&&!c.prompt?{...c,prompt:q.q}:c})} }
async function packCode(obj){
  const json=JSON.stringify(obj);
  if(typeof CompressionStream==="function"){ try{
    const buf=new Uint8Array(await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer());
    let t=""; for(let i=0;i<buf.length;i+=0x8000) t+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
    return "SK2:"+btoa(t).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }catch(e){} }
  return "FIELDNOTE1:"+b64e(json);
}
async function exportCode(all){ const a=all?lsRead():unsent().a, f=all?lsFb():unsent().f; const b=getBuddy(); return (a.length||f.length)?await packCode({a:a.map(slim),f:f.map(({sent,...x})=>x),...(b?{b:{name:b.name,kind:b.kind}}:{})}):"" }

/* LINE cuts long messages (about 1,000 characters got through), so a long code is sent as numbered parts */
const PART_LEN=800;
function splitCode(code){ if(code.length<=PART_LEN) return [code];
  const id=(Date.now()%46656).toString(36).padStart(3,"0"), n=Math.ceil(code.length/PART_LEN), out=[];

async function importCode(raw, asTest){
  /* LINE may wrap a long code, split it into several bubbles, or add invisible characters: join everything first */
  raw=String(raw||"").replace(/[\s\u200B-\u200D\u2060\uFEFF]/g,"");
  if(raw.includes("SKP:")){ const got={}; let n=0, id=null;
    raw.split("SKP:").slice(1).forEach(seg=>{const m=seg.match(/^([a-z0-9]+):(\d+)\/(\d+):(.*)$/); if(!m) return;
      if(id&&m[1]!==id) return; id=m[1]; n=+m[3]; got[+m[2]]=m[4]});
    const miss=[]; for(let i=1;i<=n;i++) if(!(i in got)) miss.push(i);
    if(!n) throw new Error("bad");
    if(miss.length){ const er=new Error("parts"); er.miss=miss; er.n=n; throw er }
    raw=Array.from({length:n},(_,i)=>got[i+1]).join(""); }
  let data; const m2=raw.match(/SK2:([A-Za-z0-9_-]+)/), m1=raw.match(/FIELDNOTE1:([A-Za-z0-9+/=]+)/);
  if(!m2&&!m1) throw new Error("bad");
  try{
    if(m2){ const c=m2[1].replace(/-/g,"+").replace(/_/g,"/"); const bin=atob(c+"=".repeat((4-c.length%4)%4));
      const bytes=Uint8Array.from(bin,ch=>ch.charCodeAt(0));
      data=JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text()); }
    else data=JSON.parse(b64d(m1[1]));
  }catch(e){ const er=new Error("cut"); er.len=(m2||m1)[1].length; throw er }
  let n=0,k=0; const what=[];
  for(const a of (data.a||[])){ what.push(`${a.topic||a.type||"ผลฝึก"} (${new Date(a.endedAt).toLocaleString("th-TH",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})})`); const id=("s-"+(a.setId||a.type)+"-"+a.endedAt).replace(/[^A-Za-z0-9_-]/g,""); const {example,...rest}=fatten(a); await db.collection("attempts").doc(id).set({...rest,via:"code",test:!!(a.test||asTest)}); n++ }
  if(data.b&&!asTest){ try{ await db.collection("feedback").doc("buddy").set({kind:"buddy",name:data.b.name,buddy:data.b.kind,at:new Date().toISOString()}) }catch(e){} }
  for(const f of (data.f||[])){ const id=("f-"+f.at).replace(/[^A-Za-z0-9_-]/g,""); await db.collection("feedback").doc(id).set({...f,test:!!(f.test||asTest)}); k++ }
  return {n,k,what};
}

const NUMOPT=/^\s*([−-]?[\d,]*\.?\d+(?:\s*\/\s*\d+)?)\s*(.*)$/;

function pickLesson(list, preferCurrent, exclude){
  const last=lastDone(list), t=todayKey(), ex=exclude||[];
  /* calendar.lessonQueue: the school's order for the next lessons; the first one not done yet comes first */
  if(preferCurrent&&Array.isArray(CAL.lessonQueue)){ const q=CAL.lessonQueue.map(id=>SETS.find(s=>s.id===id)).find(s=>s&&s.kind==="lesson"&&!last[s.id]&&!ex.includes(s.id)); if(q) return q }
  const lessons=SETS.filter(s=>s.kind==="lesson"&&!ex.includes(s.id)); if(!lessons.length) return null;
  const pool=lessons.filter(s=>last[s.id]!==t), use=pool.length?pool:lessons;

/* questions to look at again: wrong answers, and (trial) right answers she was not sure about */
function reviewPool(list){

    if(x.skipped||!QBANK[x.qid]) return; const id=QBANK[x.qid].q.of||x.qid;

    if(x.notTaught) return; if(x.correct===false||(x.correct&&(x.conf==="unsure"||x.checkOk===false||x.guessed||x.hintStep))) wrong.set(id,+new Date(a.endedAt)); else if(x.correct&&thought) wrong.delete(id);

const SPACING=[3,4,7,14];   // days before a spell is due again, by tier 0..3

/* old-topic sweep ("ย้อนคาถาเก่า"): a few questions a day from ม.1–2 topics, mixed, one per spell, the spell checked

function sweepQuestions(list,n){
  const bank=SETS.filter(s=>s.kind==="sweep").flatMap(s=>s.practice); if(!bank.length) return [];
  const cur=new Set(CAL.currentSpells||[]), seen=new Map(), lastSpell=new Map(), t=todayKey();
  list.filter(a=>a.type==="sweep").forEach(a=>(a.items||[]).forEach(x=>{ const d=dayKey(a.endedAt); seen.set(x.qid,Math.max(seen.get(x.qid)||0,d)); const sp=QBANK[x.qid]?.q.spell; if(sp) lastSpell.set(sp,Math.max(lastSpell.get(sp)||0,d)) }));
  const fresh=bank.filter(q=>!cur.has(q.spell)&&!seen.has(q.id));
  const bySpell=new Map(); fresh.forEach(q=>{ if(!bySpell.has(q.spell)) bySpell.set(q.spell,[]); bySpell.get(q.spell).push(q) });
  const order=[...bySpell.keys()].sort((a,b)=>(lastSpell.get(a)||0)-(lastSpell.get(b)||0)||(hashStr(a+t)%97)-(hashStr(b+t)%97));

let skipPick=null, skipMode="one", leaveDaysN=3;
const LEAVE_REASONS=["ไปค่าย","ทัศนศึกษา","ไปต่างจังหวัด/ต่างประเทศ","สอบ/งานโรงเรียนช่วงยาว","ไม่สบายหลายวัน","อื่นๆ"];
function renderSkip(){
  const p=progressOf(mine());
  const reasons=skipMode==="one"?SKIP_REASONS:LEAVE_REASONS;
  const until=new Date(); until.setDate(until.getDate()+leaveDaysN-1);
  $v.innerHTML=`<section class="card"><h2>ขอพัก</h2>
    <div class="why" role="tablist"><button data-mode="one" aria-pressed="${skipMode==="one"}">วันนี้วันเดียว</button><button data-mode="leave" aria-pressed="${skipMode==="leave"}">ไม่อยู่หลายวัน (ค่าย ทัศนศึกษา)</button></div>
    ${skipMode==="one"?`<p class="small">${p.streak?(p.freeze?`มีน้ำแข็ง 🧊 ${p.freeze} ก้อน พรุ่งนี้จะใช้ 1 ก้อนกันไฟ ${p.streak} วันไม่ให้ดับ`:`ตอนนี้ไม่มีน้ำแข็ง ไฟ ${p.streak} วันจะดับ แต่ไม่เป็นไร เริ่มใหม่ได้เสมอ`):"ไม่เป็นไร พรุ่งนี้เริ่มจุดไฟใหม่กัน"}</p>`
    :`<p class="small">ช่วงที่ลาไว้ ไฟ ${p.streak} วันจะ<b>หยุดรอ</b> ไม่ดับและไม่ใช้น้ำแข็ง กลับมาแล้วทำต่อได้เลย ลาได้ครั้งละไม่เกิน 14 วัน พ่อจะเห็นในหน้าผู้ปกครอง</p>
      <label class="small" for="ldays">กี่วัน (นับวันนี้ด้วย)</label>
      <div class="row"><button class="btn ghost" id="lminus" ${leaveDaysN<=2?"disabled":""}>−</button><b id="ldays" style="font-family:var(--mono);font-size:1.3rem">${leaveDaysN}</b><button class="btn ghost" id="lplus" ${leaveDaysN>=14?"disabled":""}>+</button>
      <span class="small muted">ถึง ${until.toLocaleDateString("th-TH",{weekday:"short",day:"numeric",month:"short"})}</span></div>`}
    <p class="small muted">เพราะอะไร</p>
    <div class="why">${reasons.map(x=>`<button data-sr="${x}" aria-pressed="${skipPick===x}">${x}</button>`).join("")}</div>
    <label class="small muted" for="skipnote">อยากเล่าเพิ่มไหม (ไม่บังคับ)</label>
    <input id="skipnote" style="font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)" placeholder="${skipMode==="one"?"เช่น มีงานกลุ่มส่งพรุ่งนี้":"เช่น ค่ายลูกเสือที่กาญจนบุรี ห้ามใช้มือถือ"}">
    <div class="row"><button class="btn" id="skipsave" ${skipPick?"":"disabled"}>บันทึก</button><button class="btn ghost" id="skipback">กลับ</button></div></section>`;
  const keep=f=>()=>{const n=document.getElementById("skipnote").value; f(); renderSkip(); document.getElementById("skipnote").value=n};
  $v.querySelectorAll("[data-mode]").forEach(b=>b.onclick=keep(()=>{skipMode=b.dataset.mode;skipPick=null}));
  $v.querySelectorAll("[data-sr]").forEach(b=>b.onclick=keep(()=>{skipPick=b.dataset.sr}));
  const lm=document.getElementById("lminus"); if(lm) lm.onclick=keep(()=>{leaveDaysN=Math.max(2,leaveDaysN-1)});
  const lp=document.getElementById("lplus"); if(lp) lp.onclick=keep(()=>{leaveDaysN=Math.min(14,leaveDaysN+1)});
  document.getElementById("skipback").onclick=()=>{view="home";render()};
  document.getElementById("skipsave").onclick=async e=>{e.target.disabled=true;
    const now=new Date().toISOString(), from=todayKey(); let to=from; for(let i=1;i<leaveDaysN;i++) to=nextDay(to);
    const base={type:"skip",reason:skipPick,memo:document.getElementById("skipnote").value.trim(),startedAt:now,endedAt:now,durationSec:0,correct:0,total:0,xp:0,items:[]};
    await saveAttempt(skipMode==="one"?{...base,setId:"skip",topic:"ขอพัก"}:{...base,setId:"leave",topic:"ลาหลายวัน",leave:true,days:leaveDaysN,from,to});
    skipPick=null; skipMode="one"; view="home"; render();};
}

const SUP={"⁰":"0","¹":"1","²":"2","³":"3","⁴":"4","⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9","⁻":"ลบ "};
const UNIT_SAY={km:"กิโลเมตร",cm:"เซนติเมตร",mm:"มิลลิเมตร",m:"เมตร",kg:"กิโลกรัม",mg:"มิลลิกรัม",g:"กรัม",mL:"มิลลิลิตร",ml:"มิลลิลิตร",L:"ลิตร",N:"นิวตัน",Pa:"ปาสคาล",kPa:"กิโลปาสคาล",W:"วัตต์",kW:"กิโลวัตต์",kWh:"กิโลวัตต์ชั่วโมง",J:"จูล",s:"วินาที",h:"ชั่วโมง",V:"โวลต์",A:"แอมแปร์","µm":"ไมโครเมตร"};
function sayable(t){
  return String(t).replace(/PM ?2\.5/g,"พีเอ็มสองจุดห้า").replace(/ม\.(\d)/g,"มอ $1").replace(/ป\.(\d)/g,"ปอ $1")
    .replace(/([\d⁰¹²³⁴⁵⁶⁷⁸⁹]) ?(kWh|kPa|km|cm|mm|kg|mg|mL|ml|kW|µm|Pa|m|g|L|N|W|J|V|A|s|h)(?![A-Za-z²³\/])/g,(m,d,u)=>d+" "+UNIT_SAY[u]+" ")
    .replace(/(\d+)\/(\d+)/g,"$1 ส่วน $2")
    .replace(/µg\/m³/g," ไมโครกรัมต่อลูกบาศก์เมตร ").replace(/g\/cm³/g," กรัมต่อลูกบาศก์เซนติเมตร ").replace(/cm³/g," ลูกบาศก์เซนติเมตร ").replace(/m³/g," ลูกบาศก์เมตร ")
    .replace(/m²/g," ตารางเมตร ").replace(/cm²/g," ตารางเซนติเมตร ").replace(/°C/g," องศาเซลเซียส ").replace(/% ?w\/v/g," เปอร์เซ็นต์โดยมวลต่อปริมาตร ")
    .replace(/(\d)²/g,"$1 กำลังสอง ").replace(/(\d)³/g,"$1 กำลังสาม ").replace(/([⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g,m=>" ยกกำลัง "+[...m].map(c=>SUP[c]).join("")+" ")
    .replace(/√/g," รากที่สองของ ").replace(/×/g," คูณ ").replace(/÷/g," หาร ").replace(/=/g," เท่ากับ ").replace(/[−–](?=\s*\d)/g," ลบ ")
    .replace(/%/g," เปอร์เซ็นต์ ").replace(/(\d) : (\d)/g,"$1 ต่อ $2").replace(/[→]/g," ได้ ").replace(/·/g,", ").replace(/\s+/g," ").trim();
}
function chunkText(t){
  const parts=String(t).replace(/\s+/g," ").trim().split(/(?<=[ .?!;])(?=\S)/), out=[];
  for(const p of parts){ if(out.length&&(out[out.length-1].length<22||p.trim().length<6)) out[out.length-1]+=p; else out.push(p) }
  return out.filter(x=>x.trim());
}

    <div class="row" style="margin-top:8px;gap:8px"><span class="small">ความเร็ว</span><span class="why">${RD_RATES.map(([l,v])=>`<button type="button" data-rate="${v}" aria-pressed="${RD.rate===v}">${l}</button>`).join("")}</span></div>

  (btn.closest(".row")||btn).insertAdjacentElement("afterend",box); btn.textContent="⏹ หยุดอ่าน"; RD.box=box;

    try{localStorage.setItem("fieldnote.thrate",String(RD.rate))}catch(err){} box.querySelectorAll("[data-rate]").forEach(x=>x.setAttribute("aria-pressed",x===b)); restart() });

    if(RD.k>=RD.chunks.length){ RD.where=null; btn.textContent=btn.dataset.label; box.querySelectorAll(".now").forEach(x=>x.classList.remove("now")); return }
    const v=thVoice(), k=RD.k, gen=RD.gen||0, u=new SpeechSynthesisUtterance(sayable(RD.chunks[k])); u.lang="th-TH"; if(v){ u.voice=v; u.lang=v.lang } u.rate=RD.rate;
    u.onstart=()=>{started=true}; u.onend=()=>{ if(RD.k===k&&RD.where===where&&(RD.gen||0)===gen){ RD.k++; next() } }; u.onerror=e=>{ if(e.error!=="interrupted"&&e.error!=="canceled"){ RD.where=null; btn.textContent=btn.dataset.label; alertRead(where,"เสียงภาษาไทยยังไม่พร้อม บน iPad ไปที่ การตั้งค่า › การช่วยการเข้าถึง › เนื้อหาที่ถูกพูด › เสียง › ไทย แล้วดาวน์โหลดเสียง") } };

/* ---------- figures inside questions (q.fig): dot plot, stem-and-leaf (one or two sided), histogram/bar chart, table ---------- */
function figHtml(f){
  if(!f) return "";
  try{
  if(f.kind==="dot"){ const step=f.step||1, n=Math.round((f.max-f.min)/step), W=Math.max(260,n*26+40), maxc=Math.max(1,...Object.values(f.counts||{})), H=maxc*13+46, x=v=>20+(v-f.min)/step*((W-40)/n);
    const tick=f.tick||(n>14?2:1); let g="";
    for(let i=0;i<=n;i++){ const v=+(f.min+i*step).toFixed(4); g+=`<line x1="${x(v)}" y1="${H-26}" x2="${x(v)}" y2="${H-20}" stroke="currentColor"/>`+(i%tick===0?`<text x="${x(v)}" y="${H-6}" font-size="11" text-anchor="middle" fill="currentColor">${v}</text>`:"") }
    Object.entries(f.counts||{}).forEach(([v,c])=>{ for(let k=0;k<c;k++) g+=`<circle cx="${x(+v)}" cy="${H-33-k*13}" r="4.6" fill="var(--accent)"/>` });
    return `<figure class="qfig"><svg viewBox="0 0 ${W} ${H}" style="max-width:${W}px" role="img" aria-label="แผนภาพจุด"><line x1="10" y1="${H-23}" x2="${W-10}" y2="${H-23}" stroke="currentColor" stroke-width="1.5"/>${g}</svg>${f.label?`<figcaption class="small muted">${esc(f.label)}</figcaption>`:""}</figure>` }
  if(f.kind==="stem"){ const two=f.rows.some(r=>r.length===3);
    return `<figure class="qfig"><table class="stemtab">${f.head?`<tr>${f.head.map((h,i)=>`<th class="${two&&i===0?"l":""}">${esc(h)}</th>`).join("")}</tr>`:""}${f.rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${two?(i===0?"l":i===1?"st":""):(i===0?"st":"")}">${esc(c)}</td>`).join("")}</tr>`).join("")}</table>${f.key?`<figcaption class="small muted">${esc(f.key)}</figcaption>`:""}</figure>` }
  if(f.kind==="hist"||f.kind==="bar"){ const v=f.values, mx=Math.max(...v), W=Math.max(260,v.length*48+50), H=190, bw=(W-50)/v.length, gap=f.kind==="hist"?0:10, y=t=>H-30-(t/mx)*(H-55);
    let g=""; v.forEach((t,i)=>{ g+=`<rect x="${40+i*bw+gap/2}" y="${y(t)}" width="${bw-gap}" height="${H-30-y(t)}" fill="color-mix(in srgb,var(--accent) 55%,transparent)" stroke="currentColor" stroke-width="1"/><text x="${40+i*bw+bw/2}" y="${y(t)-4}" font-size="11" text-anchor="middle" fill="currentColor">${t}</text>` });
    (f.labels||[]).forEach((l,i)=>{ g+=`<text x="${f.kind==="hist"&&f.edges?40+i*bw:40+i*bw+bw/2}" y="${H-14}" font-size="10.5" text-anchor="middle" fill="currentColor">${esc(l)}</text>` });
    return `<figure class="qfig"><svg viewBox="0 0 ${W} ${H}" style="max-width:${W}px" role="img" aria-label="${f.kind==="hist"?"ฮิสโทแกรม":"แผนภูมิแท่ง"}"><line x1="38" y1="${H-30}" x2="${W-6}" y2="${H-30}" stroke="currentColor"/><line x1="38" y1="12" x2="38" y2="${H-30}" stroke="currentColor"/>${g}</svg>${f.xLabel||f.yLabel?`<figcaption class="small muted">${esc([f.yLabel&&("แกนตั้ง: "+f.yLabel),f.xLabel&&("แกนนอน: "+f.xLabel)].filter(Boolean).join(" · "))}</figcaption>`:""}</figure>` }
  if(f.kind==="table") return `<figure class="qfig"><div style="overflow-x:auto"><table class="mt">${f.head?`<thead><tr>${f.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>`:""}<tbody>${f.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>${f.caption?`<figcaption class="small muted">${esc(f.caption)}</figcaption>`:""}</figure>`;
  }catch(e){}
  return "";
}

const GLOSS_KEYS=Object.keys(GLOSS).sort((a,b)=>b.length-a.length);
/* question data written as "a → b · c → d · ..." is shown one item per line (father, 10 Nov: the dots were hard to read) */
function qLines(h){ if(!h||h.indexOf(" · ")<0||/English corner/.test(h)) return h; const parts=h.split(" · ");
  let head=parts[0], first="", after=""; const c=head.lastIndexOf(": "); if(c>0&&c>head.length-40){ first=head.slice(c+2); head=head.slice(0,c+1) } else { const o=head.lastIndexOf("("); if(o>=0&&o>head.length-40){ first=head.slice(o+1); head=head.slice(0,o+1) } else { first=head; head="" } }
  const items=[first,...parts.slice(1)]; let last=items[items.length-1];
  const startsData=x=>/^\s*[\d(]/.test(x);
  if(items.length>2&&startsData(items[0])&&!startsData(last)&&!/→/.test(last)){ items.pop(); after=last }
  else { const r=/\)\s+(?=[ก-๙])|\s(?=(?:ข้อใด|ข้อสรุป|ถ้า|จง|ฐานนิยม|มัธยฐาน|ค่าเฉลี่ย|พิสัย|ชมรม|ส่วนกลุ่ม|มีนักเรียน|ทำไม|ช่วงคะแนนใด|ช่วงใด))/g; let mm, cut=-1;
    while((mm=r.exec(last))){ if(mm.index>0){ cut=mm.index+(mm[0].startsWith(")")?1:0); break } }
    if(cut>0){ items[items.length-1]=last.slice(0,cut); after=last.slice(cut).trim() } }
  return head+items.map(x=>`<span class="qline">${x}</span>`).join("")+(after?`<span class="qafter">${after}</span>`:"") }
function gloss(raw){
  let t=esc(raw); const marks=[];
  GLOSS_KEYS.forEach(k=>{ const ek=esc(k), i=t.indexOf(ek); if(i<0) return;
    marks.push(k); t=t.slice(0,i)+"\u0001"+(marks.length-1)+"\u0002"+t.slice(i+ek.length) });
  return t.replace(/\u0001(\d+)\u0002/g,(_,n)=>`<button class="term" type="button" data-t="${esc(marks[+n])}">${esc(marks[+n])}</button>`);
}
function bindGloss(){
  $v.querySelectorAll(".term").forEach(b=>b.onclick=()=>{
    const box=document.getElementById("gloss-box"); if(!box) return;
    const k=b.dataset.t; box.hidden=false; box.innerHTML=`<b>${esc(k)}</b> <span class="small">${esc(GLOSS[k]||"")}</span> <button class="btn ghost" id="gloss-x" style="border:0;padding:0 4px">ปิด</button>`;
    document.getElementById("gloss-x").onclick=()=>{box.hidden=true};
    if(S&&!S.glossed.includes(k)) S.glossed.push(k);
  });
}

/* ---------- ask about the exact thing that is confusing; goes to dad (and Claude) with the results ---------- */
function askHtml(where){
  const done=S.confused.find(c=>c.where===where&&c.ask&&c.key===askKey(where));
  return `<details class="ask"${S.askOpen===askKey(where)?" open":""}><summary>✍️ พิมพ์ถามตรงจุดที่งง</summary>
    ${done?`<p class="small">ส่งคำถามแล้ว: “${esc(done.ask)}” พ่อกับ Claude จะช่วยตอบ</p>`:""}
    <textarea id="ask-text" rows="2" placeholder="เช่น จำนวนคู่ คืออะไร / ทำไมต้องหาร 5" style="font:inherit;padding:8px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);width:100%;box-sizing:border-box"></textarea>
    <button class="btn ghost" id="ask-send">ส่งคำถาม</button>
    <p class="small muted">คำว่าที่มีเส้นประใต้ กดดูความหมายได้ทันทีนะ</p></details>`;
}
function askKey(where){ const st=S.steps[S.i]; return where==="concept"?"concept":(st.q?.id||"q") }
function bindAsk(where, extra){
  const d=$v.querySelector("details.ask"); if(d) d.ontoggle=()=>{S.askOpen=d.open?askKey(where):null};
  const b=document.getElementById("ask-send"); if(!b) return;
  b.onclick=()=>{ const t=document.getElementById("ask-text").value.trim(); if(!t) return;
    S.confused.push({where,key:askKey(where),topic:extra.topic,qid:extra.qid,prompt:extra.prompt,ask:t}); saveProgress(); S.askOpen=askKey(where); renderStep() };
}

/* ---------- scratch paper for the pencil ---------- */
const PAD={open:false,strokes:[],hist:[],tool:"pen",penSeen:false,view:{z:1,x:0,y:0},big:false};
try{ PAD.penSeen=localStorage.getItem("fieldnote.pen")==="1" }catch(e){}
function padHtml(){
  return `<button class="padfab" id="pad-toggle" type="button">${PAD.open?"✕ ปิดกระดาษทด":"✏️ กระดาษทด"}</button>
  <div class="pad ${PAD.big?"big":""}" id="pad" ${PAD.open?"":"hidden"}>
    <div class="padbar"><button type="button" data-tool="pen" aria-pressed="${PAD.tool==="pen"}">✏️ ปากกา</button><button type="button" data-tool="eraser" aria-pressed="${PAD.tool==="eraser"}">🧽 ยางลบ (ลบทีละเส้น)</button>
      <button type="button" data-tool="pan" aria-pressed="${PAD.tool==="pan"}">✋ เลื่อน</button>
      <button type="button" id="pad-zo" aria-label="ซูมออก">🔍−</button><button type="button" id="pad-zi" aria-label="ซูมเข้า">🔍+</button><button type="button" id="pad-fit">⤢ ${Math.round(PAD.view.z*100)}%</button>
      <button type="button" id="pad-big" aria-pressed="${PAD.big}">${PAD.big?"⬇ ย่อกระดาษ":"⬆ ขยายกระดาษ"}</button>
      <button type="button" id="pad-undo">↶ ย้อน</button><button type="button" id="pad-clear">🗑 ล้าง</button></div>
    <canvas id="pad-canvas"></canvas></div>`;
}
function padSetup(){
  const tg=document.getElementById("pad-toggle"); if(!tg) return;
  tg.onclick=()=>{PAD.open=!PAD.open; document.body.classList.toggle("padopen",PAD.open); const p=document.getElementById("pad"); p.hidden=!PAD.open; tg.textContent=PAD.open?"✕ ปิดกระดาษทด":"✏️ กระดาษทด"; if(PAD.open) padDraw(true)};
  document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{PAD.tool=b.dataset.tool;document.querySelectorAll("[data-tool]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.tool===PAD.tool))});
  /* undo history: "add" a stroke, or "erase" whole strokes (so undo brings erased lines back) */
  document.getElementById("pad-undo").onclick=()=>{ const h=PAD.hist.pop(); if(!h) return;
    if(h.type==="add") PAD.strokes=PAD.strokes.filter(x=>x!==h.stroke); else if(h.type==="erase") PAD.strokes.push(...h.strokes); else if(h.type==="clear") PAD.strokes=h.strokes; padDraw() };
  document.getElementById("pad-clear").onclick=()=>{ if(PAD.strokes.length) PAD.hist.push({type:"clear",strokes:PAD.strokes}); PAD.strokes=[]; padDraw() };
  const cv=document.getElementById("pad-canvas"); let cur=null, activeId=null, erased=null;
  /* zoom and pan: strokes are kept in paper coordinates; the view (z, x, y) maps paper to screen.
     Zoom out = more paper. Move with the ✋ tool, or with two fingers (pinch to zoom). */
  const V=PAD.view, fitLbl=()=>{ const f=document.getElementById("pad-fit"); if(f) f.textContent="⤢ "+Math.round(V.z*100)+"%" };
  const zoomAt=(nz,cx,cy)=>{ nz=Math.max(0.35,Math.min(3,nz)); V.x=cx-(cx-V.x)*nz/V.z; V.y=cy-(cy-V.y)*nz/V.z; V.z=nz; fitLbl(); padDraw() };
  document.getElementById("pad-zi").onclick=()=>zoomAt(V.z*1.25,cv.clientWidth/2,cv.clientHeight/2);
  document.getElementById("pad-zo").onclick=()=>zoomAt(V.z/1.25,cv.clientWidth/2,cv.clientHeight/2);
  document.getElementById("pad-fit").onclick=()=>{ V.z=1; V.x=0; V.y=0; fitLbl(); padDraw() };
  document.getElementById("pad-big").onclick=()=>{ PAD.big=!PAD.big; document.body.classList.toggle("padbig",PAD.big); const pd=document.getElementById("pad"); pd.classList.toggle("big",PAD.big);
    const b=document.getElementById("pad-big"); b.textContent=PAD.big?"⬇ ย่อกระดาษ":"⬆ ขยายกระดาษ"; b.setAttribute("aria-pressed",PAD.big); padDraw(true) };
  const touches=new Map(); let pinch=null, panning=null;
  const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left-V.x)/V.z,(e.clientY-r.top-V.y)/V.z,e.pressure||0.5]};
  const scr=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  cv.addEventListener("pointerdown",e=>{ if(e.pointerType!=="touch") return; touches.set(e.pointerId,scr(e));
    if(touches.size===2){ const [a,b]=[...touches.values()]; pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),m:[(a[0]+b[0])/2,(a[1]+b[1])/2],z:V.z,x:V.x,y:V.y};
      if(cur&&cur.touch){ PAD.strokes=PAD.strokes.filter(x=>x!==cur); PAD.hist=PAD.hist.filter(h=>h.stroke!==cur); cur=null; activeId=null; padDraw() } } },true);
  cv.addEventListener("pointermove",e=>{ if(!touches.has(e.pointerId)) return; touches.set(e.pointerId,scr(e));
    if(pinch&&touches.size>=2){ const [a,b]=[...touches.values()], d=Math.hypot(a[0]-b[0],a[1]-b[1]), m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
      const nz=Math.max(0.35,Math.min(3,pinch.z*d/pinch.d)); V.z=nz; V.x=m[0]-(pinch.m[0]-pinch.x)*nz/pinch.z; V.y=m[1]-(pinch.m[1]-pinch.y)*nz/pinch.z; fitLbl(); padDraw() } },true);
  const tEnd=e=>{ touches.delete(e.pointerId); if(touches.size<2) pinch=null };
  cv.addEventListener("pointerup",tEnd,true); cv.addEventListener("pointercancel",tEnd,true);
  /* stroke eraser: any stroke passing within 14 px of the eraser is removed whole */
  const near=(s,x,y)=>s.pts.some((p,i)=>{ const q=s.pts[i-1]||p, dx=p[0]-q[0], dy=p[1]-q[1], L=dx*dx+dy*dy, t=L?Math.max(0,Math.min(1,((x-q[0])*dx+(y-q[1])*dy)/L)):0;
    const cx=q[0]+t*dx-x, cy=q[1]+t*dy-y, R=14/PAD.view.z; return cx*cx+cy*cy<R*R });
  const eraseAt=([x,y])=>{ const hit=PAD.strokes.filter(s=>near(s,x,y)); if(hit.length){ PAD.strokes=PAD.strokes.filter(s=>!hit.includes(s)); erased.push(...hit); padDraw() } };
  /* palm rejection: once a pencil has been used on this device, finger/palm touches never draw; a pencil always wins */
  cv.onpointerdown=e=>{
    if(e.pointerType==="pen"){ if(!PAD.penSeen){ PAD.penSeen=true; try{localStorage.setItem("fieldnote.pen","1")}catch(err){} }
      if(cur&&cur.touch){ PAD.strokes=PAD.strokes.filter(x=>x!==cur); PAD.hist=PAD.hist.filter(h=>h.stroke!==cur); cur=null } }
    else if(PAD.penSeen&&e.pointerType==="touch") return;
    if(activeId!==null&&e.pointerType!=="pen") return;
    if(pinch) return;
    activeId=e.pointerId; try{cv.setPointerCapture(e.pointerId)}catch(err){} e.preventDefault();
    if(PAD.tool==="pan"){ panning={s:scr(e),x:V.x,y:V.y}; return }
    if(PAD.tool==="eraser"){ erased=[]; eraseAt(pt(e)); return }
    cur={tool:"pen",pts:[pt(e)],touch:e.pointerType==="touch"}; PAD.strokes.push(cur); PAD.hist.push({type:"add",stroke:cur}) };
  cv.onpointermove=e=>{ if(e.pointerId!==activeId||pinch) return;
    if(panning){ const c=scr(e); V.x=panning.x+c[0]-panning.s[0]; V.y=panning.y+c[1]-panning.s[1]; padDraw(); return }
    let evs=e.getCoalescedEvents?e.getCoalescedEvents():[]; if(!evs.length) evs=[e];
    if(erased){ evs.forEach(ev=>eraseAt(pt(ev))); return }
    if(cur){ evs.forEach(ev=>cur.pts.push(pt(ev))); padDraw() } };
  cv.onpointerup=cv.onpointercancel=e=>{ if(e.pointerId!==activeId) return; if(erased&&erased.length) PAD.hist.push({type:"erase",strokes:erased}); erased=null; cur=null; activeId=null; panning=null };
  /* stop iPad's long-press magnifier / selection and page gestures on the pad */
  ["touchstart","touchmove"].forEach(t=>cv.addEventListener(t,ev=>ev.preventDefault(),{passive:false}));
  if(PAD.open){ document.body.classList.add("padopen"); document.body.classList.toggle("padbig",PAD.big); padDraw(true) }
}
function padDraw(resize){
  const cv=document.getElementById("pad-canvas"); if(!cv||cv.offsetParent===null) return;
  const dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight;
  if(resize||cv.width!==Math.round(w*dpr)){ cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr) }
  const g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  const ink=getComputedStyle(document.documentElement).getPropertyValue("--ink").trim()||"#16302B", V=PAD.view;
  /* faint dot grid in paper coordinates, so moving and zooming feels like moving real paper */
  { const step=32*V.z; if(step>=6){ g.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--line").trim()||"#ddd"; g.lineWidth=1; const oy=((V.y%step)+step)%step;
      g.beginPath(); for(let y=oy;y<h;y+=step){ g.moveTo(0,Math.round(y)+0.5); g.lineTo(w,Math.round(y)+0.5) } g.stroke() } }
  g.setTransform(dpr*V.z,0,0,dpr*V.z,dpr*V.x,dpr*V.y);
  PAD.strokes.forEach(s=>{ g.globalCompositeOperation=s.tool==="eraser"?"destination-out":"source-over"; g.strokeStyle=ink; g.lineCap="round"; g.lineJoin="round";
    if(s.pts.length===1){ const [x,y,p]=s.pts[0]; g.fillStyle=ink; g.beginPath(); g.arc(x,y,0.8+p*1.3,0,7); g.fill() }
    for(let i=1;i<s.pts.length;i++){ const [x0,y0]=s.pts[i-1],[x1,y1,p]=s.pts[i]; g.lineWidth=s.tool==="eraser"?22:1.2+p*2.6; g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke() } });
  g.globalCompositeOperation="source-over";
}
window.addEventListener("resize",()=>padDraw(true));

/* ---------- one question ---------- */
function renderStep(){
  const st = S.steps[S.i];
  if(st.kind==="concept") return renderConcept();
  if(st.kind==="passage") return renderPassage();
  if(st.kind==="rate") return renderRate();
  if(st.kind==="finish") return finishReview();
  const q = st.q, ans = S.answered;
  const canQ=!q.en&&S.set.kind!=="mixed"&&CAL.listenQuestions!==false, waitMs=Math.max(0,(CAL.listenDelaySec??20)*1000-(Date.now()-S.qStart));
  /* trials: confidence buttons and/or a reason before the answer is shown, so choosing and sending are two taps */
  const tConf=(S.trial||[]).includes("confidence"), tWhy=!!st.explain, staged=tConf||tWhy;
  const sendBtns=tConf?`<button class="btn" id="send-sure">✓ มั่นใจ ส่งคำตอบ</button><button class="btn ghost" id="send-unsure">🤔 ไม่ชัวร์ ส่งคำตอบ</button>`:`<button class="btn" id="send-plain">ส่งคำตอบ</button>`;
  const panel = !ans&&staged&&(q.num||S.pick!=null)?`<div class="feedback trialbox">
      ${tWhy?`<label class="small" for="whytext"><b>ก่อนดูเฉลย:</b> ทำไมถึงตอบแบบนี้ เขียนสั้นๆ 1–2 บรรทัด (หรือเขียนในกระดาษทดก็ได้)</label>
      <textarea id="whytext" rows="2" maxlength="300" style="font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink)" placeholder="เช่น เพราะต้องเรียงข้อมูลก่อน ตัวตรงกลางคือ 7">${esc(S.whyText||"")}</textarea>`:""}
      ${tConf?`<span class="small muted">ตอบแล้วมั่นใจแค่ไหน ข้อที่ถูกแต่ไม่ชัวร์ ระบบจะเอามาให้ทวนอีกรอบ</span>`:""}
      <div class="row">${sendBtns}</div></div>`:"";
  let body;
  if(q.cover&&!ans&&!S.uncovered){
    body=`<div class="feedback trialbox"><b>🧠 ข้อนี้เคยเจอแล้ว</b><span class="small">ลองคิดคำตอบในใจหรือในกระดาษทดก่อน ว่าต้องใช้วิธีไหน ได้คำตอบอะไร แล้วค่อยกดดูตัวเลือก</span>
      <button class="btn" id="uncover" type="button">คิดแล้ว ขอดูตัวเลือก</button></div>`;

async function finishWith(rec){
  if(S&&rec.type!=="vocab"){ S.active=false; if(S.mode==="set") clearProgress() }
  PAD.open=false; document.body.classList.remove("padopen");
  const prevList=mine(), before=progressOf(prevList), ssB=spellStats(prevList);
  { const adj=xpRules(rec,prevList); if(adj!==rec) Object.assign(rec,adj); }
  const where=await saveAttempt(rec);
  const list=attempts.includes(rec)?mine():[rec,...mine()];
  const after=progressOf(list), ssA=spellStats(list);
  /* celebrations: only for things that matter, so they stay special */
  const cele=[];
  SPELLS.forEach(sp=>{ const tA=ssA[sp.id]?.tier||0, tB=ssB[sp.id]?.tier||0; if(tA>tB) cele.push({kind:"tier",sp,tier:tA}) });
  Object.keys(REALMS).forEach(rk=>{ const sps=SPELLS.filter(s=>s.realm===rk);
    if(sps.every(s=>(ssA[s.id]?.tier||0)>=1)&&!sps.every(s=>(ssB[s.id]?.tier||0)>=1)) cele.push({kind:"realm",rk}) });
  MILESTONES.filter(m=>after.best>=m&&before.best<m).forEach(m=>cele.push({kind:"milestone",m}));
  if(after.questDoneThisWeek&&!before.questDoneThisWeek) cele.push({kind:"quest"});
  if(after.freeze>before.freeze) cele.push({kind:"ice",why:after.earnedToday.map(e=>e.why).join(", ")});
  S={...S,where,rec,before,after,list,cele,ci:0}; view="done"; render(); window.scrollTo({top:0});
}

function goalProgress(list,g){

  if(g.metric==="metDays"){ const p=progressOf(list); return [...p.met].filter(d=>d>=from&&monthKey(d)===g.month).length }
  if(g.metric==="unlock"){ return Object.values(spellStats(list)).filter(v=>v.tier>=1).length-(g.base||0) }
  if(g.metric==="tierup"){ const a=spellStats(list), b=spellStats(list.filter(x=>dayKey(x.endedAt)<from)); return Object.entries(a).reduce((s,[k,v])=>s+Math.max(0,v.tier-(b[k]?.tier||0)),0) }

ion": ["Magic Potion เป็นมอร์ฟของตัวกะปิ Armadillidium vulgare ที่มีแต้มหลายสี", "เปลือกไอโซพอดมีแคลเซียมคาร์บอเนต สารเดียวกับเปลือกไข่และหินปูน", "คนเลี้ยงไอโซพอดจะทำมุมชื้นและมุมแห้งไว้ในตู้ ให้มันเลือกเองว่าจะอยู่ตรงไหน"], "kilen": ["กิเลนเป็นสัตว์หิมพานต์ หัวคล้ายมังกร ตัวมีเกล็ด และมีกีบเหมือนกวางหรือม้า", "ในความเชื่อจีน กิเลนเป็นสัตว์มงคลที่เดินเบามากจนไม่เหยียบหญ้าให้ช้ำ", "ตัวนิ่มหรือตัวลิ่นมีเกล็ดจริงๆ ทำจากเคราติน และถูกล่าจนใกล้สูญพันธุ์"], "lion": ["ราชสีห์เป็นสัตว์หิมพานต์ ที่ได้แรงบันดาลใจมาจากสิงโต", "สิงโตเป็นแมวป่าชนิดเดียวที่อยู่กันเป็นฝูง", "แผงคอของสิงโตตัวผู้ช่วยป้องกันคอเวลาต่อสู้ และบอกว่าตัวนั้นแข็งแรงแค่ไหน"], "naga": ["พญานาคเป็นสัตว์ในตำนานที่ผูกพันกับน้ำและฝน ในความเชื่อของไทยและลาว", "งูจงอางแผ่แม่เบี้ยได้ และเป็นงูพิษที่ยาวที่สุดในโลก ยาวได้ราว 5 เมตร", "งูจงอางกินงูชนิดอื่นเป็นอาหารหลัก และตัวเมียทำรังจากใบไม้เพื่อวางไข่"]};

    ${next?`<div class="growbox"><span class="nextshape" aria-hidden="true">${petLook(b.kind,st+1)}</span>
      <div style="flex:1;display:flex;flex-direction:column;gap:4px"><span class="small"><b>${st===0?`อีก ${next[0]-g} พลัง ไข่จะฟัก`:`อีก ${next[0]-g} พลังจะเข้าสู่${next[1]}`}</b>${st===3?" (มีออร่าเรืองแสง)":""}</span>

      return `<div class="shopitem ${have?"have":""}">${denTab==="bg"?`<span class="thumb">${SCENES[s.id].svg()}</span>`:`<span style="font-size:2rem">${s.e}</span>`}<b class="small">${esc(s.n)}</b>${s.rare!=null?`<span class="small muted">✨ ของหายาก</span>`:s.guest?`<span class="small muted">🎁 จากแขกพิเศษ</span>`:s.replica!=null?`<span class="small muted">🏛️ จากพิพิธภัณฑ์</span>`:s.shelf?`<span class="small muted">วางของบนชั้นได้</span>`:""}

      :denTab==="fx"?`<p class="small muted">เอฟเฟกต์ลอยอยู่รอบตัว ใช้ได้ทีละ 1 แบบต่อตัว</p>`
      :`<p class="small muted">ใส่ได้หลายชิ้นพร้อมกัน ซื้อครั้งเดียวใช้กับทุกตัว กด "✋ จัดวางของ" แล้วลากไปไว้ตรงไหนก็ได้ ของหายาก ✨ ได้จากภารกิจประจำสัปดาห์</p>`}`}</section>
  ${denCele?`<div class="celebrate" role="dialog" aria-modal="true">${confetti()}<div class="celecard"><div class="celeicon">${denCele.icon}</div><h2>${esc(denCele.title)}</h2><p class="small">${esc(denCele.text)}</p><button class="btn" id="dcok">เยี่ยม!</button></div></div>`:""}`;
  const on=(id,f)=>{const e=document.getElementById(id); if(e) e.onclick=f};
  const reRender=()=>renderDen();
  on("dcok",()=>{denCele=null;reRender()});
  $v.querySelectorAll("[data-dtab]").forEach(x=>x.onclick=()=>{denTab=x.dataset.dtab;denBuy=null;denMsg="";reRender()});
  $v.querySelectorAll("[data-act]").forEach(x=>x.onclick=()=>{lsSet("fieldnote.activepet",x.dataset.act);denMsg=`${petName(x.dataset.act,list)} มาอยู่หน้าแรกแล้ว`;reRender()});
  $v.querySelectorAll("[data-buy]").forEach(x=>x.onclick=()=>{denBuy=x.dataset.buy;denName="";denMsg="";reRender()});

  const nn=document.getElementById("newname"); if(nn) nn.oninput=()=>{denName=nn.value};

    if(wish()===item){ const t=new Date().toISOString(); await saveAttempt({type:"wish",act:"cancel",item,setId:"wish",topic:"ซื้อเองแล้ว",startedAt:t,endedAt:new Date(Date.now()+1).toISOString(),durationSec:0,correct:0,total:0,xp:0,items:[]}) }
    if(isPet){ denCele={icon:"🥚",title:`ไข่ของ ${name} มาถึงบ้านแล้ว!`,text:`ให้ ${name} มาอยู่หน้าแรก แล้วให้อาหารวิเศษ ไข่จะฟักเมื่อมีพลังโต ${GROW[1][0]}`} }
    denMsg=isPet?"":`ได้ ${s.n} แล้ว`; denBuy=null; reRender() });
  $v.querySelectorAll("[data-equip]").forEach(x=>x.onclick=()=>{ const s=SHOP.find(z=>z.id===x.dataset.equip), r=room();

    else if(s.slot==="wear"&&(r.wear[b.kind]||[]).some(w=>w.id===s.id)) r.wear[b.kind]=r.wear[b.kind].filter(w=>w.id!==s.id);
    else { placeItem(r,s,b.kind); denArrange=true; denSel=s.slot==="prop"?{t:"p",i:r.props.length-1}:{t:"w",i:r.wear[b.kind].length-1};
      lsSet("fieldnote.room",r); denMsg=s.slot==="prop"?`วาง${s.n}แล้ว ลากไปวางตรงไหนก็ได้ ปรับขนาดด้วยแถบเลื่อน`:`${b.name}ใส่${s.n}แล้ว ลากปรับตำแหน่งได้ ปรับขนาดด้วยแถบเลื่อน`; reRender(); return }
    lsSet("fieldnote.room",r); denSel=null; reRender() });
  $v.querySelectorAll("[data-wishclaim]").forEach(x=>x.onclick=()=>{ x.disabled=true; wishClaim(reRender) }); bindWishGo($v);
  $v.querySelectorAll("[data-wish]").forEach(x=>x.onclick=async()=>{ const had=wish(); x.disabled=true; await wishSet(x.dataset.wish,mine()); denMsg=had?"เปลี่ยนของที่อยากได้แล้ว ภารกิจเริ่มนับใหม่":"เริ่มภารกิจอยากได้แล้ว ทำครบทุกข้อ คู่หูจะนำของมาให้ฟรี"; reRender() });

    sr.onchange=()=>{ const r=room(), o2=denSel.t==="p"?r.props[denSel.i]:(r.wear[b.kind]||[])[denSel.i]; if(!o2) return; o2.s=sr.value/100; lsSet("fieldnote.room",r) } } }

    await saveAttempt({type:"shop",setId:"shop",item:f.id,cost:f.cost,pet:b.kind,grow:f.grow,topic:"ให้อาหารวิเศษ",startedAt:now,endedAt:now,durationSec:0,correct:0,total:0,xp:0,items:[]});

    denMsg=pickDay([`${b.name} ชอบ${f.n}มาก!`,`${b.name} กิน${f.n}อย่างมีความสุข`,`${b.name} ยิ้มกว้างเลย`],Date.now()%7); reRender();

function placeItem(r,s,kind){
  if(s.slot==="bg") r.bg=s.id;
  else if(s.slot==="prop"){ const n=r.props.length; r.props.push({id:s.id,x:[14,86,30,70,50,22,78][n%7],y:[82,82,86,86,90,70,70][n%7],s:1}) }
  else if(s.slot==="fx") r.fx[kind]=s.id;
  else { r.wear[kind]=r.wear[kind]||[]; const a=WEAR_HOME[s.anchor]||[50,30], dup=r.wear[kind].filter(w=>(SHOP.find(z=>z.id===w.id)||{}).anchor===s.anchor).length;
    r.wear[kind].push({id:s.id,x:a[0]+(s.anchor==="neck"?0:dup*8),y:a[1]+(s.anchor==="neck"?dup*4:0),s:1}) } }
/* drag worn things around the companion, and room things around the scene; positions are % of the box they sit in */
function bindArrange(kind, reRender){
  const grab=(el,t,i,box)=>{ el.onpointerdown=e=>{ e.preventDefault(); e.stopPropagation(); denSel={t,i}; $v.querySelectorAll(".sel").forEach(z=>z.classList.remove("sel")); el.classList.add("sel");
      el.setPointerCapture(e.pointerId); let moved=false;
      el.onpointermove=ev=>{ const rc=box().getBoundingClientRect(); const x=Math.max(-10,Math.min(110,(ev.clientX-rc.left)/rc.width*100)), y=Math.max(-10,Math.min(110,(ev.clientY-rc.top)/rc.height*100));
        el.style.left=x+"%"; el.style.top=y+"%"; el.dataset.nx=x.toFixed(1); el.dataset.ny=y.toFixed(1); moved=true };
      el.onpointerup=()=>{ el.onpointermove=null; el.onpointerup=null; const r=room(), o=t==="p"?r.props[i]:(r.wear[kind]||[])[i];
        if(o&&moved){ o.x=+el.dataset.nx; o.y=+el.dataset.ny; if(t==="p"&&!el.dataset.shelf) snapShelf(o,el,box()); lsSet("fieldnote.room",r) } reRender() } } };
  /* drop a small thing onto a shelf: it lands on the nearest board, in the nearest free-looking slot */
  const snapShelf=(o,el,bx)=>{ const rc=bx.getBoundingClientRect(), it=el.getBoundingClientRect(), px=rc.left+o.x/100*rc.width, py=rc.top+o.y/100*rc.height;
    for(const sh of $v.querySelectorAll("#props [data-shelf]")){ const b=sh.getBoundingClientRect(), cfg=SHELVES[sh.dataset.shelf]; if(!cfg) continue;

      const by=cfg.boards.map(f=>b.top+f*b.height).reduce((best,y)=>Math.abs(y-py)<Math.abs(best-py)?y:best);
      const sx=cfg.slots.map(f=>b.left+f*b.width).reduce((best,x)=>Math.abs(x-px)<Math.abs(best-px)?x:best);
      const h=Math.min(it.height,b.height*0.3); if((o.s||1)>0.8) o.s=0.8;
      o.x=+((sx-rc.left)/rc.width*100).toFixed(1); o.y=+((by-h*0.8/2-rc.top)/rc.height*100).toFixed(1); return } };
  $v.querySelectorAll("#props .prop-it").forEach(el=>grab(el,"p",+el.dataset.pi,()=>document.getElementById("props")));
  /* grab() captures box() lazily; snapShelf needs it too */
  const hero=document.querySelector("#petpat .petwrap");

}

/* pronunciation: the browser's own English voice (works on iPad and Android Chrome) */
/* Some in-app browsers (LINE, Facebook, the Claude app) hide the voice engine, so detect it and offer a way out */
const CAN_SPEAK = typeof speechSynthesis!=="undefined" && typeof SpeechSynthesisUtterance!=="undefined";
const UA = navigator.userAgent||"";
const IN_APP = /Line\/|FBAN|FBAV|Instagram|; wv\)|Claude/i.test(UA);
const IS_ANDROID = /Android/i.test(UA);
let speechBroken = !CAN_SPEAK;
try{ if(CAN_SPEAK) speechSynthesis.getVoices(); }catch(e){}
function speak(text, slow){
  if(!CAN_SPEAK){ speechBroken=true; showSpeechHelp(); return }
  try{
    if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=slow?0.42:0.9;
    const v=pickVoice(); if(v){ u.voice=v; u.lang=v.lang }
    let started=false; u.onstart=()=>{started=true;speechBroken=false;hideSpeechHelp()}; u.onerror=e=>{ if(e.error!=="interrupted"&&e.error!=="canceled"){speechBroken=true;showSpeechHelp()} };
