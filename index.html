/* replay the vocabulary sessions that are kept, so removed tries do not leave words half-learned */
function rebuildVocabState(list){
  const st={};
  list.filter(a=>a.type==="vocab").sort((a,b)=>new Date(a.endedAt)-new Date(b.endedAt)).forEach(a=>{
    const t=dayKey(a.endedAt), byWord={};
    (a.items||[]).forEach(i=>{ if(i.word) byWord[i.word]=(byWord[i.word]??true)&&i.correct });
    Object.entries(byWord).forEach(([w,ok])=>{ const cur=st[w]?.box||0, box=ok?Math.min(BOX_DAYS.length,cur+1):1; let due=t; for(let k=0;k<BOX_DAYS[box-1];k++) due=nextDay(due); st[w]={box,due} });
  });
  saveVocabState(st);
}
async function finishVocab(){
  V.active=false;
  try{ if(CAN_SPEAK) speechSynthesis.cancel() }catch(e){}
  $v.innerHTML=`<section class="card"><p class="muted">กำลังบันทึก…</p></section>`;
  const st=vocabState(), t=todayKey(), byWord={};
  V.results.forEach(r=>{ byWord[r.w]=(byWord[r.w]??true)&&r.correct });   // a word moves up only if every item on it was right
  Object.entries(byWord).forEach(([w,ok])=>{ const cur=st[w]?.box||0; const box=ok?Math.min(BOX_DAYS.length,cur+1):1;
    let due=t; for(let i=0;i<BOX_DAYS[box-1];i++) due=nextDay(due); st[w]={box,due} });
  saveVocabState(st);
  const c=V.results.filter(r=>r.correct).length, rc=V.rres.filter(Boolean).length;
  const sp=V.results.filter(r=>r.kind==="spell");
  await finishWith({type:"vocab",setId:"vocab",subject:"อังกฤษ",topic:"คำศัพท์วันนี้",startedAt:new Date(V.start).toISOString(),endedAt:new Date().toISOString(),
    durationSec:Math.round((Date.now()-V.start)/1000),correct:c,total:V.results.length,newWords:V.fresh.length,
    spelling:{correct:sp.filter(r=>r.correct).length,total:sp.length},
    reading:V.read?{correct:rc,total:V.rres.length}:null,xp:c*5+(V.results.length-c)*2+rc*5+(V.rres.length-rc)*2,
    items:V.results.map(r=>({qid:"v:"+r.w,word:r.w,kind:r.kind,fresh:r.fresh,correct:r.correct}))});
}

  const night=st==="night", tint=night?"rgba(18,28,64,.5)":st==="dusk"?"rgba(255,140,60,.2)":"rgba(255,200,150,.15)";

  else if(cfg.win){ const [x,y,w,h]=cfg.win; bgTint=night?"rgba(40,30,20,.32)":"rgba(255,150,80,.12)";   /* indoors: lamp-lit room, the sky only in the window */

      <g clip-path="url(#wclip)"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#wsky)"/>${night?stars(8,x+4,y+4,w-8,h-8):""}${night?`<g transform="translate(${x+w-24} ${y+20})">${moonSvg(t,10)}</g>`:""}
        ${ev&&ev.k==="meteor"&&night?`<line class="meteor" x1="${x+70}" y1="${y+12}" x2="${x+40}" y2="${y+32}" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>`:""}</g>
      <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="none" stroke="#8a5a36" stroke-width="7"/><line x1="${x+w/2}" y1="${y}" x2="${x+w/2}" y2="${y+h}" stroke="#8a5a36" stroke-width="5"/><line x1="${x}" y1="${y+h/2}" x2="${x+w}" y2="${y+h/2}" stroke="#8a5a36" stroke-width="5"/>

/* ---------- readiness vs the real exam, by district (rough estimate, recomputed for each month-end) ----------
   coverage  = share of the district's spells practised (tier ≥ 1), weighted by exam importance (stars)
   level 3   = accuracy on level-3 (exam-style) questions in the district, last 30 days
   retention = accuracy in the old-topic sweep for the district (falls back to level 3 when no data)
   readiness = 40% coverage + 40% level 3 + 20% retention;  80+ ≈ ready for first-round level */
const READY_TARGET=80;
function readiness(list,upto){ const L=list.filter(a=>new Date(a.endedAt).getTime()<=upto), ss=spellStats(L), out={};
  const its=L.filter(a=>isLesson(a)&&upto-new Date(a.endedAt).getTime()<30*DAY).flatMap(a=>a.items||[]).filter(x=>!x.skipped);
  const sw=L.filter(a=>a.type==="sweep").flatMap(a=>a.items||[]);
  Object.keys(DISTRICTS).filter(k=>k!=="tech").forEach(rk=>{ const sps=SPELLS.filter(s=>s.realm===rk); if(!sps.length) return;
    const w=sp=>sp.stars||1, tot=sps.reduce((a,sp)=>a+w(sp),0), cov=sps.filter(sp=>(ss[sp.id]?.tier||0)>=1).reduce((a,sp)=>a+w(sp),0)/tot;
    const ids=new Set(sps.map(s=>s.id)), l3=its.filter(x=>x.level===3&&ids.has(QBANK[x.qid]?.q.spell)), sv=sw.filter(x=>ids.has(QBANK[x.qid]?.q.spell));
    const p3=l3.length>=3?l3.filter(x=>x.correct&&!x.guessed).length/l3.length:null, pr=sv.length>=3?sv.filter(x=>x.correct).length/sv.length:null;
    const val=Math.round(100*(0.4*cov+0.4*(p3??0)+0.2*(pr??p3??0)));
    out[rk]={val,cov:Math.round(cov*100),p3:p3==null?null:Math.round(p3*100),pr:pr==null?null:Math.round(pr*100),w:tot,n3:l3.length} });
  const ks=Object.keys(out), W=ks.reduce((a,k)=>a+out[k].w,0); out._all=Math.round(ks.reduce((a,k)=>a+out[k].val*out[k].w,0)/W); return out }
function readinessCard(list){ if(!list.length) return "";
  const now=Date.now(), r=readiness(list,now), first=Math.min(...list.map(a=>new Date(a.endedAt).getTime()));
  const months=[]; { const d=new Date(first); d.setDate(1); d.setMonth(d.getMonth()+1); d.setHours(0,0,0,0); while(d.getTime()<now){ months.push(d.getTime()-1); d.setMonth(d.getMonth()+1) } } months.push(now);
  const trend=months.map(t=>({t,v:readiness(list,t)._all}));
  const notYet=Object.entries(r).filter(([k,v])=>k!=="_all"&&v.val===0).map(([k])=>DISTRICTS[k].e+" "+DISTRICTS[k].n);
  const rows=Object.entries(r).filter(([k,v])=>k!=="_all"&&v.val>0).sort((a,b)=>a[1].val-b[1].val).map(([k,v])=>{ const d=DISTRICTS[k], col=v.val>=READY_TARGET?"var(--good)":v.val>=50?"var(--beak)":"var(--warn)";
    return `<div class="rrow"><span class="small" style="min-width:8.5em">${d.e} ${d.n}</span><div class="rbar"><i style="width:${v.val}%;background:${col}"></i><b style="left:${READY_TARGET}%"></b></div><span class="small" style="min-width:2.4em;text-align:right">${v.val}</span></div>
      <p class="small muted" style="margin:-4px 0 4px 0">ฝึกแล้ว ${v.cov}% ของเรื่อง · ข้อระดับ 3 ${v.p3==null?"ยังน้อยไป":v.p3+"%"} · ความจำเรื่องเก่า ${v.pr==null?"ยังไม่มีข้อมูล":v.pr+"%"}</p>` }).join("");
  const W=300,H=60, xs=i=>trend.length<2?W/2:i*(W/(trend.length-1)), ys=v=>H-v/100*H;
  const spark=`<svg viewBox="0 0 ${W} ${H+16}" style="width:100%;max-width:360px;height:auto;color:var(--ink)"><line x1="0" x2="${W}" y1="${ys(READY_TARGET)}" y2="${ys(READY_TARGET)}" stroke="var(--good)" stroke-dasharray="4 4"/>
    ${trend.length>1?`<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${trend.map((p,i)=>`${xs(i)},${ys(p.v)}`).join(" ")}"/>`:""}
    ${trend.map((p,i)=>`<circle cx="${xs(i)}" cy="${ys(p.v)}" r="3.5" fill="var(--accent)"/><text x="${xs(i)}" y="${H+13}" font-size="9" text-anchor="middle" fill="currentColor" opacity=".7">${new Date(p.t).toLocaleDateString("th-TH",{month:"short"})} ${p.v}</text>`).join("")}</svg>`;
  return `<div><span class="eyebrow">ความพร้อมเทียบระดับข้อสอบจริง · ตอนนี้ ${r._all}/100 (เส้นเป้า ${READY_TARGET})</span>
    ${spark}<div class="rrows">${rows}</div>${notYet.length?`<p class="small muted">ยังไม่เริ่ม (${notYet.length} ย่าน): ${notYet.join(" · ")}</p>`:""}
    <details class="small"><summary>คิดคะแนนนี้อย่างไร</summary><p class="small">แต่ละย่านคิดจาก 3 ส่วน: ฝึกครบกี่เรื่อง (40% ถ่วงตามความสำคัญในข้อสอบ) ความแม่นข้อระดับ 3 ที่เป็นแนวข้อสอบใน 30 วันล่าสุด (40%) และความจำเรื่องเก่าจากย้อนคาถาเก่า (20%) 80 ขึ้นไปถือว่าใกล้ระดับข้อสอบรอบแรก ตัวเลขนี้เป็นค่าประมาณจากการฝึกในแอป ไม่ใช่คะแนนสอบ ผลสอบจำลองจากภายนอกจะช่วยยืนยันว่าตรงแค่ไหน ช่วงแรกตัวเลขจะต่ำเพราะยังฝึกไม่ครบทุกเรื่อง จุดสำคัญคือแนวโน้มรายเดือนที่ควรค่อยๆ ขึ้น</p></details></div>` }

function sayTh(text){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang="th-TH"; const v=thVoice(); if(v){ u.voice=v; u.lang=v.lang } u.rate=0.95; speechSynthesis.speak(u) }catch(e){} }
function closeSheet(){ const s=document.getElementById("sheet"); if(s){ s.remove(); try{ speechSynthesis.cancel() }catch(e){} document.removeEventListener("keydown",sheetKey) } }
function sheetKey(e){ if(e.key==="Escape") closeSheet() }
function sheet({icon,title,html,read,actions,wide}){
  closeSheet(); const d=document.createElement("div"); d.id="sheet"; d.className="celebrate"; d.setAttribute("role","dialog"); d.setAttribute("aria-modal","true"); d.setAttribute("aria-label",title||"");
  d.innerHTML=`<div class="celecard sheetcard ${wide?"wide":""}"><button class="sheetx" type="button" aria-label="ปิด">✕</button>
    ${icon?`<div class="celeicon">${icon}</div>`:""}${title?`<h2>${esc(title)}</h2>`:""}<div class="sheetbody">${html||""}</div>
    <div class="row sheetact">${read?`<button class="btn ghost small" data-sh="read">🔊 อ่านให้ฟัง</button>`:""}${(actions||[]).map((a,i)=>`<button class="btn ${a.ghost?"ghost":""}" data-sh="${i}" ${a.disabled?"disabled":""}>${a.label}</button>`).join("")}</div></div>`;
  document.body.appendChild(d); document.addEventListener("keydown",sheetKey);
  d.addEventListener("click",e=>{ if(e.target===d||e.target.closest(".sheetx")) return closeSheet(); const b=e.target.closest("[data-sh]"); if(!b) return;
    if(b.dataset.sh==="read") return sayTh(read); const a=(actions||[])[+b.dataset.sh]; if(a&&a.fn) a.fn(d) });
  const f=d.querySelector(".sheetbody textarea,.sheetbody input")||d.querySelector(".sheetx"); try{ f.focus({preventScroll:true}) }catch(e){}
  return d }

/* ---------- hands-on studio (father, 9 Nov: she wants to make games, not only read about them) ----------
   1) a balance lab: set team / monster numbers, simulate 100 battles, read win rate, mean and median turns and a histogram.
   2) a daily "player guide": rewrite the explanation of a question she missed today in her own words, for a new player. */
function labSim(v){ const R=[], sw=x=>x*(1+v.luck/100*(2*Math.random()-1));
  for(let n=0;n<100;n++){ let th=v.th, mh=v.mh, t=0, win=false; while(t<40){ t++; mh-=sw(v.ta); if(mh<=0){ win=true; break } th-=sw(v.ma); if(th<=0) break } R.push({t,win}) }
  const ts=R.map(r=>r.t).sort((a,b)=>a-b), mean=ts.reduce((a,b)=>a+b,0)/ts.length, med=(ts[49]+ts[50])/2;
  return {R,win:R.filter(r=>r.win).length,mean,med,min:ts[0],max:ts[ts.length-1]} }
function labOk(L,v,r){ const c=L.check||{}; return (c.winMin==null||r.win>=c.winMin)&&(c.winMax==null||r.win<=c.winMax)&&(c.meanMin==null||r.mean>=c.meanMin)&&(c.meanMax==null||r.mean<=c.meanMax)&&(c.luckMin==null||v.luck>=c.luckMin)&&(c.skewMin==null||r.mean-r.med>=c.skewMin) }
function labHist(r){ const top=Math.min(20,Math.max(...r.R.map(x=>x.t))), b=Array.from({length:top},()=>[0,0]); r.R.forEach(x=>{ const i=Math.min(top,x.t)-1; b[i][x.win?0:1]++ });
  const mx=Math.max(...b.map(x=>x[0]+x[1]),1), W=300, H=120, bw=W/top;
  return `<svg viewBox="0 0 ${W} ${H+28}" class="labhist" role="img" aria-label="กราฟจำนวนตาที่ใช้">${b.map((x,i)=>{ const hw=x[0]/mx*H, hl=x[1]/mx*H;
    return `<rect x="${i*bw+1}" y="${H-hw}" width="${bw-2}" height="${hw}" fill="#3f9b5a"/><rect x="${i*bw+1}" y="${H-hw-hl}" width="${bw-2}" height="${hl}" fill="#e08a2c"/>${top<=12||i%2===0?`<text x="${i*bw+bw/2}" y="${H+12}" font-size="9" text-anchor="middle" fill="currentColor">${i+1}${i===top-1&&top===20?"+":""}</text>`:""}` }).join("")}
    <line x1="${(r.mean-0.5)*bw}" x2="${(r.mean-0.5)*bw}" y1="0" y2="${H}" stroke="#2f6f8f" stroke-width="2" stroke-dasharray="4 3"/><line x1="${(r.med-0.5)*bw}" x2="${(r.med-0.5)*bw}" y1="0" y2="${H}" stroke="#b04a8c" stroke-width="2"/>
    <text x="${W/2}" y="${H+26}" font-size="9" text-anchor="middle" fill="currentColor">จำนวนตาที่ใช้ (เขียว = ชนะ, ส้ม = แพ้)</text></svg>` }

    const sb=out.querySelector("#labsend"); if(sb) sb.onclick=async()=>{ const v=(out.querySelector("#labans").value||"").trim(); if(v.length<4){ out.querySelector("#labans").focus(); return }

      render(); sheet({icon:"🌟",title:"นักออกแบบตัวจริง!",html:`<p>+10 XP · ทำโจทย์ห้องทดลองแล้ว ${done.size+1}/${labs.length} ข้อ</p>`,actions:[{label:"ลองโจทย์อื่น",ghost:true,fn:()=>studioLab()},{label:"เยี่ยม!",fn:closeSheet}]}) } } }
/* today's missed questions she can rewrite (one guide a day earns XP) */
function rewriteToday(list){ const t=todayKey(), seen=new Set(), out=[];
  list.filter(a=>isLesson(a)&&dayKey(a.endedAt)===t).forEach(a=>(a.items||[]).forEach(x=>{ if(x.correct===false&&!x.notTaught&&QBANK[x.qid]&&!seen.has(x.qid)){ seen.add(x.qid); out.push(QBANK[x.qid].q) } })); return out }
function rewriteDone(list){ const t=todayKey(); return studioRecs(list).some(a=>a.act==="rewrite"&&dayKey(a.endedAt)===t) }
function studioRewrite(qi){ const W=STUDIO.rewrite, list=mine(), qs=rewriteToday(list); if(!W) return;
  if(!qs.length) return sheet({icon:W.icon,title:W.title,html:`<p>${esc(nm(W.intro))}</p><p class="small muted">วันนี้ยังไม่มีข้อที่พลาด ทำภารกิจก่อน ถ้ามีข้อที่พลาดจะมาเขียนคู่มือได้</p>`,actions:[{label:"ปิด",fn:closeSheet}]});
  const q=qs[Math.min(qi||0,qs.length-1)], st=exSteps(q.ex), dn=rewriteDone(list);
  const d=sheet({icon:W.icon,title:W.title,wide:true,read:q.ex,html:`<p class="small">${esc(nm(W.intro))}</p>
    ${qs.length>1?`<div class="row" style="gap:6px">${qs.slice(0,5).map((x,i)=>`<button class="btn small ${x===q?"":"ghost"}" data-rq="${i}">ข้อ ${i+1}</button>`).join("")}</div>`:""}

function fxBest(list){ const b={}; chemRecs(list).forEach(a=>{ b[a.level]=Math.max(b[a.level]||0,a.correct||0) }); return b }
function fxOpen(list){ const b=fxBest(list), o=[1]; for(let L=2;L<=6;L++) if((b[L-1]||0)>=6) o.push(L); return o }
function fxTried(list){ return [...new Set(chemRecs(list).map(a=>a.level))] }

async function setupAsk(sum){ const skips=sum.skips||[], conf=sum.conf||[];

      wrong:(a.items||[]).filter(x=>x.correct===false).map(x=>({topic:x.topic,level:x.level,error:x.errorType,hints:x.hints}))})),accuracyByLevel:rLv,errors:rErr,streak:{days:rp.streak,freezeLeft:rp.freeze,goalDays:rp.goalDays},vocab:{sessions:rv.length,correct:rv.reduce((s,a)=>s+a.correct,0),total:rv.reduce((s,a)=>s+a.total,0)}};
