<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="Loma, Garuda, Waree, DejaVu Sans, sans-serif">
<rect width="800" height="400" fill="#ffffff"/>
<polyline points="110.6,170 205.6,170 145.0,300 240.0,300" fill="none" stroke="#1e8449" stroke-width="14" stroke-opacity="0.28" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="25" y1="170" x2="355" y2="170" stroke="#2a4a7f" stroke-width="3"/>
<line x1="25" y1="300" x2="355" y2="300" stroke="#2a4a7f" stroke-width="3"/>
<line x1="128.9" y1="334.4" x2="221.7" y2="135.6" stroke="#c0392b" stroke-width="3"/>
<text x="29" y="162" font-size="15" fill="#2a4a7f">ราวบน</text><text x="29" y="322" font-size="15" fill="#2a4a7f">ราวล่าง</text>
<path d="M205.6,170.0 L190.4,202.6 A36,36 0 0 1 169.6,170.0 Z" fill="#1e8449" fill-opacity="0.45" stroke="#1e8449" stroke-width="2"/>
<text x="151.6" y="210.4" font-size="20" font-weight="700" text-anchor="middle" fill="#1e8449">65°</text>
<path d="M145.0,300.0 L160.2,267.4 A36,36 0 0 1 181.0,300.0 Z" fill="#1e8449" fill-opacity="0.45" stroke="#1e8449" stroke-width="2"/>
<text x="199.0" y="271.6" font-size="20" font-weight="700" text-anchor="middle" fill="#1e8449">65°</text>
<polyline points="705.6,170 610.6,170 550.0,300 645.0,300" fill="none" stroke="#b9770e" stroke-width="14" stroke-opacity="0.28" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="430" y1="170" x2="760" y2="170" stroke="#2a4a7f" stroke-width="3"/>
<line x1="430" y1="300" x2="760" y2="300" stroke="#2a4a7f" stroke-width="3"/>
<line x1="533.9" y1="334.4" x2="626.7" y2="135.6" stroke="#c0392b" stroke-width="3"/>
<text x="434" y="162" font-size="15" fill="#2a4a7f">ราวบน</text><text x="434" y="322" font-size="15" fill="#2a4a7f">ราวล่าง</text>
<path d="M610.6,170.0 L646.6,170.0 A36,36 0 0 1 595.4,202.6 Z" fill="#b9770e" fill-opacity="0.45" stroke="#b9770e" stroke-width="2"/>
<text x="648.2" y="235.0" font-size="20" font-weight="700" text-anchor="middle" fill="#b9770e">115°</text>
<path d="M550.0,300.0 L565.2,267.4 A36,36 0 0 1 586.0,300.0 Z" fill="#b9770e" fill-opacity="0.45" stroke="#b9770e" stroke-width="2"/>
<text x="604.0" y="271.6" font-size="20" font-weight="700" text-anchor="middle" fill="#b9770e">65°</text>
<text x="195" y="40" font-size="25" font-weight="700" text-anchor="middle" fill="#1e8449">ตัว Z : มุมเท่ากัน</text>
<text x="600" y="40" font-size="25" font-weight="700" text-anchor="middle" fill="#b9770e">ตัว C : รวมกันได้ 180°</text>
<text x="195" y="72" font-size="15" text-anchor="middle" fill="#444">มุมแย้ง (ในระหว่างราว คนละข้างของซี่ราว)</text>
<text x="600" y="72" font-size="15" text-anchor="middle" fill="#444">มุมภายในข้างเดียวกัน (ในระหว่างราว ข้างเดียวกัน)</text>
<text x="600" y="102" font-size="17" font-weight="700" text-anchor="middle" fill="#b9770e">115° + 65° = 180°</text>
<text x="400" y="370" font-size="15" text-anchor="middle" fill="#444">ข้อราวบันได: ให้มุมหนึ่ง 65° อยู่ข้างเดียวกัน (ตัว C) อีกมุมจึงเป็น 180° − 65° = 115°</text>
<text x="400" y="392" font-size="13" text-anchor="middle" fill="#777">เส้นสีน้ำเงิน = ราวสองเส้นขนาน · เส้นสีแดง = ซี่ราวที่พาดตัด · รูปไม่ได้วาดตามสเกล</text>
</svg>